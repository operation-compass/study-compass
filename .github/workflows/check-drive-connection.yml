name: Study COMPASS Drive connection check (no deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Google Drive service-account configuration
        shell: bash
        env:
          STUDY_COMPASS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.STUDY_COMPASS_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$STUDY_COMPASS_GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::Service-account secret not configured. Read-only connection test not run."
            exit 0
          fi
          echo "Read-only Drive connection check starting."
          node scripts/check-drive-connection.cjs

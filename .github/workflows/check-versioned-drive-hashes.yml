name: Validate versioned Drive SHA diagnostic (no deploy)
on:
  pull_request:
    paths:
      - 'scripts/verify-versioned-drive-hashes.cjs'
      - 'scripts/audit-drive-export.cjs'
      - 'scripts/check-drive-connection.cjs'
      - '.github/workflows/check-drive-connection.yml'
      - '.github/workflows/check-versioned-drive-hashes.yml'
      - 'scripts/auto-publish-ready.cjs'
      - 'scripts/test-release-hold.cjs'
      - 'scripts/verify-independent-release.cjs'
      - 'scripts/test-independent-release.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check scripts/verify-versioned-drive-hashes.cjs
      - name: Self test with negative cases
        run: node scripts/verify-versioned-drive-hashes.cjs --self-test
      - name: Independent release contract fixtures
        run: node scripts/test-independent-release.cjs
      - name: Draft release safety guard
        run: node scripts/test-release-hold.cjs
      - name: Existing CSV parser regression
        run: node scripts/audit-drive-export.cjs --self-test
      - name: Drive connection must fail closed without credentials
        shell: bash
        run: |
          set -euo pipefail
          if env -u STUDY_COMPASS_GOOGLE_SERVICE_ACCOUNT_JSON node scripts/check-drive-connection.cjs > /tmp/study-drive-diagnostic.log 2>&1; then
            echo 'ERROR: missing credential was unexpectedly accepted'
            exit 1
          fi
          grep -q 'Missing service-account secret' /tmp/study-drive-diagnostic.log
          echo 'PASS: missing credentials are rejected; no Drive request performed.'

name: Deploy Study COMPASS to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-compass-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Worker syntax and learning routes before deploy
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --test tests/public-question-feed.test.mjs
          node --test tests/traffic-analytics.test.mjs
          python3 -m unittest discover -s tests -p 'test_traffic_report.py'
          node tests/live-catalog-home.test.cjs
          node scripts/check-question-release.cjs
          node scripts/check-history.cjs
          node scripts/check-beta.cjs
          node scripts/check-home-safety.cjs
          node scripts/check-shirunoera-quiz-rotation.cjs
          node scripts/check-approval-contract.cjs
          node scripts/audit-drive-export.cjs --self-test
          python3 - <<'PY'
          from pathlib import Path
          worker = Path("worker.js").read_text()
          legacy = Path("legacy-study.html").read_text()
          home = Path("home-v2.html").read_text()
          assert 'location.assign("/study.html?"' in home, "missing canonical question route"
          for subject in ("国語", "数学", "英語", "理科", "社会"):
              assert f'data-subject="{subject}"' in home, f"missing subject {subject}"
          assert 'id="history-title">学習記録' in home, "missing learning record"
          for token in ('function setup()', 'function setStudyMode(m)', 'class="mode-switch three"'):
              assert token in legacy, f"missing legacy study structure: {token}"
          assert "data-study-route-ready" in worker
          assert "study-route-recovery" in worker
          print("Static learning-route checks passed.")
          PY

      - name: Verify Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Configure optional traffic analytics
        shell: bash
        env:
          ANALYTICS_ENABLED: ${{ vars.SHIRUNOERA_ANALYTICS_ENABLED }}
        run: |
          set -euo pipefail
          if [ "$ANALYTICS_ENABLED" != "false" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("wrangler.jsonc")
          c=json.loads(p.read_text())
          c["analytics_engine_datasets"]=[{"binding":"TRAFFIC_ANALYTICS","dataset":"shirunoera_traffic_v1"}]
          p.write_text(json.dumps(c,indent=2)+"\n")
          PY
            echo "Traffic analytics binding enabled."
          else
            echo "Traffic analytics disabled; core learning service deploys independently."
          fi

      - name: Deploy with Wrangler
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx --yes wrangler@4.148.0 deploy 2>&1 | tee /tmp/shirunoera-deploy.log; then
            echo "Deployment successful."
          elif grep -q '10089' /tmp/shirunoera-deploy.log && grep -q 'enable Analytics Engine' /tmp/shirunoera-deploy.log; then
            echo "::warning::Analytics Engine not enabled on account; deploying learning service without analytics."
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("wrangler.jsonc")
          c=json.loads(p.read_text())
          c.pop("analytics_engine_datasets",None)
          p.write_text(json.dumps(c,indent=2)+"\n")
          PY
            npx --yes wrangler@4.148.0 deploy
          else
            exit 1
          fi

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://shirunoera.occompass-info.workers.dev"

          echo "Checking live approved-only question CSV..."
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/api/questions.csv?smoke=${GITHUB_SHA}" -o /tmp/public-questions.csv
          python3 - <<'PY'
          from pathlib import Path
          import csv
          with Path('/tmp/public-questions.csv').open(encoding='utf-8-sig', newline='') as fp:
              rows=list(csv.reader(fp))
          required='question_id,version,subject,grade,unit_major,unit_minor,question_type,question_text,choice_a,choice_b,choice_c,choice_d,correct_answer,explanation,source_url'.split(',')
          assert rows and rows[0] == required, 'Published CSV header mismatch'
          assert all(len(r)==len(required) for r in rows[1:]), 'Published CSV malformed row'
          print('Live published-question CSV verified; question count:',len(rows)-1)
          PY

          echo "Checking current approved catalog and public search routes..."
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/api/question-catalog.json?smoke=${GITHUB_SHA}" -o /tmp/catalog.json
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/robots.txt" -o /tmp/robots.txt
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/sitemap.xml" -o /tmp/sitemap.xml
          python3 - <<'PY'
          import json, csv, xml.etree.ElementTree as ET
          from pathlib import Path
          catalog=json.loads(Path('/tmp/catalog.json').read_text())
          assert catalog['schema']==1
          questions=catalog['questions']
          assert all(set(q)=={'id','subject','major','minor'} and all(isinstance(v,str) and v.strip() for v in q.values()) for q in questions)
          assert len({q['id'] for q in questions})==len(questions)
          with Path('/tmp/public-questions.csv').open(encoding='utf-8-sig',newline='') as f:
              expected={r['question_id']:(r['subject'],r['unit_major'],r['unit_minor']) for r in csv.DictReader(f)}
          actual={q['id']:(q['subject'],q['major'],q['minor']) for q in questions}
          if actual!=expected:
              # Public questions can be added while deploying; retry against a fresh CSV.
              import urllib.request, io
              req=urllib.request.Request('https://shirunoera.occompass-info.workers.dev/api/questions.csv',headers={'User-Agent':'SHIRUNOERA-smoke-test'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  expected={r['question_id']:(r['subject'],r['unit_major'],r['unit_minor']) for r in csv.DictReader(io.StringIO(response.read().decode('utf-8-sig')))}
              assert all(actual.get(k)==v for k,v in expected.items()) or all(expected.get(k)==v for k,v in actual.items()), 'Catalog differs from approved CSV'
          assert Path('/tmp/robots.txt').read_text().find('Sitemap: https://shirunoera.occompass-info.workers.dev/sitemap.xml')>=0
          root=ET.parse('/tmp/sitemap.xml').getroot()
          urls={x.text for x in root.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc')}
          assert urls=={'https://shirunoera.occompass-info.workers.dev/','https://shirunoera.occompass-info.workers.dev/high-school'}
          print('Live approved catalog and sitemap verified; catalog questions:',len(questions))
          PY

          echo "Checking the SHIRUNOERA portal..."
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/?smoke=${GITHUB_SHA}" -o /tmp/home.html
          grep -q 'SHIRUNOERA' /tmp/home.html
          grep -q 'href="/high-school"' /tmp/home.html
          grep -q 'id="learn"' /tmp/home.html
          grep -q 'id="select"' /tmp/home.html
          echo "Checking high-school learning dashboard..."
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/high-school?smoke=${GITHUB_SHA}" -o /tmp/high-school.html
          grep -q 'SHIRUNOERA' /tmp/high-school.html
          grep -q 'id="first-accuracy"' /tmp/high-school.html
          grep -q 'id="record-radar"' /tmp/high-school.html
          for image in hero high-school university school-test certification select; do
            curl -fsSL --retry 5 --retry-delay 2 "$BASE/assets/portal/$image.webp?smoke=${GITHUB_SHA}" -o "/tmp/$image.webp"
          done
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          for name in ("hero", "high-school", "university", "school-test", "certification", "select"):
              live=Path("/tmp", name+".webp").read_bytes()
              expected=Path("assets/portal", name+".webp").read_bytes()
              assert live[:4]==b"RIFF" and live[8:12]==b"WEBP", "Invalid WebP: "+name
              assert sha256(live).digest()==sha256(expected).digest(), "Live image mismatch: "+name
          print("All six production photographs match the repository.")
          PY

          echo "Checking unreviewed legacy route is blocked..."
          legacy_code="$(curl -sS -o /tmp/legacy.html -w '%{http_code}' "$BASE/legacy-study.html")"
          test "$legacy_code" = "404"
          echo "Checking reviewed-only study route..."
          for i in {1..20}; do
            curl -fsSL "$BASE/study.html?mode=qa&smoke=${GITHUB_SHA}&attempt=$i" -o /tmp/study.html
            if grep -q '監査済み・公開承認済みの問題のみ表示' /tmp/study.html && grep -q 'function selectQuizQuestions' /tmp/study.html; then break; fi
            if [ "$i" -eq 20 ]; then echo "::error::Reviewed-only study route not deployed"; exit 1; fi
            sleep 3
          done
          python3 - <<'PY'
          import csv
          from pathlib import Path
          with Path('/tmp/public-questions.csv').open(encoding='utf-8-sig', newline='') as f:
              ids=[row['question_id'] for row in csv.DictReader(f)]
          html=Path('/tmp/study.html').read_text()
          assert all('"id":"'+id+'"' in html for id in ids), 'Approved question missing'
          assert 'const SOCIAL = ' not in html, 'Unreviewed legacy bank leaked'
          assert 'const questions=' in html
          print('Reviewed-only HTML: ',len(ids),'approved questions, no legacy SOCIAL bank')
          PY
          echo "Published-only learning route verified."

          echo "Production smoke test passed."

      - name: Verify rendered reviewed-only learning page
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://shirunoera.occompass-info.workers.dev"
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$BASE/study.html?mode=qa&render=${GITHUB_SHA}" > /tmp/rendered.html
          grep -q '監査済み・公開承認済みの問題のみ表示' /tmp/rendered.html
          if grep -q '教材データに不整合があります' /tmp/rendered.html; then exit 1; fi
          echo "Reviewed-only learning page rendered."
          echo "Checking live question counts in rendered high-school dashboard..."
          for attempt in 1 2 3; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=15000 --timeout=20000 --dump-dom "$BASE/high-school?render=${GITHUB_SHA}&attempt=$attempt" > /tmp/rendered-high-school.html
            if grep -q 'data-state="ready"' /tmp/rendered-high-school.html; then break; fi
            sleep 2
          done
          grep -q 'data-state="ready"' /tmp/rendered-high-school.html
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          html=Path('/tmp/rendered-high-school.html').read_text()
          class Dashboard(HTMLParser):
              def __init__(self):
                  super().__init__(); self.subjects=[]; self.capture=False; self.status=''
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='button' and 'data-subject' in a:self.subjects.append((a['data-subject'],'disabled' in a))
                  if a.get('id')=='catalog-status':self.capture=True
              def handle_endtag(self,tag):
                  if tag=='p' and self.capture:self.capture=False
              def handle_data(self,data):
                  if self.capture:self.status+=data
          p=Dashboard();p.feed(html)
          assert len(p.subjects)==5 and len({s for s,_ in p.subjects})==5
          assert re.search(r'公開済みの5教科：[0-9]+問',p.status),p.status
          assert '2026年11月23日時点' not in html
          print('Rendered dashboard:',p.status)
          PY

      - name: Preserve production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-production-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/home.html
            /tmp/high-school.html
            /tmp/study.html
            /tmp/study.headers
            /tmp/study-v2.css
            /tmp/rendered.html
            /tmp/rendered-high-school.html
            /tmp/rendered-flashcards.html
            /tmp/rendered-questions.html

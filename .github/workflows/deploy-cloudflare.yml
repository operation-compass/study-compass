name: Deploy Study COMPASS to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-compass-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Worker syntax and learning routes before deploy
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node scripts/check-question-release.cjs
          node scripts/check-history.cjs
          node scripts/check-beta.cjs
          node scripts/check-home-safety.cjs
          node scripts/check-approval-contract.cjs
          node scripts/audit-drive-export.cjs --self-test
          python3 - <<'PY'
          from pathlib import Path
          worker = Path("worker.js").read_text()
          legacy = Path("legacy-study.html").read_text()
          home = Path("home-v2.html").read_text()
          for mode, target in (("qa", "mcq"), ("flashcards", "flashcard"), ("questions", "question")):
              assert f'mode==="{mode}"' in worker, f"missing deep link {mode}"
              assert f'activateMode("{target}"' in worker, f"missing mode activation {mode}"
              assert f'./study.html?mode={mode}' in home, f"missing home entry {mode}"
          for token in ('function setup()', 'function setStudyMode(m)', 'class="mode-switch three"'):
              assert token in legacy, f"missing legacy study structure: {token}"
          assert "data-study-route-ready" in worker
          assert "study-route-recovery" in worker
          print("Static learning-route checks passed.")
          PY

      - name: Verify Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy with Wrangler
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.148.0 deploy

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://study-compass.occompass-info.workers.dev"

          echo "Checking live approved-only question CSV..."
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/api/questions.csv?smoke=${GITHUB_SHA}" -o /tmp/public-questions.csv
          python3 - <<'PY'
          from pathlib import Path
          import csv
          with Path('/tmp/public-questions.csv').open(encoding='utf-8-sig', newline='') as fp:
              rows=list(csv.reader(fp))
          required='question_id,version,subject,grade,unit_major,unit_minor,question_type,question_text,choice_a,choice_b,choice_c,choice_d,correct_answer,explanation,source_url'.split(',')
          assert rows and rows[0] == required, 'Published CSV header mismatch'
          assert all(len(r)==len(required) for r in rows[1:]), 'Published CSV malformed row'
          print('Live published-question CSV verified; question count:',len(rows)-1)
          PY

          echo "Checking homepage..."
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/?smoke=${GITHUB_SHA}" -o /tmp/home.html
          grep -q 'study-compass-build' /tmp/home.html
          grep -q 'Study COMPASS' /tmp/home.html

          echo "Checking unreviewed legacy route is blocked..."
          legacy_code="$(curl -sS -o /tmp/legacy.html -w '%{http_code}' "$BASE/legacy-study.html")"
          test "$legacy_code" = "404"
          echo "Checking reviewed-only study route..."
          for i in {1..20}; do
            curl -fsSL "$BASE/study.html?mode=qa&smoke=${GITHUB_SHA}&attempt=$i" -o /tmp/study.html
            if grep -q '監査済み・公開承認済みの問題のみ表示' /tmp/study.html; then break; fi
            if [ "$i" -eq 20 ]; then echo "::error::Reviewed-only study route not deployed"; exit 1; fi
            sleep 3
          done
          python3 - <<'PY'
          import csv
          from pathlib import Path
          with Path('/tmp/public-questions.csv').open(encoding='utf-8-sig', newline='') as f:
              ids=[row['question_id'] for row in csv.DictReader(f)]
          html=Path('/tmp/study.html').read_text()
          assert all('"id":"'+id+'"' in html for id in ids), 'Approved question missing'
          assert 'const SOCIAL = ' not in html, 'Unreviewed legacy bank leaked'
          assert 'const questions=' in html
          print('Reviewed-only HTML: ',len(ids),'approved questions, no legacy SOCIAL bank')
          PY
          echo "Published-only learning route verified."

          echo "Production smoke test passed."

      - name: Verify rendered reviewed-only learning page
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://study-compass.occompass-info.workers.dev"
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$BASE/study.html?mode=qa&render=${GITHUB_SHA}" > /tmp/rendered.html
          grep -q '監査済み・公開承認済みの問題のみ表示' /tmp/rendered.html
          if grep -q '教材データに不整合があります' /tmp/rendered.html; then exit 1; fi
          echo "Reviewed-only learning page rendered."

      - name: Preserve production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-production-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/home.html
            /tmp/study.html
            /tmp/study.headers
            /tmp/study-v2.css
            /tmp/rendered.html
            /tmp/rendered-flashcards.html
            /tmp/rendered-questions.html

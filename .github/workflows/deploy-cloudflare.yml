name: Deploy Study COMPASS to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-compass-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy with Wrangler
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.148.0 deploy

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://study-compass.occompass-info.workers.dev"

          echo "Checking homepage..."
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/?smoke=${GITHUB_SHA}" -o /tmp/home.html
          grep -q 'study-compass-build' /tmp/home.html
          grep -q 'Study COMPASS' /tmp/home.html

          echo "Checking raw legacy asset..."
          curl -fsSL --retry 5 --retry-delay 2 -D /tmp/legacy.headers "$BASE/legacy-study.html?smoke=${GITHUB_SHA}" -o /tmp/legacy.html
          echo "--- legacy size ---"
          wc -c /tmp/legacy.html
          echo "--- legacy head ---"
          head -c 180 /tmp/legacy.html || true
          echo

          echo "Checking study route..."
          for i in {1..20}; do
            curl -fsSL --retry 3 --retry-delay 1 -D /tmp/study.headers "$BASE/study.html?mode=qa&smoke=${GITHUB_SHA}&attempt=$i" -o /tmp/study.html
            if grep -q 'data-study-v2-worker="20261011-10"' /tmp/study.html; then
              echo "Latest worker version is live on attempt $i"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "::error::Latest worker version did not propagate within wait window"
              exit 1
            fi
            sleep 3
          done
          echo "--- study headers ---"
          sed -n '1,20p' /tmp/study.headers
          echo "--- study size ---"
          wc -c /tmp/study.html
          echo "--- study markers ---"
          grep -oE 'study-v2\.css[^" <]*|data-study-v2-worker="[^"]*"|study-home-fab|legacy-study|study-compass-build|Study COMPASS' /tmp/study.html | head -20 || true
          echo "--- study head ---"
          head -c 700 /tmp/study.html || true
          echo

          grep -q 'study-v2.css?v=20261011-13' /tmp/study.html
          grep -q 'data-study-v2-worker="20261011-10"' /tmp/study.html
          grep -q 'study-home-fab' /tmp/study.html

          echo "Checking V2 stylesheet..."
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/study-v2.css?v=${GITHUB_SHA}" -o /tmp/study-v2.css
          echo "--- css size ---"
          wc -c /tmp/study-v2.css
          grep -q 'Study COMPASS V2 runtime theme' /tmp/study-v2.css
          grep -q '.study-v2-runtime' /tmp/study-v2.css
          grep -q 'study-quiz-active' /tmp/study-v2.css
          grep -q 'Mobile flashcard readability' /tmp/study-v2.css
          grep -q 'Flashcard nested explanation' /tmp/study-v2.css
          grep -Fq '.study-v2-runtime.study-selection-active .selection>.subjects>.subject-tile:first-child' /tmp/study-v2.css
          grep -q 'grid-template-columns:42px minmax(0,1fr)' /tmp/study-v2.css

          echo "Checking beta navigation..."
          curl -fsSL --retry 5 --retry-delay 2 "$BASE/beta.html?smoke=${GITHUB_SHA}" -o /tmp/beta.html
          grep -q 'global-home' /tmp/beta.html
          grep -q 'href="/"' /tmp/beta.html

          curl -fsSL --retry 5 --retry-delay 2 "$BASE/practice-beta.html?smoke=${GITHUB_SHA}" -o /tmp/practice-beta.html
          grep -q '/study.html?mode=qa' /tmp/practice-beta.html
          grep -q 'global-home' /tmp/practice-beta.html

          echo "Production smoke test passed."

      - name: Verify rendered study page
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://study-compass.occompass-info.workers.dev"
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "::error::No headless browser found on runner"
            exit 1
          fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$BASE/study.html?mode=qa&render=${GITHUB_SHA}" > /tmp/rendered.html
          echo "--- rendered size ---"
          wc -c /tmp/rendered.html
          echo "--- rendered markers ---"
          grep -oE 'study-v2-runtime|study-selection-active|study-quiz-active|一問一答|教科|今日の10問|学習トップへ戻る' /tmp/rendered.html | head -30 || true
          grep -q 'data-study-route-ready="qa"' /tmp/rendered.html
          grep -q 'study-v2-runtime' /tmp/rendered.html
          grep -Eq 'study-selection-active|study-quiz-active' /tmp/rendered.html
          test "$(wc -c < /tmp/rendered.html)" -gt 100000
          echo "Checking flashcard and question-only deep links..."
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$BASE/study.html?mode=flashcards&render=${GITHUB_SHA}" > /tmp/rendered-flashcards.html
          grep -q 'data-study-route-ready="flashcards"' /tmp/rendered-flashcards.html
          grep -q 'study-selection-active' /tmp/rendered-flashcards.html
          grep -q 'フラッシュカード20枚' /tmp/rendered-flashcards.html
          grep -q 'study-v2-runtime' /tmp/rendered-flashcards.html
          "$BROWSER" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$BASE/study.html?mode=questions&render=${GITHUB_SHA}" > /tmp/rendered-questions.html
          grep -q 'data-study-route-ready="questions"' /tmp/rendered-questions.html
          grep -q 'study-selection-active' /tmp/rendered-questions.html
          grep -q '問題だけ10問' /tmp/rendered-questions.html
          grep -q 'study-v2-runtime' /tmp/rendered-questions.html
          echo "All three study-entry modes rendered."
          echo "Rendered study page test passed."

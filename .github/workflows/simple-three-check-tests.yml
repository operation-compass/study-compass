name: Study COMPASS simple-check isolated tests
on:
  pull_request:
    paths:
      - 'scripts/simple-three-check-gate.cjs'
      - 'scripts/test-simple-three-check-gate.cjs'
      - 'scripts/simple-three-check-evidence.cjs'
      - 'scripts/test-simple-three-check-evidence.cjs'
      - 'scripts/test-simple-three-check-integration.cjs'
      - 'scripts/simple-three-check-gas-adapter.cjs'
      - 'scripts/test-simple-three-check-gas-adapter.cjs'
      - 'scripts/test-simple-three-check-gas-export.cjs'
      - 'gas/sc-simple-check-export.gs'
      - 'gas/sc-attach-simple-checks.gs'
      - 'gas/sc-simple-three-migration-preview.gs'
      - 'scripts/test-simple-three-check-migration-preview.cjs'
      - 'scripts/test-simple-three-check-gas-hook.cjs'
      - 'scripts/verify-auto-publication.cjs'
      - 'gas/sc-master-preflight-preview.gs'
      - 'scripts/test-master-preflight-preview.cjs'
      - 'scripts/reconcile-three-check-evidence.cjs'
      - 'scripts/test-reconcile-three-check-evidence.cjs'
      - 'scripts/test-three-coin-isolated-learning.cjs'
      - 'scripts/patch-history-version-offline.cjs'
      - 'scripts/test-history-version-offline.cjs'
      - 'scripts/test-real-grading-history-isolated.cjs'
      - 'scripts/evaluate-release-exceptions.cjs'
      - 'scripts/test-evaluate-release-exceptions.cjs'
      - 'scripts/test-browser-learning-isolated.cjs'
      - 'scripts/test-browser-master-snapshot.cjs'
      - 'scripts/test-live-master-drift-preview.cjs'
      - 'scripts/test-exception-classification.cjs'
      - 'gas/sc-auto-three-check-exception-preview.gs'
      - 'gas/sc-master-preflight-preview.gs'
      - 'scripts/check-publish-delta-approval.cjs'
      - 'scripts/test-check-publish-delta-approval.cjs'
      - 'scripts/adapt-drive-to-web.cjs'
      - '.github/workflows/simple-three-check-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only live site vs main bank parity (no release)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git show origin/main:legacy-study.html > /tmp/sc-main-legacy.html
          curl -fsSL --retry 2 --max-time 20 'https://study-compass.occompass-info.workers.dev/legacy-study.html' -o /tmp/sc-live-legacy.html
          python3 - <<'PY'
          import re,hashlib
          from pathlib import Path
          names=('SOCIAL','WORDS','ENGLISH_GRAMMAR','JAPANESE','MATH','SCIENCE')
          banks=[]
          for p in ('/tmp/sc-main-legacy.html','/tmp/sc-live-legacy.html'):
              txt=Path(p).read_text()
              found={}
              for n in names:
                  m=re.search(r'const '+n+r'\s*=\s*(\[[^\n]*\]);',txt)
                  if not m: raise SystemExit('INCOMPLETE_BANK_DATA '+n+' '+p)
                  found[n]=m.group(1)
              banks.append(found)
              print(p, 'raw_bytes',len(txt.encode()),'bank_fingerprint',hashlib.sha256((''.join(found.values())).encode()).hexdigest())
          mismatch=[n for n in names if banks[0][n]!=banks[1][n]]
          if mismatch: raise SystemExit('LIVE_MAIN_BANK_MISMATCH '+','.join(mismatch))
          print('PASS main/live six raw bank arrays parity (not a Drive approval or 631 displayed-count proof)')
          PY
      - name: Test publish delta approval fail-closed
        run: node --test scripts/test-check-publish-delta-approval.cjs
      - name: Test read-only exception classification and HOLD
        run: node --test scripts/test-exception-classification.cjs
      - name: Test read-only live MASTER drift detection and HOLD
        run: node --test scripts/test-live-master-drift-preview.cjs
      - name: Test pinned MASTER fixture drift
        run: node --test scripts/test-browser-master-snapshot.cjs
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test isolated mobile browser and retained localStorage
        run: node scripts/test-browser-learning-isolated.cjs
      - name: Test fail-closed exception review before manual release
        run: node --test scripts/test-evaluate-release-exceptions.cjs
      - name: Test historical version propagation and history non-destructive offline patch
        run: node --test scripts/test-history-version-offline.cjs
      - name: Test actual grading and local storage event code in VM
        run: node --test scripts/test-real-grading-history-isolated.cjs
      - name: Test isolated three-coin grading fixture
        run: node --test scripts/test-three-coin-isolated-learning.cjs
      - name: Test evidence reconciliation and fail-closed HOLD
        run: node --test scripts/test-reconcile-three-check-evidence.cjs
      - name: Test MASTER preflight read-only functionality
        run: node --test scripts/test-master-preflight-preview.cjs
      - name: Run isolated candidate checks
        run: node --test scripts/test-simple-three-check-*.cjs

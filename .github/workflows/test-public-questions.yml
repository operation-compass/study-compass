name: Study public CSV verification
on:
  pull_request:
    paths:
      - 'worker.js'
      - 'public-questions.html'
      - 'tests/public-question-feed.test.mjs'
      - 'tests/public-question-browser.mjs'
      - '.github/workflows/test-public-questions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public feed without deployment
        run: node --test tests/public-question-feed.test.mjs

  verify-quiz-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser test with synthetic approved question (no deployment)
        run: node tests/public-question-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-questions-browser-preview
          path: public-question-browser.png
          if-no-files-found: ignore

  verify-google-csv-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check Google CSV endpoint (headers only, no data logging)
        shell: bash
        run: |
          url='https://docs.google.com/spreadsheets/d/1WFYJ-a5V1GBZzr99yglB4MUaW29z-qBze6cZ5m4cM8g/export?format=csv&gid=343531822'
          response=$(curl -sS -L -o /dev/null -w '%{http_code} %{content_type}' --max-time 20 "$url")
          echo "Google Sheets CSV HTTP response: $response"
          [[ "$response" == 200\ text/csv* ]] || { echo 'Public CSV access is not ready; leave PR as draft.'; exit 1; }
          # Verify the actual public CSV schema without printing question content.
          csv_file="$RUNNER_TEMP/study-public.csv"
          curl -fsSL --max-time 20 "$url" -o "$csv_file"
          expected='question_id,version,subject,grade,unit_major,unit_minor,question_type,question_text,choice_a,choice_b,choice_c,choice_d,correct_answer,explanation,source_url'
          actual="$(head -n 1 "$csv_file" | tr -d '\r' | sed 's/^\xef\xbb\xbf//')"
          [[ "$actual" == "$expected" ]] || { echo 'Public CSV schema does not match expected 15 columns'; exit 1; }
          echo 'Public CSV header verified (15 columns).'

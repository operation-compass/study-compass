name: Verify reviewed Study COMPASS version without production deployment
on:
  push:
    branches: [feature/drive-approval-gate-20261016]
    paths: [.github/workflows/verify-cloudflare-version.yml]
permissions:
  contents: read
concurrency:
  group: study-compass-reviewed-version
  cancel-in-progress: false
jobs:
  version-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 61838cf040de027202a395774e60af9a13cb3523
      - name: Verify reviewed release before upload
        run: |
          set -euo pipefail
          node --check worker.js
          node scripts/check-question-release.cjs
          node scripts/check-history.cjs
          node scripts/check-beta.cjs
          test "$(git rev-parse HEAD)" = "61838cf040de027202a395774e60af9a13cb3523"
          test "$(git hash-object index.html)" = "d264e63ca7d7c08ede672b7c6af376f36e812133"
          test "$(git hash-object legacy-study.html)" = "d264e63ca7d7c08ede672b7c6af376f36e812133"
      - name: Upload reviewed version without activating production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.148.0 versions upload 2>&1 | tee /tmp/reviewed-version.log
      - name: Preserve version receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-version-receipt
          retention-days: 14
          path: /tmp/reviewed-version.log

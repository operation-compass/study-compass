name: Verify Drive approval gate (no deploy)

on:
  push:
    branches: [feature/drive-approval-gate-20261016]
    paths:
      - 'data/staging/drive-sync-bundle.json'
      - 'scripts/check-drive-approval.cjs'
      - 'scripts/check-drive-staging-bundle.cjs'
      - '.github/workflows/verify-drive-approval.yml'
  pull_request:
    paths:
      - 'data/staging/drive-sync-bundle.json'
      - 'scripts/check-drive-approval.cjs'
      - 'scripts/test-drive-approval.cjs'
      - 'scripts/export-drive-approved.cjs'
      - 'scripts/test-drive-export.cjs'
      - 'scripts/check-drive-connection.cjs'
      - 'scripts/check-drive-staging-bundle.cjs'
      - 'scripts/test-drive-staging-bundle.cjs'
      - 'integrations/apps-script/StudyCompassSync.gs'
      - 'scripts/test-drive-master-schema.cjs'
      - '.github/workflows/check-drive-connection.yml'
      - '.github/workflows/verify-drive-approval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: |
          node --check scripts/check-drive-approval.cjs
          node --check scripts/test-drive-approval.cjs
          node --check scripts/export-drive-approved.cjs
          node --check scripts/test-drive-export.cjs
          node --check scripts/check-drive-connection.cjs
          node --check scripts/check-drive-staging-bundle.cjs
          node --check scripts/test-drive-staging-bundle.cjs
          node --check scripts/test-drive-master-schema.cjs
      - name: Run regression tests (synthetic fixtures only)
        run: |
          node scripts/test-drive-approval.cjs
          node scripts/test-drive-export.cjs
          node scripts/test-drive-master-schema.cjs
          node scripts/test-drive-staging-bundle.cjs
      - name: Validate real GAS staging bundle (never deploy)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/staging/drive-sync-bundle.json ]; then
            node scripts/check-drive-staging-bundle.cjs data/staging/drive-sync-bundle.json
          else
            echo 'No GAS bundle staged: regression-only check.'
          fi


<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIRUNOERA — 一問一答トップ（検証用）</title>
<style>
:root{--bg:#faf8f4;--paper:#fff;--ink:#292d33;--muted:#6a6e75;--line:#e6e1da;--wine:#6d3046;--copper:#a47763}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;line-height:1.65}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--copper);outline-offset:3px}header{background:var(--paper);border-bottom:1px solid var(--line)}.wrap{max-width:680px;margin:auto;padding:0 20px}
header .wrap{min-height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font:700 22px Georgia,serif;letter-spacing:.10em;color:var(--wine)}.header-sub{font-size:11px;color:var(--muted);letter-spacing:.05em}
main{padding:44px 0 70px}.eyebrow{letter-spacing:.14em;color:var(--wine);font-size:12px;font-weight:700}.intro{margin-bottom:30px}.intro h1{font-size:clamp(28px,5vw,38px);letter-spacing:.02em;margin:10px 0 7px;line-height:1.45}.intro p{font-size:15px;color:var(--muted);margin:0}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}.subject{background:var(--paper);border:1px solid var(--line);border-radius:10px;text-align:left;min-height:90px;padding:20px;display:flex;align-items:center;justify-content:space-between;color:var(--ink);box-shadow:0 2px 9px rgba(25,20,15,.025)}.subject:hover{border-color:var(--wine)}.subject strong{font-size:21px;font-weight:700}.arrow{color:var(--copper);font-size:21px}.subject:last-child{grid-column:span 2}
.note{font-size:12px;color:var(--muted);margin:17px 0 0}.footer{padding:22px;text-align:center;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.subpage{display:none}.subpage.active{display:block}.home.hidden{display:none}.back{border:0;background:transparent;color:var(--wine);padding:0 0 18px;font-weight:700}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:20px}
label{font-size:14px;font-weight:700;display:block;margin:0 0 8px}select{width:100%;background:white;padding:14px;border:1px solid #c9c4be;border-radius:8px;font-size:16px;color:var(--ink)}.num{display:flex;gap:8px;margin-top:10px}.num button{flex:1;background:white;border:1px solid var(--line);padding:14px 0;border-radius:8px}.num button[aria-pressed=true]{background:#f4e8ec;border:2px solid var(--wine);font-weight:700;color:var(--wine)}.primary{background:var(--wine);color:white;border:0;border-radius:8px;padding:17px;display:block;width:100%;font-weight:700;font-size:16px;margin-top:24px}.hint{font-size:12px;color:var(--muted);margin-top:12px}
.preview{margin-top:20px;padding:18px;background:#f2eee7;border-radius:10px}.preview h2{font-size:21px;margin:5px 0}.preview p{margin:0}
@media(max-width:480px){.wrap{padding:0 16px}main{padding-top:35px}.subjects{gap:10px}.subject{min-height:82px;padding:16px}.subject strong{font-size:18px}.logo{font-size:19px}.header-sub{font-size:10px}}
</style></head><body>
<header><div class="wrap"><div class="logo">SHIRUNOERA</div><div class="header-sub">高校受験 一問一答</div></div></header>
<main><div class="wrap"><section class="home" id="home">
  <div class="intro"><div class="eyebrow">STUDY COMPASS</div><h1>教科を選んで、<br>すぐに学ぼう。</h1><p>5教科の一問一答。毎日少しずつ、自分のペースで。</p></div>
  <div class="subjects" aria-label="教科を選択">
    <button class="subject" data-subject="国語"><strong>国語</strong><span class="arrow" aria-hidden="true">↗</span></button>
    <button class="subject" data-subject="数学"><strong>数学</strong><span class="arrow" aria-hidden="true">↗</span></button>
    <button class="subject" data-subject="英語"><strong>英語</strong><span class="arrow" aria-hidden="true">↗</span></button>
    <button class="subject" data-subject="理科"><strong>理科</strong><span class="arrow" aria-hidden="true">↗</span></button>
    <button class="subject" data-subject="社会"><strong>社会</strong><span class="arrow" aria-hidden="true">↗</span></button>
  </div>
  <p class="note">登録不要。まずは教科を選んでください。</p>
</section>
<section id="configure" class="subpage" aria-label="出題設定">
  <button id="back" class="back">← 教科一覧に戻る</button><div class="eyebrow">STUDY COMPASS</div><h1 id="subject-title">社会の一問一答</h1>
  <p class="note">分野・単元と問題数を選んでスタート。</p>
  <div class="panel"><label for="unit">出題する分野</label>
    <select id="unit"></select>
    <label style="margin-top:22px">問題数</label>
    <div class="num" id="num"><button data-n="5">5問</button><button data-n="10" aria-pressed="true">10問</button><button data-n="20">20問</button><button data-n="all">全問</button></div>
    <button class="primary" id="start">この条件で始める →</button>
    <p class="hint">検証用の画面です。実際の問題データ・学習記録・本番サイトには接続していません。</p>
  </div><div id="selection" class="preview" hidden aria-live="polite"></div>
</section></div></main>
<footer class="footer">SHIRUNOERA / STUDY COMPASS — UI PREVIEW ONLY</footer>
<script>
"use strict";
const units={"国語":["すべて","漢字","語彙","熟語"],"数学":["すべて","数と式","方程式","関数","図形"],"英語":["すべて","英単語","文法","語順"],"理科":["すべて","物理","化学","生物","地学"],"社会":["すべて","地理","歴史","公民"]};
let subject="",amount="10";
const byId=id=>document.getElementById(id);
document.querySelectorAll("[data-subject]").forEach(btn=>btn.addEventListener("click",()=>{
 subject=btn.dataset.subject;byId("home").classList.add("hidden");byId("configure").classList.add("active");byId("subject-title").textContent=subject+"の一問一答";
 const sel=byId("unit");sel.replaceChildren();for(const name of units[subject]){const opt=document.createElement("option");opt.value=name;opt.textContent=name;sel.append(opt)}byId("selection").hidden=true;window.scrollTo(0,0);
}));
byId("back").addEventListener("click",()=>{byId("configure").classList.remove("active");byId("home").classList.remove("hidden");window.scrollTo(0,0)});
document.querySelectorAll("[data-n]").forEach(btn=>btn.addEventListener("click",()=>{amount=btn.dataset.n;document.querySelectorAll("[data-n]").forEach(b=>b.setAttribute("aria-pressed",String(b===btn)))}));
byId("start").addEventListener("click",()=>{const box=byId("selection");box.hidden=false;box.replaceChildren();const h=document.createElement("h2");h.textContent="設定の確認";const p=document.createElement("p");p.textContent=subject+" ／ "+byId("unit").value+" ／ "+(amount==="all"?"全問":amount+"問")+"。実装時にはここから問題演習画面へ進みます。";box.append(h,p)});
</script></body></html>

let state=JSON.parse(localStorage.getItem(KEY)||'{"i":0,"score":0,"answered":{}}');if(state.i>=Q.length)state.i=0;
let variant=0;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function render(){const x=Q[state.i];document.getElementById("family").textContent=x.family;document.getElementById("qid").textContent=x.id;document.getElementById("material").textContent=x.m[variant%x.m.length];document.getElementById("question").textContent=x.q;document.getElementById("result").style.display="none";const box=document.getElementById("choices");box.innerHTML="";for(const o of shuffle(x.o)){const b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=()=>answer(b,o);box.appendChild(b)}document.getElementById("count").textContent=(state.i+1)+" / "+Q.length+"問";document.getElementById("score").textContent="正解 "+Object.values(state.answered).filter(Boolean).length+" / "+Object.keys(state.answered).length;document.getElementById("bar").style.width=((state.i+1)/Q.length*100)+"%"}
function answer(btn,o){const x=Q[state.i],ok=o===x.a;state.answered[x.id]=ok;save();for(const b of document.querySelectorAll(".choice")){b.disabled=true;if(b.textContent===x.a)b.classList.add("ok")}if(!ok)btn.classList.add("ng");const r=document.getElementById("result");r.textContent=ok?"正解。資料の形が変わっても、同じ根拠で判断できます。":"もう一度資料の『何が分かるか／何までは分からないか』を確認しよう。";r.style.display="block";document.getElementById("score").textContent="正解 "+Object.values(state.answered).filter(Boolean).length+" / "+Object.keys(state.answered).length}
document.getElementById("regen").onclick=()=>{variant++;render()};document.getElementById("prev").onclick=()=>{state.i=(state.i-1+Q.length)%Q.length;variant=0;save();render()};document.getElementById("next").onclick=()=>{state.i=(state.i+1)%Q.length;variant=0;save();render()};render();
</script></body></html>

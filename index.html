ic_name":"経済","q":"供給が変わらないとき、需要が増えると一般に価格はどうなりやすい？","answer":"上がりやすい","options":["上がりやすい","下がりやすい","必ず同じ","必ず0になる"],"ex":"市場では需要と供給の関係によって価格が変動します。"},{"id":"SC-SOC-CIV-000047","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"日本の中央銀行は？","answer":"日本銀行","options":["日本銀行","財務省","金融庁","ゆうちょ銀行"],"ex":"日本銀行は日本の中央銀行です。"},{"id":"SC-SOC-CIV-000048","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合の本部がある都市は？","answer":"ニューヨーク","options":["ニューヨーク","ジュネーブ","パリ","ロンドン"],"ex":"国際連合の本部はアメリカ合衆国のニューヨークにあります。"},{"id":"SC-SOC-CIV-000049","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合の略称として一般に使われる英字は？","answer":"UN","options":["UN","EU","WHO","WTO"],"ex":"United Nationsの略としてUNが使われます。"},{"id":"SC-SOC-CIV-000050","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"日本国憲法で保障されている基本的な権利は？","answer":"基本的人権","options":["基本的人権","参政権だけ","納税の義務","行政権"],"ex":"日本国憲法は基本的人権の尊重を基本原理の一つとしています。"},{"id":"SC-SOC-CIV-000051","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"商品やサービスを買おうとする量を何という？","answer":"需要","options":["需要","供給","生産","輸出"],"ex":"消費者が商品やサービスを買おうとする量を需要といいます。"},{"id":"SC-SOC-CIV-000052","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"商品やサービスを売ろうとする量を何という？","answer":"供給","options":["供給","需要","消費","輸入"],"ex":"生産者などが商品やサービスを市場に出そうとする量を供給といいます。"},{"id":"SC-SOC-CIV-000053","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"日本国憲法で保障される、思想・良心の自由はどの権利に含まれる？","answer":"自由権","options":["自由権","社会権","参政権だけ","請求権だけ"],"ex":"思想・良心の自由などは、国家から不当に制約されないための自由権に含まれます。"},{"id":"SC-SOC-CIV-000054","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"健康で文化的な最低限度の生活を営む権利は？","answer":"生存権","options":["生存権","選挙権","請願権","財産権"],"ex":"日本国憲法25条は生存権を保障しています。"},{"id":"SC-SOC-CIV-000055","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合の安全保障理事会で、常任理事国が持つ特別な権限は？","answer":"拒否権","options":["拒否権","解散権","課税権","立法権"],"ex":"安全保障理事会の常任理事国には、実質事項の決議に対する拒否権があります。"},{"id":"SC-SOC-CIV-000056","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"日本国憲法で、健康で文化的な最低限度の生活を営む権利を何という？","answer":"生存権","options":["生存権","参政権","請願権","財産権"],"ex":"日本国憲法第25条は、健康で文化的な最低限度の生活を営む権利を保障しています。"},{"id":"SC-SOC-CIV-000057","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"国民が政治に参加する権利をまとめて何という？","answer":"参政権","options":["参政権","社会権","自由権","平等権"],"ex":"選挙権など、政治に参加するための権利を参政権といいます。"},{"id":"SC-SOC-CIV-000058","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"思想・良心の自由や表現の自由などを含む基本的人権の分類は？","answer":"自由権","options":["自由権","社会権","参政権","請求権"],"ex":"国家から不当に干渉されず自由に活動することを保障する権利を自由権といいます。"},{"id":"SC-SOC-CIV-000059","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合で、国際平和と安全の維持に主要な責任を負う機関は？","answer":"安全保障理事会","options":["安全保障理事会","総会","国際司法裁判所","事務局"],"ex":"国際連合の安全保障理事会は、国際平和と安全の維持に主要な責任を負います。"},{"id":"SC-SOC-CIV-000060","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合安全保障理事会の常任理事国が持つ、実質的に決議を成立させない権限を何という？","answer":"拒否権","options":["拒否権","解散権","違憲審査権","請願権"],"ex":"安全保障理事会の実質事項では、常任理事国の反対票が決議成立を妨げるため、一般に拒否権と呼ばれます。"},{"id":"SC-SOC-CIV-000061","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国と国との間で結ばれる合意で、国内で承認手続を経て効力を持つものを何という？","answer":"条約","options":["条約","条例","政令","判例"],"ex":"国家間の合意のうち、国際法上の権利や義務を定めるものを条約といいます。"},{"id":"SC-SOC-CIV-000062","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"ある商品の価格が下がったとき、ほかの条件が同じなら需要量は一般にどうなる？","answer":"増える","options":["増える","減る","必ず0になる","変化しない"],"ex":"一般に価格が下がると、その商品を買いたい量である需要量は増える傾向があります。"},{"id":"SC-SOC-CIV-000063","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"企業どうしが価格や品質などで競い合うことを何という？","answer":"競争","options":["競争","独占","租税","社会保障"],"ex":"市場では企業が価格や品質、サービスなどをめぐって競争します。"},{"id":"SC-SOC-GEO-000064","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"世界地理","q":"赤道付近が一年を通して高温になりやすい主な理由は？","answer":"太陽の光が強く当たりやすいから","options":["太陽の光が強く当たりやすいから","海抜が高い地域が多いから","寒流の影響が強いから","太陽が地平線近くに見えるから"],"ex":"赤道付近は太陽高度が高く、年間を通して強い日射を受けやすいため高温になりやすい地域です。"},{"id":"SC-SOC-GEO-000065","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"世界地理","q":"世界の気候を考えるとき、緯度が高くなるほど一般に気温が低くなる主な理由は？","answer":"太陽の光が斜めに当たりやすくなるから","options":["太陽の光が斜めに当たりやすくなるから","地球から遠くなるから","海がなくなるから","空気がなくなるから"],"ex":"高緯度ほど太陽光が斜めに当たり、単位面積あたりに受けるエネルギーが小さくなります。"},{"id":"SC-SOC-GEO-000066","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"世界地理","q":"季節によって風向きが大きく変わる風を何という？","answer":"季節風（モンスーン）","options":["季節風（モンスーン）","偏西風","貿易風","海風"],"ex":"大陸と海洋の温まり方の違いなどにより、季節で風向きが変わる風を季節風といいます。"},{"id":"SC-SOC-HIS-000067","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉幕府で、将軍を補佐し政治の実権を握った役職は？","answer":"執権","options":["執権","関白","老中","大老"],"ex":"鎌倉幕府では北条氏が執権となり、政治の実権を握りました。"},{"id":"SC-SOC-HIS-000068","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町幕府の第3代将軍で、金閣を建てた人物は？","answer":"足利義満","options":["足利義満","足利尊氏","足利義政","源頼朝"],"ex":"足利義満は室町幕府第3代将軍で、京都の北山に金閣を建てました。"},{"id":"SC-SOC-HIS-000069","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"土器の使用が始まるより前、日本で狩りや採集を中心に暮らした時代は？","answer":"旧石器時代","options":["旧石器時代","縄文時代","弥生時代","古墳時代"],"ex":"日本の旧石器時代は、土器の使用が始まる前の時代です。打製石器は縄文時代にも使われたため、それだけでは時代を特定できません。"},{"id":"SC-SOC-HIS-000070","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の人々が食べ物の煮炊きなどに使った土器は？","answer":"縄文土器","options":["縄文土器","弥生土器","須恵器","土師器"],"ex":"縄文時代には、表面に縄目の文様を持つ縄文土器が使われました。"},{"id":"SC-SOC-HIS-000071","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の代表的な住居は？","answer":"竪穴住居","options":["竪穴住居","高床倉庫","寝殿造","書院造"],"ex":"縄文時代には、地面を掘り下げて柱を立てる竪穴住居が広く使われました。"},{"id":"SC-SOC-HIS-000072","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代に日本各地へ広がった農業は？","answer":"稲作","options":["稲作","酪農","茶の栽培","綿花栽培"],"ex":"弥生時代には大陸から伝わった水田稲作が広がりました。"},{"id":"SC-SOC-HIS-000073","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代の収穫物を保存するために使われた建物は？","answer":"高床倉庫","options":["高床倉庫","竪穴住居","校倉造","寝殿造"],"ex":"高床倉庫は湿気や害虫を防ぎ、米などの保存に適していました。"},{"id":"SC-SOC-HIS-000074","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"『魏志』倭人伝に記された邪馬台国の女王は？","answer":"卑弥呼","options":["卑弥呼","推古天皇","持統天皇","額田王"],"ex":"卑弥呼は邪馬台国の女王として中国の『魏志』倭人伝に記されています。"},{"id":"SC-SOC-HIS-000075","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"大規模な前方後円墳が多く造られた時代は？","answer":"古墳時代","options":["古墳時代","縄文時代","奈良時代","鎌倉時代"],"ex":"古墳時代には有力者の墓として前方後円墳などの大きな古墳が造られました。"},{"id":"SC-SOC-HIS-000076","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳の周囲などに置かれた素焼きの土製品は？","answer":"埴輪","options":["埴輪","土偶","銅鐸","木簡"],"ex":"埴輪は古墳の周囲や上に並べられた素焼きの土製品です。"},{"id":"SC-SOC-HIS-000077","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"冠位十二階や十七条の憲法に関わった人物は？","answer":"聖徳太子","options":["聖徳太子","中大兄皇子","藤原道長","聖武天皇"],"ex":"聖徳太子は推古天皇のもとで政治を助け、冠位十二階や十七条の憲法に関わったとされます。"},{"id":"SC-SOC-HIS-000078","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"645年の政変をきっかけに始まった改革を何という？","answer":"大化の改新","options":["大化の改新","壬申の乱","承久の乱","応仁の乱"],"ex":"645年の政変をきっかけに、中大兄皇子や中臣鎌足らが政治改革を進めました。"},{"id":"SC-SOC-HIS-000079","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"710年に都が置かれた場所は？","answer":"平城京","options":["平城京","平安京","藤原京","長岡京"],"ex":"710年に都が平城京へ移され、奈良時代が始まりました。"},{"id":"SC-SOC-HIS-000080","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"聖武天皇が国ごとに建立を命じた寺院は？","answer":"国分寺・国分尼寺","options":["国分寺・国分尼寺","延暦寺","東福寺","金閣"],"ex":"聖武天皇は仏教の力で国を守ろうとし、国分寺・国分尼寺の建立を命じました。"},{"id":"SC-SOC-HIS-000081","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"奈良時代に完成した、日本最古の和歌集は？","answer":"万葉集","options":["万葉集","古今和歌集","新古今和歌集","梁塵秘抄"],"ex":"万葉集は奈良時代に成立した日本最古の和歌集です。"},{"id":"SC-SOC-HIS-000082","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"794年に都を平安京へ移した天皇は？","answer":"桓武天皇","options":["桓武天皇","聖武天皇","天智天皇","後醍醐天皇"],"ex":"桓武天皇は794年に都を平安京へ移しました。"},{"id":"SC-SOC-HIS-000083","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"摂政・関白の地位を利用して摂関政治を行った氏族は？","answer":"藤原氏","options":["藤原氏","平氏","源氏","北条氏"],"ex":"藤原氏は天皇家との婚姻関係を背景に、摂政・関白として政治の実権を握りました。"},{"id":"SC-SOC-HIS-000084","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉幕府が全国に守護・地頭を置くきっかけとなった出来事は？","answer":"源義経追討","options":["源義経追討","承久の乱","元寇","応仁の乱"],"ex":"源頼朝は源義経追討を名目に、全国に守護・地頭を置く権限を朝廷から認められました。"},{"id":"SC-SOC-HIS-000085","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"将軍と御家人の主従関係を表す言葉は？","answer":"御恩と奉公","options":["御恩と奉公","公地公民","班田収授","殖産興業"],"ex":"将軍が領地などの御恩を与え、御家人が軍役などの奉公をする関係でした。"},{"id":"SC-SOC-HIS-000086","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉幕府で将軍を補佐し、北条氏が就いた役職は？","answer":"執権","options":["執権","関白","老中","管領"],"ex":"鎌倉幕府では北条氏が執権となり政治の実権を握りました。"},{"id":"SC-SOC-HIS-000087","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"1221年、後鳥羽上皇が幕府打倒をめざして起こした戦いは？","answer":"承久の乱","options":["承久の乱","壬申の乱","応仁の乱","島原・天草一揆"],"ex":"1221年に承久の乱が起こり、幕府側が勝利しました。"},{"id":"SC-SOC-HIS-000088","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"御成敗式目を制定した執権は？","answer":"北条泰時","options":["北条泰時","北条時宗","北条政子","北条時政"],"ex":"北条泰時は武士の慣習に基づく御成敗式目を制定しました。"},{"id":"SC-SOC-HIS-000089","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"元が日本へ二度襲来した出来事を何という？","answer":"元寇","options":["元寇","応仁の乱","倭寇","文永の役"],"ex":"1274年の文永の役と1281年の弘安の役を合わせて元寇と呼びます。"},{"id":"SC-SOC-HIS-000090","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉時代に浄土宗を開いた人物は？","answer":"法然","options":["法然","親鸞","日蓮","栄西"],"ex":"法然は念仏による救いを説き、浄土宗を開きました。"},{"id":"SC-SOC-HIS-000091","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"建武の新政を行った天皇は？","answer":"後醍醐天皇","options":["後醍醐天皇","後鳥羽上皇","桓武天皇","後白河法皇"],"ex":"鎌倉幕府滅亡後、後醍醐天皇は天皇中心の政治である建武の新政を行いました。"},{"id":"SC-SOC-HIS-000092","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町幕府で将軍を補佐した役職は？","answer":"管領","options":["管領","執権","老中","関白"],"ex":"室町幕府では管領が将軍を補佐しました。"},{"id":"SC-SOC-HIS-000093","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"金閣を建て、南北朝の合一を実現した将軍は？","answer":"足利義満","options":["足利義満","足利義政","足利尊氏","足利義昭"],"ex":"足利義満は南北朝の合一を実現し、北山文化を代表する金閣を建てました。"},{"id":"SC-SOC-HIS-000094","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"銀閣に代表される文化を何という？","answer":"東山文化","options":["東山文化","北山文化","天平文化","元禄文化"],"ex":"銀閣を中心に発達した文化は東山文化と呼ばれます。"},{"id":"SC-SOC-HIS-000095","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"1467年に始まり、戦国時代につながった戦乱は？","answer":"応仁の乱","options":["応仁の乱","承久の乱","壬申の乱","島原・天草一揆"],"ex":"応仁の乱は京都を中心に長期化し、戦国時代につながる要因となりました。"},{"id":"SC-SOC-HIS-000096","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町時代、農民や地侍などが自治的につくった村を何という？","answer":"惣村","options":["惣村","荘園","城下町","寺内町"],"ex":"惣村では寄合などによって村の運営が行われました。"},{"id":"SC-SOC-HIS-000097","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町時代に明との間で行われた、勘合を用いた貿易は？","answer":"日明貿易","options":["日明貿易","南蛮貿易","朱印船貿易","日宋貿易"],"ex":"倭寇と区別するため勘合を用いて行われた貿易 _name":"江戸後期","q":"『古事記伝』を著し、国学を大成した人物は？","answer":"本居宣長","options":["本居宣長","賀茂真淵","杉田玄白","荻生徂徠"],"ex":"本居宣長は『古事記伝』を著し、国学を大成しました。"},{"id":"SC-SOC-HIS-000159","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"日米修好通商条約を結んだときの大老は？","answer":"井伊直弼","options":["井伊直弼","大久保利通","伊藤博文","西郷隆盛"],"ex":"1858年、大老井伊直弼のもとで日米修好通商条約が結ばれました。"},{"id":"SC-SOC-HIS-000160","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"薩摩藩と長州藩の提携を仲介した人物は？","answer":"坂本龍馬","options":["坂本龍馬","勝海舟","板垣退助","福沢諭吉"],"ex":"坂本龍馬らの仲介で薩長同盟が成立しました。"},{"id":"SC-SOC-HIS-000161","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"岩倉使節団の主な目的として適切なのは？","answer":"欧米の制度や産業を調査すること","options":["欧米の制度や産業を調査すること","朝鮮を植民地にすること","鎖国を復活させること","幕府を再建すること"],"ex":"岩倉使節団は欧米諸国の制度や産業などを視察・調査しました。"},{"id":"SC-SOC-HIS-000162","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"明治政府が近代産業を育成するために進めた政策を何という？","answer":"殖産興業","options":["殖産興業","富国強兵","文明開化","廃藩置県"],"ex":"殖産興業は官営工場の設置などを通じて近代産業を育成する政策です。"},{"id":"SC-SOC-HIS-000163","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"大日本帝国憲法の制定に中心的に関わった人物は？","answer":"伊藤博文","options":["伊藤博文","板垣退助","大隈重信","西郷隆盛"],"ex":"伊藤博文はヨーロッパの憲法制度を調査し、大日本帝国憲法制定の中心となりました。"},{"id":"SC-SOC-HIS-000164","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"1918年、米価の急騰を背景に全国へ広がった民衆運動は？","answer":"米騒動","options":["米騒動","自由民権運動","護憲運動","労働争議"],"ex":"1918年、米価の急騰を背景に米騒動が全国へ広がりました。"},{"id":"SC-SOC-HIS-000165","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"1923年に東京・横浜を中心に大きな被害を出した災害は？","answer":"関東大震災","options":["関東大震災","濃尾地震","阪神・淡路大震災","東日本大震災"],"ex":"1923年に関東大震災が発生し、東京や横浜などに大きな被害が出ました。"},{"id":"SC-SOC-HIS-000166","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"1937年に本格化した日本と中国の戦争は？","answer":"日中戦争","options":["日中戦争","日清戦争","日露戦争","太平洋戦争"], s":["銅鐸","打製石器","埴輪","火縄銃"],"ex":"銅鐸は弥生時代の青銅器で、祭りなどに使われたと考えられています。"},{"id":"SC-SOC-HIS-000175","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳時代に大和政権が勢力を広げたことを示す手がかりとして適切なのは？","answer":"各地に似た形の前方後円墳が造られた","options":["各地に似た形の前方後円墳が造られた","全国で参勤交代が行われた","各地に国分寺が建てられた","全国に鉄道が敷かれた"],"ex":"各地に前方後円墳が造られたことは、大和政権とのつながりを考える手がかりになります。"},{"id":"SC-SOC-HIS-000176","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"大和政権の豪族に与えられた地位や称号の仕組みを何という？","answer":"氏姓制度","options":["氏姓制度","班田収授法","御恩と奉公","参勤交代"],"ex":"大和政権は豪族を氏と姓で秩序づける氏姓制度を用いました。"},{"id":"SC-SOC-HIS-000177","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"十七条の憲法が目指したこととして適切なのは？","answer":"役人の心構えを示し、天皇中心の政治を進める","options":["役人の心構えを示し、天皇中心の政治を進める","武士の裁判基準を定める","大名を江戸に住まわせる","国会の仕組みを定める"],"ex":"十七条の憲法は役人の心構えを示し、天皇を中心とした政治を目指す内容でした。"},{"id":"SC-SOC-HIS-000178","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"班田収授法では、一定の年齢に達した人々に何が与えられた？","answer":"口分田","options":["口分田","荘園","知行地","藩"],"ex":"班田収授法では戸籍に基づき人々に口分田が与えられました。"},{"id":"SC-SOC-HIS-000179","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"奈良時代に税として地方から都へ運ばれたものの組み合わせとして適切なのは？","answer":"調・庸","options":["調・庸","年貢・地租","石高・俸禄","関税・消費税"],"ex":"律令制度では調や庸などの税が課されました。"},{"id":"SC-SOC-HIS-000180","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"国風文化が発達した背景として適切なのは？","answer":"遣唐使停止後、日本独自の文化が発達した","options":["遣唐使停止後、日本独自の文化が発達した","鎖国で外国との交流が完全になくなった","明治政府が欧化政策を進めた","武士が全国を統一した"],"ex":"遣唐使停止後、中国文化の影響を受けつつ日本の風土に合った国風文化が発達しました。"},{"id":"SC-SOC-HIS-000181","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"院政を始めた上皇として知られる人物は？","answer":"白河上皇","options":["白河上皇","後鳥羽上皇","後醍醐天皇","聖武天皇"],"ex":"白河上皇は上皇となった後も政治の実権を握り、院政を始めました。"},{"id":"SC-SOC-HIS-000182","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"御家人が将軍に対して負った奉公の例として適切なのは？","answer":"軍役や京都の警備を務める","options":["軍役や京都の警備を務める","年貢を免除される","関白に就任する","外交条約を結ぶ"],"ex":"御家人は将軍から御恩を受ける代わりに軍役や警備などの奉公を行いました。"},{"id":"SC-SOC-HIS-000183","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"御成敗式目が制定された目的として適切なのは？","answer":"武士社会の裁判基準を明確にする","options":["武士社会の裁判基準を明確にする","公家の儀式を定める","農民の年貢を廃止する","外国との貿易ルールを定める"],"ex":"御成敗式目は武士の慣習や道理に基づいて裁判の基準を示しました。"},{"id":"SC-SOC-HIS-000184","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"日明貿易で勘合が使われた主な理由は？","answer":"倭寇と正式な貿易船を区別するため","options":["倭寇と正式な貿易船を区別するため","税を米で納めるため","大名を江戸へ集めるため","キリスト教徒を調べるため"],"ex":"勘合は正式な貿易船であることを示し、倭寇と区別するために使われました。"},{"id":"SC-SOC-HIS-000185","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"応仁の乱の後、各地で勢力を強めたのは？","answer":"戦国大名","options":["戦国大名","摂政","国司","公家"],"ex":"応仁の乱後、各地で戦国大名が力を強めました。"},{"id":"SC-SOC-HIS-000186","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"下剋上とはどのような動きを指す？","answer":"身分の低い者が実力で上の者を倒す","options":["身分の低い者が実力で上の者を倒す","朝廷が幕府を保護する","農民が武士になることを禁じる","大名が江戸に住む"],"ex":"戦国時代には実力によって下位の者が上位の者を倒す下剋上が見られました。"},{"id":"SC-SOC-HIS-000187","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"楽市・楽座の目的として適切なのは？","answer":"商工業を活発にする","options":["商工業を活発にする","農民から武器を取り上げる","キリスト教を禁止する","大名を統制する"],"ex":"楽市・楽座は市場の特権を廃して商工業を活発にする政策でした。"},{"id":"SC-SOC-HIS-000188","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"太閤検地と刀狩によって進んだ社会の変化は？","answer":"兵農分離","options":["兵農分離","公地公民","摂関政治","殖産興業"],"ex":"検地と刀狩によって武士と農民の身分の分離が進みました。"},{"id":"SC-SOC-HIS-000189","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"参勤交代が幕府による大名統制に役立った理由として適切なのは？","answer":"大名に経済的負担を負わせ、江戸との往復を義務づけた","options":["大名に経済的負担を負わせ、江戸との往復を義務づけた","大名に外国貿易を任せた","大名に国会議員を選ばせた","農民の税を免除した"],"ex":"参勤交代は大名に江戸との往復や江戸滞在を義務づけ、経済的負担も与えました。"},{"id":"SC-SOC-HIS-000190","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"江戸幕府の対外政策のもとで、長崎を通じて貿易した相手の組み合わせは？","answer":"オランダと中国","options":["オランダと中国","イギリスとフランス","ロシアとアメリカ","スペインとポルトガル"],"ex":"鎖国下でも長崎を通じてオランダや中国との貿易が行われました。"},{"id":"SC-SOC-HIS-000191","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"元禄文化と関係が深い人物の組み合わせは？","answer":"井原西鶴と松尾芭蕉","options":["井原西鶴と松尾芭蕉","葛飾北斎と歌川広重","紫式部と清少納言","観阿弥と世阿弥"],"ex":"井原西鶴や松尾芭蕉は元禄文化を代表する人物です。"},{"id":"SC-SOC-HIS-000192","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"化政文化の特色として適切なのは？","answer":"江戸の町人を中心に浮世絵や文学が栄えた","options":["江戸の町人を中心に浮世絵や文学が栄えた","公家中心にかな文学が発達した","武士中心に能が大成した","仏教中心に天平文化が栄えた"],"ex":"化政文化は江戸を中心に町人文化が発達し、浮世絵や文学が栄えました。"},{"id":"SC-SOC-HIS-000193","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"日米修好通商条約が不平等条約とされた理由として適切なのは？","answer":"領事裁判権を認め、関税自主権がなかった","options":["領事裁判権を認め、関税自主権がなかった","日本がアメリカを植民地化した","日本だけが鎖国を続けた","将軍が選挙で選ばれた"],"ex":"条約には領事裁判権を認め、関税自主権を持てないなど日本に不利な内容が含まれていました。"},{"id":"SC-SOC-HIS-000194","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"大政奉還を行った将軍は？","answer":"徳川慶喜","options":["徳川慶喜","徳川家康","徳川吉宗","徳川家光"],"ex":"1867年、徳川慶喜は政権を朝廷へ返す大政奉還を行いました。"},{"id":"SC-SOC-HIS-000195","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"地租改正で税を納める基準となったものは？","answer":"地価","options":["地価","収穫量","人口","家の広さ"],"ex":"地租改正では土地の価格である地価を基準に地租を現金で納めました。"},{"id":"SC-SOC-HIS-000196","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"徴兵令や殖産興業などの政策が目指したこととして最も適切なのは？","answer":"近代国家をつくり国力を高める","options":["近代国家をつくり国力を高める","幕藩体制を復活させる","鎖国を強化する","摂関政治を復活させる"],"ex":"明治政府は富国強兵を掲げ、近代国家づくりを進めました。"},{"id":"SC-SOC-HIS-000197","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"大正デモクラシーの動きとして適切なのは？","answer":"普通選挙を求める運動が広がった","options":["普通選挙を求める運動が広がった","参勤交代が復活した","班田収授法が始まった","鎖国が強化された"],"ex":"大正期には民衆の政治参加を求める動きが広がりました。"},{"id":"SC-SOC-HIS-000198","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"世界恐慌が始まったきっかけとして一般に知られる出来事は？","answer":"ニューヨーク株式市場の株価暴落","options":["ニューヨーク株式市場の株価暴落","ベルリンの壁崩壊","オイルショック","米騒動"],"ex":"1929年のニューヨーク株式市場の株価暴落をきっかけに世界恐慌が広がりました。"},{"id":"SC-SOC-HIS-000199","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"1933年、日本が脱退を表明した国際機関は？","answer":"国際連盟","options":["国際連盟","国際連合","ASEAN","EU"],"ex":"満州事変をめぐる国際連盟の対応を受け、日本は1933年に国際連盟脱退を表明しました。"},{"id":"SC-SOC-HIS-000200","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"1940年に日本がドイツ・イタリアと結んだ同盟は？","answer":"日独伊三国同盟","options":["日独伊三国同盟","日英同盟","三国干渉","ワシントン条約"],"ex":"1940年、日本はドイツ・イタリアと日独伊三国同盟を結びました。"},{"id":"SC-SOC-HIS-000201","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"太平洋戦争が始まった年は？","answer":"1941年","options":["1941年","1931年","1937年","1945年"],"ex":"1941年12月、日本のハワイ真珠湾攻撃などをきっかけに太平洋戦争が始まりました。"},{"id":"SC-SOC-HIS-000202","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"日本国憲法の基本原理の組み合わせとして適切なのは？","answer":"国民主権・基本的人権の尊重・平和主義","options":["国民主権・基本的人権の尊重・平和主義","天皇主権・富国強兵・殖産興業","議会政治・鎖国・身分制","公地公民・班田収授・租庸調"],"ex":"日本国憲法の三大原理は国民主権・基本的人権の尊重・平和主義です。"},{"id":"SC-SOC-HIS-000203","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"高度経済成長期に人々の生活で広く普及したものとして適切なのは？","answer":"テレビ・冷蔵庫・洗濯機","options":["テレビ・冷蔵庫・洗濯機","火縄銃・刀・鎧","ラジオ・蓄音機・人力車","蒸気機関車・電信機・紡績機"],"ex":"高度経済成長期には三種の神器と呼ばれた家電製品が広く普及しました。"},{"id":"SC-SOC-GEO-000204","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"気候","q":"赤道付近に広がり、一年中高温で降水量が多い気候は？","answer":"熱帯雨林気候","options":["熱帯雨林気候","砂漠気候","地中海性気候","ツンドラ気候"],"ex":"赤道付近では一年中高温多雨の熱帯雨林気候が見られます。"},{"id":"SC-SOC-GEO-000205","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"気候","q":"夏に乾燥し、冬に比較的雨が多い気候は？","answer":"地中海性気候","options":["地中海性気候","西岸海洋性気候","熱帯雨林気候","亜寒帯湿潤気候"],"ex":"地中海沿岸では夏に乾燥し冬に降水が多い地中海性気候が見られます。"},{"id":"SC-SOC-GEO-000206","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"地形","q":"日本の川の特徴として適切なのは？","answer":"短く流れが急な川が多い","options":["短く流れが急な川が多い","長く流れが緩やかな川が多い","ほとんどが一年中凍っている","河口がすべて三角州ではない"],"ex":"日本は山地が多く海までの距離が短いため、短く流れが急な川が多く見られます。"},{"id":"SC-SOC-GEO-000207","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"人口","q":"人口が都市部に集中することで起こりやすい問題は？","answer":"住宅不足や交通混雑","options":["住宅不足や交通混雑","耕地面積の急増","農村人口の増加","人口密度の低下"],"ex":"都市への人口集中により住宅不足や交通混雑などの都市問題が起こりやすくなります。"},{"id":"SC-SOC-GEO-000208","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"工業","q":"太平洋ベルトに工業地帯・地域が多く集まる理由として適切なのは？","answer":"港湾や人口の多い都市が連なり輸送に便利だから","options":["港湾や人口の多い都市が連なり輸送に便利だから","積雪が多く冬の農業に向くから","森林が多く林業だけが盛んだから","国境に近く軍事上有利だから"],"ex":"太平洋側には港湾や大都市が連なり、原料や製品の輸送に便利なため工業が発達しました。"},{"id":"SC-SOC-CIV-000209","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"国会","q":"衆議院の優越が認められている理由として適切なのは？","answer":"任期が短く解散もあり、民意を反映しやすいから","options":["任期が短く解散もあり、民意を反映しやすいから","参議院より議員数が必ず少ないから","裁判官を任命できるから","地方自治を担当するから"],"ex":"衆議院は任期が短く解散があるため、民意をより反映しやすいと考えられています。"},{"id":"SC-SOC-CIV-000210","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"裁判所","q":"三審制が設けられている主な目的は？","answer":"慎重で公正な裁判を行うため","options":["慎重で公正な裁判を行うため","裁判を必ず長引かせるため","国会の仕事を減らすため","内閣が裁判を指揮するため"],"ex":"同じ事件について原則3回まで裁判を受けられる仕組みにより、慎重で公正な判断を目指します。"},{"id":"SC-SOC-CIV-000211","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"社会権に含まれるものとして適切なのは？","answer":"生存権","options":["生存権","選挙権","信教の自由","表現の自由"],"ex":"生存権は社会権の一つで、健康で文化的な最低限度の生活を営む権利です。"},{"id":"SC-SOC-CIV-000212","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"市場で需要が減り、供給が変わらないとき、価格は一般にどうなりやすい？","answer":"下がりやすい","options":["下がりやすい","上がりやすい","必ず変わらない","必ず0になる"],"ex":"供給が変わらず需要が減ると、一般に価格には下がる方向の力が働きます。"},{"id":"SC-SOC-CIV-000213","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合の総会で各加盟国が持つ票数は原則いくつ？","answer":"1票","options":["1票","2票","人口に応じて変わる","常任理事国だけ5票"],"ex":"国際連合総会では原則として各加盟国が1票を持ちます。"},{"id":"SC-SOC-HIS-000214","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代の遺跡として知られる岩宿遺跡がある都道府県は？","answer":"群馬県","options":["群馬県","青森県","奈良県","福岡県"],"ex":"岩宿遺跡は群馬県にあり、日本にも旧石器時代があったことを示す重要な遺跡です。"},{"id":"SC-SOC-HIS-000215","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の人々が定住生活を送れた理由として適切なのは？","answer":"狩り・漁・採集で得られる食料が豊富だったから","options":["狩り・漁・採集で得られる食料が豊富だったから","水田稲作が全国で完成していたから","貨幣経済が発達していたから","武士が治安を守っていたから"],"ex":"縄文時代には豊かな自然を利用し、狩り・漁・採集を組み合わせて定住生活を営みました。"},{"id":"SC-SOC-HIS-000216","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国大名が城下町を整備した主な目的として適切なのは？","answer":"家臣や商工業者を集め領国支配を強めるため","options":["家臣や商工業者を集め領国支配を強めるため","朝廷を地方へ移すため","農民をすべて武士にするため","外国との貿易を禁止するため"],"ex":"城下町には家臣や商工業者が集められ、政治・経済の中心として領国支配に役立ちました。"},{"id":"SC-SOC-HIS-000217","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"天保の改革が行われた背景として適切なのは？","answer":"幕府財政の悪化や社会不安が深まっていた","options":["幕府財政の悪化や社会不安が深まっていた","日露戦争に敗れた","鎌倉幕府が滅亡した","普通選挙が実現した"],"ex":"江戸後期には幕府財政の悪化や飢饉・一揆などの社会不安が深まり、改革が試みられました。"},{"id":"SC-SOC-HIS-000218","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"『東海道五十三次』で知られる浮世絵師は？","answer":"歌川広重","options":["歌川広重","葛飾北斎","喜多川歌麿","東洲斎写楽"],"ex":"歌川広重は『東海道五十三次』で知られる浮世絵師です。"},{"id":"SC-SOC-HIS-000219","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代と縄文時代の違いとして最も適切なのは？","answer":"縄文時代には土器が使われるようになった","options":["縄文時代には土器が使われるようになった","旧石器時代には稲作が広まった","縄文時代には武士が登場した","旧石器時代には貨幣が使われた"],"ex":"縄文時代には土器が使われ、煮炊きや保存など生活の幅が広がりました。"},{"id":"SC-SOC-HIS-000220","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"三内丸山遺跡から分かる縄文時代の特色として適切なのは？","answer":"大規模な集落が形成されていた","options":["大規模な集落が形成されていた","全国を幕府が支配していた","工場制機械工業が行われていた","議会政治が行われていた"],"ex":"三内丸山遺跡からは、縄文時代に大規模な集落が形成されていたことが分かります。"},{"id":"SC-SOC-HIS-000221","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代にむらの有力者が現れた背景として最も適切なのは？","answer":"米などの蓄えに差が生まれたから","options":["米などの蓄えに差が生まれたから","参勤交代が始まったから","工業地帯ができたから","国会議員が選ばれたから"],"ex":"稲作の広がりにより収穫物の蓄えや土地・水の管理をめぐって差が生まれ、有力者が現れました。"},{"id":"SC-SOC-HIS-000222","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"前方後円墳が各地に広がったことから考えられることは？","answer":"大和政権と各地の豪族に結びつきがあった","options":["大和政権と各地の豪族に結びつきがあった","全国で同じ税率が使われていた","全国で選挙が行われていた","すべての豪族が同じ土地を治めていた"],"ex":"似た形の大規模古墳が広い地域に見られることは、大和政権と地方豪族の関係を考える手がかりになります。"},{"id":"SC-SOC-HIS-000223","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"冠位十二階を定めた目的として適切なのは？","answer":"家柄だけでなく能力や功績に応じて人材を登用するため","options":["家柄だけでなく能力や功績に応じて人材を登用するため","農民に土地を分けるため","大名を江戸に集めるため","外国との貿易を禁止するため"],"ex":"冠位十二階は、能力や功績に応じて役人の地位を示す仕組みでした。"},{"id":"SC-SOC-HIS-000224","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"東大寺の大仏造立を進めた背景として適切なのは？","answer":"仏教の力で国家の安定を願った","options":["仏教の力で国家の安定を願った","武士の反乱を鎮圧するため","海外貿易を拡大するため","議会政治を始めるため"],"ex":"聖武天皇は社会不安の中で仏教の力による国家の安定を願い、大仏造立を進めました。"},{"id":"SC-SOC-HIS-000225","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"荘園が増えたことで起こった変化として適切なのは？","answer":"朝廷が税を集めにくくなった","options":["朝廷が税を集めにくくなった","幕府が参勤交代を始めた","国会が解散した","工場労働者が増えた"],"ex":"税のかからない荘園が増えると、朝廷が直接税を得られる土地が減っていきました。"},{"id":"SC-SOC-HIS-000226","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"承久の乱後に幕府の支配が強まった地域は？","answer":"西日本","options":["西日本","北海道だけ","沖縄だけ","東北だけ"],"ex":"承久の乱後、幕府は朝廷側の所領を没収し、西日本にも地頭を置いて支配を強めました。"},{"id":"SC-SOC-HIS-000227","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉仏教が広まった理由として適切なのは？","answer":"武士や庶民にも分かりやすい教えが広まった","options":["武士や庶民にも分かりやすい教えが広まった","朝廷が仏教を全面禁止した","外国との交流が完全になくなった","武士が文字を使わなくなった"],"ex":"鎌倉時代には、念仏や題目、座禅など比較的実践しやすい教えが武士や庶民にも広がりました。"},{"id":"SC-SOC-HIS-000228","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"北山文化と東山文化の組み合わせとして正しいのは？","answer":"北山文化―金閣、東山文化―銀閣","options":["北山文化―金閣、東山文化―銀閣","北山文化―銀閣、東山文化―金閣","北山文化―東大寺、東山文化―法隆寺","北山文化―平等院、東山文化―厳島神社"],"ex":"北山文化は足利義満の金閣、東山文化は足利義政の銀閣に代表されます。"},{"id":"SC-SOC-HIS-000229","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"分国法を定めた目的として適切なのは？","answer":"戦国大名が領国内の支配を強めるため","options":["戦国大名が領国内の支配を強めるため","朝廷が全国の裁判を行うため","農民が自由に大名を選ぶため","外国との関税を決めるため"],"ex":"分国法は戦国大名が領国を統治するための独自の法でした。"},{"id":"SC-SOC-HIS-000230","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"織田信長が比叡山延暦寺や一向一揆と対立したことから分かることは？","answer":"宗教勢力も大きな政治・軍事力を持っていた","options":["宗教勢力も大きな政治・軍事力を持っていた","寺院はすべて幕府の役所だった","宗教勢力は武器を持たなかった","全国の寺院は外国政府が支配していた"],"ex":"戦国期には寺社勢力や一向一揆なども大きな政治・軍事力を持っていました。"},{"id":"SC-SOC-HIS-000231","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"江戸幕府がキリスト教を厳しく禁止した理由として適切なのは？","answer":"幕府支配を揺るがす可能性を警戒したから","options":["幕府支配を揺るがす可能性を警戒したから","米の収穫量を増やすため","大名の数を増やすため","鎖国を解除するため"],"ex":"幕府はキリスト教徒の結びつきや海外勢力との関係が支配を不安定にすることを警戒しました。"},{"id":"SC-SOC-HIS-000232","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"享保の改革で徳川吉宗が行った政策として適切なのは？","answer":"上米の制","options":["上米の制","廃藩置県","地租改正","版籍奉還"],"ex":"徳川吉宗は大名に米を納めさせる上米の制などで幕府財政の立て直しを図りました。"},{"id":"SC-SOC-HIS-000233","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"外国船打払令から薪水給与令へ政策が変化した背景として適切なのは？","answer":"外国船への対応を現実的に改める必要が生じた","options":["外国船への対応を現実的に改める必要が生じた","鎖国が完全に終わった","幕府が外国を植民地にした","参勤交代が廃止された"],"ex":"外国船の接近が増える中、幕府は一律の打払いから水や燃料を与える方針へ修正しました。"},{"id":"SC-SOC-HIS-000234","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"浮世絵が広く普及した背景として適切なのは？","answer":"木版印刷によって多く刷ることができた","options":["木版印刷によって多く刷ることができた","すべて手描きで一点物だった","幕府が外国から輸入した","武士しか購入できなかった"],"ex":"浮世絵は木版技術によって大量に刷ることができ、町人文化の中で広く普及しました。"},{"id":"SC-SOC-HIS-000235","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"薩長同盟が成立した意味として適切なのは？","answer":"幕府に対抗する有力藩の連携が強まった","options":["幕府に対抗する有力藩の連携が強まった","鎖国体制が完成した","大名の参勤交代が強化された","国会が開設された"],"ex":"薩摩藩と長州藩の提携により、倒幕へ向かう動きが強まりました。"},{"id":"SC-SOC-HIS-000236","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"自由民権運動が求めたものとして適切なのは？","answer":"国会の開設と憲法制定","options":["国会の開設と憲法制定","鎖国の復活","身分制度の強化","参勤交代の復活"],"ex":"自由民権運動では国会開設や憲法制定、国民の政治参加が求められました。"},{"id":"SC-SOC-HIS-000237","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"日清戦争と日露戦争の順序として正しいのは？","answer":"日清戦争→日露戦争","options":["日清戦争→日露戦争","日露戦争→日清戦争","同じ年に始まった","どちらも第二次世界大戦後"],"ex":"日清戦争は1894年、日露戦争は1904年に始まりました。"},{"id":"SC-SOC-HIS-000238","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"第一次世界大戦中、日本の工業生産が伸びた主な理由は？","answer":"欧州からの輸入が減り、日本製品への需要が増えた","options":["欧州からの輸入が減り、日本製品への需要が増えた","日本が鎖国した","農業が禁止された","人口が半減した"],"ex":"欧州諸国が戦争に集中したためアジア市場などで日本製品への需要が増え、大戦景気が起こりました。"},{"id":"SC-SOC-HIS-000239","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"満州事変後、日本と国際社会の関係はどう変化した？","answer":"国際連盟脱退へ進み国際的孤立が深まった","options":["国際連盟脱退へ進み国際的孤立が深まった","国際連合の常任理事国になった","日英同盟が復活した","EUに加盟した"],"ex":"満州事変をめぐる対立から、日本は国際連盟脱退へ進み国際的孤立を深めました。"},{"id":"SC-SOC-HIS-000240","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"国家総動員法の目的として適切なのは？","answer":"戦争遂行のため人や物資を国家が統制する","options":["戦争遂行のため人や物資を国家が統制する","普通選挙を実現する","地方自治を強化する","農地改革を進める"],"ex":"国家総動員法により、戦争遂行のため労働力や物資などへの国家統制が強まりました。"},{"id":"SC-SOC-HIS-000241","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"戦後の農地改革の目的として適切なのは？","answer":"地主の土地を小作農に売り渡し、自作農を増やす","options":["地主の土地を小作農に売り渡し、自作農を増やす","大名に土地を与える","荘園制度を復活させる","工場を国有化する"],"ex":"農地改革では地主の農地を買い上げ小作農へ売り渡し、自作農を増やしました。"},{"id":"SC-SOC-HIS-000242","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1950年代後半から1970年代初めにかけて日本経済が急成長した時期を何という？","answer":"高度経済成長","options":["高度経済成長","バブル経済","戦後恐慌","大戦景気"],"ex":"日本では1950年代後半から1970年代初めにかけて高度経済成長が続きました。"},{"id":"SC-SOC-GEO-000243","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"気候","q":"雨温図を見るとき、気候を判断するために特に重要な情報の組み合わせは？","answer":"月別の気温と降水量","options":["月別の気温と降水量","人口と面積","輸出額と輸入額","緯度と経度だけ"],"ex":"雨温図は月ごとの平均気温と降水量から気候の特徴を読み取ります。"},{"id":"SC-SOC-GEO-000244","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"人口","q":"人口密度を求める式として正しいのは？","answer":"人口÷面積","options":["人口÷面積","面積÷人口","人口×面積","人口＋面積"],"ex":"人口密度は、ある地域の人口を面積で割って求めます。"},{"id":"SC-SOC-GEO-000245","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"農業","q":"都市近郊で、鮮度が重要な野菜や花などを生産する農業を何という？","answer":"近郊農業","options":["近郊農業","促成栽培","抑制栽培","焼畑農業"],"ex":"大都市に近い立地を生かして新鮮な野菜や花を供給する農業を近郊農業といいます。"},{"id":"SC-SOC-GEO-000246","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"農業","q":"温暖な気候を利用し、出荷時期を早める栽培方法を何という？","answer":"促成栽培","options":["促成栽培","抑制栽培","二期作","輪作"],"ex":"ビニールハウスなどを利用し、通常より早い時期に出荷する栽培を促成栽培といいます。"},{"id":"SC-SOC-GEO-000247","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"工業","q":"自動車工業が特に盛んな中京工業地帯の中心県は？","answer":"愛知県","options":["愛知県","北海道","高知県","沖縄県"],"ex":"中京工業地帯は愛知県を中心に自動車などの機械工業が盛んです。"},{"id":"SC-SOC-GEO-000248","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"貿易","q":"日本が多く輸入する資源の一つとして適切なのは？","answer":"原油","options":["原油","米だけ","自動車だけ","精密機械だけ"],"ex":"日本はエネルギー資源の多くを海外に依存しており、原油を多く輸入しています。"},{"id":"SC-SOC-GEO-000249","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"地形","q":"扇状地で果樹栽培が行われやすい理由として適切なのは？","answer":"水はけがよい土地が多いから","options":["水はけがよい土地が多いから","一年中水田に水がたまるから","海面より必ず低いから","火山灰だけでできているから"],"ex":"扇状地は水はけがよい土地が多く、果樹栽培に利用されることがあります。"},{"id":"SC-SOC-GEO-000250","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"地形","q":"三角州が形成されやすい場所は？","answer":"川の河口付近","options":["川の河口付近","山頂付近","海溝の底","砂漠の中央"],"ex":"川が運んだ土砂が河口付近に堆積して三角州が形成されます。"},{"id":"SC-SOC-GEO-000251","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"気候","q":"偏西風が吹く方向としておおむね正しいのは？","answer":"西から東","options":["西から東","東から西","北から南だけ","南から北だけ"],"ex":"中緯度地域では偏西風が西から東へ吹く傾向があります。"},{"id":"SC-SOC-GEO-000252","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"人口","q":"人口ピラミッドで若年層が非常に多い国に起こりやすい課題は？","answer":"教育や雇用の受け皿を増やす必要がある","options":["教育や雇用の受け皿を増やす必要がある","高齢者人口だけが急増する","出生数が0になる","人口密度が必ず低下する"],"ex":"若年人口が多い国では学校や将来の雇用機会を確保することが重要な課題になります。"},{"id":"SC-SOC-CIV-000253","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"国会","q":"国会が『国権の最高機関』とされる理由として最も適切なのは？","answer":"国民の代表者で構成され国政の重要事項を審議するから","options":["国民の代表者で構成され国政の重要事項を審議するから","裁判所を直接指揮するから","地方自治体を廃止できるから","内閣より常に人数が多いから"],"ex":"国会は国民の代表者で構成され、法律制定など国政の重要事項を審議します。"},{"id":"SC-SOC-CIV-000254","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"内閣","q":"議院内閣制の説明として適切なのは？","answer":"内閣が国会の信任に基づいて成立する仕組み","options":["内閣が国会の信任に基づいて成立する仕組み","裁判官を国民が直接選ぶ仕組み","地方自治体が国会を解散する仕組み","天皇が法律を自由に制定する仕組み"],"ex":"日本では内閣が国会、特に衆議院の信任に基づいて成立する議院内閣制が採られています。"},{"id":"SC-SOC-CIV-000255","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"地方自治","q":"地方自治で住民が首長や議員を直接選ぶことが重視される理由は？","answer":"地域住民の意思を行政に反映しやすくするため","options":["地域住民の意思を行政に反映しやすくするため","国会をなくすため","裁判所の判決を変えるため","外交政策を自治体が決めるため"],"ex":"地方自治では住民が首長や議員を直接選び、地域の意思を政治へ反映します。"},{"id":"SC-SOC-CIV-000256","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"公共の福祉という考え方が必要になる場面として適切なのは？","answer":"人権同士が衝突するときに調整する","options":["人権同士が衝突するときに調整する","人権をすべて停止する","税金をなくす","選挙を行わない"],"ex":"人権は互いに尊重される必要があり、人権同士が衝突する場合には公共の福祉の観点から調整されます。"},{"id":"SC-SOC-CIV-000257","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"円高になると、一般に日本の輸入品の価格はどうなりやすい？","answer":"安くなりやすい","options":["安くなりやすい","高くなりやすい","必ず2倍になる","変化しない"],"ex":"円高では同じ円でより多くの外国通貨と交換できるため、輸入品は安くなりやすくなります。"},{"id":"SC-SOC-CIV-000258","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"中央銀行である日本銀行の役割として適切なのは？","answer":"金融政策を行い物価や景気の安定を図る","options":["金融政策を行い物価や景気の安定を図る","国会議員を選ぶ","裁判を行う","地方税を集める"],"ex":"日本銀行は金融政策などを通じて物価や景気の安定を図ります。"},{"id":"SC-SOC-CIV-000259","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合安全保障理事会の常任理事国は何か国？","answer":"5か国","options":["5か国","3か国","7か国","10か国"],"ex":"安全保障理事会の常任理事国はアメリカ・イギリス・フランス・ロシア・中国の5か国です。"},{"id":"SC-SOC-CIV-000260","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"持続可能な開発目標を表す略称は？","answer":"SDGs","options":["SDGs","GDP","NPO","ODA"],"ex":"SDGsはSustainable Development Goalsの略で、持続可能な開発目標を指します。"},{"id":"SC-SOC-CIV-000261","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"社会保障制度の目的として最も適切なのは？","answer":"生活上のリスクに社会全体で備える","options":["生活上のリスクに社会全体で備える","企業の利益だけを増やす","選挙制度を管理する","外交交渉を行う"],"ex":"社会保障は病気・失業・高齢など生活上のリスクに社会全体で備える仕組みです。"},{"id":"SC-SOC-CIV-000262","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"裁判所","q":"裁判員制度の目的として適切なのは？","answer":"国民の感覚を刑事裁判に反映する","options":["国民の感覚を刑事裁判に反映する","国会議員を裁判官にする","民事裁判をすべて廃止する","最高裁判所をなくす"],"ex":"裁判員制度では国民が一定の重大な刑事裁判に参加し、判断に国民の感覚を反映します。"},{"id":"SC-SOC-HIS-000263","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳時代に朝鮮半島から伝わった技術として適切なのは？","answer":"鉄器や須恵器の製作技術","options":["鉄器や須恵器の製作技術","蒸気機関","活版印刷","電信"],"ex":"古墳時代には朝鮮半島などから渡来人が来て、鉄器や須恵器などの技術を伝えました。"},{"id":"SC-SOC-HIS-000264","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町時代の産業発達を示すものとして適切なのは？","answer":"定期市が開かれ、座が発達した","options":["定期市が開かれ、座が発達した","全国で工場制機械工業が始まった","鉄道網が完成した","株式会社が広がった"],"ex":"室町時代には定期市が各地で開かれ、商工業者の同業組合である座も発達しました。"},{"id":"SC-SOC-HIS-000265","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"株仲間を認めて商業を利用した政治を進めた人物は？","answer":"田沼意次","options":["田沼意次","松平定信","水野忠邦","徳川慶喜"],"ex":"田沼意次は株仲間を奨励して営業税を得るなど、商業を利用した政策を進めました。"},{"id":"SC-SOC-GEO-000266","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"工業","q":"工業製品の輸送で高速道路沿いに工場が増えた理由として適切なのは？","answer":"トラック輸送に便利だから","options":["トラック輸送に便利だから","水田を広げやすいから","漁業に便利だから","雪が多いから"],"ex":"高速道路網の発達により、内陸部でもトラックによる原料や製品の輸送がしやすくなりました。"},{"id":"SC-SOC-CIV-000267","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"少子高齢化が社会保障に与える影響として適切なのは？","answer":"支える現役世代の負担が課題になりやすい","options":["支える現役世代の負担が課題になりやすい","年金制度が不要になる","医療費が必ず減る","税金がなくなる"],"ex":"少子高齢化では社会保障を支える現役世代が相対的に少なくなり、負担と給付のバランスが課題になります。"},{"id":"SC-SOC-CIV-000268","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"地方自治","q":"住民が条例の制定・改廃を求める制度を何という？","answer":"直接請求権","options":["直接請求権","違憲審査権","請願権","参政権"],"ex":"地方自治では住民が条例の制定・改廃などを求める直接請求の制度があります。"},{"id":"SC-SOC-HIS-000269","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"次のうち、旧石器時代の特徴として最も適切なのは？","answer":"打製石器を使い狩りや採集を行った","options":["打製石器を使い狩りや採集を行った","水田稲作を行った","前方後円墳を築いた","律令を定めた"],"ex":"旧石器時代には打製石器を用い、狩りや採集を中心に生活していました。"},{"id":"SC-SOC-HIS-000270","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代から縄文時代への変化として適切なのは？","answer":"土器の使用が始まった","options":["土器の使用が始まった","貨幣経済が始まった","武士が登場した","幕府が成立した"],"ex":"縄文時代には土器が使われるようになり、食物の煮炊きや保存がしやすくなりました。"},{"id":"SC-SOC-HIS-000271","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の人々の食生活を知る資料として特に役立つものは？","answer":"貝塚","options":["貝塚","古墳","木簡","御触書"],"ex":"貝塚からは貝殻・魚骨・獣骨などが見つかり、当時の食生活を知ることができます。"},{"id":"SC-SOC-HIS-000272","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の竪穴住居から考えられる生活の特色は？","answer":"一定の場所に定住する生活が広がった","options":["一定の場所に定住する生活が広がった","全国を移動し続けた","武士が城に住んだ","都市に集合住宅が建った"],"ex":"竪穴住居を中心とする集落の存在から、縄文時代には定住生活が広がっていたことが分かります。"},{"id":"SC-SOC-HIS-000273","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代の社会で身分差が生まれた背景として適切なのは？","answer":"米や土地の所有に差が生まれた","options":["米や土地の所有に差が生まれた","参勤交代が行われた","工業化が進んだ","国会が開設された"],"ex":"稲作の普及で収穫物や土地・水の管理をめぐる差が生まれ、身分差につながりました。"},{"id":"SC-SOC-HIS-000274","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"次の出来事を古い順に並べたものは？","answer":"縄文土器の使用→稲作の広がり→古墳の築造","options":["縄文土器の使用→稲作の広がり→古墳の築造","古墳の築造→稲作の広がり→縄文土器の使用","稲作の広がり→縄文土器の使用→古墳の築造","縄文土器の使用→古墳の築造→稲作の広がり"],"ex":"縄文時代の土器使用、弥生時代の稲作普及、古墳時代の古墳築造の順です。"},{"id":"SC-SOC-HIS-000275","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"渡来人が日本社会に与えた影響として適切なのは？","answer":"文字や金属加工などの技術を伝えた","options":["文字や金属加工などの技術を伝えた","参勤交代を始めた","国会制度を導入した","蒸気機関を発明した"],"ex":"渡来人は漢字や金属加工、土木などさまざまな技術や文化を伝えました。"},{"id":"SC-SOC-HIS-000276","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"大和政権の勢力が広がったことを示す資料として最も適切なのは？","answer":"各地に前方後円墳が分布していること","options":["各地に前方後円墳が分布していること","全国に国会議事堂があること","各地に鉄道駅があること","全国に同じ工業地帯があること"],"ex":"広い地域に前方後円墳が見られることは、大和政権と地方豪族とのつながりを示す手がかりです。"},{"id":"SC-SOC-HIS-000277","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"楽市・楽座によって期待された効果として適切なのは？","answer":"商人の活動を活発にする","options":["商人の活動を活発にする","農民を武士にする","海外貿易を禁止する","年貢をなくす"],"ex":"市場の特権や税をなくすことで商人が自由に活動しやすくなり、商業の活性化が期待されました。"},{"id":"SC-SOC-HIS-000278","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国時代の下剋上を表す具体例として最も適切なのは？","answer":"家臣が主君を倒して領国を支配する","options":["家臣が主君を倒して領国を支配する","天皇が摂政を任命する","農民が年貢を納める","大名が江戸へ参勤する"],"ex":"下剋上は、下の身分の者が実力で上の者を倒して地位を得る動きを指します。"},{"id":"SC-SOC-HIS-000279","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"田沼意次の政治と松平定信の政治の違いとして適切なのは？","answer":"田沼は商業重視、松平は倹約重視","options":["田沼は商業重視、松平は倹約重視","田沼は鎖国廃止、松平は開国","田沼は地租改正、松平は徴兵令","田沼は廃藩置県、松平は版籍奉還"],"ex":"田沼意次は商業を活用して収入増を図り、松平定信は倹約や農村立て直しを重視しました。"},{"id":"SC-SOC-HIS-000280","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"寛政の改革を行った人物は？","answer":"松平定信","options":["松平定信","田沼意次","水野忠邦","徳川慶喜"],"ex":"寛政の改革は老中松平定信が行いました。"},{"id":"SC-SOC-HIS-000281","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"天保の改革を行った人物は？","answer":"水野忠邦","options":["水野忠邦","松平定信","田沼意次","新井白石"],"ex":"天保の改革は老中水野忠邦が行いました。"},{"id":"SC-SOC-HIS-000282","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"異国船打払令の後に薪水給与令へと方針を改めた理由として適切なのは？","answer":"外国船との衝突を避ける必要が高まった","options":["外国船との衝突を避ける必要が高まった","幕府が海外進出を始めた","参勤交代が強化された","農民一揆がなくなった"],"ex":"外国船の接近が増え、厳しい打払いだけでは対応が難しくなったため政策が改められました。"},{"id":"SC-SOC-HIS-000283","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"元禄文化と化政文化の違いとして適切なのは？","answer":"元禄は上方中心、化政は江戸中心","options":["元禄は上方中心、化政は江戸中心","元禄は江戸中心、化政は上方中心","どちらも奈良中心","どちらも京都の公家だけの文化"],"ex":"元禄文化は上方を中心に、化政文化は江戸を中心に発展しました。"},{"id":"SC-SOC-HIS-000284","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"『富嶽三十六景』で知られる浮世絵師は？","answer":"葛飾北斎","options":["葛飾北斎","歌川広重","近松門左衛門","井原西鶴"],"ex":"葛飾北斎は『富嶽三十六景』で知られます。"},{"id":"SC-SOC-HIS-000285","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"米騒動が起こった背景として適切なのは？","answer":"米価が急上昇した","options":["米価が急上昇した","米が無税になった","米の輸入が禁止された","農地改革が行われた"],"ex":"1918年、米価の急騰に対する不満から米騒動が全国へ広がりました。"},{"id":"SC-SOC-HIS-000286","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"1925年の普通選挙法で選挙権を得たのは？","answer":"25歳以上の男子","options":["25歳以上の男子","20歳以上の男女","18歳以上の男女","納税額の多い男子だけ"],"ex":"普通選挙法により、納税額による制限がなくなり25歳以上の男子に選挙権が広がりました。"},{"id":"SC-SOC-HIS-000287","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"大正デモクラシーを象徴する動きとして適切なのは？","answer":"政党政治や普通選挙を求める動き","options":["政党政治や普通選挙を求める動き","幕藩体制の復活","鎖国の強化","公地公民の実施"],"ex":"大正期には政党政治や普通選挙など、民衆の政治参加を求める動きが広がりました。"},{"id":"SC-SOC-HIS-000288","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"1931年の満州事変の後、日本が進んだ方向として適切なのは？","answer":"中国大陸への軍事的進出を拡大した","options":["中国大陸への軍事的進出を拡大した","鎖国政策へ戻った","国際連合へ加盟した","日英同盟を再締結した"],"ex":"満州事変以後、日本は中国大陸への軍事的進出を強めました。"},{"id":"SC-SOC-HIS-000289","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"太平洋戦争中の国民生活について適切なのは？","answer":"物資の配給や統制が強まった","options":["物資の配給や統制が強まった","自由貿易が急拡大した","参勤交代が復活した","普通選挙が初めて始まった"],"ex":"戦時下では物資不足が深まり、配給制や国家による統制が強まりました。"},{"id":"SC-SOC-HIS-000290","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"開国後、日本から大量に金が流出した理由として適切なのは？","answer":"国内外で金銀の交換比率が異なっていた","options":["国内外で金銀の交換比率が異なっていた","金の使用が法律で禁止された","幕府が金を外国へ無償で配った","日本に銀が存在しなかった"],"ex":"日本と海外で金と銀の交換比率が異なっていたため、開国後に金が海外へ流出しました。"},{"id":"SC-SOC-HIS-000291","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"幕末の尊王攘夷運動で使われた『尊王』の意味は？","answer":"天皇を尊ぶこと","options":["天皇を尊ぶこと","将軍を外国へ派遣すること","外国文化を積極的に取り入れること","武士の身分を廃止すること"],"ex":"尊王は天皇を尊ぶ考えを指します。"},{"id":"SC-SOC-HIS-000292","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"戦後の財閥解体の目的として適切なのは？","answer":"経済力の集中を弱めるため","options":["経済力の集中を弱めるため","農民から土地を取り上げるため","大名制度を復活させるため","鎖国を行うため"],"ex":"財閥解体は巨大財閥への経済力集中を弱め、経済の民主化を進める政策でした。"},{"id":"SC-SOC-HIS-000293","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"日本国憲法施行、サンフランシスコ平和条約調印、国際連合加盟を古い順に並べたものは？","answer":"日本国憲法施行→サンフランシスコ平和条約→国際連合加盟","options":["日本国憲法施行→サンフランシスコ平和条約→国際連合加盟","国際連合加盟→日本国憲法施行→サンフランシスコ平和条約","サンフランシスコ平和条約→日本国憲法施行→国際連合加盟","日本国憲法施行→国際連合加盟→サンフランシスコ平和条約"],"ex":"日本国憲法施行は1947年、サンフランシスコ平和条約調印は1951年、国際連合加盟は1956年です。"},{"id":"SC-SOC-GEO-000294","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"人口","q":"過疎化が進む地域で起こりやすい問題は？","answer":"公共交通や医療サービスの維持が難しくなる","options":["公共交通や医療サービスの維持が難しくなる","人口密度が急上昇する","住宅不足が深刻化する","通勤ラッシュが激しくなる"],"ex":"人口減少が進む地域では利用者が減り、交通・医療・商店などのサービス維持が課題になります。"},{"id":"SC-SOC-GEO-000295","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"農業","q":"高冷地で夏でも涼しい気候を利用し、出荷時期を遅らせる栽培を何という？","answer":"抑制栽培","options":["抑制栽培","促成栽培","近郊農業","二毛作"],"ex":"高冷地などの涼しい気候を利用して出荷時期を遅らせる方法を抑制栽培といいます。"},{"id":"SC-SOC-GEO-000296","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"貿易","q":"輸出額より輸入額が大きい状態を何という？","answer":"貿易赤字","options":["貿易赤字","貿易黒字","円高","デフレーション"],"ex":"輸入額が輸出額を上回る状態を貿易赤字といいます。"},{"id":"SC-SOC-GEO-000297","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"人口","q":"人口ピラミッドで高齢層の割合が大きい国に起こりやすい課題は？","answer":"社会保障費の増加","options":["社会保障費の増加","学校不足の急増","出生率の急上昇","若年人口の急増"],"ex":"高齢化が進むと年金・医療・介護など社会保障にかかる費用が増えやすくなります。"},{"id":"SC-SOC-GEO-000298","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"工業","q":"工業の海外移転が進む理由として適切なのは？","answer":"生産コストや市場への近さを重視するため","options":["生産コストや市場への近さを重視するため","国内の道路がすべてなくなったため","日本で電気が使えないため","国内の人口が0になったため"],"ex":"企業は人件費などの生産コストや販売市場への近さを考えて海外に工場を設けることがあります。"},{"id":"SC-SOC-CIV-000299","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"国会","q":"法律案が成立するために必要な流れとして適切なのは？","answer":"原則として衆議院と参議院の両方で可決される","options":["原則として衆議院と参議院の両方で可決される","内閣だけで決定する","最高裁判所だけで決定する","都道府県知事が決定する"],"ex":"法律案は原則として両議院で可決されて成立します。"},{"id":"SC-SOC-CIV-000300","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"内閣","q":"衆議院で内閣不信任決議が可決された場合、内閣が取る対応として適切なのは？","answer":"衆議院を解散するか総辞職する","options":["衆議院を解散するか総辞職する","参議院だけを解散する","最高裁判所を解散する","地方議会を解散する"],"ex":"内閣不信任決議が可決された場合、内閣は10日以内に衆議院を解散しない限り総辞職します。"},{"id":"SC-SOC-CIV-000301","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"表現の自由が保障される意義として適切なのは？","answer":"多様な意見を社会で共有し民主政治を支える","options":["多様な意見を社会で共有し民主政治を支える","政府への批判を禁止する","選挙をなくす","裁判所を廃止する"],"ex":"表現の自由は多様な意見や情報の交換を可能にし、民主政治の基盤になります。"},{"id":"SC-SOC-CIV-000302","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"物価が継続的に上昇する状態を何という？","answer":"インフレーション","options":["インフレーション","デフレーション","円高","貿易黒字"],"ex":"物価が継続的に上昇する状態をインフレーションといいます。"},{"id":"SC-SOC-CIV-000303","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"物価が継続的に下落する状態を何という？","answer":"デフレーション","options":["デフレーション","インフレーション","円安","景気拡大"],"ex":"物価が継続的に下落する状態をデフレーションといいます。"},{"id":"SC-SOC-CIV-000304","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"政府開発援助を表す略称は？","answer":"ODA","options":["ODA","NGO","GDP","WHO"],"ex":"ODAはOfficial Development Assistanceの略で、政府による開発途上国への援助を指します。"},{"id":"SC-SOC-CIV-000305","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国境を越えて活動する非政府組織を表す略称は？","answer":"NGO","options":["NGO","ODA","GDP","WTO"],"ex":"NGOはNon-Governmental Organizationの略で、政府とは独立して国際協力などを行う組織です。"},{"id":"SC-SOC-CIV-000306","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"地方自治","q":"地方公共団体が独自に定めるルールを何という？","answer":"条例","options":["条例","法律","政令","条約"],"ex":"条例は地方公共団体がその地域の事務について制定するルールです。"},{"id":"SC-SOC-CIV-000307","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"社会保険に含まれるものとして適切なのは？","answer":"公的年金","options":["公的年金","選挙制度","裁判員制度","地方交付税"],"ex":"公的年金は社会保険の一つです。"},{"id":"SC-SOC-CIV-000308","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"裁判所","q":"最高裁判所が『憲法の番人』と呼ばれる理由は？","answer":"法令が憲法に違反しないか最終的に判断するから","options":["法令が憲法に違反しないか最終的に判断するから","国会議員を選ぶから","外交を担当するから","地方税を決めるから"],"ex":"最高裁判所は違憲審査について最終的な判断を行うため『憲法の番人』と呼ばれます。"},{"id":"SC-SOC-HIS-000309","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"日本の旧石器時代の研究が大きく進むきっかけとなった遺跡は？","answer":"岩宿遺跡","options":["岩宿遺跡","三内丸山遺跡","吉野ヶ里遺跡","登呂遺跡"],"ex":"岩宿遺跡の発見により、日本にも旧石器時代が存在したことが明らかになりました。"},{"id":"SC-SOC-HIS-000310","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代の人々が大型動物を狩るために使ったと考えられる道具は？","answer":"石や木で作ったやり","options":["石や木で作ったやり","鉄砲","火縄銃","青銅の剣"],"ex":"旧石器時代には打製石器を先端につけたやりなどが狩りに使われたと考えられています。"},{"id":"SC-SOC-HIS-000311","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代に見られないものはどれ？","answer":"縄文土器","options":["縄文土器","打製石器","狩り","採集"],"ex":"縄文土器は縄文時代に使われるようになったもので、旧石器時代にはまだ見られません。"},{"id":"SC-SOC-HIS-000312","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の人々が海や川の恵みを利用していたことを示す資料として適切なのは？","answer":"貝塚から魚の骨や貝殻が見つかること","options":["貝塚から魚の骨や貝殻が見つかること","古墳から埴輪が見つかること","寺院から瓦が見つかること","城下町から貨幣が見つかること"],"ex":"貝塚から魚の骨や貝殻が見つかることは、漁や採集が行われていた証拠になります。"},{"id":"SC-SOC-HIS-000313","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代に土器が使われたことで可能になったこととして適切なのは？","answer":"食べ物を煮炊きすること","options":["食べ物を煮炊きすること","鉄を精錬すること","印刷すること","貨幣を鋳造すること"],"ex":"土器の使用により煮炊きや保存がしやすくなりました。"},{"id":"SC-SOC-HIS-000314","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"吉野ヶ里遺跡などの環濠集落から考えられることは？","answer":"集落を守るための防御が必要だった","options":["集落を守るための防御が必要だった","武士が城を築いていた","全国で同じ法律が使われていた","外国との戦争だけが続いていた"],"ex":"周囲に濠をめぐらせた集落から、むら同士の争いなどに備えていたことが考えられます。"},{"id":"SC-SOC-HIS-000315","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳の大きさや副葬品の違いから読み取れることとして適切なのは？","answer":"有力者の間にも力の差があった","options":["有力者の間にも力の差があった","すべての人が同じ身分だった","農民が全国を統治していた","税制度が完全に統一されていた"],"ex":"古墳の規模や副葬品の違いは、埋葬された有力者の権力差を考える手がかりになります。"},{"id":"SC-SOC-HIS-000316","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"遣隋使・遣唐使を派遣した主な目的は？","answer":"中国の進んだ制度や文化を学ぶため","options":["中国の進んだ制度や文化を学ぶため","外国との交流を完全に断つため","大名を統制するため","武士の裁判基準を定めるため"],"ex":"日本は隋や唐の制度・文化を取り入れるため遣隋使や遣唐使を派遣しました。"},{"id":"SC-SOC-HIS-000317","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国大名が分国法を定めたことから分かることは？","answer":"領国内で独自に支配を進めていた","options":["領国内で独自に支配を進めていた","全国を朝廷が直接支配していた","すべての大名が同じ法律を使っていた","幕府が完全に地方統治を統一していた"],"ex":"分国法は戦国大名が自らの領国を支配するために定めた独自の法です。"},{"id":"SC-SOC-HIS-000318","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"田沼意次の政治で株仲間が重視された理由として適切なのは？","answer":"商業を活用して幕府収入を増やすため","options":["商業を活用して幕府収入を増やすため","農民から武器を取り上げるため","大名を江戸に住まわせるため","外国船を打ち払うため"],"ex":"田沼意次は株仲間を公認し、営業税などを得て幕府収入を増やそうとしました。"},{"id":"SC-SOC-HIS-000319","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"大塩平八郎の乱が起きた背景として適切なのは？","answer":"飢饉や米価高騰で人々の生活が苦しくなった","options":["飢饉や米価高騰で人々の生活が苦しくなった","日露戦争で敗北した","普通選挙法が成立した","鎖国が始まった"],"ex":"天保の飢饉などで人々の生活が苦しくなる中、大塩平八郎が大阪で反乱を起こしました。"},{"id":"SC-SOC-HIS-000320","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"異国船の接近が増えた江戸後期、幕府が海防を意識するようになった理由は？","answer":"欧米諸国が東アジアへ進出していたから","options":["欧米諸国が東アジアへ進出していたから","国内の稲作がなくなったから","武士が全員商人になったから","朝廷が北海道へ移ったから"],"ex":"欧米諸国がアジアへ進出する中、日本近海にも外国船が現れるようになりました。"},{"id":"SC-SOC-HIS-000321","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"元禄文化で人形浄瑠璃の脚本家として活躍した人物は？","answer":"近松門左衛門","options":["近松門左衛門","松尾芭蕉","葛飾北斎","本居宣長"],"ex":"近松門左衛門は人形浄瑠璃や歌舞伎の脚本で活躍しました。"},{"id":"SC-SOC-HIS-000322","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"江戸時代に庶民の教育を支えた施設は？","answer":"寺子屋","options":["寺子屋","国分寺","藩校だけ","大学寮"],"ex":"寺子屋では町人や農民の子どもが読み書きやそろばんなどを学びました。"},{"id":"SC-SOC-HIS-000323","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"日本の旧石器時代を代表する遺跡として知られるのは？","answer":"岩宿遺跡","options":["岩宿遺跡","三内丸山遺跡","吉野ヶ里遺跡","登呂遺跡"],"ex":"群馬県の岩宿遺跡は日本に旧石器時代があったことを示す重要な遺跡です。"},{"id":"SC-SOC-HIS-000324","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代の人々が狩りに主に用いた道具は？","answer":"打製石器","options":["打製石器","磨製石器","鉄製農具","青銅器"],"ex":"旧石器時代には石を打ち欠いて作る打製石器が使われました。"},{"id":"SC-SOC-HIS-000325","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代の狩猟に使われた、先を鋭く加工した石器は？","answer":"尖頭器","options":["尖頭器","銅鐸","埴輪","和同開珎"],"ex":"尖頭器は槍の先などに付けて狩猟に使われた打製石器です。"},{"id":"SC-SOC-HIS-000326","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"日本列島で旧石器時代の遺跡が見つかる地層の特徴として適切なのは？","answer":"縄文土器より古い地層から石器が見つかる","options":["縄文土器より古い地層から石器が見つかる","鉄器だけが見つかる","瓦と木簡が大量に見つかる","銅鐸と前方後円墳が同じ層から見つかる"],"ex":"縄文土器より古い地層から打製石器が見つかることが旧石器時代の存在を示します。"},{"id":"SC-SOC-HIS-000327","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代から縄文時代への変化として最も適切なのは？","answer":"土器の使用が始まり定住が進んだ","options":["土器の使用が始まり定住が進んだ","稲作が全国に一斉に広がった","武士が政権を握った","貨幣経済が発達した"],"ex":"縄文時代には土器が使われ、竪穴住居による定住生活が広がりました。"},{"id":"SC-SOC-HIS-000328","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の貝塚から分かることとして最も適切なのは？","answer":"当時の食生活や自然環境","options":["当時の食生活や自然環境","律令制度の仕組み","武士の主従関係","外国との条約内容"],"ex":"貝塚には貝殻や動物の骨などが残り、食生活や環境を知る手掛かりになります。"},{"id":"SC-SOC-HIS-000329","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文土器の主な用途として適切なのは？","answer":"食物の煮炊きや保存","options":["食物の煮炊きや保存","年貢の計量だけ","武器としての使用","貨幣の代わり"],"ex":"土器の使用により食物の煮炊きや保存がしやすくなりました。"},{"id":"SC-SOC-HIS-000330","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の住居として代表的なのは？","answer":"竪穴住居","options":["竪穴住居","寝殿造","書院造","高床倉庫だけ"],"ex":"縄文時代には地面を掘り下げて柱を立てる竪穴住居が多く見られます。"},{"id":"SC-SOC-HIS-000331","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の人々の信仰を考える手掛かりとなる遺物は？","answer":"土偶","options":["土偶","勘合","木簡","三角縁神獣鏡だけ"],"ex":"土偶は祭りや祈りなど縄文時代の信仰を考える重要な遺物です。"},{"id":"SC-SOC-HIS-000332","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代と弥生時代を比べた説明として適切なのは？","answer":"弥生時代には水田稲作が広がった","options":["弥生時代には水田稲作が広がった","縄文時代には全国で鉄器が普及した","弥生時代には幕府が成立した","縄文時代には班田収授法が行われた"],"ex":"弥生時代には大陸から伝わった水田稲作が広がりました。"},{"id":"SC-SOC-HIS-000333","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代に大陸から伝わり、農作業などに使われた金属器は？","answer":"鉄器","options":["鉄器","勘合","和同開珎","火縄銃"],"ex":"弥生時代には鉄器が伝わり、農具や武器などに利用されました。"},{"id":"SC-SOC-HIS-000334","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代の高床倉庫が主に使われた目的は？","answer":"収穫した稲などを保存するため","options":["収穫した稲などを保存するため","武士が住むため","仏像を置くため","港の荷物を運ぶため"],"ex":"高床倉庫は湿気や害獣を避けて穀物を保存するのに適していました。"},{"id":"SC-SOC-HIS-000335","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"吉野ヶ里遺跡の環濠や物見やぐらから考えられる社会の変化は？","answer":"集落どうしの争いが起こった","options":["集落どうしの争いが起こった","鎖国が始まった","武家政治が成立した","寺院勢力が全国を支配した"],"ex":"環濠や物見やぐらは集落間の争いや防御の必要性を示します。"},{"id":"SC-SOC-HIS-000336","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"『魏志』倭人伝に登場する邪馬台国の女王は？","answer":"卑弥呼","options":["卑弥呼","推古天皇","紫式部","北条政子"],"ex":"卑弥呼は邪馬台国の女王として中国の史書に記されています。"},{"id":"SC-SOC-HIS-000337","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代に広まった青銅器の使われ方として適切なのは？","answer":"祭りの道具として使われることが多かった","options":["祭りの道具として使われることが多かった","田を耕す農具だけに使われた","寺院の屋根材に使われた","貨幣として全国で統一された"],"ex":"銅鐸などの青銅器は祭りの道具として用いられたと考えられています。"},{"id":"SC-SOC-HIS-000338","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"前方後円墳が各地に築かれたことから考えられることは？","answer":"有力者を中心とする政治的なまとまりが広がった","options":["有力者を中心とする政治的なまとまりが広がった","すべての人が同じ身分になった","武士の全国支配が完成した","キリスト教が広がった"],"ex":"大型古墳の広がりは有力豪族を中心とする政治的まとまりの形成を示します。"},{"id":"SC-SOC-HIS-000339","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"大和政権で大王と呼ばれた人物の立場として適切なのは？","answer":"有力豪族をまとめる中心的な支配者","options":["有力豪族をまとめる中心的な支配者","鎌倉幕府の将軍","江戸幕府の老中","明治政府の内閣総理大臣"],"ex":"大王は大和政権の中心として有力豪族をまとめました。"},{"id":"SC-SOC-HIS-000340","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳に置かれた人物や動物などの形をした焼き物は？","answer":"埴輪","options":["埴輪","土偶","木簡","勘合"],"ex":"埴輪は古墳の周囲などに並べられた素焼きの焼き物です。"},{"id":"SC-SOC-HIS-000341","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳時代に朝鮮半島などから渡来した人々が伝えたものとして適切なのは？","answer":"漢字や新しい技術","options":["漢字や新しい技術","参勤交代","キリスト教と鉄砲だけ","普通選挙制度"],"ex":"渡来人は漢字、機織り、土木などの技術や文化を伝えました。"},{"id":"SC-SOC-HIS-000342","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳時代から飛鳥時代への政治の変化として適切なのは？","answer":"豪族連合から中央集権化をめざす動きが強まった","options":["豪族連合から中央集権化をめざす動きが強まった","幕府と藩による政治に変わった","国会中心の政治に変わった","武士が御恩と奉公で結ばれた"],"ex":"飛鳥時代には大化の改新などを通して中央集権国家をめざす改革が進みました。"},{"id":"SC-SOC-HIS-000343","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"冠位十二階が設けられた目的として適切なのは？","answer":"家柄だけでなく能力や功績を重んじて人材を登用するため","options":["家柄だけでなく能力や功績を重んじて人材を登用するため","武士に土地を与えるため","大名を江戸に住まわせるため","農民の年貢を軽くするため"],"ex":"冠位十二階は能力や功績に応じて位を与え、人材登用を進める制度でした。"},{"id":"SC-SOC-HIS-000344","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"十七条の憲法で重視された考えとして適切なのは？","answer":"役人が協調し天皇を中心に政治を行うこと","options":["役人が協調し天皇を中心に政治を行うこと","国会が法律を制定すること","武士が幕府に奉公すること","藩が独立して外交すること"],"ex":"十七条の憲法は役人の心構えを示し、協調や天皇への服従を重視しました。"},{"id":"SC-SOC-HIS-000345","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"遣隋使を送った目的として最も適切なのは？","answer":"隋の制度や文化を学び国づくりに生かすため","options":["隋の制度や文化を学び国づくりに生かすため","キリスト教を禁止するため","鎖国を完成させるため","欧米と不平等条約を改正するため"],"ex":"遣隋使は中国の進んだ制度や文化を学ぶ目的で派遣されました。"},{"id":"SC-SOC-HIS-000346","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"大化の改新でめざされた政治のあり方は？","answer":"天皇を中心とする中央集権国家","options":["天皇を中心とする中央集権国家","将軍を中心とする幕藩体制","議会中心の立憲政治","豪族が独立して支配する連邦制"],"ex":"大化の改新では豪族中心の支配を改め、天皇中心の国家づくりをめざしました。"},{"id":"SC-SOC-HIS-000347","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"次の出来事を古い順に並べたものは？ ①遣隋使 ②大化の改新 ③壬申の乱","answer":"①→②→③","options":["①→②→③","②→①→③","①→③→②","③→②→①"],"ex":"遣隋使は7世紀初め、大化の改新は645年、壬申の乱は672年です。"},{"id":"SC-SOC-HIS-000348","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"奈良時代に国ごとに置かれた寺院は？","answer":"国分寺・国分尼寺","options":["国分寺・国分尼寺","金閣・銀閣","寺子屋・藩校","教会・修道院"],"ex":"聖武天皇は国ごとに国分寺・国分尼寺を建てさせました。"},{"id":"SC-SOC-HIS-000349","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"墾田永年私財法が出された結果として最も適切なのは？","answer":"新しく開墾した土地の私有が進んだ","options":["新しく開墾した土地の私有が進んだ","すべての土地が幕府領になった","荘園がすべて廃止された","農民が土地を売買できなくなった"],"ex":"墾田永年私財法により新たに開墾した土地の永久私有が認められ、私有地が増えました。"},{"id":"SC-SOC-HIS-000350","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"正倉院に外国由来の品々が残ることから分かる奈良時代の特色は？","answer":"シルクロードを通じた国際的な文化交流","options":["シルクロードを通じた国際的な文化交流","鎖国による海外交流の停止","欧米文化だけの受容","武士による海外貿易の独占"],"ex":"正倉院の宝物には西アジアなどの影響を受けた品があり、国際交流を示します。"},{"id":"SC-SOC-HIS-000351","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"桓武天皇が平安京に都を移した目的の一つとして適切なのは？","answer":"奈良の寺院勢力の影響を離れて政治を立て直すため","options":["奈良の寺院勢力の影響を離れて政治を立て直すため","武士に政権を譲るため","鎖国を行うため","国会を開設するため"],"ex":"平安京への遷都には寺院勢力の影響を避け政治を立て直すねらいがありました。"},{"id":"SC-SOC-HIS-000352","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"摂関政治で権力を強めた藤原氏の方法として適切なのは？","answer":"娘を天皇のきさきにして外戚の立場を利用した","options":["娘を天皇のきさきにして外戚の立場を利用した","全国に守護と地頭を置いた","参勤交代を制度化した","武家諸法度を定めた"],"ex":"藤原氏は娘を天皇のきさきにし、天皇の外戚として摂政・関白の地位を得ました。"},{"id":"SC-SOC-HIS-000353","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"平等院鳳凰堂の建立と最も関係が深い信仰は？","answer":"浄土信仰","options":["浄土信仰","キリスト教","禅宗","国学"],"ex":"平安後期には末法思想を背景に浄土信仰が広がり、平等院鳳凰堂などが建てられました。"},{"id":"SC-SOC-HIS-000354","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"平安時代にひらがなやカタカナの普及と関係が深い文化は？","answer":"国風文化","options":["国風文化","天平文化","元禄文化","化政文化"],"ex":"かな文字の発達は国風文化の代表的な特色です。"},{"id":"SC-SOC-HIS-000355","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"院政が始まったことで政治の中心となった人物は？","answer":"上皇","options":["上皇","征夷大将軍","執権","老中"],"ex":"院政では天皇を退いた上皇が政治の実権を握りました。"},{"id":"SC-SOC-HIS-000356","subject":"社会","grade":"中1〜中3","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国大名が領国支配のために定めた独自の法を何という？","answer":"分国法","options":["分国法","武家諸法度","御成敗式目","公事方御定書"],"ex":"戦国大名は領国内の秩序を保つため分国法を定めました。"},{"id":"SC-SOC-HIS-000357","subject":"社会","grade":"中1〜中3","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国大名が城下町に家臣や商工業者を集めた主な目的は？","answer":"領国支配と経済を強めるため","options":["領国支配と経済を強めるため","朝廷の権力を強めるため","鎖国を完成させるため","班田収授法を行うため"],"ex":"城下町は政治・軍事・経済の拠点となり、大名の領国支配を支えました。"},{"id":"SC-SOC-HIS-000358","subject":"社会","grade":"中1〜中3","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"下剋上という言葉が表す戦国時代の特色は？","answer":"実力のある者が上の身分の者を倒して力を持つこと","options":["実力のある者が上の身分の者を倒して力を持つこと","将軍が全国を直接統治すること","農民が国会議員になること","天皇が幕府を廃止すること"],"ex":"戦国時代には身分秩序が揺らぎ、実力によって勢力を伸ばす動きが見られました。"},{"id":"SC-SOC-HIS-000359","subject":"社会","grade":"中1〜中3","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"鉄砲が戦国大名の戦い方に与えた影響として適切なのは？","answer":"集団での鉄砲運用など戦術の変化を促した","options":["集団での鉄砲運用など戦術の変化を促した","騎馬戦だけに戻った","城が不要になった","武士が戦わなくなった"],"ex":"鉄砲の普及は戦術や城づくりなどに影響を与えました。"},{"id":"SC-SOC-HIS-000360","subject":"社会","grade":"中1〜中3","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国時代の自治的な都市として知られる堺の特色は？","answer":"貿易や商業で栄え、町衆による自治が行われた","options":["貿易や商業で栄え、町衆による自治が行われた","幕府の直轄農村だった","寺院だけが住む町だった","鎖国後に初めてつくられた"],"ex":"堺は貿易と商業で栄え、町衆による自治が行われました。"},{"id":"SC-SOC-HIS-000361","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"織田信長が楽市・楽座を行ったねらいは？","answer":"商工業を活発にし城下町を発展させるため","options":["商工業を活発にし城下町を発展させるため","農民の移動を禁止するため","キリスト教を全国で禁止するため","大名を江戸に集めるため"],"ex":"楽市・楽座は座の特権などを廃し、商工業を活発にする政策でした。"},{"id":"SC-SOC-HIS-000362","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"豊臣秀吉の太閤検地で調べたものとして適切なのは？","answer":"田畑の面積や土地の生産力","options":["田畑の面積や土地の生産力","大名の参勤回数","輸出入品の関税","工場労働者の人数"],"ex":"太閤検地では田畑の面積や石高などを調べ、年貢徴収の基準を整えました。"},{"id":"SC-SOC-HIS-000363","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"刀狩の目的として最も適切なのは？","answer":"農民から武器を取り上げ一揆を防ぎ兵農分離を進めるため","options":["農民から武器を取り上げ一揆を防ぎ兵農分離を進めるため","武士を農民に戻すため","外国との貿易を止めるため","仏教を禁止するため"],"ex":"刀狩は農民の武器を取り上げ、一揆を防ぐとともに兵農分離を進めました。"},{"id":"SC-SOC-HIS-000364","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"桃山文化の特色として最も適切なのは？","answer":"豪華で力強い文化が大名や商人を中心に栄えた","options":["豪華で力強い文化が大名や商人を中心に栄えた","かな文字中心の貴族文化だった","わび・さびだけを重視した文化だった","欧米の自由主義だけを学ぶ文化だった"],"ex":"桃山文化は城郭建築や障壁画など豪華で力強い特色をもちます。"},{"id":"SC-SOC-HIS-000365","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"次の出来事を古い順に並べたものは？ ①鉄砲伝来 ②本能寺の変 ③全国統一","answer":"①→②→③","options":["①→②→③","②→①→③","③→①→②","①→③→②"],"ex":"鉄砲伝来は1543年、本能寺の変は1582年、秀吉による全国統一は1590年です。"},{"id":"SC-SOC-HIS-000366","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"徳川吉宗の享保の改革で行われた政策は？","answer":"目安箱の設置","options":["目安箱の設置","版籍奉還","廃藩置県","地租改正"],"ex":"享保の改革では目安箱の設置などが行われました。"},{"id":"SC-SOC-HIS-000367","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"田沼意次の政治の特色として適切なのは？","answer":"株仲間を奨励し商業からの収入を重視した","options":["株仲間を奨励し商業からの収入を重視した","鎖国を全面的に廃止した","地租改正を行った","普通選挙を実施した"],"ex":"田沼意次は株仲間を奨励し、商業活動から税収を得ようとしました。"},{"id":"SC-SOC-HIS-000368","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"新田開発が進んだことによる幕府や藩のねらいは？","answer":"年貢収入を増やすこと","options":["年貢収入を増やすこと","武士を農民にすること","鎖国を終わらせること","国会を開くこと"],"ex":"耕地を増やす新田開発は年貢収入の増加につながりました。"},{"id":"SC-SOC-HIS-000369","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"江戸中期に商品作物の栽培が広がった背景として適切なのは？","answer":"貨幣経済と都市の発達","options":["貨幣経済と都市の発達","班田収授法の復活","武士による土地私有の禁止","欧米との自由貿易"],"ex":"都市と市場の発達により、綿や菜種など販売を目的とした商品作物が広がりました。"},{"id":"SC-SOC-HIS-000370","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"大阪が「天下の台所」と呼ばれた理由として適切なのは？","answer":"各地の年貢米や商品が集まる商業の中心だったから","options":["各地の年貢米や商品が集まる商業の中心だったから","天皇が住んでいたから","外国船だけが入港したから","全国の大名が常住したから"],"ex":"大阪には蔵屋敷が置かれ、全国の商品が集まる商業都市として発展しました。"},{"id":"SC-SOC-HIS-000371","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"寛政の改革を行った老中は？","answer":"松平定信","options":["松平定信","田沼意次","水野忠邦","井伊直弼"],"ex":"松平定信は寛政の改革を進めました。"},{"id":"SC-SOC-HIS-000372","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"天保の改革で株仲間が解散させられたねらいは？","answer":"物価を下げようとした","options":["物価を下げようとした","大名を江戸に集めるため","キリスト教を広めるため","農民に選挙権を与えるため"],"ex":"株仲間の解散には流通を自由にして物価を下げようとするねらいがありました。"},{"id":"SC-SOC-HIS-000373","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"大塩平八郎の乱の背景として適切なのは？","answer":"飢饉で苦しむ人々への救済が不十分だった","options":["飢饉で苦しむ人々への救済が不十分だった","日清戦争に敗れた","地租改正に反対した","普通選挙に反対した"],"ex":"天保の飢饉の中で救済が不十分な幕府や商人を批判して乱を起こしました。"},{"id":"SC-SOC-HIS-000374","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"異国船打払令が出された背景として適切なのは？","answer":"外国船が日本近海に現れる機会が増えた","options":["外国船が日本近海に現れる機会が増えた","鎖国が完全に終わった","日米修好通商条約が結ばれた","国際連盟に加盟した"],"ex":"外国船の接近が増えたため、幕府は異国船打払令を出しました。"},{"id":"SC-SOC-HIS-000375","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"蘭学の発達を示す出来事として適切なのは？","answer":"『解体新書』が出版された","options":["『解体新書』が出版された","『源氏物語』が書かれた","『古事記』がまとめられた","『学問のすゝめ』が出版された"],"ex":"杉田玄白らは西洋の医学書を翻訳し『解体新書』を出版しました。"},{"id":"SC-SOC-HIS-000376","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"元禄文化が栄えた中心地は？","answer":"上方","options":["上方","北海道","蝦夷地のみ","沖縄のみ"],"ex":"元禄文化は京都・大阪など上方を中心に町人文化として発展しました。"},{"id":"SC-SOC-HIS-000377","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"近松門左衛門が活躍した分野は？","answer":"人形浄瑠璃や歌舞伎の脚本","options":["人形浄瑠璃や歌舞伎の脚本","浮世絵の風景画","蘭学の医学書翻訳","俳句だけ"],"ex":"近松門左衛門は人形浄瑠璃や歌舞伎の脚本で知られます。"},{"id":"SC-SOC-HIS-000378","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"化政文化の文学作品『東海道中膝栗毛』の作者は？","answer":"十返舎一九","options":["十返舎一九","近松門左衛門","井原西鶴","松尾芭蕉"],"ex":"十返舎一九は滑稽本『東海道中膝栗毛』で知られます。"},{"id":"SC-SOC-HIS-000379","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"葛飾北斎や歌川広重と関係が深い文化は？","answer":"浮世絵","options":["浮世絵","水墨画","大和絵","障壁画"],"ex":"北斎や広重は風景を題材にした浮世絵で知られます。"},{"id":"SC-SOC-HIS-000380","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"寺子屋が広がったことから分かる江戸時代の社会の特色は？","answer":"庶民にも読み書きや計算の学習が広がった","options":["庶民にも読み書きや計算の学習が広がった","全国民が大学に通った","武士以外は文字を学べなかった","義務教育制度が完成していた"],"ex":"寺子屋では町人や農民の子どもが読み書きやそろばんを学びました。"},{"id":"SC-SOC-HIS-000381","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"ペリー来航後に結ばれた日米和親条約で開かれた港は？","answer":"下田と函館","options":["下田と函館","横浜と神戸","長崎と堺","新潟と大阪"],"ex":"日米和親条約で下田と函館が開かれました。"},{"id":"SC-SOC-HIS-000382","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"日米修好通商条約が不平等条約とされる理由として適切なのは？","answer":"領事裁判権を認め関税自主権がなかった","options":["領事裁判権を認め関税自主権がなかった","日本人だけに選挙権がなかった","鎖国を続けた","幕府が関税を自由に決められた"],"ex":"領事裁判権を認め、関税自主権がない点などで日本に不利な条約でした。"},{"id":"SC-SOC-HIS-000383","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"開国後に生糸などの輸出が増えたことで国内に起こった変化は？","answer":"物価が上昇した","options":["物価が上昇した","米の価格が固定された","貨幣が使われなくなった","農村の生産が停止した"],"ex":"輸出増加などで国内の商品が不足し、物価上昇の一因となりました。"},{"id":"SC-SOC-HIS-000384","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"大政奉還を行った人物は？","answer":"徳川慶喜","options":["徳川慶喜","徳川家康","西郷隆盛","大久保利通"],"ex":"15代将軍徳川慶喜は政権を朝廷に返す大政奉還を行いました。"},{"id":"SC-SOC-HIS-000385","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"薩長同盟が倒幕運動に与えた影響として適切なのは？","answer":"有力な二藩が協力し幕府に対抗する力が強まった","options":["有力な二藩が協力し幕府に対抗する力が強まった","幕府の支配が安定した","鎖国が強化された","日清戦争が始まった"],"ex":"薩摩藩と長州藩の協力により倒幕勢力が強まりました。"},{"id":"SC-SOC-HIS-000386","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"大正期に民本主義を唱えた人物は？","answer":"吉野作造","options":["吉野作造","伊藤博文","板垣退助","陸奥宗光"],"ex":"吉野作造は大正デモクラシー期に民本主義を唱えました。"},{"id":"SC-SOC-HIS-000387","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"米騒動が全国に広がった主な原因は？","answer":"米価が急上昇した","options":["米価が急上昇した","地租が廃止された","失業者がいなくなった","米の輸入が完全に禁止された"],"ex":"シベリア出兵を見込んだ米の買い占めなどで米価が上昇し、米騒動が広がりました。"},{"id":"SC-SOC-HIS-000388","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"1925年に成立した普通選挙法で選挙権を得たのは？","answer":"25歳以上の男子","options":["25歳以上の男子","20歳以上の男女","すべての納税者","女性だけ"],"ex":"普通選挙法により納税額に関係なく25歳以上の男子に選挙権が認められました。"},{"id":"SC-SOC-HIS-000389","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"普通選挙法と同じ1925年に制定された法律は？","answer":"治安維持法","options":["治安維持法","国家総動員法","教育基本法","独占禁止法"],"ex":"1925年には普通選挙法とともに治安維持法が制定されました。"},{"id":"SC-SOC-HIS-000390","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"第一次世界大戦が日本経済に与えた影響として適切なのは？","answer":"輸出が増えて好景気になった","options":["輸出が増えて好景気になった","貿易が完全に停止した","工業生産がなくなった","鎖国に戻った"],"ex":"欧州諸国からアジアへの輸出が減り、日本の輸出が増えて大戦景気となりました。"},{"id":"SC-SOC-HIS-000391","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"世界恐慌が日本の農村に与えた影響として適切なのは？","answer":"農産物価格が下がり農家の生活が苦しくなった","options":["農産物価格が下がり農家の生活が苦しくなった","米価が大幅に上がり農村が豊かになった","工場労働者が全員農村へ戻った","税がすべて廃止された"],"ex":"世界恐慌では生糸などの価格が下落し、農村不況が深刻化しました。"},{"id":"SC-SOC-HIS-000392","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"満州事変後、日本が国際連盟を脱退した背景は？","answer":"満州での行動をめぐり国際社会と対立したため","options":["満州での行動をめぐり国際社会と対立したため","国際連盟が日本に加盟を拒否したため","日清戦争に敗れたため","普通選挙法に反対されたため"],"ex":"満州国をめぐる国際連盟の対応に反発し、日本は国際連盟を脱退しました。"},{"id":"SC-SOC-HIS-000393","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"国家総動員法が制定された目的として適切なのは？","answer":"戦争のため人員や物資を政府が統制できるようにするため","options":["戦争のため人員や物資を政府が統制できるようにするため","普通選挙を実施するため","地方自治を拡大するため","財閥を解体するため"],"ex":"国家総動員法により政府は戦争遂行のため人や物資を広く統制できるようになりました。"},{"id":"SC-SOC-HIS-000394","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"次の出来事を古い順に並べたものは？ ①満州事変 ②日中戦争 ③太平洋戦争","answer":"①→②→③","options":["①→②→③","②→①→③","③→①→②","①→③→②"],"ex":"満州事変は1931年、日中戦争は1937年、太平洋戦争は1941年に始まりました。"},{"id":"SC-SOC-HIS-000395","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"戦時下の国民生活について適切なのは？","answer":"物資の配給や統制が行われた","options":["物資の配給や統制が行われた","海外旅行が自由化された","消費税が導入された","全国で普通選挙が毎年行われた"],"ex":"戦時下では物資不足が進み、配給制などの統制が強まりました。"},{"id":"SC-SOC-HIS-000396","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"戦後の財閥解体のねらいとして最も適切なのは？","answer":"経済の民主化を進めること","options":["経済の民主化を進めること","地主制度を強化すること","軍需産業だけを保護すること","大名の領地を復活させること"],"ex":"財閥解体は経済力の集中を弱め、経済の民主化を進める改革の一つでした。"},{"id":"SC-SOC-HIS-000397","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"日本が国際連合に加盟した年は？","answer":"1956年","options":["1956年","1945年","1951年","1964年"],"ex":"日本は日ソ共同宣言後の1956年に国際連合へ加盟しました。"},{"id":"SC-SOC-HIS-000398","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"高度経済成長期の社会の変化として適切なのは？","answer":"都市人口が増え家庭に耐久消費財が普及した","options":["都市人口が増え家庭に耐久消費財が普及した","農村人口だけが増えた","工業生産が減少した","鉄道や道路の整備が止まった"],"ex":"高度経済成長期には都市化が進み、家電などの耐久消費財が広く普及しました。"},{"id":"SC-SOC-HIS-EXT-000001","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"世界の古代文明","q":"ナイル川流域で発達し、ピラミッドが築かれた文明は？","answer":"エ kisi_tousyo.html","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000006","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"世界の古代文明","q":"秦で中国を統一し、文字や貨幣の統一も進めた人物は？","answer":"始皇帝","options":["始皇帝","孔子","ムハンマド","ナポレオン"],"ex":"始皇帝は紀元前3世紀に中国を統一しました。孔子は儒学のもととなる教えを説いた人物です。","practice_kind":"用語・人物","reference_url":"https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000007","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"世界の古代文明","q":"中国と西方を結び、絹などが運ばれた交易路は？","answer":"シルクロード","options":["シルクロード","東海道","大西洋航路","北前船航路"],"ex":"シルクロードを通じて商品だけでなく文化や宗教も伝わりました。","practice_kind":"用語・人物","reference_url":"https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000008","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"世界の古代文明","q":"古代ギリシャのアテネで発達した政治の特徴は？","answer":"市民が集会で政治に参加した","options":["市民が集会で政治に参加した","すべての住民に同じ参政権があった","将軍が全国の大名を統制した","近代的な政党内閣が成立した"],"ex":"アテネでは市民による民主政が発達しましたが、女性・奴隷・外国人などは政治参加から除かれていました。","practice_kind":"理由・比較","reference_url":"https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000009","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"宗教のおこり","q":"仏教を開いた人物は？","answer":"シャカ","options":["シャカ","イエス","ムハンマド","孔子"],"ex":"シャカは古代インドで教えを説き、仏教は東アジアなどに広がりました。","practice_kind":"用語・人物","reference_url":"https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000010","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"宗教のおこり","q":"イエスの教えをもとに成立した宗教は？","answer":"キリスト教","options":["キリスト教","仏教","イスラム教","儒教"],"ex":"キリスト教はパレスチナで生まれ、ローマ帝国などに広がりました。","practice_kind":"用語・人物","reference_url":"https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000011","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"宗教のおこり","q":"7世紀のアラビア半島でイスラム教を説いた人物は？","answer":"ムハンマド","options":["ムハンマド","シャカ","イエス","始皇帝"],"ex":"ムハンマドが説いたイスラム教は、西アジアから広い地域へ伝わりました。","practice_kind":"年代・順序","reference_url":"https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000012","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"宗教のおこり","q":"イスラム教の聖典は？","answer":"コーラン","options":["コーラン","聖書","古事記","論語"],"ex":"コーランはイスラム教の聖典です。聖書はキリスト教、論語は孔子の言行を伝える書物です。","practice_kind":"用語・人物","reference_url":"https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000013","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"宗教のおこり","q":"孔子の教えをもとに、人間関係や道徳を重んじた思想は？","answer":"儒学","options":["儒学","蘭学","国学","社会主義"],"ex":"儒学は中国で発展し、日本を含む東アジアの政治や教育にも影響しました。","practice_kind":"用語・人物","reference_url":"https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000014","subject":"社会","grade":"中1〜中3","unit":"歴史・中世","field_name":"歴史","topic_name":"世界の中世","q":"唐の都で、日本の都づくりにも影響を与えた都市は？","answer":"長安","options":["長安","ロンドン","パリ","ローマ"],"ex":"唐の長安は国際的な都市でした。日本は唐の制度や文化を取り入れました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000015","subject":"社会","grade":"中1〜中3","unit":"歴史・中世","field_name":"歴史","topic_name":"世界の中世","q":"13世紀

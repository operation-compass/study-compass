"field_name":"公民","topic_name":"国際社会","q":"国際連合の安全保障理事会で、常任理事国が持つ特別な権限は？","answer":"拒否権","options":["拒否権","解散権","課税権","立法権"],"ex":"安全保障理事会の常任理事国には、実質事項の決議に対する拒否権があります。"},{"id":"SC-SOC-CIV-000056","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"日本国憲法で、健康で文化的な最低限度の生活を営む権利を何という？","answer":"生存権","options":["生存権","参政権","請願権","財産権"],"ex":"日本国憲法第25条は、健康で文化的な最低限度の生活を営む権利を保障しています。"},{"id":"SC-SOC-CIV-000057","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"国民が政治に参加する権利をまとめて何という？","answer":"参政権","options":["参政権","社会権","自由権","平等権"],"ex":"選挙権など、政治に参加するための権利を参政権といいます。"},{"id":"SC-SOC-CIV-000058","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"思想・良心の自由や表現の自由などを含む基本的人権の分類は？","answer":"自由権","options":["自由権","社会権","参政権","請求権"],"ex":"国家から不当に干渉されず自由に活動することを保障する権利を自由権といいます。"},{"id":"SC-SOC-CIV-000059","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合で、国際平和と安全の維持に主要な責任を負う機関は？","answer":"安全保障理事会","options":["安全保障理事会","総会","国際司法裁判所","事務局"],"ex":"国際連合の安全保障理事会は、国際平和と安全の維持に主要な責任を負います。"},{"id":"SC-SOC-CIV-000060","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合安全保障理事会の常任理事国が持つ、実質的に決議を成立させない権限を何という？","answer":"拒否権","options":["拒否権","解散権","違憲審査権","請願権"],"ex":"安全保障理事会の実質事項では、常任理事国の反対票が決議成立を妨げるため、一般に拒否権と呼ばれます。"},{"id":"SC-SOC-CIV-000061","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国と国との間で結ばれる合意で、国内で承認手続を経て効力を持つものを何という？","answer":"条約","options":["条約","条例","政令","判例"],"ex":"国家間の合意のうち、国際法上の権利や義務を定めるものを条約といいます。"},{"id":"SC-SOC-CIV-000062","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"ある商品の価格が下がったとき、ほかの条件が同じなら需要量は一般にどうなる？","answer":"増える","options":["増える","減る","必ず0になる","変化しない"],"ex":"一般に価格が下がると、その商品を買いたい量である需要量は増える傾向があります。"},{"id":"SC-SOC-CIV-000063","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"企業どうしが価格や品質などで競い合うことを何という？","answer":"競争","options":["競争","独占","租税","社会保障"],"ex":"市場では企業が価格や品質、サービスなどをめぐって競争します。"},{"id":"SC-SOC-GEO-000064","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"世界地理","q":"赤道付近が一年を通して高温になりやすい主な理由は？","answer":"太陽の光が強く当たりやすいから","options":["太陽の光が強く当たりやすいから","海抜が高い地域が多いから","寒流の影響が強いから","太陽が地平線近くに見えるから"],"ex":"赤道付近は太陽高度が高く、年間を通して強い日射を受けやすいため高温になりやすい地域です。"},{"id":"SC-SOC-GEO-000065","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"世界地理","q":"世界の気候を考えるとき、緯度が高くなるほど一般に気温が低くなる主な理由は？","answer":"太陽の光が斜めに当たりやすくなるから","options":["太陽の光が斜めに当たりやすくなるから","地球から遠くなるから","海がなくなるから","空気がなくなるから"],"ex":"高緯度ほど太陽光が斜めに当たり、単位面積あたりに受けるエネルギーが小さくなります。"},{"id":"SC-SOC-GEO-000066","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"世界地理","q":"季節によって風向きが大きく変わる風を何という？","answer":"季節風（モンスーン）","options":["季節風（モンスーン）","偏西風","貿易風","海風"],"ex":"大陸と海洋の温まり方の違いなどにより、季節で風向きが変わる風を季節風といいます。"},{"id":"SC-SOC-HIS-000067","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉幕府で、将軍を補佐し政治の実権を握った役職は？","answer":"執権","options":["執権","関白","老中","大老"],"ex":"鎌倉幕府では北条氏が執権となり、政治の実権を握りました。"},{"id":"SC-SOC-HIS-000068","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町幕府の第3代将軍で、金閣を建てた人物は？","answer":"足利義満","options":["足利義満","足利尊氏","足利義政","源頼朝"],"ex":"足利義満は室町幕府第3代将軍で、京都の北山に金閣を建てました。"},{"id":"SC-SOC-HIS-000069","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"打製石器が使われた時代は？","answer":"旧石器時代","options":["旧石器時代","縄文時代","弥生時代","古墳時代"],"ex":"旧石器時代には、石を打ち欠いて作る打製石器が使われました。"},{"id":"SC-SOC-HIS-000070","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の人々が食べ物の煮炊きなどに使った土器は？","answer":"縄文土器","options":["縄文土器","弥生土器","須恵器","土師器"],"ex":"縄文時代には、表面に縄目の文様を持つ縄文土器が使われました。"},{"id":"SC-SOC-HIS-000071","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の代表的な住居は？","answer":"竪穴住居","options":["竪穴住居","高床倉庫","寝殿造","書院造"],"ex":"縄文時代には、地面を掘り下げて柱を立てる竪穴住居が広く使われました。"},{"id":"SC-SOC-HIS-000072","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代に日本各地へ広がった農業は？","answer":"稲作","options":["稲作","酪農","茶の栽培","綿花栽培"],"ex":"弥生時代には大陸から伝わった水田稲作が広がりました。"},{"id":"SC-SOC-HIS-000073","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代の収穫物を保存するために使われた建物は？","answer":"高床倉庫","options":["高床倉庫","竪穴住居","校倉造","寝殿造"],"ex":"高床倉庫は湿気や害虫を防ぎ、米などの保存に適していました。"},{"id":"SC-SOC-HIS-000074","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"『魏志』倭人伝に記された邪馬台国の女王は？","answer":"卑弥呼","options":["卑弥呼","推古天皇","持統天皇","額田王"],"ex":"卑弥呼は邪馬台国の女王として中国の『魏志』倭人伝に記されています。"},{"id":"SC-SOC-HIS-000075","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"大規模な前方後円墳が多く造られた時代は？","answer":"古墳時代","options":["古墳時代","縄文時代","奈良時代","鎌倉時代"],"ex":"古墳時代には有力者の墓として前方後円墳などの大きな古墳が造られました。"},{"id":"SC-SOC-HIS-000076","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳の周囲などに置かれた素焼きの土製品は？","answer":"埴輪","options":["埴輪","土偶","銅鐸","木簡"],"ex":"埴輪は古墳の周囲や上に並べられた素焼きの土製品です。"},{"id":"SC-SOC-HIS-000077","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"冠位十二階や十七条の憲法に関わった人物は？","answer":"聖徳太子","options":["聖徳太子","中大兄皇子","藤原道長","聖武天皇"],"ex":"聖徳太子は推古天皇のもとで政治を助け、冠位十二階や十七条の憲法に関わったとされます。"},{"id":"SC-SOC-HIS-000078","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"645年の政変をきっかけに始まった改革を何という？","answer":"大化の改新","options":["大化の改新","壬申の乱","承久の乱","応仁の乱"],"ex":"645年の政変をきっかけに、中大兄皇子や中臣鎌足らが政治改革を進めました。"},{"id":"SC-SOC-HIS-000079","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"710年に都が置かれた場所は？","answer":"平城京","options":["平城京","平安京","藤原京","長岡京"],"ex":"710年に都が平城京へ移され、奈良時代が始まりました。"},{"id":"SC-SOC-HIS-000080","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"聖武天皇が国ごとに建立を命じた寺院は？","answer":"国分寺・国分尼寺","options":["国分寺・国分尼寺","延暦寺","東福寺","金閣"],"ex":"聖武天皇は仏教の力で国を守ろうとし、国分寺・国分尼寺の建立を命じました。"},{"id":"SC-SOC-HIS-000081","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"奈良時代に完成した、日本最古の和歌集は？","answer":"万葉集","options":["万葉集","古今和歌集","新古今和歌集","梁塵秘抄"],"ex":"万葉集は奈良時代に成立した日本最古の和歌集です。"},{"id":"SC-SOC-HIS-000082","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"794年に都を平安京へ移した天皇は？","answer":"桓武天皇","options":["桓武天皇","聖武天皇","天智天皇","後醍醐天皇"],"ex":"桓武天皇は794年に都を平安京へ移しました。"},{"id":"SC-SOC-HIS-000083","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"摂政・関白の地位を利用して摂関政治を行った氏族は？","answer":"藤原氏","options":["藤原氏","平氏","源氏","北条氏"],"ex":"藤原氏は天皇家との婚姻関係を背景に、摂政・関白として政治の実権を握りました。"},{"id":"SC-SOC-HIS-000084","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉幕府が全国に守護・地頭を置くきっかけとなった出来事は？","answer":"源義経追討","options":["源義経追討","承久の乱","元寇","応仁の乱"],"ex":"源頼朝は源義経追討を名目に、全国に守護・地頭を置く権限を朝廷から認められました。"},{"id":"SC-SOC-HIS-000085","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"将軍と御家人の主従関係を表す言葉は？","answer":"御恩と奉公","options":["御恩と奉公","公地公民","班田収授","殖産興業"],"ex":"将軍が領地などの御恩を与え、御家人が軍役などの奉公をする関係でした。"},{"id":"SC-SOC-HIS-000086","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉幕府で将軍を補佐し、北条氏が就いた役職は？","answer":"執権","options":["執権","関白","老中","管領"],"ex":"鎌倉幕府では北条氏が執権となり政治の実権を握りました。"},{"id":"SC-SOC-HIS-000087","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"1221年、後鳥羽上皇が幕府打倒をめざして起こした戦いは？","answer":"承久の乱","options":["承久の乱","壬申の乱","応仁の乱","島原・天草一揆"],"ex":"1221年に承久の乱が起こり、幕府側が勝利しました。"},{"id":"SC-SOC-HIS-000088","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"御成敗式目を制定した執権は？","answer":"北条泰時","options":["北条泰時","北条時宗","北条政子","北条時政"],"ex":"北条泰時は武士の慣習に基づく御成敗式目を制定しました。"},{"id":"SC-SOC-HIS-000089","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"元が日本へ二度襲来した出来事を何という？","answer":"元寇","options":["元寇","応仁の乱","倭寇","文永の役"],"ex":"1274年の文永の役と1281年の弘安の役を合わせて元寇と呼びます。"},{"id":"SC-SOC-HIS-000090","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉時代に浄土宗を開いた人物は？","answer":"法然","options":["法然","親鸞","日蓮","栄西"],"ex":"法然は念仏による救いを説き、浄土宗を開きました。"},{"id":"SC-SOC-HIS-000091","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"建武の新政を行った天皇は？","answer":"後醍醐天皇","options":["後醍醐天皇","後鳥羽上皇","桓武天皇","後白河法皇"],"ex":"鎌倉幕府滅亡後、後醍醐天皇は天皇中心の政治である建武の新政を行いました。"},{"id":"SC-SOC-HIS-000092","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町幕府で将軍を補佐した役職は？","answer":"管領","options":["管領","執権","老中","関白"],"ex":"室町幕府では管領が将軍を補佐しました。"},{"id":"SC-SOC-HIS-000093","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"金閣を建て、南北朝の合一を実現した将軍は？","answer":"足利義満","options":["足利義満","足利義政","足利尊氏","足利義昭"],"ex":"足利義満は南北朝の合一を実現し、北山文化を代表する金閣を建てました。"},{"id":"SC-SOC-HIS-000094","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"銀閣に代表される文化を何という？","answer":"東山文化","options":["東山文化","北山文化","天平文化","元禄文化"],"ex":"銀閣を中心に発達した文化は東山文化と呼ばれます。"},{"id":"SC-SOC-HIS-000095","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"1467年に始まり、戦国時代につながった戦乱は？","answer":"応仁の乱","options":["応仁の乱","承久の乱","壬申の乱","島原・天草一揆"],"ex":"応仁の乱は京都を中心に長期化し、戦国時代につながる要因となりました。"},{"id":"SC-SOC-HIS-000096","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町時代、農民や地侍などが自治的につくった村を何という？","answer":"惣村","options":["惣村","荘園","城下町","寺内町"],"ex":"惣村では寄合などによって村の運営が行われました。"},{"id":"SC-SOC-HIS-000097","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町時代に明との間で行われた、勘合を用いた貿易は？","answer":"日明貿易","options":["日明貿易","南蛮貿易","朱印船貿易","日宋貿易"],"ex":"倭寇と区別するため勘合を用いて行われた貿易を日明貿易といいます。"},{"id":"SC-SOC-HIS-000098","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国大名が領国支配のために定めた独自の法律は？","answer":"分国法","options":["分国法","武家諸法度","御成敗式目","公事方御定書"],"ex":"戦国大名は領国を統治するため分国法を定めました。"},{"id":"SC-SOC-HIS-000099","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"長篠の戦いで鉄砲を有効に使ったことで知られる武将は？","answer":"織田信長","options":["織田信長","豊臣秀吉","徳川家康","武田信玄"],"ex":"織田信長は長篠の戦いで鉄砲を活用したことで知られます。"},{"id":"SC-SOC-HIS-000100","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"太閤検地と刀狩を進めた人物は？","answer":"豊臣秀吉","options":["豊臣秀吉","織田信長","徳川家康","足利義満"],"ex":"豊臣秀吉は太閤検地と刀狩を進め、兵農分離を進展させました。"},{"id":"SC-SOC-HIS-000101","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"ヨーロッパ人との交易やキリスト教の伝来に関わる貿易を何という？","answer":"南蛮貿易","options":["南蛮貿易","勘合貿易","朱印船貿易","日宋貿易"],"ex":"16世紀にはポルトガル人やスペイン人との南蛮貿易が行われました。"},{"id":"SC-SOC-HIS-000102","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"1603年に征夷大将軍となり江戸幕府を開いた人物は？","answer":"徳川家康","options":["徳川家康","徳川秀忠","徳川家光","豊臣秀吉"],"ex":"徳川家康は1603年に征夷大将軍となり江戸幕府を開きました。"},{"id":"SC-SOC-HIS-000103","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"大名を親藩・譜代・外様に分けた幕府の目的として最も適切なのは？","answer":"大名を統制するため","options":["大名を統制するため","農民を武士にするため","朝廷を京都から移すため","外国との貿易を増やすため"],"ex":"幕府は将軍家との関係に応じて大名を配置し、支配を安定させました。"},{"id":"SC-SOC-HIS-000104","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"大名が江戸と領地を往復する制度は？","answer":"参勤交代","options":["参勤交代","五人組","株仲間","寺請制度"],"ex":"参勤交代は大名統制の重要な仕組みでした。"},{"id":"SC-SOC-HIS-000105","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"江戸幕府が大名を統制するために定めた法令は？","answer":"武家諸法度","options":["武家諸法度","御成敗式目","十七条の憲法","公事方御定書"],"ex":"武家諸法度は大名の行動などを規制するために定められました。"},{"id":"SC-SOC-HIS-000106","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"江戸時代、日本が正式な外交関係を結んでいた朝鮮との窓口になった藩は？","answer":"対馬藩","options":["対馬藩","薩摩藩","松前藩","長州藩"],"ex":"対馬藩は朝鮮との外交や貿易の窓口となりました。"},{"id":"SC-SOC-HIS-000107","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"琉球王国との関係が深く、その支配に関わった藩は？","answer":"薩摩藩","options":["薩摩藩","対馬藩","松前藩","仙台藩"],"ex":"薩摩藩は1609年に琉球へ侵攻し、その後琉球王国との関係を深めました。"},{"id":"SC-SOC-HIS-000108","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"徳川吉宗が行った改革は？","answer":"享保の改革","options":["享保の改革","寛政の改革","天保の改革","大化の改新"],"ex":"8代将軍徳川吉宗は享保の改革を行いました。"},{"id":"SC-SOC-HIS-000109","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"田沼意次の政治で重視された政策は？","answer":"商業を活用して幕府収入を増やす","options":["商業を活用して幕府収入を増やす","鎖国を廃止する","廃藩置県を行う","地租改正を行う"],"ex":"田沼意次は株仲間を認めるなど、商業を活用した政策を進めました。"},{"id":"SC-SOC-HIS-000110","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"松平定信が行った改革は？","answer":"寛政の改革","options":["寛政の改革","享保の改革","天保の改革","明治維新"],"ex":"松平定信は寛政の改革を行いました。"},{"id":"SC-SOC-HIS-000111","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"水野忠邦が行った改革は？","answer":"天保の改革","options":["天保の改革","寛政の改革","享保の改革","正徳の治"],"ex":"水野忠邦は天保の改革を行いました。"},{"id":"SC-SOC-HIS-000112","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"井原西鶴や松尾芭蕉らが活躍した、上方中心の文化は？","answer":"元禄文化","options":["元禄文化","化政文化","北山文化","東山文化"],"ex":"17世紀後半から18世紀初めに、上方を中心に元禄文化が栄えました。"},{"id":"SC-SOC-HIS-000113","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"葛飾北斎や歌川広重らが活躍した文化は？","answer":"化政文化","options":["化政文化","元禄文化","天平文化","国風文化"],"ex":"江戸を中心に発達した化政文化では浮世絵などが栄えました。"},{"id":"SC-SOC-HIS-000114","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"1853年に浦賀へ来航したアメリカの使節は？","answer":"ペリー","options":["ペリー","ハリス","マッカーサー","ワシントン"],"ex":"1853年、アメリカのペリーが浦賀に来航し開国を求めました。"},{"id":"SC-SOC-HIS-000115","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name SOC-HIS-000124","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"第一次世界大戦後の国際連盟で、常任理事国となったアジアの国は？","answer":"日本","options":["日本","中国","インド","タイ"],"ex":"日本は国際連盟の常任理事国の一つとなりました。"},{"id":"SC-SOC-HIS-000125","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"1925年、25歳以上のすべての男子に選挙権を認めた法律は？","answer":"普通選挙法","options":["普通選挙法","治安維持法","国家総動員法","労働基準法"],"ex":"普通選挙法により、納税額による制限が撤廃され、25歳以上の男子に選挙権が広がりました。"},{"id":"SC-SOC-HIS-000126","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"1931年に日本の関東軍が満州で軍事行動を拡大するきっかけとなった事件は？","answer":"満州事変","options":["満州事変","日中戦争","二・二六事件","五・一五事件"],"ex":"1931年の満州事変をきっかけに日本の中国東北部への進出が拡大しました。"},{"id":"SC-SOC-HIS-000127","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1947年に施行された憲法は？","answer":"日本国憲法","options":["日本国憲法","大日本帝国憲法","五箇条の御誓文","教育勅語"],"ex":"日本国憲法は1946年に公布され、1947年5月3日に施行されました。"},{"id":"SC-SOC-HIS-000128","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1951年に日本が連合国の多くと結んだ講和条約は？","answer":"サンフランシスコ平和条約","options":["サンフランシスコ平和条約","日米安全保障条約","日ソ共同宣言","日韓基本条約"],"ex":"サンフランシスコ平和条約によって日本は国際社会への復帰を進めました。"},{"id":"SC-SOC-HIS-000129","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"大和政権の王は中国の史書で何と呼ばれた？","answer":"倭王","options":["倭王","執権","関白","将軍"],"ex":"古墳時代の大和政権の王は、中国の史書で倭王と記されました。"},{"id":"SC-SOC-HIS-000130","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"日本から隋へ派遣された使節を何という？","answer":"遣隋使","options":["遣隋使","遣唐使","勘合使","朝鮮通信使"],"ex":"飛鳥時代、日本は隋の制度や文化を学ぶため遣隋使を派遣しました。"},{"id":"SC-SOC-HIS-000131","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"607年に遣隋使として隋へ渡った人物は？","answer":"小野妹子","options":["小野妹子","中臣鎌足","山上憶良","阿倍仲麻呂"],"ex":"607年、小野妹子が遣隋使として隋へ派遣されました。"},{"id":"SC-SOC-HIS-000132","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"672年に皇位継承をめぐって起きた争いは？","answer":"壬申の乱","options":["壬申の乱","承久の乱","応仁の乱","保元の乱"],"ex":"672年、皇位継承をめぐって壬申の乱が起こりました。"},{"id":"SC-SOC-HIS-000133","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"701年に制定された律令は？","answer":"大宝律令","options":["大宝律令","養老律令","御成敗式目","武家諸法度"],"ex":"701年、大宝律令が制定され、律令国家の仕組みが整えられました。"},{"id":"SC-SOC-HIS-000134","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"743年、開墾した土地の私有を認めた法令は？","answer":"墾田永年私財法","options":["墾田永年私財法","班田収授法","武家諸法度","地租改正"],"ex":"墾田永年私財法により、新たに開墾した土地の永久私有が認められました。"},{"id":"SC-SOC-HIS-000135","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"唐から来日し、仏教の戒律を伝えた僧は？","answer":"鑑真","options":["鑑真","最澄","空海","法然"],"ex":"鑑真は唐から日本へ渡り、戒律を伝えました。"},{"id":"SC-SOC-HIS-000136","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"遣唐使の停止を提案した人物は？","answer":"菅原道真","options":["菅原道真","藤原道長","平清盛","坂上田村麻呂"],"ex":"894年、菅原道真の建議により遣唐使は停止されました。"},{"id":"SC-SOC-HIS-000137","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"かな文字や『源氏物語』などに代表される文化は？","answer":"国風文化","options":["国風文化","天平文化","北山文化","元禄文化"],"ex":"平安時代中期には、日本の風土や生活に合った国風文化が発達しました。"},{"id":"SC-SOC-HIS-000138","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"平等院鳳凰堂を建立した人物は？","answer":"藤原頼通","options":["藤原頼通","藤原道長","聖武天皇","足利義満"],"ex":"藤原頼通は宇治に平等院鳳凰堂を建立しました。"},{"id":"SC-SOC-HIS-000139","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉幕府が国ごとに置いた軍事・警察の役職は？","answer":"守護","options":["守護","地頭","執権","管領"],"ex":"守護は国ごとに置かれ、軍事・警察などを担当しました。"},{"id":"SC-SOC-HIS-000140","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉幕府が荘園や公領に置いた役職は？","answer":"地頭","options":["地頭","守護","老中","奉行"],"ex":"地頭は荘園や公領に置かれ、年貢の徴収や土地管理などを担いました。"},{"id":"SC-SOC-HIS-000141","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"元寇の後、幕府が御家人に十分な恩賞を与えにくかった主な理由は？","answer":"新たな領地を得られなかったから","options":["新たな領地を得られなかったから","幕府が京都へ移ったから","米の栽培が禁止されたから","朝廷が幕府を廃止したから"],"ex":"元寇は外国からの侵攻を退けた戦いで、新しい領地を獲得できず恩賞が不足しました。"},{"id":"SC-SOC-HIS-000142","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉時代、武士の生活や戦いを題材にした『平家物語』のような作品を何という？","answer":"軍記物語","options":["軍記物語","随筆","勅撰和歌集","浮世草子"],"ex":"武士の戦いや盛衰を描く作品は軍記物語と呼ばれます。"},{"id":"SC-SOC-HIS-000143","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"南北朝を合一した将軍は？","answer":"足利義満","options":["足利義満","足利尊氏","足利義政","足利義昭"],"ex":"足利義満は1392年に南北朝の合一を実現しました。"},{"id":"SC-SOC-HIS-000144","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"能を大成した人物として適切なのは？","answer":"世阿弥","options":["世阿弥","松尾芭蕉","近松門左衛門","井原西鶴"],"ex":"観阿弥・世阿弥父子は能を大成しました。"},{"id":"SC-SOC-HIS-000145","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町時代、農民らが団結して要求を通そうとした行動を何という？","answer":"土一揆","options":["土一揆","打ちこわし","百姓一揆","自由民権運動"],"ex":"室町時代には農民や地侍らが団結して土一揆を起こしました。"},{"id":"SC-SOC-HIS-000146","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"浄土真宗の信者らが各地で起こした一揆は？","answer":"一向一揆","options":["一向一揆","土一揆","国一揆","打ちこわし"],"ex":"浄土真宗の信者を中心に一向一揆が各地で起こりました。"},{"id":"SC-SOC-HIS-000147","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国大名が城下に商工業者を集めて発展させた町を何という？","answer":"城下町","options":["城下町","門前町","宿場町","港町"],"ex":"戦国大名は城の周囲に家臣や商工業者を集め、城下町を発展させました。"},{"id":"SC-SOC-HIS-000148","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"織田信長が商工業を活発にするために行った政策は？","answer":"楽市・楽座","options":["楽市・楽座","株仲間の奨励","参勤交代","上知令"],"ex":"織田信長は市場の特権を廃し、商工業を活発にする楽市・楽座を進めました。"},{"id":"SC-SOC-HIS-000149","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"1549年に日本へキリスト教を伝えた宣教師は？","answer":"フランシスコ・ザビエル","options":["フランシスコ・ザビエル","マルコ・ポーロ","ペリー","シーボルト"],"ex":"1549年、ザビエルが鹿児島に来航しキリスト教を伝えました。"},{"id":"SC-SOC-HIS-000150","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"豊臣秀吉が全国の田畑を調査した政策は？","answer":"太閤検地","options":["太閤検地","刀狩","楽市・楽座","地租改正"],"ex":"太閤検地では土地の面積や収穫量を調べ、石高で把握しました。"},{"id":"SC-SOC-HIS-000151","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"豊臣秀吉が農民から武器を取り上げた政策は？","answer":"刀狩","options":["刀狩","兵農分離令","参勤交代","鎖国令"],"ex":"刀狩は農民から刀や鉄砲などを取り上げる政策でした。"},{"id":"SC-SOC-HIS-000152","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"関ヶ原の戦いが起きた年は？","answer":"1600年","options":["1600年","1543年","1637年","1868年"],"ex":"1600年の関ヶ原の戦いで徳川家康が勝利しました。"},{"id":"SC-SOC-HIS-000153","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"江戸幕府がキリスト教徒ではないことを寺院に証明させた制度は？","answer":"寺請制度","options":["寺請制度","五人組","参勤交代","株仲間"],"ex":"寺請制度は人々を寺院に所属させ、キリスト教徒ではないことを証明させる仕組みでした。"},{"id":"SC-SOC-HIS-000154","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"オランダ商館が置かれた長崎の人工島は？","answer":"出島","options":["出島","種子島","平戸島","対馬"],"ex":"江戸幕府は長崎の出島を通じてオランダとの貿易を続けました。"},{"id":"SC-SOC-HIS-000155","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"オランダ語を通して西洋の学問を学ぶ学問を何という？","answer":"蘭学","options":["蘭学","国学","朱子学","蘭印学"],"ex":"蘭学はオランダ語の書物などを通して西洋の医学や科学を学ぶ学問です。"},{"id":"SC-SOC-HIS-000156","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"『解体新書』の翻訳に関わった人物は？","answer":"杉田玄白","options":["杉田玄白","本居宣長","伊能忠敬","新井白石"],"ex":"杉田玄白らはオランダ語の医学書を翻訳し、『解体新書』を刊行しました。"},{"id":"SC-SOC-HIS-000157","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"日本全国を測量し、精密な日本地図作成に貢献した人物は？","answer":"伊能忠敬","options":["伊能忠敬","杉田玄白","本居宣長","平賀源内"],"ex":"伊能忠敬は全国を歩いて測量し、精密な日本地図作成に貢献しました。"},{"id":"SC-SOC-HIS-000158","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"『古事記伝』を著し、国学を大成した人物は？","answer":"本居宣長","options":["本居宣長","賀茂真淵","杉田玄白","荻生徂徠"],"ex":"本居宣長は『古事記伝』を著し、国学を大成しました。"},{"id":"SC-SOC-HIS-000159","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"日米修好通商条約を結んだときの大老は？","answer":"井伊直弼","options":["井伊直弼","大久保利通","伊藤博文","西郷隆盛"],"ex":"1858年、大老井伊直弼のもとで日米修好通商条約が結ばれました。"},{"id":"SC-SOC-HIS-000160","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"薩摩藩と長州藩の提携を仲介した人物は？","answer":"坂本龍馬","options":["坂本龍馬","勝海舟","板垣退助","福沢諭吉"],"ex":"坂本龍馬らの仲介で薩長同盟が成立しました。"},{"id":"SC-SOC-HIS-000161","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"岩倉使節団の主な目的として適切なのは？","answer":"欧米の制度や産業を調査すること","options":["欧米の制度や産業を調査すること","朝鮮を植民地にすること","鎖国を復活させること","幕府を再建すること"],"ex":"岩倉使節団は欧米諸国の制度や産業などを視察・調査しました。"},{"id":"SC-SOC-HIS-000162","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"明治政府が近代産業を育成するために進めた政策を何という？","answer":"殖産興業","options":["殖産興業","富国強兵","文明開化","廃藩置県"],"ex":"殖産興業は官営工場の設置などを通じて近代産業を育成する政策です。"},{"id":"SC-SOC-HIS-000163","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"大日本帝国憲法の制定に中心的に関わった人物は？","answer":"伊藤博文","options":["伊藤博文","板垣退助","大隈重信","西郷隆盛"],"ex":"伊藤博文はヨーロッパの憲法制度を調査し、大日本帝国憲法制定の中心となりました。"},{"id":"SC-SOC-HIS-000164","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"1918年、米価の急騰を背景に全国へ広がった民衆運動は？","answer":"米騒動","options":["米騒動","自由民権運動","護憲運動","労働争議"],"ex":"1918年、米価の急騰を背景に米騒動が全国へ広がりました。"},{"id":"SC-SOC-HIS-000165","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"1923年に東京・横浜を中心に大きな被害を出した災害は？","answer":"関東大震災","options":["関東大震災","濃尾地震","阪神・淡路大震災","東日本大震災"],"ex":"1923年に関東大震災が発生し、東京や横浜などに大きな被害が出ました。"},{"id":"SC-SOC-HIS-000166","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"1937年に本格化した日本と中国の戦争は？","answer":"日中戦争","options":["日中戦争","日清戦争","日露戦争","太平洋戦争"],"ex":"1937年、盧溝橋事件をきっかけに日中戦争が本格化しました。"},{"id":"SC-SOC-HIS-000167","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1956年、日本が加盟した国際機関は？","answer":"国際連合","options":["国際連合","国際連盟","EU","NATO"],"ex":"1956年、日本は国際連合に加盟しました。"},{"id":"SC-SOC-HIS-000168","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"高度経済成長期の1964年に東京で開かれた国際的なスポーツ大会は？","answer":"オリンピック","options":["オリンピック","アジア競技大会","ラグビーワールドカップ","万国博覧会"],"ex":"1964年に東京オリンピックが開催され、高度経済成長期を象徴する出来事の一つとなりました。"},{"id":"SC-SOC-HIS-000169","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代の人々の生活として最も適切なのは？","answer":"狩りや採集をしながら移動して暮らした","options":["狩りや採集をしながら移動して暮らした","水田稲作を中心に定住した","武士が荘園を管理した","城下町で商業を行った"],"ex":"旧石器時代の人々は狩りや採集を行い、獲物や季節に応じて移動しながら暮らしていました。"},{"id":"SC-SOC-HIS-000170","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代を知る手がかりとして特に重要なものは？","answer":"打製石器","options":["打製石器","銅鐸","埴輪","瓦"],"ex":"旧石器時代の代表的な遺物は打製石器です。"},{"id":"SC-SOC-HIS-000171","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代に貝殻や魚の骨などが多く捨てられた場所を何という？","answer":"貝塚","options":["貝塚","古墳","条里","荘園"],"ex":"貝塚は当時の食生活や環境を知る重要な手がかりです。"},{"id":"SC-SOC-HIS-000172","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の土偶について適切な説明は？","answer":"祈りやまじないに使われたと考えられている","options":["祈りやまじないに使われたと考えられている","税を納めるための道具だった","武士の身分を示した","稲作の収穫量を記録した"],"ex":"土偶は祈りやまじないなどに使われたと考えられています。"},{"id":"SC-SOC-HIS-000173","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代に稲作が広がったことで起こった変化として適切なのは？","answer":"むらの間で土地や水をめぐる争いが起こるようになった","options":["むらの間で土地や水をめぐる争いが起こるようになった","武士が全国を支配した","工場で大量生産が始まった","参勤交代が始まった"],"ex":"稲作の広がりにより土地や水の管理が重要となり、むらの間で争いも起こるようになりました。"},{"id":"SC-SOC-HIS-000174","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代に祭りなどで使われたと考えられる青銅器は？","answer":"銅鐸","options":["銅鐸","打製石器","埴輪","火縄銃"],"ex":"銅鐸は弥生時代の青銅器で、祭りなどに使われたと考えられています。"},{"id":"SC-SOC-HIS-000175","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳時代に大和政権が勢力を広げたことを示す手がかりとして適切なのは？","answer":"各地に似た形の前方後円墳が造られた","options":["各地に似た形の前方後円墳が造られた","全国で参勤交代が行われた","各地に国分寺が建てられた","全国に鉄道が敷かれた"],"ex":"各地に前方後円墳が造られたことは、大和政権とのつながりを考える手がかりになります。"},{"id":"SC-SOC-HIS-000176","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"大和政権の豪族に与えられた地位や称号の仕組みを何という？","answer":"氏姓制度","options":["氏姓制度","班田収授法","御恩と奉公","参勤交代"],"ex":"大和政権は豪族を氏と姓で秩序づける氏姓制度を用いました。"},{"id":"SC-SOC-HIS-000177","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"十七条の憲法が目指したこととして適切なのは？","answer":"役人の心構えを示し、天皇中心の政治を進める","options":["役人の心構えを示し、天皇中心の政治を進める","武士の裁判基準を定める","大名を江戸に住まわせる","国会の仕組みを定める"],"ex":"十七条の憲法は役人の心構えを示し、天皇を中心とした政治を目指す内容でした。"},{"id":"SC-SOC-HIS-000178","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"班田収授法では、一定の年齢に達した人々に何が与えられた？","answer":"口分田","options":["口分田","荘園","知行地","藩"],"ex":"班田収授法では戸籍に基づき人々に口分田が与えられました。"},{"id":"SC-SOC-HIS-000179","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"奈良時代に税として地方から都へ運ばれたものの組み合わせとして適切なのは？","answer":"調・庸","options":["調・庸","年貢・地租","石高・俸禄","関税・消費税"],"ex":"律令制度では調や庸などの税が課されました。"},{"id":"SC-SOC-HIS-000180","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"国風文化が発達した背景として適切なのは？","answer":"遣唐使停止後、日本独自の文化が発達した","options":["遣唐使停止後、日本独自の文化が発達した","鎖国で外国との交流が完全になくなった","明治政府が欧化政策を進めた","武士が全国を統一した"],"ex":"遣唐使停止後、中国文化の影響を受けつつ日本の風土に合った国風文化が発達しました。"},{"id":"SC-SOC-HIS-000181","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"院政を始めた上皇として知られる人物は？","answer":"白河上皇","options":["白河上皇","後鳥羽上皇","後醍醐天皇","聖武天皇"],"ex":"白河上皇は上皇となった後も政治の実権を握り、院政を始めました。"},{"id":"SC-SOC-HIS-000182","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"御家人が将軍に対して負った奉公の例として適切なのは？","answer":"軍役や京都の警備を務める","options":["軍役や京都の警備を務める","年貢を免除される","関白に就任する","外交条約を結ぶ"],"ex":"御家人は将軍から御恩を受ける代わりに軍役や警備などの奉公を行いました。"},{"id":"SC-SOC-HIS-000183","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"御成敗式目が制定された目的として適切なのは？","answer":"武士社会の裁判基準を明確にする","options":["武士社会の裁判基準を明確にする","公家の儀式を定める","農民の年貢を廃止する","外国との貿易ルールを定める"],"ex":"御成敗式目は武士の慣習や道理に基づいて裁判の基準を示しました。"},{"id":"SC-SOC-HIS-000184","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"日明貿易で勘合が使われた主な理由は？","answer":"倭寇と正式な貿易船を区別するため","options":["倭寇と正式な貿易船を区別するため","税を米で納めるため","大名を江戸へ集めるため","キリスト教徒を調べるため"],"ex":"勘合は正式な貿易船であることを示し、倭寇と区別するために使われました。"},{"id":"SC-SOC-HIS-000185","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"応仁の乱の後、各地で勢力を強めたのは？","answer":"戦国大名","options":["戦国大名","摂政","国司","公家"],"ex":"応仁の乱後、各地で戦国大名が力を強めました。"},{"id":"SC-SOC-HIS-000186","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"下剋上とはどのような動きを指す？","answer":"身分の低い者が実力で上の者を倒す","options":["身分の低い者が実力で上の者を倒す","朝廷が幕府を保護する","農民が武士になることを禁じる","大名が江戸に住む"],"ex":"戦国時代には実力によって下位の者が上位の者を倒す下剋上が見られました。"},{"id":"SC-SOC-HIS-000187","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"楽市・楽座の目的として適切なのは？","answer":"商工業を活発にする","options":["商工業を活発にする","農民から武器を取り上げる","キリスト教を禁止する","大名を統制する"],"ex":"楽市・楽座は市場の特権を廃して商工業を活発にする政策でした。"},{"id":"SC-SOC-HIS-000188","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"太閤検地と刀狩によって進んだ社会の変化は？","answer":"兵農分離","options":["兵農分離","公地公民","摂関政治","殖産興業"],"ex":"検地と刀狩によって武士と農民の身分の分離が進みました。"},{"id":"SC-SOC-HIS-000189","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"参勤交代が幕府による大名統制に役立った理由として適切なのは？","answer":"大名に経済的負担を負わせ、江戸との往復を義務づけた","options":["大名に経済的負担を負わせ、江戸との往復を義務づけた","大名に外国貿易を任せた","大名に国会議員を選ばせた","農民の税を免除した"],"ex":"参勤交代は大名に江戸との往復や江戸滞在を義務づけ、経済的負担も与えました。"},{"id":"SC-SOC-HIS-000190","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"鎖国下でも貿易が続けられた相手として適切なのは？","answer":"オランダと中国","options":["オランダと中国","イギリスとフランス","ロシアとアメリカ","スペインとポルトガル"],"ex":"鎖国下でも長崎を通じてオランダや中国との貿易が行われました。"},{"id":"SC-SOC-HIS-000191","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"元禄文化と関係が深い人物の組み合わせは？","answer":"井原西鶴と松尾芭蕉","options":["井原西鶴と松尾芭蕉","葛飾北斎と歌川広重","紫式部と清少納言","観阿弥と世阿弥"],"ex":"井原西鶴や松尾芭蕉は元禄文化を代表する人物です。"},{"id":"SC-SOC-HIS-000192","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"化政文化の特色として適切なのは？","answer":"江戸の町人を中心に浮世絵や文学が栄えた","options":["江戸の町人を中心に浮世絵や文学が栄えた","公家中心にかな文学が発達した","武士中心に能が大成した","仏教中心に天平文化が栄えた"],"ex":"化政文化は江戸を中心に町人文化が発達し、浮世絵や文学が栄えました。"},{"id":"SC-SOC-HIS-000193","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"日米修好通商条約が不平等条約とされた理由として適切なのは？","answer":"領事裁判権を認め、関税自主権がなかった","options":["領事裁判権を認め、関税自主権がなかった","日本がアメリカを植民地化した","日本だけが鎖国を続けた","将軍が選挙で選ばれた"],"ex":"条約には領事裁判権を認め、関税自主権を持てないなど日本に不利な内容が含まれていました。"},{"id":"SC-SOC-HIS-000194","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"大政奉還を行った将軍は？","answer":"徳川慶喜","options":["徳川慶喜","徳川家康","徳川吉宗","徳川家光"],"ex":"1867年、徳川慶喜は政権を朝廷へ返す大政奉還を行いました。"},{"id":"SC-SOC-HIS-000195","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"地租改正で税を納める基準となったものは？","answer":"地価","options":["地価","収穫量","人口","家の広さ"],"ex":"地租改正では土地の価格である地価を基準に地租を現金で納めました。"},{"id":"SC-SOC-HIS-000196","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"徴兵令や殖産興業などの政策が目指したこととして最も適切なのは？","answer":"近代国家をつくり国力を高める","options":["近代国家をつくり国力を高める","幕藩体制を復活させる","鎖国を強化する","摂関政治を復活させる"],"ex":"明治政府は富国強兵を掲げ、近代国家づくりを進めました。"},{"id":"SC-SOC-HIS-000197","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"大正デモクラシーの動きとして適切なのは？","answer":"普通選挙を求める運動が広がった","options":["普通選挙を求める運動が広がった","参勤交代が復活した","班田収授法が始まった","鎖国が強化された"],"ex":"大正期には民衆の政治参加を求める動きが広がりました。"},{"id":"SC-SOC-HIS-000198","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"世界恐慌が始まったきっかけとして一般に知られる出来事は？","answer":"ニューヨーク株式市場の株価暴落","options":["ニューヨーク株式市場の株価暴落","ベルリンの壁崩壊","オイルショック","米騒動"],"ex":"1929年のニューヨーク株式市場の株価暴落をきっかけに世界恐慌が広がりました。"},{"id":"SC-SOC-HIS-000199","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"1933年、日本が脱退を表明した国際機関は？","answer":"国際連盟","options":["国際連盟","国際連合","ASEAN","EU"],"ex":"満州事変をめぐる国際連盟の対応を受け、日本は1933年に国際連盟脱退を表明しました。"},{"id":"SC-SOC-HIS-000200","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"1940年に日本がドイツ・イタリアと結んだ同盟は？","answer":"日独伊三国同盟","options":["日独伊三国同盟","日英同盟","三国干渉","ワシントン条約"],"ex":"1940年、日本はドイツ・イタリアと日独伊三国同盟を結びました。"},{"id":"SC-SOC-HIS-000201","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"太平洋戦争が始まった年は？","answer":"1941年","options":["1941年","1931年","1937年","1945年"],"ex":"1941年12月、日本のハワイ真珠湾攻撃などをきっかけに太平洋戦争が始まりました。"},{"id":"SC-SOC-HIS-000202","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"日本国憲法の基本原理の組み合わせとして適切なのは？","answer":"国民主権・基本的人権の尊重・平和主義","options":["国民主権・基本的人権の尊重・平和主義","天皇主権・富国強兵・殖産興業","議会政治・鎖国・身分制","公地公民・班田収授・租庸調"],"ex":"日本国憲法の三大原理は国民主権・基本的人権の尊重・平和主義です。"},{"id":"SC-SOC-HIS-000203","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"高度経済成長期に人々の生活で広く普及したものとして適切なのは？","answer":"テレビ・冷蔵庫・洗濯機","options":["テレビ・冷蔵庫・洗濯機","火縄銃・刀・鎧","ラジオ・蓄音機・人力車","蒸気機関車・電信機・紡績機"],"ex":"高度経済成長期には三種の神器と呼ばれた家電製品が広く普及しました。"},{"id":"SC-SOC-GEO-000204","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"気候","q":"赤道付近に広がり、一年中高温で降水量が多い気候は？","answer":"熱帯雨林気候","options":["熱帯雨林気候","砂漠気候","地中海性気候","ツンドラ気候"],"ex":"赤道付近では一年中高温多雨の熱帯雨林気候が見られます。"},{"id":"SC-SOC-GEO-000205","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"気候","q":"夏に乾燥し、冬に比較的雨が多い気候は？","answer":"地中海性気候","options":["地中海性気候","西岸海洋性気候","熱帯雨林気候","亜寒帯湿潤気候"],"ex":"地中海沿岸では夏に乾燥し冬に降水が多い地中海性気候が見られます。"},{"id":"SC-SOC-GEO-000206","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"地形","q":"日本の川の特徴として適切なのは？","answer":"短く流れが急な川が多い","options":["短く流れが急な川が多い","長く流れが緩やかな川が多い","ほとんどが一年中凍っている","河口がすべて三角州ではない"],"ex":"日本は山地が多く海までの距離が短いため、短く流れが急な川が多く見られます。"},{"id":"SC-SOC-GEO-000207","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"人口","q":"人口が都市部に集中することで起こりやすい問題は？","answer":"住宅不足や交通混雑","options":["住宅不足や交通混雑","耕地面積の急増","農村人口の増加","人口密度の低下"],"ex":"都市への人口集中により住宅不足や交通混雑などの都市問題が起こりやすくなります。"},{"id":"SC-SOC-GEO-000208","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"工業","q":"太平洋ベルトに工業地帯・地域が多く集まる理由として適切なのは？","answer":"港湾や人口の多い都市が連なり輸送に便利だから","options":["港湾や人口の多い都市が連なり輸送に便利だから","積雪が多く冬の農業に向くから","森林が多く林業だけが盛んだから","国境に近く軍事上有利だから"],"ex":"太平洋側には港湾や大都市が連なり、原料や製品の輸送に便利なため工業が発達しました。"},{"id":"SC-SOC-CIV-000209","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"国会","q":"衆議院の優越が認められている理由として適切なのは？","answer":"任期が短く解散もあり、民意を反映しやすいから","options":["任期が短く解散もあり、民意を反映しやすいから","参議院より議員数が必ず少ないから","裁判官を任命できるから","地方自治を担当するから"],"ex":"衆議院は任期が短く解散があるため、民意をより反映しやすいと考えられています。"},{"id":"SC-SOC-CIV-000210","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"裁判所","q":"三審制が設けられている主な目的は？","answer":"慎重で公正な裁判を行うため","options":["慎重で公正な裁判を行うため","裁判を必ず長引かせるため","国会の仕事を減らすため","内閣が裁判を指揮するため"],"ex":"同じ事件について原則3回まで裁判を受けられる仕組みにより、慎重で公正な判断を目指します。"},{"id":"SC-SOC-CIV-000211","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"社会権に含まれるものとして適切なのは？","answer":"生存権","options":["生存権","選挙権","信教の自由","表現の自由"],"ex":"生存権は社会権の一つで、健康で文化的な最低限度の生活を営む権利です。"},{"id":"SC-SOC-CIV-000212","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"市場で需要が減り、供給が変わらないとき、価格は一般にどうなりやすい？","answer":"下がりやすい","options":["下がりやすい","上がりやすい","必ず変わらない","必ず0になる"],"ex":"供給が変わらず需要が減ると、一般に価格には下がる方向の力が働きます。"},{"id":"SC-SOC-CIV-000213","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合の総会で各加盟国が持つ票数は原則いくつ？","answer":"1票","options":["1票","2票","人口に応じて変わる","常任理事国だけ5票"],"ex":"国際連合総会では原則として各加盟国が1票を持ちます。"},{"id":"SC-SOC-HIS-000214","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代の遺跡として知られる岩宿遺跡がある都道府県は？","answer":"群馬県","options":["群馬県","青森県","奈良県","福岡県"],"ex":"岩宿遺跡は群馬県にあり、日本にも旧石器時代があったことを示す重要な遺跡です。"},{"id":"SC-SOC-HIS-000215","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の人々が定住生活を送れた理由として適切なのは？","answer":"狩り・漁・採集で得られる食料が豊富だったから","options":["狩り・漁・採集で得られる食料が豊富だったから","水田稲作が全国で完成していたから","貨幣経済が発達していたから","武士が治安を守っていたから"],"ex":"縄文時代には豊かな自然を利用し、狩り・漁・採集を組み合わせて定住生活を営みました。"},{"id":"SC-SOC-HIS-000216","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国大名が城下町を整備した主な目的として適切なのは？","answer":"家臣や商工業者を集め領国支配を強めるため","options":["家臣や商工業者を集め領国支配を強めるため","朝廷を地方へ移すため","農民をすべて武士にするため","外国との貿易を禁止するため"],"ex":"城下町には家臣や商工業者が集められ、政治・経済の中心として領国支配に役立ちました。"},{"id":"SC-SOC-HIS-000217","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"天保の改革が行われた背景として適切なのは？","answer":"幕府財政の悪化や社会不安が深まっていた","options":["幕府財政の悪化や社会不安が深まっていた","日露戦争に敗れた","鎌倉幕府が滅亡した","普通選挙が実現した"],"ex":"江戸後期には幕府財政の悪化や飢饉・一揆などの社会不安が深まり、改革が試みられました。"},{"id":"SC-SOC-HIS-000218","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"『東海道五十三次』で知られる浮世絵師は？","answer":"歌川広重","options":["歌川広重","葛飾北斎","喜多川歌麿","東洲斎写楽"],"ex":"歌川広重は『東海道五十三次』で知られる浮世絵師です。"},{"id":"SC-SOC-HIS-000219","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代と縄文時代の違いとして最も適切なのは？","answer":"縄文時代には土器が使われるようになった","options":["縄文時代には土器が使われるようになった","旧石器時代には稲作が広まった","縄文時代には武士が登場した","旧石器時代には貨幣が使われた"],"ex":"縄文時代には土器が使われ、煮炊きや保存など生活の幅が広がりました。"},{"id":"SC-SOC-HIS-000220","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"三内丸山遺跡から分かる縄文時代の特色として適切なのは？","answer":"大規模な集落が形成されていた","options":["大規模な集落が形成されていた","全国を幕府が支配していた","工場制機械工業が行われていた","議会政治が行われていた"],"ex":"三内丸山遺跡からは、縄文時代に大規模な集落が形成されていたことが分かります。"},{"id":"SC-SOC-HIS-000221","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代にむらの有力者が現れた背景として最も適切なのは？","answer":"米などの蓄えに差が生まれたから","options":["米などの蓄えに差が生まれたから","参勤交代が始まったから","工業地帯ができたから","国会議員が選ばれたから"],"ex":"稲作の広がりにより収穫物の蓄えや土地・水の管理をめぐって差が生まれ、有力者が現れました。"},{"id":"SC-SOC-HIS-000222","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"前方後円墳が各地に広がったことから考えられることは？","answer":"大和政権と各地の豪族に結びつきがあった","options":["大和政権と各地の豪族に結びつきがあった","全国で同じ税率が使われていた","全国で選挙が行われていた","すべての豪族が同じ土地を治めていた"],"ex":"似た形の大規模古墳が広い地域に見られることは、大和政権と地方豪族の関係を考える手がかりになります。"},{"id":"SC-SOC-HIS-000223","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"冠位十二階を定めた目的として適切なのは？","answer":"家柄だけでなく能力や功績に応じて人材を登用するため","options":["家柄だけでなく能力や功績に応じて人材を登用するため","農民に土地を分けるため","大名を江戸に集めるため","外国との貿易を禁止するため"],"ex":"冠位十二階は、能力や功績に応じて役人の地位を示す仕組みでした。"},{"id":"SC-SOC-HIS-000224","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"東大寺の大仏造立を進めた背景として適切なのは？","answer":"仏教の力で国家の安定を願った","options":["仏教の力で国家の安定を願った","武士の反乱を鎮圧するため","海外貿易を拡大するため","議会政治を始めるため"],"ex":"聖武天皇は社会不安の中で仏教の力による国家の安定を願い、大仏造立を進めました。"},{"id":"SC-SOC-HIS-000225","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"荘園が増えたことで起こった変化として適切なのは？","answer":"朝廷が税を集めにくくなった","options":["朝廷が税を集めにくくなった","幕府が参勤交代を始めた","国会が解散した","工場労働者が増えた"],"ex":"税のかからない荘園が増えると、朝廷が直接税を得られる土地が減っていきました。"},{"id":"SC-SOC-HIS-000226","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"承久の乱後に幕府の支配が強まった地域は？","answer":"西日本","options":["西日本","北海道だけ","沖縄だけ","東北だけ"],"ex":"承久の乱後、幕府は朝廷側の所領を没収し、西日本にも地頭を置いて支配を強めました。"},{"id":"SC-SOC-HIS-000227","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉仏教が広まった理由として適切なのは？","answer":"武士や庶民にも分かりやすい教えが広まった","options":["武士や庶民にも分かりやすい教えが広まった","朝廷が仏教を全面禁止した","外国との交流が完全になくなった","武士が文字を使わなくなった"],"ex":"鎌倉時代には、念仏や題目、座禅など比較的実践しやすい教えが武士や庶民にも広がりました。"},{"id":"SC-SOC-HIS-000228","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"北山文化と東山文化の組み合わせとして正しいのは？","answer":"北山文化―金閣、東山文化―銀閣","options":["北山文化―金閣、東山文化―銀閣","北山文化―銀閣、東山文化―金閣","北山文化―東大寺、東山文化―法隆寺","北山文化―平等院、東山文化―厳島神社"],"ex":"北山文化は足利義満の金閣、東山文化は足利義政の銀閣に代表されます。"},{"id":"SC-SOC-HIS-000229","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"分国法を定めた目的として適切なのは？","answer":"戦国大名が領国内の支配を強めるため","options":["戦国大名が領国内の支配を強めるため","朝廷が全国の裁判を行うため","農民が自由に大名を選ぶため","外国との関税を決めるため"],"ex":"分国法は戦国大名が領国を統治するための独自の法でした。"},{"id":"SC-SOC-HIS-000230","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"織田信長が比叡山延暦寺や一向一揆と対立したことから分かることは？","answer":"宗教勢力も大きな政治・軍事力を持っていた","options":["宗教勢力も大きな政治・軍事力を持っていた","寺院はすべて幕府の役所だった","宗教勢力は武器を持たなかった","全国の寺院は外国政府が支配していた"],"ex":"戦国期には寺社勢力や一向一揆なども大きな政治・軍事力を持っていました。"},{"id":"SC-SOC-HIS-000231","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"江戸幕府がキリスト教を厳しく禁止した理由として適切なのは？","answer":"幕府支配を揺るがす可能性を警戒したから","options":["幕府支配を揺るがす可能性を警戒したから","米の収穫量を増やすため","大名の数を増やすため","鎖国を解除するため"],"ex":"幕府はキリスト教徒の結びつきや海外勢力との関係が支配を不安定にすることを警戒しました。"},{"id":"SC-SOC-HIS-000232","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"享保の改革で徳川吉宗が行った政策として適切なのは？","answer":"上米の制","options":["上米の制","廃藩置県","地租改正","版籍奉還"],"ex":"徳川吉宗は大名に米を納めさせる上米の制などで幕府財政の立て直しを図りました。"},{"id":"SC-SOC-HIS-000233","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"外国船打払令から薪水給与令へ政策が変化した背景として適切なのは？","answer":"外国船への対応を現実的に改める必要が生じた","options":["外国船への対応を現実的に改める必要が生じた","鎖国が完全に終わった","幕府が外国を植民地にした","参勤交代が廃止された"],"ex":"外国船の接近が増える中、幕府は一律の打払いから水や燃料を与える方針へ修正しました。"},{"id":"SC-SOC-HIS-000234","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"浮世絵が広く普及した背景として適切なのは？","answer":"木版印刷によって多く刷ることができた","options":["木版印刷によって多く刷ることができた","すべて手描きで一点物だった","幕府が外国から輸入した","武士しか購入できなかった"],"ex":"浮世絵は木版技術によって大量に刷ることができ、町人文化の中で広く普及しました。"},{"id":"SC-SOC-HIS-000235","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"薩長同盟が成立した意味として適切なのは？","answer":"幕府に対抗する有力藩の連携が強まった","options":["幕府に対抗する有力藩の連携が強まった","鎖国体制が完成した","大名の参勤交代が強化された","国会が開設された"],"ex":"薩摩藩と長州藩の提携により、倒幕へ向かう動きが強まりました。"},{"id":"SC-SOC-HIS-000236","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"自由民権運動が求めたものとして適切なのは？","answer":"国会の開設と憲法制定","options":["国会の開設と憲法制定","鎖国の復活","身分制度の強化","参勤交代の復活"],"ex":"自由民権運動では国会開設や憲法制定、国民の政治参加が求められました。"},{"id":"SC-SOC-HIS-000237","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"日清戦争と日露戦争の順序として正しいのは？","answer":"日清戦争→日露戦争","options":["日清戦争→日露戦争","日露戦争→日清戦争","同じ年に始まった","どちらも第二次世界大戦後"],"ex":"日清戦争は1894年、日露戦争は1904年に始まりました。"},{"id":"SC-SOC-HIS-000238","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"第一次世界大戦中、日本の工業生産が伸びた主な理由は？","answer":"欧州からの輸入が減り、日本製品への需要が増えた","options":["欧州からの輸入が減り、日本製品への需要が増えた","日本が鎖国した","農業が禁止された","人口が半減した"],"ex":"欧州諸国が戦争に集中したためアジア市場などで日本製品への需要が増え、大戦景気が起こりました。"},{"id":"SC-SOC-HIS-000239","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"満州事変後、日本と国際社会の関係はどう変化した？","answer":"国際連盟脱退へ進み国際的孤立が深まった","options":["国際連盟脱退へ進み国際的孤立が深まった","国際連合の常任理事国になった","日英同盟が復活した","EUに加盟した"],"ex":"満州事変をめぐる対立から、日本は国際連盟脱退へ進み国際的孤立を深めました。"},{"id":"SC-SOC-HIS-000240","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"国家総動員法の目的として適切なのは？","answer":"戦争遂行のため人や物資を国家が統制する","options":["戦争遂行のため人や物資を国家が統制する","普通選挙を実現する","地方自治を強化する","農地改革を進める"],"ex":"国家総動員法により、戦争遂行のため労働力や物資などへの国家統制が強まりました。"},{"id":"SC-SOC-HIS-000241","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"戦後の農地改革の目的として適切なのは？","answer":"地主の土地を小作農に売り渡し、自作農を増やす","options":["地主の土地を小作農に売り渡し、自作農を増やす","大名に土地を与える","荘園制度を復活させる","工場を国有化する"],"ex":"農地改革では地主の農地を買い上げ小作農へ売り渡し、自作農を増やしました。"},{"id":"SC-SOC-HIS-000242","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1950年代後半から1970年代初めにかけて日本経済が急成長した時期を何という？","answer":"高度経済成長","options":["高度経済成長","バブル経済","戦後恐慌","大戦景気"],"ex":"日本では1950年代後半から1970年代初めにかけて高度経済成長が続きました。"},{"id":"SC-SOC-GEO-000243","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"気候","q":"雨温図を見るとき、気候を判断するために特に重要な情報の組み合わせは？","answer":"月別の気温と降水量","options":["月別の気温と降水量","人口と面積","輸出額と輸入額","緯度と経度だけ"],"ex":"雨温図は月ごとの平均気温と降水量から気候の特徴を読み取ります。"},{"id":"SC-SOC-GEO-000244","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"人口","q":"人口密度を求める式として正しいのは？","answer":"人口÷面積","options":["人口÷面積","面積÷人口","人口×面積","人口＋面積"],"ex":"人口密度は、ある地域の人口を面積で割って求めます。"},{"id":"SC-SOC-GEO-000245","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"農業","q":"都市近郊で、鮮度が重要な野菜や花などを生産する農業を何という？","answer":"近郊農業","options":["近郊農業","促成栽培","抑制栽培","焼畑農業"],"ex":"大都市に近い立地を生かして新鮮な野菜や花を供給する農業を近郊農業といいます。"},{"id":"SC-SOC-GEO-000246","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"農業","q":"温暖な気候を利用し、出荷時期を早める栽培方法を何という？","answer":"促成栽培","options":["促成栽培","抑制栽培","二期作","輪作"],"ex":"ビニールハウスなどを利用し、通常より早い時期に出荷する栽培を促成栽培といいます。"},{"id":"SC-SOC-GEO-000247","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"工業","q":"自動車工業が特に盛んな中京工業地帯の中心県は？","answer":"愛知県","options":["愛知県","北海道","高知県","沖縄県"],"ex":"中京工業地帯は愛知県を中心に自動車などの機械工業が盛んです。"},{"id":"SC-SOC-GEO-000248","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"貿易","q":"日本が多く輸入する資源の一つとして適切なのは？","answer":"原油","options":["原油","米だけ","自動車だけ","精密機械だけ"],"ex":"日本はエネルギー資源の多くを海外に依存しており、原油を多く輸入しています。"},{"id":"SC-SOC-GEO-000249","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"地形","q":"扇状地で果樹栽培が行われやすい理由として適切なのは？","answer":"水はけがよい土地が多いから","options":["水はけがよい土地が多いから","一年中水田に水がたまるから","海面より必ず低いから","火山灰だけでできているから"],"ex":"扇状地は水はけがよい土地が多く、果樹栽培に利用されることがあります。"},{"id":"SC-SOC-GEO-000250","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"地形","q":"三角州が形成されやすい場所は？","answer":"川の河口付近","options":["川の河口付近","山頂付近","海溝の底","砂漠の中央"],"ex":"川が運んだ土砂が河口付近に堆積して三角州が形成されます。"},{"id":"SC-SOC-GEO-000251","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"気候","q":"偏西風が吹く方向としておおむね正しいのは？","answer":"西から東","options":["西から東","東から西","北から南だけ","南から北だけ"],"ex":"中緯度地域では偏西風が西から東へ吹く傾向があります。"},{"id":"SC-SOC-GEO-000252","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"人口","q":"人口ピラミッドで若年層が非常に多い国に起こりやすい課題は？","answer":"教育や雇用の受け皿を増やす必要がある","options":["教育や雇用の受け皿を増やす必要がある","高齢者人口だけが急増する","出生数が0になる","人口密度が必ず低下する"],"ex":"若年人口が多い国では学校や将来の雇用機会を確保することが重要な課題になります。"},{"id":"SC-SOC-CIV-000253","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"国会","q":"国会が『国権の最高機関』とされる理由として最も適切なのは？","answer":"国民の代表者で構成され国政の重要事項を審議するから","options":["国民の代表者で構成され国政の重要事項を審議するから","裁判所を直接指揮するから","地方自治体を廃止できるから","内閣より常に人数が多いから"],"ex":"国会は国民の代表者で構成され、法律制定など国政の重要事項を審議します。"},{"id":"SC-SOC-CIV-000254","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"内閣","q":"議院内閣制の説明として適切なのは？","answer":"内閣が国会の信任に基づいて成立する仕組み","options":["内閣が国会の信任に基づいて成立する仕組み","裁判官を国民が直接選ぶ仕組み","地方自治体が国会を解散する仕組み","天皇が法律を自由に制定する仕組み"],"ex":"日本では内閣が国会、特に衆議院の信任に基づいて成立する議院内閣制が採られています。"},{"id":"SC-SOC-CIV-000255","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"地方自治","q":"地方自治で住民が首長や議員を直接選ぶことが重視される理由は？","answer":"地域住民の意思を行政に反映しやすくするため","options":["地域住民の意思を行政に反映しやすくするため","国会をなくすため","裁判所の判決を変えるため","外交政策を自治体が決めるため"],"ex":"地方自治では住民が首長や議員を直接選び、地域の意思を政治へ反映します。"},{"id":"SC-SOC-CIV-000256","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"公共の福祉という考え方が必要になる場面として適切なのは？","answer":"人権同士が衝突するときに調整する","options":["人権同士が衝突するときに調整する","人権をすべて停止する","税金をなくす","選挙を行わない"],"ex":"人権は互いに尊重される必要があり、人権同士が衝突する場合には公共の福祉の観点から調整されます。"},{"id":"SC-SOC-CIV-000257","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"円高になると、一般に日本の輸入品の価格はどうなりやすい？","answer":"安くなりやすい","options":["安くなりやすい","高くなりやすい","必ず2倍になる","変化しない"],"ex":"円高では同じ円でより多くの外国通貨と交換できるため、輸入品は安くなりやすくなります。"},{"id":"SC-SOC-CIV-000258","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"中央銀行である日本銀行の役割として適切なのは？","answer":"金融政策を行い物価や景気の安定を図る","options":["金融政策を行い物価や景気の安定を図る","国会議員を選ぶ","裁判を行う","地方税を集める"],"ex":"日本銀行は金融政策などを通じて物価や景気の安定を図ります。"},{"id":"SC-SOC-CIV-000259","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国際連合安全保障理事会の常任理事国は何か国？","answer":"5か国","options":["5か国","3か国","7か国","10か国"],"ex":"安全保障理事会の常任理事国はアメリカ・イギリス・フランス・ロシア・中国の5か国です。"},{"id":"SC-SOC-CIV-000260","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"持続可能な開発目標を表す略称は？","answer":"SDGs","options":["SDGs","GDP","NPO","ODA"],"ex":"SDGsはSustainable Development Goalsの略で、持続可能な開発目標を指します。"},{"id":"SC-SOC-CIV-000261","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"社会保障制度の目的として最も適切なのは？","answer":"生活上のリスクに社会全体で備える","options":["生活上のリスクに社会全体で備える","企業の利益だけを増やす","選挙制度を管理する","外交交渉を行う"],"ex":"社会保障は病気・失業・高齢など生活上のリスクに社会全体で備える仕組みです。"},{"id":"SC-SOC-CIV-000262","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"裁判所","q":"裁判員制度の目的として適切なのは？","answer":"国民の感覚を刑事裁判に反映する","options":["国民の感覚を刑事裁判に反映する","国会議員を裁判官にする","民事裁判をすべて廃止する","最高裁判所をなくす"],"ex":"裁判員制度では国民が一定の重大な刑事裁判に参加し、判断に国民の感覚を反映します。"},{"id":"SC-SOC-HIS-000263","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳時代に朝鮮半島から伝わった技術として適切なのは？","answer":"鉄器や須恵器の製作技術","options":["鉄器や須恵器の製作技術","蒸気機関","活版印刷","電信"],"ex":"古墳時代には朝鮮半島などから渡来人が来て、鉄器や須恵器などの技術を伝えました。"},{"id":"SC-SOC-HIS-000264","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町時代の産業発達を示すものとして適切なのは？","answer":"定期市が開かれ、座が発達した","options":["定期市が開かれ、座が発達した","全国で工場制機械工業が始まった","鉄道網が完成した","株式会社が広がった"],"ex":"室町時代には定期市が各地で開かれ、商工業者の同業組合である座も発達しました。"},{"id":"SC-SOC-HIS-000265","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"株仲間を認めて商業を利用した政治を進めた人物は？","answer":"田沼意次","options":["田沼意次","松平定信","水野忠邦","徳川慶喜"],"ex":"田沼意次は株仲間を奨励して営業税を得るなど、商業を利用した政策を進めました。"},{"id":"SC-SOC-GEO-000266","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"工業","q":"工業製品の輸送で高速道路沿いに工場が増えた理由として適切なのは？","answer":"トラック輸送に便利だから","options":["トラック輸送に便利だから","水田を広げやすいから","漁業に便利だから","雪が多いから"],"ex":"高速道路網の発達により、内陸部でもトラックによる原料や製品の輸送がしやすくなりました。"},{"id":"SC-SOC-CIV-000267","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"少子高齢化が社会保障に与える影響として適切なのは？","answer":"支える現役世代の負担が課題になりやすい","options":["支える現役世代の負担が課題になりやすい","年金制度が不要になる","医療費が必ず減る","税金がなくなる"],"ex":"少子高齢化では社会保障を支える現役世代が相対的に少なくなり、負担と給付のバランスが課題になります。"},{"id":"SC-SOC-CIV-000268","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"地方自治","q":"住民が条例の制定・改廃を求める制度を何という？","answer":"直接請求権","options":["直接請求権","違憲審査権","請願権","参政権"],"ex":"地方自治では住民が条例の制定・改廃などを求める直接請求の制度があります。"},{"id":"SC-SOC-HIS-000269","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"次のうち、旧石器時代の特徴として最も適切なのは？","answer":"打製石器を使い狩りや採集を行った","options":["打製石器を使い狩りや採集を行った","水田稲作を行った","前方後円墳を築いた","律令を定めた"],"ex":"旧石器時代には打製石器を用い、狩りや採集を中心に生活していました。"},{"id":"SC-SOC-HIS-000270","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代から縄文時代への変化として適切なのは？","answer":"土器の使用が始まった","options":["土器の使用が始まった","貨幣経済が始まった","武士が登場した","幕府が成立した"],"ex":"縄文時代には土器が使われるようになり、食物の煮炊きや保存がしやすくなりました。"},{"id":"SC-SOC-HIS-000271","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の人々の食生活を知る資料として特に役立つものは？","answer":"貝塚","options":["貝塚","古墳","木簡","御触書"],"ex":"貝塚からは貝殻・魚骨・獣骨などが見つかり、当時の食生活を知ることができます。"},{"id":"SC-SOC-HIS-000272","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の竪穴住居から考えられる生活の特色は？","answer":"一定の場所に定住する生活が広がった","options":["一定の場所に定住する生活が広がった","全国を移動し続けた","武士が城に住んだ","都市に集合住宅が建った"],"ex":"竪穴住居を中心とする集落の存在から、縄文時代には定住生活が広がっていたことが分かります。"},{"id":"SC-SOC-HIS-000273","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代の社会で身分差が生まれた背景として適切なのは？","answer":"米や土地の所有に差が生まれた","options":["米や土地の所有に差が生まれた","参勤交代が行われた","工業化が進んだ","国会が開設された"],"ex":"稲作の普及で収穫物や土地・水の管理をめぐる差が生まれ、身分差につながりました。"},{"id":"SC-SOC-HIS-000274","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"次の出来事を古い順に並べたものは？","answer":"縄文土器の使用→稲作の広がり→古墳の築造","options":["縄文土器の使用→稲作の広がり→古墳の築造","古墳の築造→稲作の広がり→縄文土器の使用","稲作の広がり→縄文土器の使用→古墳の築造","縄文土器の使用→古墳の築造→稲作の広がり"],"ex":"縄文時代の土器使用、弥生時代の稲作普及、古墳時代の古墳築造の順です。"},{"id":"SC-SOC-HIS-000275","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"渡来人が日本社会に与えた影響として適切なのは？","answer":"文字や金属加工などの技術を伝えた","options":["文字や金属加工などの技術を伝えた","参勤交代を始めた","国会制度を導入した","蒸気機関を発明した"],"ex":"渡来人は漢字や金属加工、土木などさまざまな技術や文化を伝えました。"},{"id":"SC-SOC-HIS-000276","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"大和政権の勢力が広がったことを示す資料として最も適切なのは？","answer":"各地に前方後円墳が分布していること","options":["各地に前方後円墳が分布していること","全国に国会議事堂があること","各地に鉄道駅があること","全国に同じ工業地帯があること"],"ex":"広い地域に前方後円墳が見られることは、大和政権と地方豪族とのつながりを示す手がかりです。"},{"id":"SC-SOC-HIS-000277","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"楽市・楽座によって期待された効果として適切なのは？","answer":"商人の活動を活発にする","options":["商人の活動を活発にする","農民を武士にする","海外貿易を禁止する","年貢をなくす"],"ex":"市場の特権や税をなくすことで商人が自由に活動しやすくなり、商業の活性化が期待されました。"},{"id":"SC-SOC-HIS-000278","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国時代の下剋上を表す具体例として最も適切なのは？","answer":"家臣が主君を倒して領国を支配する","options":["家臣が主君を倒して領国を支配する","天皇が摂政を任命する","農民が年貢を納める","大名が江戸へ参勤する"],"ex":"下剋上は、下の身分の者が実力で上の者を倒して地位を得る動きを指します。"},{"id":"SC-SOC-HIS-000279","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"田沼意次の政治と松平定信の政治の違いとして適切なのは？","answer":"田沼は商業重視、松平は倹約重視","options":["田沼は商業重視、松平は倹約重視","田沼は鎖国廃止、松平は開国","田沼は地租改正、松平は徴兵令","田沼は廃藩置県、松平は版籍奉還"],"ex":"田沼意次は商業を活用して収入増を図り、松平定信は倹約や農村立て直しを重視しました。"},{"id":"SC-SOC-HIS-000280","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"寛政の改革を行った人物は？","answer":"松平定信","options":["松平定信","田沼意次","水野忠邦","徳川慶喜"],"ex":"寛政の改革は老中松平定信が行いました。"},{"id":"SC-SOC-HIS-000281","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"天保の改革を行った人物は？","answer":"水野忠邦","options":["水野忠邦","松平定信","田沼意次","新井白石"],"ex":"天保の改革は老中水野忠邦が行いました。"},{"id":"SC-SOC-HIS-000282","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"異国船打払令の後に薪水給与令へと方針を改めた理由として適切なのは？","answer":"外国船との衝突を避ける必要が高まった","options":["外国船との衝突を避ける必要が高まった","幕府が海外進出を始めた","参勤交代が強化された","農民一揆がなくなった"],"ex":"外国船の接近が増え、厳しい打払いだけでは対応が難しくなったため政策が改められました。"},{"id":"SC-SOC-HIS-000283","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"元禄文化と化政文化の違いとして適切なのは？","answer":"元禄は上方中心、化政は江戸中心","options":["元禄は上方中心、化政は江戸中心","元禄は江戸中心、化政は上方中心","どちらも奈良中心","どちらも京都の公家だけの文化"],"ex":"元禄文化は上方を中心に、化政文化は江戸を中心に発展しました。"},{"id":"SC-SOC-HIS-000284","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"『富嶽三十六景』で知られる浮世絵師は？","answer":"葛飾北斎","options":["葛飾北斎","歌川広重","近松門左衛門","井原西鶴"],"ex":"葛飾北斎は『富嶽三十六景』で知られます。"},{"id":"SC-SOC-HIS-000285","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"米騒動が起こった背景として適切なのは？","answer":"米価が急上昇した","options":["米価が急上昇した","米が無税になった","米の輸入が禁止された","農地改革が行われた"],"ex":"1918年、米価の急騰に対する不満から米騒動が全国へ広がりました。"},{"id":"SC-SOC-HIS-000286","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"1925年の普通選挙法で選挙権を得たのは？","answer":"25歳以上の男子","options":["25歳以上の男子","20歳以上の男女","18歳以上の男女","納税額の多い男子だけ"],"ex":"普通選挙法により、納税額による制限がなくなり25歳以上の男子に選挙権が広がりました。"},{"id":"SC-SOC-HIS-000287","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"大正デモクラシーを象徴する動きとして適切なのは？","answer":"政党政治や普通選挙を求める動き","options":["政党政治や普通選挙を求める動き","幕藩体制の復活","鎖国の強化","公地公民の実施"],"ex":"大正期には政党政治や普通選挙など、民衆の政治参加を求める動きが広がりました。"},{"id":"SC-SOC-HIS-000288","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"1931年の満州事変の後、日本が進んだ方向として適切なのは？","answer":"中国大陸への軍事的進出を拡大した","options":["中国大陸への軍事的進出を拡大した","鎖国政策へ戻った","国際連合へ加盟した","日英同盟を再締結した"],"ex":"満州事変以後、日本は中国大陸への軍事的進出を強めました。"},{"id":"SC-SOC-HIS-000289","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"太平洋戦争中の国民生活について適切なのは？","answer":"物資の配給や統制が強まった","options":["物資の配給や統制が強まった","自由貿易が急拡大した","参勤交代が復活した","普通選挙が初めて始まった"],"ex":"戦時下では物資不足が深まり、配給制や国家による統制が強まりました。"},{"id":"SC-SOC-HIS-000290","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"開国後、日本から大量に金が流出した理由として適切なのは？","answer":"国内外で金銀の交換比率が異なっていた","options":["国内外で金銀の交換比率が異なっていた","金の使用が法律で禁止された","幕府が金を外国へ無償で配った","日本に銀が存在しなかった"],"ex":"日本と海外で金と銀の交換比率が異なっていたため、開国後に金が海外へ流出しました。"},{"id":"SC-SOC-HIS-000291","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"幕末の尊王攘夷運動で使われた『尊王』の意味は？","answer":"天皇を尊ぶこと","options":["天皇を尊ぶこと","将軍を外国へ派遣すること","外国文化を積極的に取り入れること","武士の身分を廃止すること"],"ex":"尊王は天皇を尊ぶ考えを指します。"},{"id":"SC-SOC-HIS-000292","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"戦後の財閥解体の目的として適切なのは？","answer":"経済力の集中を弱めるため","options":["経済力の集中を弱めるため","農民から土地を取り上げるため","大名制度を復活させるため","鎖国を行うため"],"ex":"財閥解体は巨大財閥への経済力集中を弱め、経済の民主化を進める政策でした。"},{"id":"SC-SOC-HIS-000293","subject":"社会","grade":"中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"日本国憲法施行、サンフランシスコ平和条約調印、国際連合加盟を古い順に並べたものは？","answer":"日本国憲法施行→サンフランシスコ平和条約→国際連合加盟","options":["日本国憲法施行→サンフランシスコ平和条約→国際連合加盟","国際連合加盟→日本国憲法施行→サンフランシスコ平和条約","サンフランシスコ平和条約→日本国憲法施行→国際連合加盟","日本国憲法施行→国際連合加盟→サンフランシスコ平和条約"],"ex":"日本国憲法施行は1947年、サンフランシスコ平和条約調印は1951年、国際連合加盟は1956年です。"},{"id":"SC-SOC-GEO-000294","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"人口","q":"過疎化が進む地域で起こりやすい問題は？","answer":"公共交通や医療サービスの維持が難しくなる","options":["公共交通や医療サービスの維持が難しくなる","人口密度が急上昇する","住宅不足が深刻化する","通勤ラッシュが激しくなる"],"ex":"人口減少が進む地域では利用者が減り、交通・医療・商店などのサービス維持が課題になります。"},{"id":"SC-SOC-GEO-000295","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"農業","q":"高冷地で夏でも涼しい気候を利用し、出荷時期を遅らせる栽培を何という？","answer":"抑制栽培","options":["抑制栽培","促成栽培","近郊農業","二毛作"],"ex":"高冷地などの涼しい気候を利用して出荷時期を遅らせる方法を抑制栽培といいます。"},{"id":"SC-SOC-GEO-000296","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"貿易","q":"輸出額より輸入額が大きい状態を何という？","answer":"貿易赤字","options":["貿易赤字","貿易黒字","円高","デフレーション"],"ex":"輸入額が輸出額を上回る状態を貿易赤字といいます。"},{"id":"SC-SOC-GEO-000297","subject":"社会","grade":"中1","unit":"地理・世界","field_name":"地理","topic_name":"人口","q":"人口ピラミッドで高齢層の割合が大きい国に起こりやすい課題は？","answer":"社会保障費の増加","options":["社会保障費の増加","学校不足の急増","出生率の急上昇","若年人口の急増"],"ex":"高齢化が進むと年金・医療・介護など社会保障にかかる費用が増えやすくなります。"},{"id":"SC-SOC-GEO-000298","subject":"社会","grade":"中1","unit":"地理・日本","field_name":"地理","topic_name":"工業","q":"工業の海外移転が進む理由として適切なのは？","answer":"生産コストや市場への近さを重視するため","options":["生産コストや市場への近さを重視するため","国内の道路がすべてなくなったため","日本で電気が使えないため","国内の人口が0になったため"],"ex":"企業は人件費などの生産コストや販売市場への近さを考えて海外に工場を設けることがあります。"},{"id":"SC-SOC-CIV-000299","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"国会","q":"法律案が成立するために必要な流れとして適切なのは？","answer":"原則として衆議院と参議院の両方で可決される","options":["原則として衆議院と参議院の両方で可決される","内閣だけで決定する","最高裁判所だけで決定する","都道府県知事が決定する"],"ex":"法律案は原則として両議院で可決されて成立します。"},{"id":"SC-SOC-CIV-000300","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"内閣","q":"衆議院で内閣不信任決議が可決された場合、内閣が取る対応として適切なのは？","answer":"衆議院を解散するか総辞職する","options":["衆議院を解散するか総辞職する","参議院だけを解散する","最高裁判所を解散する","地方議会を解散する"],"ex":"内閣不信任決議が可決された場合、内閣は10日以内に衆議院を解散しない限り総辞職します。"},{"id":"SC-SOC-CIV-000301","subject":"社会","grade":"中3","unit":"公民・権利","field_name":"公民","topic_name":"基本的人権","q":"表現の自由が保障される意義として適切なのは？","answer":"多様な意見を社会で共有し民主政治を支える","options":["多様な意見を社会で共有し民主政治を支える","政府への批判を禁止する","選挙をなくす","裁判所を廃止する"],"ex":"表現の自由は多様な意見や情報の交換を可能にし、民主政治の基盤になります。"},{"id":"SC-SOC-CIV-000302","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"物価が継続的に上昇する状態を何という？","answer":"インフレーション","options":["インフレーション","デフレーション","円高","貿易黒字"],"ex":"物価が継続的に上昇する状態をインフレーションといいます。"},{"id":"SC-SOC-CIV-000303","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"物価が継続的に下落する状態を何という？","answer":"デフレーション","options":["デフレーション","インフレーション","円安","景気拡大"],"ex":"物価が継続的に下落する状態をデフレーションといいます。"},{"id":"SC-SOC-CIV-000304","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"政府開発援助を表す略称は？","answer":"ODA","options":["ODA","NGO","GDP","WHO"],"ex":"ODAはOfficial Development Assistanceの略で、政府による開発途上国への援助を指します。"},{"id":"SC-SOC-CIV-000305","subject":"社会","grade":"中3","unit":"公民・国際","field_name":"公民","topic_name":"国際社会","q":"国境を越えて活動する非政府組織を表す略称は？","answer":"NGO","options":["NGO","ODA","GDP","WTO"],"ex":"NGOはNon-Governmental Organizationの略で、政府とは独立して国際協力などを行う組織です。"},{"id":"SC-SOC-CIV-000306","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"地方自治","q":"地方公共団体が独自に定めるルールを何という？","answer":"条例","options":["条例","法律","政令","条約"],"ex":"条例は地方公共団体がその地域の事務について制定するルールです。"},{"id":"SC-SOC-CIV-000307","subject":"社会","grade":"中3","unit":"公民・経済","field_name":"公民","topic_name":"経済","q":"社会保険に含まれるものとして適切なのは？","answer":"公的年金","options":["公的年金","選挙制度","裁判員制度","地方交付税"],"ex":"公的年金は社会保険の一つです。"},{"id":"SC-SOC-CIV-000308","subject":"社会","grade":"中3","unit":"公民・政治","field_name":"公民","topic_name":"裁判所","q":"最高裁判所が『憲法の番人』と呼ばれる理由は？","answer":"法令が憲法に違反しないか最終的に判断するから","options":["法令が憲法に違反しないか最終的に判断するから","国会議員を選ぶから","外交を担当するから","地方税を決めるから"],"ex":"最高裁判所は違憲審査について最終的な判断を行うため『憲法の番人』と呼ばれます。"},{"id":"SC-SOC-HIS-000309","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"日本の旧石器時代の研究が大きく進むきっかけとなった遺跡は？","answer":"岩宿遺跡","options":["岩宿遺跡","三内丸山遺跡","吉野ヶ里遺跡","登呂遺跡"],"ex":"岩宿遺跡の発見により、日本にも旧石器時代が存在したことが明らかになりました。"},{"id":"SC-SOC-HIS-000310","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代の人々が大型動物を狩るために使ったと考えられる道具は？","answer":"石や木で作ったやり","options":["石や木で作ったやり","鉄砲","火縄銃","青銅の剣"],"ex":"旧石器時代には打製石器を先端につけたやりなどが狩りに使われたと考えられています。"},{"id":"SC-SOC-HIS-000311","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"旧石器","q":"旧石器時代に見られないものはどれ？","answer":"縄文土器","options":["縄文土器","打製石器","狩り","採集"],"ex":"縄文土器は縄文時代に使われるようになったもので、旧石器時代にはまだ見られません。"},{"id":"SC-SOC-HIS-000312","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代の人々が海や川の恵みを利用していたことを示す資料として適切なのは？","answer":"貝塚から魚の骨や貝殻が見つかること","options":["貝塚から魚の骨や貝殻が見つかること","古墳から埴輪が見つかること","寺院から瓦が見つかること","城下町から貨幣が見つかること"],"ex":"貝塚から魚の骨や貝殻が見つかることは、漁や採集が行われていた証拠になります。"},{"id":"SC-SOC-HIS-000313","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代に土器が使われたことで可能になったこととして適切なのは？","answer":"食べ物を煮炊きすること","options":["食べ物を煮炊きすること","鉄を精錬すること","印刷すること","貨幣を鋳造すること"],"ex":"土器の使用により煮炊きや保存がしやすくなりました。"},{"id":"SC-SOC-HIS-000314","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"吉野ヶ里遺跡などの環濠集落から考えられることは？","answer":"集落を守るための防御が必要だった","options":["集落を守るための防御が必要だった","武士が城を築いていた","全国で同じ法律が使われていた","外国との戦争だけが続いていた"],"ex":"周囲に濠をめぐらせた集落から、むら同士の争いなどに備えていたことが考えられます。"},{"id":"SC-SOC-HIS-000315","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","q":"古墳の大きさや副葬品の違いから読み取れることとして適切なのは？","answer":"有力者の間にも力の差があった","options":["有力者の間にも力の差があった","すべての人が同じ身分だった","農民が全国を統治していた","税制度が完全に統一されていた"],"ex":"古墳の規模や副葬品の違いは、埋葬された有力者の権力差を考える手がかりになります。"},{"id":"SC-SOC-HIS-000316","subject":"社会","grade":"中1","unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"遣隋使・遣唐使を派遣した主な目的は？","answer":"中国の進んだ制度や文化を学ぶため","options":["中国の進んだ制度や文化を学ぶため","外国との交流を完全に断つため","大名を統制するため","武士の裁判基準を定めるため"],"ex":"日本は隋や唐の制度・文化を取り入れるため遣隋使や遣唐使を派遣しました。"},{"id":"SC-SOC-HIS-000317","subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","q":"戦国大名が分国法を定めたことから分かることは？","answer":"領国内で独自に支配を進めていた","options":["領国内で独自に支配を進めていた","全国を朝廷が直接支配していた","すべての大名が同じ法律を使っていた","幕府が完全に地方統治を統一していた"],"ex":"分国法は戦国大名が自らの領国を支配するために定めた独自の法です。"},{"id":"SC-SOC-HIS-000318","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"田沼意次の政治で株仲間が重視された理由として適切なのは？","answer":"商業を活用して幕府収入を増やすため","options":["商業を活用して幕府収入を増やすため","農民から武器を取り上げるため","大名を江戸に住まわせるため","外国船を打ち払うため"],"ex":"田沼意次は株仲間を公認し、営業税などを得て幕府収入を増やそうとしました。"},{"id":"SC-SOC-HIS-000319","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"大塩平八郎の乱が起きた背景として適切なのは？","answer":"飢饉や米価高騰で人々の生活が苦しくなった","options":["飢饉や米価高騰で人々の生活が苦しくなった","日露戦争で敗北した","普通選挙法が成立した","鎖国が始まった"],"ex":"天保の飢饉などで人々の生活が苦しくなる中、大塩平八郎が大阪で反乱を起こしました。"},{"id":"SC-SOC-HIS-000320","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","q":"異国船の接近が増えた江戸後期、幕府が海防を意識するようになった理由は？","answer":"欧米諸国が東アジアへ進出していたから","options":["欧米諸国が東アジアへ進出していたから","国内の稲作がなくなったから","武士が全員商人になったから","朝廷が北海道へ移ったから"],"ex":"欧米諸国がアジアへ進出する中、日本近海にも外国船が現れるようになりました。"},{"id":"SC-SOC-HIS-000321","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"元禄文化で人形浄瑠璃の脚本家として活躍した人物は？","answer":"近松門左衛門","options":["近松門左衛門","松尾芭蕉","葛飾北斎","本居宣長"],"ex":"近松門左衛門は人形浄瑠璃や歌舞伎の脚本で活躍しました。"},{"id":"SC-SOC-HIS-000322","subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"江戸時代に庶民の教育を支えた施設は？","answer":"寺子屋","options":["寺子屋","国分寺","藩校だけ","大学寮"],"ex":"寺子屋では町人や農民の子どもが読み書きやそろばんなどを学びました。"}];

function buildWordOptions(w,i){
  const same=WORDS.filter(x=>x.id!==w.id&&x.pos===w.pos).map(x=>x.meaning);
  const rest=WORDS.filter(x=>x.id!==w.id).map(x=>x.meaning);
  const pool=[...same,...rest].filter((v,j,a)=>a.indexOf(v)===j&&v!==w.meaning);
  const picks=[];
  for(let k=0;k<pool.length&&picks.length<3;k++){const v=pool[(i*3+k)%pool.length];if(!picks.includes(v))picks.push(v);}
  return [w.meaning,...picks];
}

eld_name":"地学","topic_name":"岩石","q":"マグマが冷えて固まってできる岩石を何という？","answer":"火成岩","options":["火成岩","堆積岩","変成岩","石灰岩"],"ex":"マグマが冷えて固まってできた岩石を火成岩といいます。石灰岩は堆積岩の一種です。"},{"id":"SC-SCI-BIO-000011","subject":"理科","grade":"中1","unit":"生物","field_name":"生物","topic_name":"植物・生物","q":"植物の葉にあり、気体の出入りに関わる小さな穴は？","answer":"気孔","options":["気孔","葉脈","根毛","子房"],"ex":"葉の表面にある気孔は、二酸化炭素や酸素、水蒸気などの出入りに関わります。"},{"id":"SC-SCI-BIO-000012","subject":"理科","grade":"中1","unit":"生物","field_name":"生物","topic_name":"植物・生物","q":"根の先端近くにあり、水や無機養分を吸収する部分は？","answer":"根毛","options":["根毛","気孔","花粉","胚珠"],"ex":"根毛は根の表面積を広げ、水や無機養分を吸収しやすくします。"},{"id":"SC-SCI-BIO-000013","subject":"理科","grade":"中1","unit":"生物","field_name":"生物","topic_name":"植物・生物","q":"植物が体内の水を水蒸気として放出するはたらきは？","answer":"蒸散","options":["蒸散","光合成","受粉","発芽"],"ex":"植物が主に葉の気孔から水蒸気を放出するはたらきを蒸散といいます。"},{"id":"SC-SCI-BIO-000014","subject":"理科","grade":"中1","unit":"生物","field_name":"生物","topic_name":"植物・生物","q":"細胞の中で遺伝情報を含む構造は？","answer":"核","options":["核","細胞膜","液胞","葉緑体"],"ex":"核には遺伝に関わる情報が含まれています。"},{"id":"SC-SCI-BIO-000015","subject":"理科","grade":"中1","unit":"生物","field_name":"生物","topic_name":"植物・生物","q":"光合成で植物が取り入れる気体は？","answer":"二酸化炭素","options":["二酸化炭素","酸素","水素","窒素"],"ex":"光合成では二酸化炭素と水を材料にして有機物をつくります。"},{"id":"SC-SCI-BIO-000016","subject":"理科","grade":"中1","unit":"生物","field_name":"生物","topic_name":"植物・生物","q":"光合成で植物が放出する気体は？","answer":"酸素","options":["酸素","二酸化炭素","窒素","水素"],"ex":"光合成では酸素が生じ、外へ放出されます。"},{"id":"SC-SCI-BIO-000017","subject":"理科","grade":"中1","unit":"生物","field_name":"生物","topic_name":"植物・生物","q":"顕微鏡で観察するとき、最初は一般にどの倍率から始める？","answer":"低い倍率","options":["低い倍率","最も高い倍率","どちらでも同じ","倍率は使わない"],"ex":"最初は低い倍率で広い範囲を見て、観察したいものを探します。"},{"id":"SC-SCI-CHE-000018","subject":"理科","grade":"中2","unit":"化学","field_name":"化学","topic_name":"化学変化","q":"物質が酸素と結びつく化学変化を何という？","answer":"酸化","options":["酸化","還元","中和","蒸発"],"ex":"物質が酸素と結びつく化学変化を酸化といいます。"},{"id":"SC-SCI-CHE-000019","subject":"理科","grade":"中2","unit":"化学","field_name":"化学","topic_n エネルギー","q":"物体がもつ、運動によるエネルギーは？","answer":"運動エネルギー","options":["運動エネルギー","位置エネルギー","化学エネルギー","電気抵抗"],"ex":"運動している物体がもつエネルギーを運動エネルギーといいます。"},{"id":"SC-SCI-PHY-000029","subject":"理科","grade":"中3","unit":"物理","field_name":"物理","topic_name":"運動とエネルギー","q":"高い位置にある物体がもつエネルギーは？","answer":"位置エネルギー","options":["位置エネルギー","運動エネルギー","熱量","電流"],"ex":"高さによって物体がもつエネルギーを位置エネルギーといいます。"},{"id":"SC-SCI-PHY-000030","subject":"理科","grade":"中3","unit":"物理","field_name":"物理","topic_name":"運動とエネルギー","q":"力がつり合っている物体の運動状態について適切なのは？","answer":"静止または等速直線運動を続ける","options":["静止または等速直線運動を続ける","必ず速くなる","必ず遅くなる","必ず回転する"],"ex":"合力が0なら、静止している物体は静止を、運動中の物体は等速直線運動を続けます。"},{"id":"SC-SCI-EAR-000031","subject":"理科","grade":"中2","unit":"地学","field_name":"地学","topic_name":"地震・天気","q":"地震の最初の小さな揺れを何という？","answer":"初期微動","options":["初期微動","主要動","余震","震源"],"ex":"P波によって起こる最初の小さな揺れを初期微動といいます。"},{"id":"SC-SCI-EAR-000032","subject":"理科","grade":"中2","unit":"地学","field_name":"地学","topic_name":"地震・天気","q":"初期微動のあとに来る大きな揺れを何という？","answer":"主要動","options":["主要動","初期微動","余震","震源"],"ex":"S波によって起こる大きな揺れを主要動といいます。"},{"id":"SC-SCI-EAR-000033","subject":"理科","grade":"中2","unit":"地学","field_name":"地学","topic_name":"地震・天気","q":"地震が発生した地下の場所を何という？","answer":"震源","options":["震源","震央","断層面","観測点"],"ex":"地震が発生した地下の場所を震源といいます。"},{"id":"SC-SCI-EAR-000034","subject":"理科","grade":"中2","unit":"地学","field_name":"地学","topic_name":"地震・天気","q":"震源の真上の地表の地点を何という？","answer":"震央","options":["震央","震源","震度","マグニチュード"],"ex":"震源の真上にあたる地表の地点を震央といいます。"},{"id":"SC-SCI-EAR-000035","subject":"理科","grade":"中2","unit":"地学","field_name":"地学","topic_name":"地震・天気","q":"地震そのものの規模を表す値は？","answer":"マグニチュード","options":["マグニチュード","震度","気圧","湿度"],"ex":"地震そのものの規模はマグニチュードで表します。"},{"id":"SC-SCI-EAR-000036","subject":"理科","grade":"中2","unit":"地学","field_name":"地学","topic_name":"地震・天気","q":"ある地点での揺れの強さを表すものは？","answer":"震度","options":["震度","マグニチュード","標高","気温"],"ex":"各地点で感じる揺れの強さは震度で表します。"},{"id":"SC-SCI-EAR-000037","subject":"理科","grade":"中2","unit":"地学","field_na function canonicalUnitId(q){

    if(q.unit.includes("be動詞"))return "SC-ENG-G1-BE";
    if(q.unit.includes("一般動詞"))return "SC-ENG-G1-GV";
    if(q.unit.includes("過去形"))return "SC-ENG-G2-PST";
    if(q.unit.includes("関係代名詞"))return "SC-ENG-G3-REL";
  }
  if(q.subject==="社会"){
    if(q.unit.includes("地理"))return "SC-SOC-G1-GEO";
    if(q.unit.includes("歴史・古代"))return "SC-SOC-G1-ANC";
    if(q.unit.includes("歴史・中世"))return "SC-SOC-G2-MED";

      const subjectSignals=signals.filter(x=>x.subject===name);
      const priorityUnits=subjectSignals.map(x=>x.unit_id);

      const duePool=pool.filter(q=>status(q).name==='復習おすすめ')
        .sort((a,b)=>status(b).priority-status(a).priority);

      const signalPool=[];
      for(const unitId of priorityUnits){
        signalPool.push(...shuffle(pool.filter(q=>q.unit_id===unitId&&!duePool.includes(q))));
      }

      const unseen=shuffle(pool.filter(q=>status(q).name==='未学習'));
      const seen=shuffle(pool.filter(q=>!['未学習','復習おすすめ'].includes(status(q).name)));
      const ranked=[...duePool,...signalPool,...unseen,...seen];

      const picked=[];
      for(const q of ranked){
        if(!picked.length){picked.push(q);continue;}
        if(picked.length===1&&q.unit_id!==picked[0].unit_id){picked.push(q);break;}
      }
      if(picked.length<2){
        for(const q of ranked){
          if(picked.length>=2)break;
          if(!picked.includes(q))picked.push(q);
        }
      }
      queue.push(...picked);
    }

    const rest=[
      ...due,
      ...shuffle(candidates.filter(q=>status(q).name==='未学習')),
      ...shuffle(candidates.filter(q=>!['未学習','復習おすすめ'].includes(status(q).name)))
    ];
    for(const q of rest)if(queue.length<10&&!queue.includes(q))queue.push(q);
    queue=shuffle(queue.slice(0,10));
  }else{
    const unseen=shuffle(candidates.filter(q=>status(q).name==='未学習'));
    const seen=shuffle(candidates.filter(q=>!['未学習','復習おすすめ'].includes(status(q).name)));
    queue=[...due.slice(0,3),...unseen.slice(0,5),...seen.slice(0,2)];
    for(const q of [...unseen,...due,...seen])if(queue.length<10&&!queue.includes(q))queue.push(q);
    queue=shuffle(queue);
  }

  if(!queue.length){
    mount('<section class="selection"><div class="page-title"><span class="eyebrow">ALL CLEAR</span><h1>今の復習は完了。</h1><p class="muted">復習候補ができたら、ここに表示します。</p></div><button class="primary" onclick="setup()">新しい問題を解く <span>↗</span></button></section>');
    nav('review');
    return;
  }

}

function unitLearningSignals(daysCount=30,subjectFilter='すべて'){
  const daySet=new Set(Array.from({length:daysCount},(_,i)=>localDay(Date.now()-i*DAY)));
  const base=events.filter(e=>daySet.has(e.date)&&(subjectFilter==='すべて'||e.subject===subjectFilter));
  const units=[...new Map(items.filter(q=>subjectFilter==='すべて'||q.subject===subjectFilter).map(q=>[q.unit_id,{unit_id:q.unit_id,subject:q.subject,unit:q.unit}])).values()];
  return units.map(u=>{
    const qs=items.filter(q=>q.unit_id===u.unit_id),ids=new Set(qs.map(q=>q.id));
    const ev=base.filter(e=>eventUnitId(e)===u.unit_id||ids.has(e.id));
    const gradedEv=ev.filter(e=>e.event_type==='graded');
    const wrong=gradedEv.filter(e=>e.outcome==='incorrect').length;
    const correct=gradedEv.filter(e=>e.outcome==='correct').length;
    const skipped=ev.filter(e=>e.event_type==='skipped').length;
    const attempted=qs.filter(q=>events.some(e=>e.id===q.id)).length;
    const due=qs.filter(q=>status(q).name==='復習おすすめ'&&events.some(e=>e.id===q.id)).length;
    const stable=qs.filter(q=>status(q).name==='定着の目安').length;

    const errorRate=gradedEv.length?wrong/gradedEv.length:0;
    const dueRatio=attempted?due/attempted:0;
    const skipRate=interactions?skipped/interactions:0;
    const stableRatio=attempted?stable/attempted:0;
    const score=interactions>=2?Math.round(errorRate*55+dueRatio*30+skipRate*15-stableRatio*20):null;

function recommendationReason(u){

  if(u.wrong>=2)return "最近の誤答が重なっています";
  if(u.due>=2)return "復習タイミングの問題が増えています";
  if(u.skipped>=1)return "「あとで解く」が残っています";
  if(u.wrong>=1)return "最近の誤答をもう一度確認したい単元です";

function recommendationLevel(u){

  if(u.score>=55||u.wrong>=3||u.due>=3)return "high";
  if(u.score>=25||u.wrong>=1||u.due>=1||u.skipped>=1)return "medium";

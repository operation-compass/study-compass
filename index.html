function buildWordOptions(w,i){
  const same=WORDS.filter(x=>x.id!==w.id&&x.pos===w.pos).map(x=>x.meaning);
  const rest=WORDS.filter(x=>x.id!==w.id).map(x=>x.meaning);
  const pool=[...same,...rest].filter((v,j,a)=>a.indexOf(v)===j&&v!==w.meaning);
  const picks=[];
  for(let k=0;k<pool.length&&picks.length<3;k++){const v=pool[(i*3+k)%pool.length];if(!picks.includes(v))picks.push(v);}
  return [w.meaning,...picks];
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(isReview=false,specific=null){let candidates=eligible();if(specific)candidates=candidates.filter(q=>specific.includes(q.id));review=isReview;const due=candidates.filter(q=>status(q).name==='復習おすすめ').sort((a,b)=>status(b).priority-status(a).priority);if(isReview)queue=due.slice(0,10);else{const unseen=shuffle(candidates.filter(q=>status(q).name==='未学習')),seen=shuffle(candidates.filter(q=>!['未学習','復習おすすめ'].includes(status(q).name)));queue=[...due.slice(0,3),...unseen.slice(0,5),...seen.slice(0,2)];for(const q of [...unseen,...due,...seen])if(queue.length<10&&!queue.includes(q))queue.push(q);queue=shuffle(queue);}if(!queue.length){mount('<section class="selection"><div class="page-title"><span class="eyebrow">ALL CLEAR</span><h1>今の復習は完了。</h1><p class="muted">復習候補ができたら、ここに表示します。</p></div><button class="primary" onclick="setup()">新しい問題を解く <span>↗</span></button></section>');nav('review');return;}index=0;session=uid();sessionEvents=[];renderQ();}
function renderQ(){locked=false;selectedAnswer=null;active=0;last=performance.now();timingValid=true;const q=queue[index];currentOptions=shuffle(q.options);mount('<section class="quiz"><div class="quiz-head"><button onclick="home()">← ホーム</button><span>QUESTION '+String(index+1).padStart(2,'0')+' / '+queue.length+'</span></div><div class="quiz-progress"><i style="width:'+((index+1)/queue.length*100)+'%"></i></div><div class="meta">'+esc(q.subject)+' / '+esc(q.unit)+'</div><section class="question-card"><span class="question-kicker">QUESTION</span><h1 class="q">'+esc(q.q)+'</h1><p class="quiz-tip">一番近い答えを1つ選んでください。</p></section><div id="answer" class="choices">'+currentOptions.map((v,i)=>'<button class="choice" onclick="submitChoice('+i+')"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(v)+'</span></button>').join('')+'</div><div class="quiz-actions"><button onclick="unknown()">わからない</button><button onclick="skip()">あとで解く</button></div><div id="feedback" aria-live="polite"></div></section>');document.getElementById('nav').classList.add('hidden');}
function tick(){const n=performance.now(),delta=n-last;if(delta>120000)timingValid=false;else if(!document.hidden)active+=delta;last=n;}
document.addEventListener('visibilitychange',()=>{if(document.hidden){timingValid=false;const n=performance.now();if(n-last<120000)active+=n-last;else timingValid=false;last=n;}else last=performance.now();});

function submitChoice(i){if(locked)return;tick();selectedAnswer=currentOptions[i];record(selectedAnswer===queue[index].answer?'correct':'incorrect');}
function unknown(){if(locked)return;tick();record('incorrect');}
function skip(){if(locked)return;tick();record('ungraded','skipped');}
function record(outcome,event_type='graded'){if(locked)return;locked=true;const q=queue[index],at=Date.now(),prior=series(q,q.skill,q.method).at(-1);const e={attempt_id:uid(),session_id:session,id:q.id,knowledge_id:q.id,variant_id:q.id+':mcq-v03',skill:q.skill,method:q.method,subject:q.subject,unit:q.unit,question_version:'v0.3-CHECK',at,date:localDay(at),outcome,event_type,selected_answer:selectedAnswer,option_order:[...currentOptions],assisted:false,active_ms:Math.round(active),timing_valid:timingValid,review_of:review&&prior?prior.attempt_id:null};events.push(e);sessionEvents.push(e);save();document.querySelectorAll('.quiz-actions button').forEach(b=>b.disabled=true);document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(currentOptions[i]===q.answer)b.classList.add('correct');else if(currentOptions[i]===selectedAnswer)b.classList.add('wrong');});document.getElementById('feedback').innerHTML='<section class="feedback '+(outcome==='incorrect'?'incorrect':'')+'"><h2>'+(event_type==='skipped'?'次の復習に残しました':outcome==='correct'?'正解。その調子！':'ここで覚えていこう。')+'</h2>'+(selectedAnswer&&outcome==='incorrect'?'<p>あなたの回答：'+esc(selectedAnswer)+'</p>':'')+'<p><b>正解：'+esc(q.answer)+'</b></p><p>'+esc(q.ex)+'</p>'+(q.tip?'<p><small>覚え方：'+esc(q.tip)+'</small></p>':'')+(q.word?'<button class="sound" onclick="speak()">発音を聞く</button>':'')+'<button class="primary" onclick="next()">'+(index+1===queue.length?'結果を見る':'次の問題')+' <span>→</span></button></section>';}
function next(){if(!locked)return;index++;if(index<queue.length)renderQ();else finish();}
function finish(){const a=graded(sessionEvents),correct=a.filter(e=>e.outcome==='correct').length,wrong=sessionEvents.filter(e=>e.outcome!=='correct'),skipped=sessionEvents.filter(e=>e.event_type==='skipped').length,rate=a.length?Math.round(correct/a.length*100):null,wrongGraded=a.filter(e=>e.outcome==='incorrect').length;const nextText=wrong.length?'まずは今回の間違いを見直そう。':'今日はここまででもOK。日を空けてもう一度確認しよう。';mount('<section class="result"><div class="result-card"><span class="eyebrow">SESSION COMPLETE</span><h1>今日の一歩、完了。</h1><div class="score">'+correct+'<small> / '+a.length+' 正解</small></div><p>'+ (correct===a.length&&a.length?'いいペース。この調子で積み重ねよう。':'間違いは、次に伸びるポイント。')+'</p></div><div class="result-stats"><div class="result-stat"><small>4択正答率</small><strong>'+(rate===null?'—':rate+'%')+'</strong></div><div class="result-stat"><small>誤答</small><strong>'+wrongGraded+'問</strong></div><div class="result-stat"><small>あとで解く</small><strong>'+skipped+'問</strong></div></div><section class="result-next"><span class="eyebrow">NEXT STEP</span><h2>'+nextText+'</h2><p>'+(wrong.length?'今回の間違い・未回答だけを続けて復習できます。':'同日の繰り返し正解は定着判定に使わず、時間を空けて再確認します。')+'</p></section><div class="result-links">'+(wrong.length?'<button class="primary" onclick="retry()">間違い・未回答の'+wrong.length+'問を復習 <span>→</span></button>':'')+'<button class="secondary" onclick="dashboard()">学習記録を見る</button><button class="text-button" onclick="home()">ホームへ戻る</button></div>'+note()+'</section>');nav('learn');}
function retry(){const ids=sessionEvents.filter(e=>e.outcome!=='correct').map(e=>e.id);queue=items.filter(q=>ids.includes(q.id));if(!queue.length)return;index=0;session=uid();sessionEvents=[];review=true;renderQ();}
function speak(){if(!('speechSynthesis'in window)){msg.textContent='このブラウザでは音声が使えません。';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(queue[index].word);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u);}
function improvement(a){const bases=new Map();for(const e of a)if(e.outcome!=='correct'&&!bases.has(e.id+e.skill+e.method))bases.set(e.id+e.skill+e.method,e);let yes=0,total=0,pending=0;for(const e of bases.values()){const n=graded().find(x=>x.id===e.id&&x.skill===e.skill&&x.method===e.method&&x.at-e.at>=DAY&&!x.assisted&&x.question_version===e.question_version);if(n){total++;if(n.outcome==='correct')yes++;}else pending++;}return {yes,total,pending};}

let filterSubject='すべて',period=7;
function reviewSetup(){subject='すべて';const due=items.filter(q=>status(q).name==='復習おすすめ').sort((a,b)=>status(b).priority-status(a).priority);mount('<div class="page-title"><span class="eyebrow">NEXT TO REVIEW</span><h1>次に見直すところ。</h1><p class="muted">前回の間違い・あとで解く・復習タイミングの順で優先します。</p></div><section class="panel">'+(due.length?due.slice(0,10).map((q,i)=>{const lastAll=events.filter(e=>e.id===q.id).at(-1),lastGraded=graded().filter(e=>e.id===q.id).at(-1);let reason='復習のタイミング',cls='wait';if(lastAll?.event_type==='skipped'){reason='あとで解く';cls='high';}else if(lastGraded?.outcome==='incorrect'){reason='前回の間違い';cls='high';}return '<div class="review-item"><span class="number">'+String(i+1).padStart(2,'0')+'</span><div><b>'+esc(q.q)+'</b><small>'+esc(q.subject+' / '+q.unit)+'</small><span class="review-badge '+cls+'">'+reason+'</span></div></div>';}).join('')+'<button class="primary" onclick="start(true)">優先度順に'+Math.min(due.length,10)+'問を復習 <span>→</span></button>':'<div class="empty">今の復習候補はありません。<br>学習を進めると、ここに表示します。</div><button class="secondary" onclick="setup()">新しい問題を解く</button>')+'</section>');nav('review');}
function status(q,skill=q.skill,method=q.method){const a=series(q,skill,method),lastEvent=events.filter(e=>e.id===q.id).at(-1);if(!a.length&&!lastEvent)return {name:'未学習',priority:0,streak:0};const z=a.at(-1);let streak=0,prev=null;for(let i=a.length-1;i>=0;i--){const e=a[i];if(e.outcome!=='correct'||e.assisted)break;if(prev===null||prev-e.at>=DAY){streak++;prev=e.at;}}const stable=streak>=2,due=(z?.at||lastEvent.at)+DAY*(stable?3:1),late=Math.max(0,Math.floor((Date.now()-due)/DAY));const skipped=lastEvent?.event_type==='skipped';return {name:skipped||!z||z.outcome!=='correct'||Date.now()>=due?'復習おすすめ':stable?'定着の目安':'練習中',priority:(skipped?40:z?.outcome==='incorrect'?60:0)+Math.min(late,7)*3+a.slice(-3).filter(e=>e.outcome==='incorrect').length*5+10,streak,due};}
function dashboard(){const days=Array.from({length:period},(_,i)=>localDay(Date.now()-(period-1-i)*DAY)),a=graded().filter(e=>days.includes(e.date)&&(filterSubject==='すべて'||e.subject===filterSubject)),correct=a.filter(e=>e.outcome==='correct').length,candidates=items.filter(q=>filterSubject==='すべて'||q.subject===filterSubject),covered=candidates.filter(q=>series(q,q.skill,q.method).length).length,imp=improvement(a),times=a.filter(e=>e.timing_valid).map(e=>e.active_ms).sort((a,b)=>a-b),median=times.length?(times.length%2?times[(times.length-1)/2]:(times[times.length/2-1]+times[times.length/2])/2):null;const shown=days.slice(-7).map(date=>{const b=a.filter(e=>e.date===date);return {date,n:b.length,c:b.filter(e=>e.outcome==='correct').length};}),max=Math.max(1,...shown.map(d=>d.n));const points=shown.map((d,i)=>d.n?{x:24+i*45,y:110-d.c/d.n*90}:null);let lines='';for(let i=1;i<points.length;i++)if(points[i]&&points[i-1])lines+='<line x1="'+points[i-1].x+'" y1="'+points[i-1].y+'" x2="'+points[i].x+'" y2="'+points[i].y+'" stroke="#16715f" stroke-width="3"/>';const groups=[...new Set(candidates.map(q=>q.subject+' / '+q.unit))],dueCount=candidates.filter(q=>status(q).name==='復習おすすめ').length,stableCount=candidates.filter(q=>status(q).name==='定着の目安').length,subjectRates=['社会','英語'].map(name=>{const z=a.filter(e=>e.subject===name);return {name,n:z.length,rate:z.length?Math.round(z.filter(e=>e.outcome==='correct').length/z.length*100):null};});mount('<div class="page-title"><span class="eyebrow">YOUR LEARNING MAP</span><h1>学習の現在地。</h1><p class="muted">できたことと、次に伸ばすところ。</p></div><div class="filters"><select aria-label="期間" onchange="period=Number(this.value);dashboard()"><option value="7">7日間</option><option value="30">30日間</option></select><select aria-label="教科" onchange="filterSubject=this.value;dashboard()"><option>すべて</option><option>社会</option><option>英語</option></select></div><section class="dash-callout"><small>NEXT ACTION</small><strong>'+(dueCount?'復習 '+dueCount+'問から始めよう':'新しい問題を進めよう')+'</strong><p>'+(dueCount?'直近の誤答・スキップ・復習時期の問題を優先しています。':'今は復習候補がありません。新しい問題を進めて記録を増やしましょう。')+'</p></section><div class="metrics"><div class="metric"><small>正解数 / 回答数</small><strong>'+correct+'<small> / '+a.length+'</small></strong></div><div class="metric"><small>4択の正答率</small><strong>'+(a.length?Math.round(correct/a.length*100)+'%':'—')+'</strong></div><div class="metric"><small>学習した問題（累計）</small><strong>'+covered+'<small> / '+candidates.length+'</small></strong></div></div><div class="dash-summary"><div class="summary-card"><small>復習おすすめ</small><strong>'+dueCount+'問</strong><span class="muted">次に見直したい問題</span></div><div class="summary-card"><small>定着の目安</small><strong>'+stableCount+'問</strong><span class="muted">日を空けて正解できた問題</span></div></div><div class="dash-grid"><section class="panel"><h2>学習量の推移</h2><p class="section-hint">選択した期間のうち、直近7日を表示</p><div class="bars">'+shown.map(d=>'<div class="day"><span>'+d.n+'</span><i style="height:'+d.n/max*96+'px"></i><span>'+d.date.slice(5)+'</span></div>').join('')+'</div><p class="legend">直近7日の回答数。正解・誤答を含みます。</p></section><section class="panel"><h2>正答率の推移</h2><p class="section-hint">回答がある日の4択正答率</p><svg class="chart" viewBox="0 0 320 135" role="img" aria-label="直近7日の4択正答率。日別数値は下に表示"><path d="M18 20H310M18 65H310M18 110H310" stroke="#e5e9e0"/>'+lines+points.map(p=>p?'<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#16715f"/>':'').join('')+'</svg><div class="chart-caption">'+shown.map(d=>'<span>'+d.date.slice(5)+'<br>'+(d.n?Math.round(d.c/d.n*100)+'%':'—')+'</span>').join('')+'</div></section><section class="panel"><h2>教科ごとの正答率</h2><div class="subject-rate">'+subjectRates.map(r=>'<div class="subject-rate-row"><span>'+r.name+'</span><div class="track"><i style="width:'+(r.rate===null?0:r.rate)+'%"></i></div><b>'+(r.rate===null?'—':r.rate+'%')+'</b></div>').join('')+'</div><p class="legend">選択式で回答した記録のみ。回答がない教科は—です。</p></section><section class="panel"><h2>教科・単元ごとの状態</h2>'+groups.map(g=>{const qs=candidates.filter(q=>q.subject+' / '+q.unit===g),states=qs.map(q=>status(q)),n=states.filter(s=>s.name!=='未学習').length,b=a.filter(e=>e.subject+' / '+e.unit===g);return '<details class="unit"><summary><b>'+esc(g)+'</b><br><small>'+n+' / '+qs.length+'問に取り組み済み · '+(b.length?Math.round(b.filter(e=>e.outcome==='correct').length/b.length*100)+'%（'+b.length+'回答）':'回答なし')+'</small></summary><div class="track"><i style="width:'+n/qs.length*100+'%"></i></div><p>'+['未学習','練習中','復習おすすめ','定着の目安'].map(n=>n+' '+states.filter(s=>s.name===n).length).join(' / ')+'</p><small>'+(qs.length<5?'問題数が少ないため参考値。':'')+'4択の結果から見た状態です。</small></details>';}).join('')+'</section><section class="panel"><h2>復習での変化</h2><div class="metric"><small>24時間以降の再回答で正解</small><strong>'+imp.yes+'<small> / '+imp.total+'</small></strong></div><p class="legend">誤答後、24時間以上空けた最初の再回答。同じ問題版を比較。再回答待ち '+imp.pending+'問。</p><div class="metric"><small>回答時間の中央値</small><strong>'+(median===null?'—':Math.round(median/1000)+'秒')+'</strong></div><p class="legend">有効な時間記録 '+times.length+'件。速さは習熟判定に使いません。</p></section></div><div class="section-label"><h2>記録の詳細</h2></div><section class="panel"><details><summary>最近20件・連続正解</summary>'+a.slice(-20).reverse().map(e=>'<div class="history">'+e.date+' · '+esc(e.subject)+' · '+(e.outcome==='correct'?'正解':'誤答')+'<br><span>'+esc(items.find(q=>q.id===e.id)?.q||e.id)+'<br>'+(e.timing_valid?Math.round(e.active_ms/1000)+'秒':'時間なし')+' · 日を空けた連続正解 '+status(items.find(q=>q.id===e.id),e.skill,e.method).streak+'</span></div>').join('')+'</details><p class="legend">同日の連続正解を定着に数えません。選択での習熟の目安で、書字・綴り・自力記述は測定していません。v0.2以前の履歴は保持し、この4択の集計と分けています。</p><div class="history-tools"><button onclick="exportData()">履歴を保存</button><button onclick="clearData()">v0.3の履歴を削除</button></div></section>'+note());view.querySelectorAll('select')[0].value=String(period);view.querySelectorAll('select')[1].value=filterSubject;nav('chart');}
function exportData(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({schema_version:3,alpha_version:'0.3',events},null,2)],{type:'application/json'}));a.href=url;a.download='study-compass-v03-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function clearData(){if(!confirm('このv0.3の履歴だけを削除しますか？'))return;events=[];readError=false;save();dashboard();}
home();</script></html>

:"学習用の独自整理表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"生活の場所と食料を得る方法を分ける。","steps":["住居跡は暮らす場所の手がかり。","魚・貝・木の実は多様な食料利用の手がかり。","定住と多様な食料利用は両立する。水田中心という判断には別の証拠が必要。"],"trap":"縄文の栽培の存在と、弥生の本格的な水田稲作の普及を混同しない。","eliminate":["住居跡は住まいの情報。水田や稲作の痕跡が示されていないので、米中心という食料の結論は出せない。","狩猟・採集・漁労を続けながら定住することもできる。食料の取り方だけで定住を否定しない。","木の実の利用から栽培の有無や食料全体の構成は確定しない。表には魚や貝の利用も示されている。"]}},{"subject":"社会","grade":"中2","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","history_batch":"gaps4","source_refs":["https://www.rekihaku.ac.jp/exhibitions/room1/","https://rekihaku.repo.nii.ac.jp/records/2012"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-STD-000004","q":"遺跡から遠方を産地とする黒曜石などが見つかると、何を考える手がかりになる？","answer":"地域を越えた物資の移動や交流","options":["地域を越えた物資の移動や交流","当時の人が全員同じ職業だったこと","必ず近代の鉄道で運ばれたこと","住民全員が同じ文字を使っていたこと"],"ex":"産地と出土地の違いから物資の移動を考える。ただし、誰がどの経路で運んだかは別に調べる。","difficulty":"標準","practice_kind":"理由・比較","paired_question":"SC-SOC-HIS-GAP-ADV-000004"},{"subject":"社会","grade":"中2","unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","history_batch":"gaps4","source_refs":["https://www.rekihaku.ac.jp/exhibitions/room1/","https://rekihaku.repo.nii.ac.jp/records/2012"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-ADV-000004","q":"この学習例から推測できる範囲として適切なのは？","answer":"物資が地域を越えて移動したと考えられるが、住民が産地へ直接行ったとは限らない","options":["物資が地域を越えて移動したと考えられるが、住民が産地へ直接行ったとは限らない","出土地と産地を結べば、石材を運んだ経路と運んだ住民を特定できる","遠方の石材が出土したので、この集落の住民が産地に移住したと判断できる","石材の移動が分かれば、産地と集落の間に貨幣による売買があったと判断できる"],"ex":"移動の存在は考えられるが、直接訪問や人数までは確定しない。","difficulty":"応用","practice_kind":"資料の読み取り","paired_question":"SC-SOC-HIS-GAP-STD-000004","material":{"title":"産地と出土地の学習例","headers":["項目","内容"],"rows":[["石材の産地","集落から遠く離れた地域"],["出土地","縄文時代の集落"],["運んだ人物・経路","この情報だけでは未確定"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"物の移動と人の具体的な移動経路を区別する。","steps":["産地と出土地は異なる。","直接運ぶ場合も、交換を重ねる場合も考えられる。","移動の存在は考えられるが、直接訪問や人数までは確定しない。"],"trap":"遠方の品があることだけで、全住民の旅行や特定の経路を断定しない。","eliminate":["産地と出土地は分かるが、途中で受け渡された可能性もある。人物や経路は表でも未確定とされる。","物が移動した証拠と、住民が移住した証拠は別。住民の移住はこの表に示されていない。","物の交換や受け渡しと、貨幣を使う売買は同じではない。貨幣の使用を示す資料が必要。"]}},{"subject":"社会","grade":"中2","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","history_batch":"gaps4","source_refs":["https://www.kashikoken.jp/museum/yamatonoiseki/yamatonoiseki.html"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-STD-000005","q":"巨大な古墳の築造を、当時の社会と結び付けると？","answer":"多くの人や資源を集められる有力者の存在を考える手がかりになる","options":["すべての住民が同じ大きさの墓を持った証拠になる","古墳は必ず一人で一日以内に作られた","古墳の大きさだけで被葬者の名前が必ず分かる","多くの人や資源を集められる有力者の存在を考える手がかりになる"],"ex":"大規模な築造には労働力や資源が必要。権力を考える手がかりになるが、個人名は別の証拠が必要。","difficulty":"標準","practice_kind":"理由・比較","paired_question":"SC-SOC-HIS-GAP-ADV-000005"},{"subject":"社会","grade":"中2","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","history_batch":"gaps4","source_refs":["https://www.kashikoken.jp/museum/yamatonoiseki/yamatonoiseki.html"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-ADV-000005","q":"表から導く説明として適切なのは？","answer":"規模の違いから有力者の存在を考えられるが、名前や全住民の地位までは確定しない","options":["大型の墓の築造に多くの労働力が必要なので、被葬者が誰かを規模から特定できる","大型と小型の墓があるので、当時の身分の区分と各身分の人数を求められる","大型の墓の存在から、すべての小型の墓がその築造より後の時代と判断できる","規模の違いから有力者の存在を考えられるが、名前や全住民の地位までは確定しない"],"ex":"個人名や全住民の地位は、規模だけでは確定しない。","difficulty":"応用","practice_kind":"資料の読み取り","paired_question":"SC-SOC-HIS-GAP-STD-000005","material":{"title":"墓の規模と判断の範囲","headers":["観察","情報"],"rows":[["大型の墓","土を大量に動かす築造が必要"],["小型の墓","大型とは規模が異なる"],["被葬者の名前","この表には記載なし"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"権力を考える手がかりと、個人の特定を分ける。","steps":["大型の墓には人や資源を集める必要がある。","大小の差は社会の違いを考える手がかりになる。","個人名や全住民の地位は、規模だけでは確定しない。"],"trap":"権力の存在を推測することと、特定人物に比定することは別。","eliminate":["人や資源を集める力は考えられるが、規模だけでは個人の名前を特定できない。","墓の大小は社会の違いを考える手がかりになるが、身分制度の区分や人数の資料ではない。","規模の大小は年代の前後を示さない。築造時期を判断するには出土物や地層など別の証拠が必要。"]}},{"subject":"社会","grade":"中2","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","history_batch":"gaps4","source_refs":["https://www.kashikoken.jp/museum/yamatonoiseki/yamatonoiseki.html"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-STD-000006","q":"古墳時代の渡来人と技術の関係として適切なのは？","answer":"朝鮮半島などとの交流を通じて鉄器生産や窯業などの技術が伝わった","options":["技術の伝来は必ず明治時代になって初めて起きた","渡来人は近代の工場だけで働いた","朝鮮半島などとの交流を通じて鉄器生産や窯業などの技術が伝わった","列島は完全に孤立して技術の交流がなかった"],"ex":"渡来人は古墳時代の生産技術や文化の発展に関わった。古代にも海を越えた交流があった。","difficulty":"標準","practice_kind":"理由・比較","paired_question":"SC-SOC-HIS-GAP-ADV-000006"},{"subject":"社会","grade":"中2","unit":"歴史・古代","field_name":"歴史","topic_name":"古墳","history_batch":"gaps4","source_refs":["https://www.kashikoken.jp/museum/yamatonoiseki/yamatonoiseki.html"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-ADV-000006","q":"政治と技術の二つの欄を合わせた説明は？","answer":"外交交渉と人・技術の交流の両面で、列島は東アジアと結び付いていた","options":["中国への遣使と朝鮮半島からの技術伝来は、どちらも倭の五王が技術を教える活動を示す","中国への遣使を技術交流、渡来人による技術伝来を国内の政治制度だけの変化として読む","外交交渉と人・技術の交流の両面で、列島は東アジアと結び付いていた","政治と技術の欄を合わせると、中国への遣使が渡来人による技術伝来の直接の原因だと分かる"],"ex":"二つを合わせ、東アジアとの複数の結び付きを説明する。","difficulty":"応用","practice_kind":"資料の読み取り","paired_question":"SC-SOC-HIS-GAP-STD-000006","material":{"title":"古墳時代の対外交流","headers":["観点","内容"],"rows":[["政治","倭の五王による中国への遣使"],["技術","朝鮮半島を中心とする渡来人と鉄器・窯業などの生産"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"対外関係を外交だけに限定しない。","steps":["遣使は政治的な交渉の手がかり。","渡来人は人や技術の交流の手がかり。","二つを合わせ、東アジアとの複数の結び付きを説明する。"],"trap":"外交と技術伝来は、相互に打ち消し合う事実ではない。","eliminate":["遣使は外交交渉の情報で、技術の欄は渡来人を通じた受容を示す。列島から技術を教えたと一括しない。","政治と技術の観点を逆にしている。遣使は国外への外交、渡来人は海を越えた人・技術の交流に関係する。","二つの交流があったことは分かるが、片方がもう片方を直接引き起こしたとはこの表だけでは分からない。"]}},{"subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","history_batch":"gaps4","source_refs":["https://www.try-it.jp/chapters-2904/lessons-2919/point-3/"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-STD-000007","q":"戦国大名が領国支配のために制定した独自の法を何という？","answer":"分国法","options":["公事方御定書","分国法","武家諸法度","御成敗式目"],"ex":"分国法は戦国大名の領国の法。幕府が大名に示した武家諸法度や、鎌倉・江戸の裁判基準と区別する。","difficulty":"標準","practice_kind":"理由・比較","paired_question":"SC-SOC-HIS-GAP-ADV-000007"},{"subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","history_batch":"gaps4","source_refs":["https://www.try-it.jp/chapters-2904/lessons-2919/point-3/"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-ADV-000007","q":"表と室町幕府の権威の低下を結び付けた説明として適切なのは？","answer":"幕府の力が弱まる中、戦国大名が領国で独自の支配を進めた","options":["分国法は幕府が各領国へ同じ規則を伝え、中央の支配を強めたことを示す","幕府の力が弱まる中、戦国大名が領国で独自の支配を進めた","戦国大名は分国法を用いて領国を支配したため、幕府の全国支配も以前より強まった","分国法は朝廷が各領国の日常の秩序を直接管理するために定めた"],"ex":"幕府の権威低下と、各地の大名の支配強化を結び付ける。","difficulty":"応用","practice_kind":"資料の読み取り","paired_question":"SC-SOC-HIS-GAP-STD-000007","material":{"title":"支配の担い手を比べる","headers":["観点","戦国大名"],"rows":[["支配地域","自らの領国"],["規則","独自の分国法"],["目的","領国の秩序を整える"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"法を作る主体と、その法が及ぶ範囲を確かめる。","steps":["表の主体は戦国大名で、範囲は領国。","独自の法は領国支配を整える手段だった。","幕府の権威低下と、各地の大名の支配強化を結び付ける。"],"trap":"同じ「武士の法」でも、作った主体・時代・範囲は異なる。","eliminate":["表には戦国大名の「独自の分国法」とある。幕府の共通法を伝えたという説明ではない。","領国での大名の支配強化と、幕府の全国的な支配強化は別。問題の条件は幕府の権威の低下。","表の支配の担い手は戦国大名。朝廷が直接定めて管理したとは示されていない。"]}},{"subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","history_batch":"gaps4","source_refs":["https://www.try-it.jp/chapters-2904/lessons-2919/point-3/","https://www.try-it.jp/chapters-2904/lessons-2919/point-2/"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-STD-000008","q":"下剋上という言葉の意味に最も近いものは？","answer":"下の地位の者が実力で上の地位の者を倒すこと","options":["下の地位の者が実力で上の地位の者を倒すこと","将軍が必ず父から長男へ位を譲ること","農民が年貢を米で納めること","商人が同業者の組織を作ること"],"ex":"地位の上下と実際の力が逆転する動き。すべての人が身分の区別なく成功したという意味ではない。","difficulty":"標準","practice_kind":"理由・比較","paired_question":"SC-SOC-HIS-GAP-ADV-000008"},{"subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"戦国","history_batch":"gaps4","source_refs":["https://www.try-it.jp/chapters-2904/lessons-2919/point-3/","https://www.try-it.jp/chapters-2904/lessons-2919/point-2/"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-ADV-000008","q":"この例を下剋上と結び付ける際、適切な説明は？","answer":"BとAの地位・支配の逆転は下剋上の例だが、全国の全員が同様に逆転したとは言えない","options":["BとAの地位・支配の逆転は下剋上の例だが、全国の全員が同様に逆転したとは言えない","Aの配下だったBがAを倒したので、同じ地域の他の配下も領主になったと判断できる","Bが新たな支配者になったので、AがBへ領地を平和的に相続させた例だと判断できる","支配者がAからBへ変わったので、朝廷がBを任命して支配を移した例だと判断できる"],"ex":"この逆転は下剋上だが、一例から全員の行動は決められない。","difficulty":"応用","practice_kind":"資料の読み取り","paired_question":"SC-SOC-HIS-GAP-STD-000008","material":{"title":"政治権力の変化を考える学習例","headers":["時期","支配する立場"],"rows":[["前","領主Aが支配し、BはAの配下だった"],["後","BがAを倒し、支配する立場になる"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"一つの事例と、社会全体への断定を分ける。","steps":["前はAが支配し、Bは配下だった。","後はBがAを倒して支配している。","この逆転は下剋上だが、一例から全員の行動は決められない。"],"trap":"傾向や風潮を「例外なく全員」と読み替えない。","eliminate":["Bについての一例しか示されていない。他の配下にも同じ変化があったという資料はない。","表はBがAを「倒し」たとしている。平和的な相続という説明とは異なる。","朝廷による任命の記載はない。以前の上下関係をBが覆した点を読む。"]}},{"subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","history_batch":"gaps4","source_refs":["https://benesse.jp/kyouiku/teikitest/chu/social/social/c00736.html","https://benesse.jp/kyouiku/teikitest/chu/social/social/c00739.html"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-STD-000009","q":"株仲間について、田沼意次と水野忠邦の政策を比べると？","answer":"田沼は奨励し、水野は天保の改革で解散を命じた","options":["田沼は解散させ、水野は初めて組織を作った","両者とも五人組を株仲間と改称した","両者とも株仲間への方針は全く同じだった","田沼は奨励し、水野は天保の改革で解散を命じた"],"ex":"同じ対象に対して方針が逆。政策を人名だけでなく対象・手段・目的で整理しよう。","difficulty":"標準","practice_kind":"理由・比較","paired_question":"SC-SOC-HIS-GAP-ADV-000009"},{"subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","history_batch":"gaps4","source_refs":["https://benesse.jp/kyouiku/teikitest/chu/social/social/c00736.html","https://benesse.jp/kyouiku/teikitest/chu/social/social/c00739.html"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-ADV-000009","q":"この比較から読み取れるものは？","answer":"財政を立て直す目標は共通でも、株仲間への政策手段は異なった","options":["田沼は株仲間の解散、水野は株仲間の奨励によって、共通の財政再建を目指した","田沼は幕府財政の再建、水野は大名の領国の独立を目的として株仲間の政策を変えた","株仲間への方針が反対なので、両方の政策による税収の増減までこの表から判断できる","財政を立て直す目標は共通でも、株仲間への政策手段は異なった"],"ex":"共通する目的と異なる手段を両方残して説明する。","difficulty":"応用","practice_kind":"資料の読み取り","paired_question":"SC-SOC-HIS-GAP-STD-000009","material":{"title":"財政再建と商業政策","headers":["政治","目標","株仲間への方針"],"rows":[["田沼の政治","幕府財政の立て直し","奨励"],["天保の改革","幕府財政の立て直し","解散を命じる"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"目標と手段を別の列として比べる。","steps":["目標の列は両者とも財政の立て直し。","方針の列は奨励と解散で異なる。","共通する目的と異なる手段を両方残して説明する。"],"trap":"目的が同じことは、政策や結果まで同じことを意味しない。","eliminate":["目的は共通だが、手段が逆。表では田沼が奨励、天保の改革が解散と示されている。","目標の列は両方とも幕府財政の立て直し。領国の独立という目的は示されていない。","表にあるのは目標と方針。実際の税収の増減という結果は示されていないので、別資料が必要。"]}},{"subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","history_batch":"gaps4","source_refs":["https://benesse.jp/kyouiku/teikitest/chu/social/social/c00739.html"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-STD-000010","q":"三大改革を前後の順に並べたものは？","answer":"享保の改革 → 寛政の改革 → 天保の改革","options":["寛政の改革 → 享保の改革 → 天保の改革","享保の改革 → 天保の改革 → 寛政の改革","享保の改革 → 寛政の改革 → 天保の改革","天保の改革 → 寛政の改革 → 享保の改革"],"ex":"吉宗の享保、定信の寛政、忠邦の天保の順。田沼の政治は享保と寛政の間に位置する。","difficulty":"標準","practice_kind":"理由・比較","paired_question":"SC-SOC-HIS-GAP-ADV-000010"},{"subject":"社会","grade":"中2","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸後期","history_batch":"gaps4","source_refs":["https://benesse.jp/kyouiku/teikitest/chu/social/social/c00739.html"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-ADV-000010","q":"表の政策と反応を結び付けた説明として適切なのは？","answer":"幕府の支配地を増やす方針は、土地に関わる大名や旗本などの利害と衝突した","options":["幕府の直轄地を増やす政策は、大名や旗本の土地支配を拡大する手段だった","大名や旗本の反発は、幕府が直轄地を減らして土地を返す方針を取ったことを示す","幕府の支配地を増やす方針は、土地に関わる大名や旗本などの利害と衝突した","大名や旗本が反発したことから、この政策で幕府の財政収入がいくら増えたか判断できる"],"ex":"幕府の目的と相手の利害の違いが反発を考える手がかり。","difficulty":"応用","practice_kind":"資料の読み取り","paired_question":"SC-SOC-HIS-GAP-STD-000010","material":{"title":"天保の改革の手段と反応","headers":["観点","内容"],"rows":[["手段","幕府の直轄地を増やそうとする"],["反応","大名や旗本などの反発を招く"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"政策を行う側と影響を受ける側の立場を分ける。","steps":["幕府は直轄地を増やそうとしている。","土地を持つ大名や旗本などには不利益につながり得る。","幕府の目的と相手の利害の違いが反発を考える手がかり。"],"trap":"政策の目的と、実行のしやすさや成果を混同しない。","eliminate":["直轄地は幕府が直接支配する土地。大名や旗本の土地支配の拡大と同じではない。","表の手段は直轄地を「増やそうとする」こと。反発の記載だけを見て、方針を逆にしない。","反発は利害対立の情報で、収入額の資料ではない。財政への実際の影響は別に調べる必要がある。"]}},{"subject":"社会","grade":"中2","unit":"歴史・古代","field_name":"歴史","topic_name":"歴史の見方","history_batch":"gaps4","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-STD-000011","q":"紀元前の年代を古い順に並べたものは？","answer":"紀元前500年 → 紀元前300年 → 紀元前100年","options":["紀元前500年 → 紀元前100年 → 紀元前300年","紀元前500年 → 紀元前300年 → 紀元前100年","紀元前100年 → 紀元前300年 → 紀元前500年","紀元前300年 → 紀元前500年 → 紀元前100年"],"ex":"紀元前は数が大きい年ほど古い。西暦との前後関係を確認してから数を比べる。","difficulty":"標準","practice_kind":"理由・比較","paired_question":"SC-SOC-HIS-GAP-ADV-000011"},{"subject":"社会","grade":"中2","unit":"歴史・古代","field_name":"歴史","topic_name":"歴史の見方","history_batch":"gaps4","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-ADV-000011","q":"架空の出来事の表で、XとYの時期をA・B・Cと比較した説明として適切なのは？","answer":"XはAとBの間、YはBとCの間に起きた","options":["XはAとBの間、YはBとCの間に起きた","XはBとCの間、YはAとBの間に起きた","XはAより古く、YはCより後に起きた","XはAとBの間、YはAとBの間に起きた"],"ex":"紀元前の大小と紀元前・西暦の区別を使い、二つの出来事がどの区間に入るか判断する。","difficulty":"応用","practice_kind":"資料の読み取り","paired_question":"SC-SOC-HIS-GAP-STD-000011","material":{"title":"年代の整理練習（架空の出来事）","headers":["記号","年代"],"rows":[["A","紀元前300年"],["B","紀元前100年"],["C","西暦100年"],["X","紀元前200年"],["Y","西暦50年"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"A・B・Cの順を確かめ、XとYをそれぞれ区間に入れる。","steps":["紀元前は数が大きい年ほど古いので、AからX、Bの順になる。","Bは紀元前100年。Yの西暦50年はBより後、Cの西暦100年より前。","XはAとBの間、YはBとCの間。順序全体はA、X、B、Y、Cとなる。"],"trap":"紀元前200年を紀元前100年より後と読まない。西暦の数字は紀元前の数字と分けて比較する。","eliminate":["XとYを入れる区間が逆。Xは紀元前、Yは西暦である。","XはAの紀元前300年より後。YはCの西暦100年より前。","Xの区間は合っているが、Yは紀元前のAとBの間には入らない。"]}},{"subject":"社会","grade":"中2","unit":"歴史・古代","field_name":"歴史","topic_name":"歴史の見方","history_batch":"gaps4","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-STD-000012","q":"歴史の出来事の原因を考えるとき、必要な姿勢は？","answer":"前後の順序だけでなく、どのようにつながったかを確かめる","options":["前後の順序だけでなく、どのようにつながったかを確かめる","先に起きた出来事は必ずすべて後の出来事の唯一の原因である","後に起きた出来事が必ず過去の出来事を起こす","原因は資料を確認せず名前の似ている出来事で決める"],"ex":"年代の前後関係は因果関係を考える条件の一つ。仕組みや背景を資料から確かめる必要がある。","difficulty":"標準","practice_kind":"理由・比較","paired_question":"SC-SOC-HIS-GAP-ADV-000012"},{"subject":"社会","grade":"中2","unit":"歴史・古代","field_name":"歴史","topic_name":"歴史の見方","history_batch":"gaps4","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公的資料・教材提供者の公開解説を参考にした独自問題です。史料原文や過去問の転載ではありません。","id":"SC-SOC-HIS-GAP-ADV-000012","q":"この情報だけからの結論として適切なのは？","answer":"政策が先だとは分かるが、政策だけが価格上昇の原因とは確定できない","options":["政策が先だとは分かるが、政策だけが価格上昇の原因とは確定できない","政策Aの翌年に価格が上がったので、政策Aが価格上昇の主因だったと判断できる","政策Aが先に発表されたので、翌年の価格上昇には供給量の変化が関わらなかったと判断できる","天候や需要が未確認なので、価格上昇と政策Aには関係がなかったと判断できる"],"ex":"この表だけでは政策の影響や唯一の原因を確定せず、追加資料を調べる。","difficulty":"応用","practice_kind":"資料の読み取り","paired_question":"SC-SOC-HIS-GAP-STD-000012","material":{"title":"順序と因果を考える練習（架空例）","headers":["年","記録"],"rows":[["ある年","政策Aが発表される"],["翌年","商品の価格が上がる"],["未確認","天候・供給量・需要などの変化"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"時間の前後と原因の確定を分ける。","steps":["政策発表が価格上昇より先なのは表から分かる。","価格には供給量や需要など複数の要因が関わり得る。","この表だけでは政策の影響や唯一の原因を確定せず、追加資料を調べる。"],"trap":"「先に起きた」と「それだけが原因」を同じ意味にしない。","eliminate":["先に起きたことは因果関係の検討に役立つが、それだけで主因とは決められない。供給や需要などの資料も必要。","政策が先でも供給量などが同時に変化した可能性は残る。未確認の要因を除外できない。","因果関係が確認できていないことと、関係がないことは違う。政策の影響があった可能性も残る。"]}}];

function buildWordOptions(w,i){
  const same=WORDS.filter(x=>x.id!==w.id&&x.pos===w.pos).map(x=>x.meaning);
  const rest=WORDS.filter(x=>x.id!==w.id).map(x=>x.meaning);
  const pool=[...same,...rest].filter((v,j,a)=>a.indexOf(v)===j&&v!==w.meaning);
  const picks=[];
  for(let k=0;k<pool.length&&picks.length<3;k++){const v=pool[(i*3+k)%pool.length];if(!picks.includes(v))picks.push(v);}
  return [w.meaning,...picks];
}

","skill":"reasoning","method":"auto"},{"id":"SC-MAT-EQU-000106","subject":"数学","grade":"中1","unit":"方程式","field_name":"方程式","topic_id":"MAT-EQU-WORD","topic_name":"文章題","unit_id":"SC-MAT-G1-EQU","difficulty":"2","q":"ある数の3倍に5を加えると20になった。この数は？","answer":"5","options":["3","5","7","15"],"ex":"ある数をxとすると3x＋5＝20。3x＝15よりx＝5です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-EQU-000107","subject":"数学","grade":"中1","unit":"方程式","field_name":"方程式","topic_id":"MAT-EQU-WORD","topic_name":"文章題","unit_id":"SC-MAT-G1-EQU","difficulty":"2","q":"120円のノートをx冊買い、1000円払ったら280円残った。xは？","answer":"6","options":["4","5","6","7"],"ex":"120x＋280＝1000より120x＝720、x＝6です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-EQU-000108","subject":"数学","grade":"中2","unit":"方程式","field_name":"方程式","topic_id":"MAT-EQU-WORD","topic_name":"連立方程式文章題","unit_id":"SC-MAT-G2-EQU","difficulty":"3","q":"大人2人と子ども3人で料金が2700円、大人1人と子ども2人で1600円。子ども1人の料金は？","answer":"500円","options":["300円","400円","500円","600円"],"ex":"大人をx円、子どもをy円とすると2x＋3y＝2700、x＋2y＝1600。2本目を2倍して引くと−y＝−500なのでy＝500です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-EQU-000109","subject":"数学","grade":"中2","unit":"方程式","field_name":"方程式","topic_id":"MAT-EQU-WORD","topic_name":"連立方程式文章題","unit_id":"SC-MAT-G2-EQU","difficulty":"3","q":"2桁の整数があり、十の位と一の位の和は9。十の位は一の位より3大きい。この整数は？","answer":"63","options":["36","54","63","72"],"ex":"十の位をx、一の位をyとします。条件からx＋y＝9、また『十の位は一の位より3大きい』のでx−y＝3。2式を足すと2x＝12よりx＝6、そこからy＝3。したがって整数は63です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000110","subject":"数学","grade":"中2","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-WORD","topic_name":"一次関数文章題","unit_id":"SC-MAT-G2-FUN","difficulty":"2","q":"1分ごとに水面が3cm上がり、最初の水位が5cmだった。x分後の水位yを表す式は？","answer":"y＝3x＋5","options":["y＝3x","y＝5x＋3","y＝3x＋5","y＝5x"],"ex":"1分あたり3cm増えるので傾き3、初めの値が5なので切片5です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000111","subject":"数学","grade":"中2","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-WORD","topic_name":"一次関数文章題","unit_id":"SC-MAT-G2-FUN","difficulty":"2","q":"一次関数y＝2x＋1で、xが3増えるとyはいくつ増える？","answer":"6","options":["2","3","5","6"],"ex":"一次関数の変化の割合は2なので、xが3増えるとyは2×3＝6増えます。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000112","subject":"数学","grade":"中2","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-LINE","topic_name":"一次関数","unit_id":"SC-MAT-G2-FUN","difficulty":"2","q":"点(2,5)を通り、傾きが−1の直線の式は？","answer":"y＝−x＋7","options":["y＝−x＋3","y＝−x＋7","y＝x＋3","y＝x−7"],"ex":"y＝−x＋bに(2,5)を代入すると5＝−2＋bよりb＝7です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000113","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-QMIX","topic_name":"二次関数融合","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"y＝x²で、xが1から3まで増えるときの変化の割合は？","answer":"4","options":["2","3","4","8"],"ex":"変化の割合＝(9−1)/(3−1)＝8/2＝4です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000114","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-QMIX","topic_name":"二次関数融合","unit_id":"SC-MAT-G3-FUN","difficulty":"3","q":"y＝2x²で、xが−1から2まで増えるときの変化の割合は？","answer":"2","options":["1","2","3","4"],"ex":"変化の割合は『yの増加量÷xの増加量』です。x＝−1のときy＝2、x＝2のときy＝8。よって(8−2)÷(2−(−1))＝6÷3＝2です。二次関数でも、2点間の変化の割合はこの公式で求めます。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000115","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-QMIX","topic_name":"二次関数融合","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"関数y＝ax²が点(2,12)を通る。aの値は？","answer":"3","options":["2","3","4","6"],"ex":"12＝a×2²＝4aよりa＝3です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-PRO-000116","subject":"数学","grade":"中2","unit":"確率","field_name":"確率","topic_id":"MAT-PRO-MIX","topic_name":"複合確率","unit_id":"SC-MAT-G2-PRO","difficulty":"2","q":"2個のさいころを同時に投げるとき、目の和が7になる場合は何通り？","answer":"6通り","options":["4通り","5通り","6通り","7通り"],"ex":"(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)の6通りです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-PRO-000117","subject":"数学","grade":"中2","unit":"確率","field_name":"確率","topic_id":"MAT-PRO-MIX","topic_name":"複合確率","unit_id":"SC-MAT-G2-PRO","difficulty":"3","q":"2個のさいころを同時に投げるとき、目の和が7になる確率は？","answer":"1/6","options":["1/12","1/6","1/4","1/3"],"ex":"2個のさいころは、それぞれ1〜6の6通りなので全部で6×6＝36通りです。和が7になるのは(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)の6通り。よって確率は6/36＝1/6です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-PRO-000118","subject":"数学","grade":"中2","unit":"確率","field_name":"確率","topic_id":"MAT-PRO-MIX","topic_name":"複合確率","unit_id":"SC-MAT-G2-PRO","difficulty":"3","q":"赤2個、白3個の玉から同時に2個取り出す。2個とも赤である確率は？","answer":"1/10","options":["1/5","1/10","2/5","1/2"],"ex":"同時に2個選ぶので、順番は区別しません。5個から2個を選ぶ組合せは10通り。そのうち赤2個をともに選ぶ組合せは1通りだけなので、確率は1/10です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-NUM-000119","subject":"数学","grade":"中1","unit":"数と式","field_name":"数と式","topic_id":"MAT-ALG-PAT","topic_name":"規則性","unit_id":"SC-MAT-G1-ALG","difficulty":"2","q":"1,4,7,10,…と並ぶ数列の10番目は？","answer":"28","options":["25","28","30","31"],"ex":"初項1、公差3なので1＋3×9＝28です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-NUM-000120","subject":"数学","grade":"中1","unit":"数と式","field_name":"数と式","topic_id":"MAT-ALG-PAT","topic_name":"規則性","unit_id":"SC-MAT-G1-ALG","difficulty":"3","q":"正方形を横一列につなげる。1個で4本、2個で7本、3個で10本の棒を使う。n個では何本？","answer":"3n＋1","options":["3n","3n＋1","4n","4n−1"],"ex":"1個目は4本です。正方形を1個横につなぐごとに、前の正方形と1辺を共有するため増える棒は3本ずつです。したがって4＋3(n−1)＝3n＋1。『最初の個数＋増え方×(n−1)』で考えると整理しやすいです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000121","subject":"数学","grade":"中2","unit":"図形","field_name":"図形","topic_id":"MAT-GEO-CONG","topic_name":"合同","unit_id":"SC-MAT-G2-GEO","difficulty":"1","q":"2つの三角形で、3辺の長さがそれぞれ等しいとき使える合同条件は？","answer":"3組の辺","options":["1組の辺とその両端の角","2組の辺とその間の角","3組の辺","直角と斜辺"],"ex":"三角形の合同条件の1つは、3組の辺がそれぞれ等しいことです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000122","subject":"数学","grade":"中2","unit":"図形","field_name":"図形","topic_id":"MAT-GEO-PROOF","topic_name":"証明","unit_id":"SC-MAT-G2-GEO","difficulty":"2","q":"三角形ABCと三角形DEFで、AB＝DE、BC＝EF、∠B＝ oning","method":"auto"},{"id":"SC-MAT-GEO-000128","subject":"数学","grade":"中3","unit":"図形","field_name":"図形","topic_id":"MAT-GEO-MOVE","topic_name":"動点","unit_id":"SC-MAT-G3-GEO","difficulty":"1","q":"1辺6cmの正方形ABCDで、点PがAからBへ毎秒2cmで進む。2秒後のAPは？","answer":"4cm","options":["2cm","3cm","4cm","6cm"],"ex":"2cm/秒×2秒＝4cmです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000129","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-MOVE","topic_name":"動点・面積","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"底辺6cmの三角形で、高さxcmのとき面積ycm²。yをxの式で表すと？","answer":"y＝3x","options":["y＝3x","y＝6x","y＝x＋3","y＝12x"],"ex":"三角形の面積＝底辺×高さ÷2＝6×x÷2＝3xです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000130","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-MOVE","topic_name":"動点・面積","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"底辺8cmの三角形で、高さが毎秒1cmずつ増える。t秒後の面積Sは？","answer":"S＝4t","options":["S＝4t","S＝8t","S＝t²","S＝16t"],"ex":"面積は8×t÷2＝4tです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-DAT-000131","subject":"数学","grade":"中2","unit":"データ","field_name":"データ","topic_id":"MAT-DAT-BOX","topic_name":"箱ひげ図","unit_id":"SC-MAT-G2-DAT","difficulty":"2","q":"2つの箱ひげ図を比べるとき、データの散らばりの大きさを見る指標として特に有効なのは？","answer":"四分位範囲","options":["中央値","四分位範囲","最頻値","平均値"],"ex":"箱の長さに対応する四分位範囲を見ると、中央50%のデータの散らばりを比較できます。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-DAT-000132","subject":"数学","grade":"中3","unit":"データ","field_name":"データ","topic_id":"MAT-DAT-SAMPLE","topic_name":"標本調査","unit_id":"SC-MAT-G3-DAT","difficulty":"2","q":"無作為抽出を行う主な理由は？","answer":"偏りを小さくするため","options":["標本数を必ず増やすため","偏りを小さくするため","平均値を大きくするため","外れ値をなくすため"],"ex":"特定の特徴を持つものだけが選ばれる偏りを避け、母集団をより公平に推測するためです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-NUM-000133","subject":"数学","grade":"中3","unit":"数と式","field_name":"数と式","topic_id":"MAT-ALG-PROOF","topic_name":"数の性質","unit_id":"SC-MAT-G3-ALG","difficulty":"2","q":"連続する2つの整数をn、n＋1とすると、その和は？","answer":"2n＋1","options":[ ulty":"1","q":"平行線l∥mに1本の直線が交わる。錯角が等しいことを証明で使うとき、その理由として適切なのは？","answer":"平行線の性質","options":["平行線の性質","三角形の内角の和","円周角の定理","相似比"],"ex":"平行な2直線に1本の直線が交わると、錯角は等しくなります。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000175","subject":"数学","grade":"中3","unit":"図形","field_name":"図形","topic_id":"MAT-GEO-PROOF","topic_name":"相似証明","unit_id":"SC-MAT-G3-GEO","difficulty":"2","q":"△ABCでDはAB上、EはAC上、DE∥BC。AD:AB＝2:5のとき、AE:ACは？","answer":"2:5","options":["2:3","2:5","3:5","5:2"],"ex":"△ADE∽△ABCなので、対応する辺の比はすべて等しくAD:AB＝AE:AC＝2:5です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-EQU-000176","subject":"数学","grade":"中2","unit":"方程式","field_name":"方程式","topic_id":"MAT-EQU-WORD","topic_name":"連立方程式文章題","unit_id":"SC-MAT-G2-EQU","difficulty":"3","q":"りんご2個とみかん3個で510円、りんご1個とみかん2個で300円。りんご1個はいくら？","answer":"120円","options":["90円","100円","120円","150円"],"ex":"りんごをx円、みかんをy円とすると2x＋3y＝510、x＋2y＝300。2本目を2倍して引くと−y＝−90よりy＝90、x＝120です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-EQU-000177","subject":"数学","grade":"中2","unit":"方程式","field_name":"方程式","topic_id":"MAT-EQU-WORD","topic_name":"連立方程式文章題","unit_id":"SC-MAT-G2-EQU","difficulty":"2","q":"大人3人と子ども2人で3800円、大人1人と子ども2人で2200円。大人1人の料金は？","answer":"800円","options":["600円","700円","800円","1000円"],"ex":"2式の差をとると大人2人分が1600円なので、大人1人は800円です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-EQU-000178","subject":"数学","grade":"中2","unit":"方程式","field_name":"方程式","topic_id":"MAT-EQU-WORD","topic_name":"連立方程式文章題","unit_id":"SC-MAT-G2-EQU","difficulty":"3","q":"ある店でペン3本とノート2冊で760円、ペン1本とノート1冊で280円。ペン1本はいくら？","answer":"200円","options":["160円","180円","200円","240円"],"ex":"ペンをp円、ノートをn円とすると3p＋2n＝760、p＋n＝280です。2本目からn＝280−pとし、1本目へ代入すると3p＋2(280−p)＝760。整理してp＋560＝760よりp＝200円です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-PRO-000179","subject":"数学","grade":"中2","unit":"確率","field_name":"確率","topic_id":"MAT-PRO-COUNT","topic_name":"確率×場合の数","unit_id":"SC-MAT-G2-PRO","difficulty":"2","q":"1,2,3の3枚のカードから2枚を順に取り出して2桁の整数を作る。何通りできる？","answer":"6通 name":"グラフ読解","unit_id":"SC-MAT-G3-FUN","difficulty":"1","q":"一次関数のグラフが水平な直線なら、傾きは？","answer":"0","options":["−1","0","1","無限大"],"ex":"xが変わってもyが変化しないため傾きは0です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000215","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-GRAPH","topic_name":"グラフ読解","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"グラフ上でxが2増えたときyが6増えた。変化の割合は？","answer":"3","options":["2","3","4","8"],"ex":"変化の割合＝yの増加量÷xの増加量＝6÷2＝3です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-NUM-000216","subject":"数学","grade":"中3","unit":"数と式","field_name":"数と式","topic_id":"MAT-ALG-PROOF","topic_name":"式の説明","unit_id":"SC-MAT-G3-ALG","difficulty":"1","q":"nを整数とすると2nは何を表す？","answer":"偶数","options":["奇数","偶数","素数","自然数だけ"],"ex":"整数を2倍した数は必ず2の倍数、つまり偶数です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-NUM-000217","subject":"数学","grade":"中3","unit":"数と式","field_name":"数と式","topic_id":"MAT-ALG-PROOF","topic_name":"式の説明","unit_id":"SC-MAT-G3-ALG","difficulty":"1","q":"nを整数とすると2n＋1は何を表す？","answer":"奇数","options":["偶数","奇数","3の倍数","平方数"],"ex":"偶数2nに1を足した数なので奇数です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-NUM-000218","subject":"数学","grade":"中3","unit":"数と式","field_name":"数と式","topic_id":"MAT-ALG-PROOF","topic_name":"式の説明","unit_id":"SC-MAT-G3-ALG","difficulty":"3","q":"連続する3つの整数n−1,n,n＋1の和が3の倍数になる理由は？","answer":"和が3nになるから","options":["和が3nになるから","積が3nになるから","すべて偶数だから","すべて奇数だから"],"ex":"連続する3整数をn−1、n、n＋1と置くのがポイントです。和は(n−1)+n+(n＋1)＝3n。nは整数なので3nは3×整数の形です。したがって和は必ず3の倍数になります。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000219","subject":"数学","grade":"中3","unit":"図形","field_name":"図形","topic_id":"MAT-GEO-SIM","topic_name":"相似応用","unit_id":"SC-MAT-G3-GEO","difficulty":"3","q":"相似比3:5の図形で、小さい図形の面積が27cm²。大きい図形の面積は？","answer":"75cm²","options":["45cm²","60cm²","75cm²","125cm²"],"ex":"相似比が3:5なら、面積比はその2乗で9:25です。小さい図形の面積27cm²が9に対応するので、1あたりは27÷9＝3。大きい図形は25に対応するから3×25＝75cm²です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000220","subject":"数学","grade":"中3","unit":"図形","field_name":"図形","topic_id":"MAT-GEO-SIM","topic_name":"相似応用","unit_id":"SC-MAT-G3-GEO","difficulty":"3","q":"相似比2:3の立体で、小さい立体の体積が16cm³。大きい立体の体積は？","answer":"54cm³","options":["24cm³","36cm³","48cm³","54cm³"],"ex":"立体の体積比は相似比の3乗になります。相似比2:3だから体積比は2³:3³＝8:27。小さい立体16cm³が8に対応するので1あたり2、大きい立体は27×2＝54cm³です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000221","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-GEO","topic_name":"関数×図形","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"点A(0,0)、B(5,0)、C(5,8)の三角形ABCの面積は？","answer":"20","options":["13","20","40","80"],"ex":"底辺5、高さ8なので5×8÷2＝20です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000222","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-GEO","topic_name":"関数×図形","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"直線y＝3x−6とx軸の交点は？","answer":"(2,0)","options":["(−2,0)","(0,−6)","(2,0)","(6,0)"],"ex":"x軸上ではy＝0。0＝3x−6よりx＝2です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000223","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-FUN-GEO","topic_name":"関数×図形","unit_id":"SC-MAT-G3-FUN","difficulty":"1","q":"直線y＝−2x＋8とy軸の交点は？","answer":"(0,8)","options":["(−4,0)","(0,−2)","(0,8)","(8,0)"],"ex":"y軸上ではx＝0なのでy＝8です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000224","subject":"数学","grade":"中3","unit":"図形","field_name":"図形","topic_id":"MAT-GEO-CIRPY","topic_name":"円・三平方","unit_id":"SC-MAT-G3-GEO","difficulty":"3","q":"半径5cmの円で、中心から弦までの距離が3cm。弦の半分の長さは？","answer":"4cm","options":["2cm","4cm","5cm","8cm"],"ex":"中心Oから弦ABへ垂線を下ろすと、その垂線は弦ABを二等分します。弦の半分をx cmとすると、半径5cm・中心から弦まで3cmの直角三角形ができ、x²＋3²＝5²。x²＝16よりx＝4cmです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000225","subject":"数学","grade":"中3","unit":"図形","field_name":"図形","topic_id":"MAT-GEO-CIRPY","topic_name":"円・三平方","unit_id":"SC-MAT-G3-GEO","difficulty":"3","q":"半径13cmの円で、長さ24cmの弦ABがある。中心Oから弦ABまでの距離は？","answer":"5cm","options":["5cm","7cm","10cm","12cm"],"ex":"中心から弦に下ろした垂線は弦を二等分するので、弦の半分は12cm。距離をxとするとx²＋12²＝13²よりx²＝25、x＝5cmです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000226","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-SET-FUK01","topic_name":"関数大問セットA","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"【セットA①】直線y＝2x＋2とx軸の交点のx座標は？","answer":"−1","options":["−2","−1","1","2"],"ex":"x軸上ではy＝0なので、0＝2x＋2。よってx＝−1です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000227","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-SET-FUK01","topic_name":"関数大問セットA","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"【セットA②】直線y＝2x＋2とy＝−x＋5の交点のx座標は？","answer":"1","options":["1","2","3","4"],"ex":"2x＋2＝−x＋5より3x＝3、x＝1です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000228","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-SET-FUK01","topic_name":"関数大問セットA","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"【セットA③】前問の2直線の交点のy座標は？","answer":"4","options":["2","3","4","5"],"ex":"x＝1をy＝2x＋2へ代入し、y＝4です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-FUN-000229","subject":"数学","grade":"中3","unit":"関数","field_name":"関数","topic_id":"MAT-SET-FUK01","topic_name":"関数大問セットA","unit_id":"SC-MAT-G3-FUN","difficulty":"2","q":"【セットA④】点O(0,0)、A(−1,0)、B(1,4)でできる三角形OABの面積は？","answer":"2","options":["1","2","3","4"],"ex":"底辺OA＝1、高さはBのy座標4なので、1×4÷2＝2です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000230","subject":"数学","grade":"中2","unit":"図形","field_name":"図形","topic_id":"MAT-SET-FUK02","topic_name":"図形証明セットB","unit_id":"SC-MAT-G2-GEO","difficulty":"1","q":"【セットB①】三角形ABCでAB＝AC、∠B＝50°。∠Cは？","answer":"50°","options":["40°","50°","65°","80°"],"ex":"二等辺三角形では底角が等しいため、∠C＝∠B＝50°です。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000231","subject":"数学","grade":"中2","unit":"図形","field_name":"図形","topic_id":"MAT-SET-FUK02","topic_name":"図形証明セットB","unit_id":"SC-MAT-G2-GEO","difficulty":"1","q":"【セットB②】三角形ABCでAB＝AC、AからBCへ角の二等分線ADを引く。△ABDと△ACDで共通な辺は？","answer":"AD","options":["AB","AC","AD","BC"],"ex":"2つの三角形に共通して含まれる辺はADです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000232","subject":"数学","grade":"中2","unit":"図形","field_name":"図形","topic_id":"MAT-SET-FUK02","topic_name":"図形証明セットB","unit_id":"SC-MAT-G2-GEO","difficulty":"3","q":"【セットB③】AB＝AC、AD共通、∠BAD＝∠CADから使える合同条件は？","answer":"2組の辺とその間の角","options":["3組の辺","2組の辺とその間の角","1組の辺とその両端の角","2組の角"],"ex":"合同条件を選ぶ前に、どの辺と角が対応しているか整理します。AB＝AC、ADは共通なのでAD＝AD、さらに∠BAD＝∠CAD。等しい2辺にはさまれた角も等しいので、『2組の辺とその間の角』で合同と判断できます。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-GEO-000233","subject":"数学","grade":"中2","unit":"図形","field_name":"図形","topic_id":"MAT-SET-FUK02","topic_name":"図形証明セットB","unit_id":"SC-MAT-G2-GEO","difficulty":"2","q":"【セットB④】△ABD≡△ACDから言えることは？","answer":"BD＝CD","options":["BD＝CD","AB＝BC","∠A＝90°","AD＝BC"],"ex":"合同な三角形では対応する辺が等しいためBD＝CDです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-PRO-000234","subject":"数学","grade":"中2","unit":"確率","field_name":"確率","topic_id":"MAT-SET-FUK03","topic_name":"確率大問セットC","unit_id":"SC-MAT-G2-PRO","difficulty":"2","q":"【セットC①】1,2,3,4のカードから2枚を順に取り出して2桁の整数を作る。全部で何通り？","answer":"12","options":["6","8","12","16"],"ex":"十の位4通り、その後一の位3通りなので4×3＝12通りです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-PRO-000235","subject":"数学","grade":"中2","unit":"確率","field_name":"確率","topic_id":"MAT-SET-FUK03","topic_name":"確率大問セットC","unit_id":"SC-MAT-G2-PRO","difficulty":"1","q":"【セットC②】前問で偶数になるには一の位が何であればよい？","answer":"2または4","options":["1または3","2または4","1または2","3または4"],"ex":"2桁の整数が偶数になる条件は、一の位が偶数であることです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-PRO-000236","subject":"数学","grade":"中2","unit":"確率","field_name":"確率","topic_id":"MAT-SET-FUK03","topic_name":"確率大問セットC","unit_id":"SC-MAT-G2-PRO","difficulty":"2","q":"【セットC③】前問で偶数になる2桁の整数は何通り？","answer":"6","options":["4","6","8","10"],"ex":"一の位2のとき3通り、一の位4のとき3通りで合計6通りです。","skill":"reasoning","method":"auto"},{"id":"SC-MAT-PR function canonicalUnitId(q){

    if(q.unit.includes("現在完了"))return "SC-ENG-G3-PRF";
    if(q.unit.includes("関係代名詞"))return "SC-ENG-G3-REL";
    if(q.unit.includes("疑問詞"))return "SC-ENG-G1-WH";
    if(q.unit.includes("命令文"))return "SC-ENG-G1-IMP";
    if(q.unit.includes("複数形"))return "SC-ENG-G1-NOUN";
    if(q.unit.includes("代名詞"))return "SC-ENG-G1-PRON";
    if(q.unit.includes("there is"))return "SC-ENG-G1-THERE";
    if(q.unit.includes("接続詞"))return "SC-ENG-G2-CONJ";
    if(q.unit.includes("間接疑問"))return "SC-ENG-G3-IQ";
    if(q.unit==="会話表現")return "SC-ENG-CONV";
    if(q.unit==="長文読解")return "SC-ENG-READ";
    if(q.unit==="英作文")return "SC-ENG-WRITE";

function fieldOf(q){
  if(q.field_name)return q.field_name;
  if(q.subject==='社会'){
    if(q.unit.startsWith('歴史'))return '歴史';
    if(q.unit.startsWith('地理'))return '地理';
    if(q.unit.startsWith('公民'))return '公民';
  }
  if(q.subject==='理科')return q.unit;
  if(q.subject==='数学')return q.unit;
  if(q.subject==='国語'){
    if(q.unit==='漢字・語句')return '漢字・語句';
    if(q.unit==='文法')return '文法';
    if(q.unit==='古典')return '古典';
    if(q.unit==='表現')return '表現';
    return '読解';
  }
  if(q.subject==='英語')return q.word?'英単語':'文法';
  return q.unit;
}
function topicOf(q){return q.topic_name||q.unit;}
function textbookRank(q){
  const maps={
    '社会':['地理・世界','地理・日本','歴史・古代','歴史・中世','歴史・近世','歴史・近現代','公民・政治','公民・権利','公民・経済','公民・国際'],
    '数学':['数と式','方程式','関数','図形','データ','確率'],
    '英語':['英単語・基礎語彙','文法・be動詞','文法・一般動詞','文法・過去形','文法・関係代名詞'],
    '理科':['生物','化学','物理','地学'],
    '国語':['漢字・語句','文法','読解基礎','表現','古典']
  };
  const arr=maps[q.subject]||[];
  const i=arr.indexOf(q.unit);
  return i<0?999:i;
}

const MATH_UNIT_ORDER=['数と式','方程式','関数','図形','データ','確率'];
function mathPool(){return items.filter(q=>q.subject==='数学');}
function mathByDifficulty(pool,d){return pool.filter(q=>String(q.difficulty)===String(d));}
function mathRank(pool){
  const due=pool.filter(q=>status(q).name==='復習おすすめ').sort((a,b)=>status(b).priority-status(a).priority);
  const unseen=shuffle(pool.filter(q=>status(q).name==='未学習'&&!due.includes(q)));
  const seen=shuffle(pool.filter(q=>!due.includes(q)&&!unseen.includes(q)));
  return [...due,...unseen,...seen];
}
function mathPick(pool,kind,count=10){
  if(kind==='basic')return mathRank(mathByDifficulty(pool,1)).slice(0,count);
  if(kind==='standard'){
    const a=mathRank(mathByDifficulty(pool,2)).slice(0,Math.min(7,count));
    const b=mathRank(mathByDifficulty(pool,1)).filter(q=>!a.includes(q)).slice(0,count-a.length);
    const rest=mathRank(pool.filter(q=>['1','2'].includes(String(q.difficulty)))).filter(q=>![...a,...b].includes(q));
    return [...a,...b,...rest].slice(0,count);
  }
  if(kind==='exam'){
    const a=mathRank(mathByDifficulty(pool,3)).slice(0,Math.min(3,count));
    const b=mathRank(mathByDifficulty(pool,2)).filter(q=>!a.includes(q)).slice(0,count-a.length);
    const rest=mathRank(pool.filter(q=>['2','3'].includes(String(q.difficulty)))).filter(q=>![...a,...b].includes(q));
    return [...a,...b,...rest].slice(0,count);
  }
  return mathRank(pool).slice(0,count);
}

function start(isReview=false,specific=null,testChapter=null){
  historyTestContext=testChapter;
  if(BANK_ISSUES.length){
    mount('<section class="selection"><div class="page-title"><span class="eyebrow">CHECKING DATA</span><h1>教材データを確認中です。</h1><p class="muted">問題データの整合性に問題があるため、学習開始を一時停止しています。</p></div></section>');
    return;
  }
  if(mode==='written'){startWritten();return;}
  let candidates=eligible();
  if(specific)candidates=candidates.filter(q=>specific.includes(q.id));
  review=isReview;
  if(mode==='flashcard'){
    const ranked=[...candidates].sort((a,b)=>flashState(b).priority-flashState(a).priority||Math.random()-.5);
    queue=ranked.slice(0,Math.min(20,ranked.length));
    if(!queue.length){mount('<section class="selection"><div class="page-title"><h1>カードがありません。</h1></div><button class="primary" onclick="setup()">戻る</button></section>');return;}
    index=0;session=uid();sessionEvents=[];renderFlashcard();return;
  }
  const due=candidates.filter(q=>status(q).name==='復習おすすめ').sort((a,b)=>status(b).priority-status(a).priority);

  if(isReview){
    queue=due.slice(0,10);
  }else if(subject==='すべて'&&!specific){
    const subjects=['国語','数学','英語','理科','社会'];
    const signals=unitLearningSignals(30,'すべて');
    queue=[];

    for(const name of subjects){
      const pool=candidates.filter(q=>q.subject===name);
      const subjectSignals=signals.filter(x=>x.subject===name);
      const priorityUnits=subjectSignals.map(x=>x.unit_id);

      const duePool=pool.filter(q=>status(q).name==='復習おすすめ')
        .sort((a,b)=>status(b).priority-status(a).priority);

      const signalPool=[];
      for(const unitId of priorityUnits){
        signalPool.push(...shuffle(pool.filter(q=>q.unit_id===unitId&&!duePool.includes(q))));
      }

      const unseen=shuffle(pool.filter(q=>status(q).name==='未学習'));
      const seen=shuffle(pool.filter(q=>!['未学習','復習おすすめ'].includes(status(q).name)));
      const ranked=[...duePool,...signalPool,...unseen,...seen];

      const picked=[];
      for(const q of ranked){
        if(!picked.length){picked.push(q);continue;}
        if(picked.length===1&&q.unit_id!==picked[0].unit_id){picked.push(q);break;}
      }
      if(picked.length<2){
        for(const q of ranked){
          if(picked.length>=2)break;
          if(!picked.includes(q))picked.push(q);
        }
      }
      queue.push(...picked);
    }

    const rest=[
      ...due,
      ...shuffle(candidates.filter(q=>status(q).name==='未学習')),
      ...shuffle(candidates.filter(q=>!['未学習','復習おすすめ'].includes(status(q).name)))
    ];
    for(const q of rest)if(queue.length<10&&!queue.includes(q))queue.push(q);
    queue=shuffle(queue.slice(0,10));
  }else{
    const unseen=shuffle(candidates.filter(q=>status(q).name==='未学習'));
    const seen=shuffle(candidates.filter(q=>!['未学習','復習おすすめ'].includes(status(q).name)));
    queue=[...due.slice(0,3),...unseen.slice(0,5),...seen.slice(0,2)];
    for(const q of [...unseen,...due,...seen])if(queue.length<10&&!queue.includes(q))queue.push(q);
    queue=shuffle(queue);
  }

  if(!queue.length){
    mount('<section class="selection"><div class="page-title"><span class="eyebrow">ALL CLEAR</span><h1>今の復習は完了。</h1><p class="muted">復習候補ができたら、ここに表示します。</p></div><button class="primary" onclick="setup()">新しい問題を解く <span>↗</span></button></section>');
    nav('review');
    return;
  }
  index=0;session=uid();sessionEvents=[];renderQ();
}

function recommendationReason(u){

  if(u.due>=2)return "復習タイミングの問題が増えています";
  if(u.skipped>=1)return "「あとで解く」が残っています";
  if(u.wrong>=1)return "最近の誤答をもう一度確認したい単元です";

function recommendationLevel(u){

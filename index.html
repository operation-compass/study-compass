function buildWordOptions(w,i){
  const same=WORDS.filter(x=>x.id!==w.id&&x.pos===w.pos).map(x=>x.meaning);
  const rest=WORDS.filter(x=>x.id!==w.id).map(x=>x.meaning);
  const pool=[...same,...rest].filter((v,j,a)=>a.indexOf(v)===j&&v!==w.meaning);
  const picks=[];
  for(let k=0;k<pool.length&&picks.length<3;k++){const v=pool[(i*3+k)%pool.length];if(!picks.includes(v))picks.push(v);}
  return [w.meaning,...picks];
}

function canonicalUnitId(q){
  if(q.subject==="英語"){
    if(q.word||q.unit==="英単語・基礎語彙")return "SC-ENG-G1-VOC";
    if(q.unit.includes("be動詞"))return "SC-ENG-G1-BE";
    if(q.unit.includes("一般動詞"))return "SC-ENG-G1-GV";
    if(q.unit.includes("過去形"))return "SC-ENG-G2-PST";
    if(q.unit.includes("関係代名詞"))return "SC-ENG-G3-REL";
  }
  if(q.subject==="社会"){
    if(q.unit.includes("地理"))return "SC-SOC-G1-GEO";
    if(q.unit.includes("歴史・古代"))return "SC-SOC-G1-ANC";
    if(q.unit.includes("歴史・中世"))return "SC-SOC-G2-MED";
    if(q.unit.includes("歴史・近世"))return "SC-SOC-G2-EARLY";
    if(q.unit.includes("歴史・近現代"))return "SC-SOC-G3-MOD";
    if(q.unit.includes("公民"))return "SC-SOC-G3-CIV";
  }
  if(q.subject==="国語"){
    if(q.unit==="漢字・語句")return "SC-JPN-G1-KAN";
    if(q.unit==="文法")return "SC-JPN-G2-GRA";
    if(q.unit==="古典")return "SC-JPN-G3-CLS";
    if(q.unit==="表現")return "SC-JPN-G2-EXP";
    if(q.unit==="読解基礎")return "SC-JPN-G3-REA";
  }
  if(q.subject==="数学"){
    if(q.unit==="数と式")return "SC-MAT-G1-ALG";
    if(q.unit==="方程式")return "SC-MAT-G1-EQU";
    if(q.unit==="図形")return "SC-MAT-G2-GEO";
    if(q.unit==="データ")return "SC-MAT-G2-DAT";
    if(q.unit==="確率")return "SC-MAT-G2-PRO";
    if(q.unit==="関数")return q.id.includes("-QFUN-")?"SC-MAT-G3-FUN":"SC-MAT-G2-FUN";
  }
  if(q.subject==="理科"){
    if(q.unit==="生物")return "SC-SCI-G1-BIO";
    if(q.unit==="化学")return "SC-SCI-G2-CHE";
    if(q.unit==="物理")return "SC-SCI-G3-PHY";
    if(q.unit==="地学")return "SC-SCI-G2-EAR";
  }
  return "";
}

function validateQuestionBank(){
  const ids=new Set(),issues=[];
  for(const q of items){
    if(!q?.id||!q?.q||!q?.answer||!Array.isArray(q.options)||q.options.length!==4)issues.push(q?.id||"unknown");
    if(q?.id&&ids.has(q.id))issues.push("duplicate:"+q.id);
    if(q?.id)ids.add(q.id);
    if(Array.isArray(q?.options)&&(new Set(q.options).size!==4||!q.options.includes(q.answer)))issues.push("options:"+q.id);
    if(!q?.unit_id||!VALID_UNIT_IDS.has(q.unit_id))issues.push("unit:"+q.id);
  }
  return issues;
}

function start(isReview=false,specific=null){
  if(BANK_ISSUES.length){
    mount('<section class="selection"><div class="page-title"><span class="eyebrow">CHECKING DATA</span><h1>教材データを確認中です。</h1><p class="muted">問題データの整合性に問題があるため、学習開始を一時停止しています。</p></div></section>');
    return;
  }
  let candidates=eligible();
  if(specific)candidates=candidates.filter(q=>specific.includes(q.id));
  review=isReview;
  const due=candidates.filter(q=>status(q).name==='復習おすすめ').sort((a,b)=>status(b).priority-status(a).priority);

  if(isReview){
    queue=due.slice(0,10);
  }else if(subject==='すべて'&&!specific){
    const subjects=['国語','数学','英語','理科','社会'];
    const signals=unitLearningSignals(30,'すべて');
    queue=[];

    for(const name of subjects){
      const pool=candidates.filter(q=>q.subject===name);
      const subjectSignals=signals.filter(x=>x.subject===name);
      const priorityUnits=subjectSignals.map(x=>x.unit_id);

      const duePool=pool.filter(q=>status(q).name==='復習おすすめ')
        .sort((a,b)=>status(b).priority-status(a).priority);

      const signalPool=[];
      for(const unitId of priorityUnits){
        signalPool.push(...shuffle(pool.filter(q=>q.unit_id===unitId&&!duePool.includes(q))));
      }

      const unseen=shuffle(pool.filter(q=>status(q).name==='未学習'));
      const seen=shuffle(pool.filter(q=>!['未学習','復習おすすめ'].includes(status(q).name)));
      const ranked=[...duePool,...signalPool,...unseen,...seen];

      const picked=[];
      for(const q of ranked){
        if(!picked.length){picked.push(q);continue;}
        if(picked.length===1&&q.unit_id!==picked[0].unit_id){picked.push(q);break;}
      }
      if(picked.length<2){
        for(const q of ranked){
          if(picked.length>=2)break;
          if(!picked.includes(q))picked.push(q);
        }
      }
      queue.push(...picked);
    }

    const rest=[
      ...due,
      ...shuffle(candidates.filter(q=>status(q).name==='未学習')),
      ...shuffle(candidates.filter(q=>!['未学習','復習おすすめ'].includes(status(q).name)))
    ];
    for(const q of rest)if(queue.length<10&&!queue.includes(q))queue.push(q);
    queue=shuffle(queue.slice(0,10));
  }else{
    const unseen=shuffle(candidates.filter(q=>status(q).name==='未学習'));
    const seen=shuffle(candidates.filter(q=>!['未学習','復習おすすめ'].includes(status(q).name)));
    queue=[...due.slice(0,3),...unseen.slice(0,5),...seen.slice(0,2)];
    for(const q of [...unseen,...due,...seen])if(queue.length<10&&!queue.includes(q))queue.push(q);
    queue=shuffle(queue);
  }

  if(!queue.length){
    mount('<section class="selection"><div class="page-title"><span class="eyebrow">ALL CLEAR</span><h1>今の復習は完了。</h1><p class="muted">復習候補ができたら、ここに表示します。</p></div><button class="primary" onclick="setup()">新しい問題を解く <span>↗</span></button></section>');

function unitLearningSignals(daysCount=30,subjectFilter='すべて'){
  const daySet=new Set(Array.from({length:daysCount},(_,i)=>localDay(Date.now()-i*DAY)));
  const base=events.filter(e=>daySet.has(e.date)&&(subjectFilter==='すべて'||e.subject===subjectFilter));
  const units=[...new Map(items.filter(q=>subjectFilter==='すべて'||q.subject===subjectFilter).map(q=>[q.unit_id,{unit_id:q.unit_id,subject:q.subject,unit:q.unit}])).values()];
  return units.map(u=>{
    const qs=items.filter(q=>q.unit_id===u.unit_id),ids=new Set(qs.map(q=>q.id));
    const ev=base.filter(e=>eventUnitId(e)===u.unit_id||ids.has(e.id));
    const gradedEv=ev.filter(e=>e.event_type==='graded');
    const wrong=gradedEv.filter(e=>e.outcome==='incorrect').length;
    const correct=gradedEv.filter(e=>e.outcome==='correct').length;
    const skipped=ev.filter(e=>e.event_type==='skipped').length;
    const attempted=qs.filter(q=>events.some(e=>e.id===q.id)).length;
    const due=qs.filter(q=>status(q).name==='復習おすすめ'&&events.some(e=>e.id===q.id)).length;
    const stable=qs.filter(q=>status(q).name==='定着の目安').length;
    const interactions=gradedEv.length+skipped;
    const errorRate=gradedEv.length?wrong/gradedEv.length:0;
    const dueRatio=attempted?due/attempted:0;
    const skipRate=interactions?skipped/interactions:0;
    const stableRatio=attempted?stable/attempted:0;
    const score=interactions>=2?Math.round(errorRate*55+dueRatio*30+skipRate*15-stableRatio*20):null;

function recommendationLevel(u){

function reviewSetup(){mode='mcq';subject='すべて';const due=items.filter(q=>status(q).name==='復習おすすめ').sort((a,b)=>status(b).priority-status(a).priority);mount('<div class="page-title"><span class="eyebrow">NEXT TO REVIEW</span><h1>次に見直すところ。</h1><p class="muted">間違い・あとで解く・復習時期をもとに優先度を決めます。</p></div><section class="panel">'+(due.length?due.slice(0,10).map((q,i)=>{const lastAll=events.filter(e=>e.id===q.id).at(-1),lastGraded=graded().filter(e=>e.id===q.id).at(-1);let reason='復習のタイミング',cls='wait';if(lastAll?.event_type==='skipped'){reason='あとで解く';cls='high';}else if(lastGraded?.outcome==='incorrect'){reason='前回の間違い';cls='high';}return '<div class="review-item"><span class="number">'+String(i+1).padStart(2,'0')+'</span><div><b>'+esc(q.q)+'</b><small>'+esc(q.subject+' / '+q.unit)+'</small><span class="review-badge '+cls+'">'+reason+'</span></div></div>';}).join('')+'<button class="primary" onclick="start(true)">優先度順に'+Math.min(due.length,10)+'問を復習 <span>→</span></button>':'<div class="empty">今の復習候補はありません。<br>学習を進めると、ここに表示します。</div><button class="secondary" onclick="setup()">新しい問題を解く</button>')+'</section>');nav('review');}
function status(q,skill=q.skill,method=q.method){const a=series(q,skill,method),lastEvent=events.filter(e=>e.id===q.id&&e.event_type!=='viewed').at(-1);if(!a.length&&!lastEvent)return {name:'未学習',priority:0,streak:0};const z=a.at(-1);let streak=0,prev=null;for(let i=a.length-1;i>=0;i--){const e=a[i];if(e.outcome!=='correct'||e.assisted)break;if(prev===null||prev-e.at>=DAY){streak++;prev=e.at;}}const stable=streak>=2,due=(z?.at||lastEvent.at)+DAY*(stable?3:1),late=Math.max(0,Math.floor((Date.now()-due)/DAY));const skipped=lastEvent?.event_type==='skipped';return {name:skipped||!z||z.outcome!=='correct'||Date.now()>=due?'復習おすすめ':stable?'定着の目安':'練習中',priority:(skipped?40:z?.outcome==='incorrect'?60:0)+Math.min(late,7)*3+a.slice(-3).filter(e=>e.outcome==='incorrect').length*5+10,streak,due};}
function dashboard(){const days=Array.from({length:period},(_,i)=>localDay(Date.now()-(period-1-i)*DAY)),periodEvents=graded().filter(e=>days.includes(e.date)),a=periodEvents.filter(e=>filterSubject==='すべて'||e.subject===filterSubject),correct=a.filter(e=>e.outcome==='correct').length,candidates=items.filter(q=>filterSubject==='すべて'||q.subject===filterSubject),covered=candidates.filter(q=>series(q,q.skill,q.method).length).length,imp=improvement(a),times=a.filter(e=>e.timing_valid).map(e=>e.active_ms).sort((a,b)=>a-b),median=times.length?(times.length%2?times[(times.length-1)/2]:(times[times.length/2-1]+times[times.length/2])/2):null;const shown=days.slice(-7).map(date=>{const b=a.filter(e=>e.date===date);return {date,n:b.length,c:b.filter(e=>e.outcome==='correct').length};}),max=Math.max(1,...shown.map(d=>d.n));const points=shown.map((d,i)=>d.n?{x:24+i*45,y:110-d.c/d.n*90}:null);let lines='';for(let i=1;i<points.length;i++)if(points[i]&&points[i-1])lines+='<line x1="'+points[i-1].x+'" y1="'+points[i-1].y+'" x2="'+points[i].x+'" y2="'+points[i].y+'" stroke="#16715f" stroke-width="3"/>';const groups=[...new Set(candidates.map(q=>q.subject+' / '+q.unit))],dueCount=candidates.filter(q=>status(q).name==='復習おすすめ').length,stableCount=candidates.filter(q=>status(q).name==='定着の目安').length,subjectRates=['国語','数学','英語','理科','社会'].map(name=>{const z=periodEvents.filter(e=>e.subject===name);return {name,n:z.length,rate:z.length?Math.round(z.filter(e=>e.outcome==='correct').length/z.length*100):null};});const unitSignals=unitLearningSignals(period,filterSubject),focus=unitSignals.filter(u=>recommendationLevel(u)!=='light').slice(0,3);mount('<div class="page-title"><span class="eyebrow">YOUR LEARNING MAP</span><h1>学習の現在地。</h1><p class="muted">できたことと、次に伸ばすところ。</p></div><div class="filters"><select aria-label="期間" onchange="period=Number(this.value);dashboard()"><option value="7">7日間</option><option value="30">30日間</option></select><select aria-label="教科" onchange="filterSubject=this.value;dashboard()"><option>すべて</option><option>国語</option><option>数学</option><option>英語</option><option>理科</option><option>社会</option></select></div><section class="dash-callout"><small>NEXT ACTION</small><strong>'+(focus.length?esc(focus[0].subject+' / '+focus[0].unit):dueCount?'復習 '+dueCount+'問から始めよう':'新しい問題を進めよう')+'</strong><p>'+(focus.length?esc(recommendationReason(focus[0])):dueCount?'直近の誤答・スキップ・復習時期の問題を優先しています。':'今は復習候補がありません。新しい問題を進めて記録を増やしましょう。')+'</p>'+(focus.length?'<button class="text-button" onclick="focusUnit(\''+focus[0].unit_id+'\')">この単元を確認 →</button>':'')+'</section><div class="metrics"><div class="metric"><small>正解数 / 回答数</small><strong>'+correct+'<small> / '+a.length+'</small></strong></div><div class="metric"><small>4択の正答率</small><strong>'+(a.length?Math.round(correct/a.length*100)+'%':'—')+'</strong></div><div class="metric"><small>学習した問題（累計）</small><strong>'+covered+'<small> / '+candidates.length+'</small></strong></div></div><div class="dash-summary"><div class="summary-card"><small>復習おすすめ</small><strong>'+dueCount+'問</strong><span class="muted">次に見直したい問題</span></div><div class="summary-card"><small>定着の目安</small><strong>'+stableCount+'問</strong><span class="muted">日を空けて正解できた問題</span></div></div><section class="panel"><h2>次に伸ばす単元</h2><p class="section-hint">期間内の誤答・スキップ・復習時期をもとにした学習優先候補です。入試得点や学力判定ではありません。</p>'+(focus.length?focus.map((u,i)=>'<div class="review-item"><span class="number">'+String(i+1).padStart(2,'0')+'</span><div><b>'+esc(u.subject+' / '+u.unit)+'</b><small>'+esc(recommendationReason(u))+'<br>誤答 '+u.wrong+' · 復習 '+u.due+' · 取り組み '+u.attempted+'/'+u.questions+'問</small><span class="review-badge '+(recommendationLevel(u)==='high'?'high':'wait')+'">'+(recommendationLevel(u)==='high'?'優先して確認':'確認候補')+'</span></div><button class="text-button" onclick="focusUnit(\''+u.unit_id+'\')">10問で確認 →</button></div>').join(''):'<div class="empty">まだ単元判定に十分な記録がありません。<br>2回以上の回答がある単元から候補を出します。</div>')+'</section><div class="dash-grid"><section class="panel"><h2>学習量の推移</h2><p class="section-hint">選択した期間のうち、直近7日を表示</p><div class="bars">'+shown.map(d=>'<div class="day"><span>'+d.n+'</span><i style="height:'+d.n/max*96+'px"></i><span>'+d.date.slice(5)+'</span></div>').join('')+'</div><p class="legend">直近7日の回答数。正解・誤答を含みます。</p></section><section class="panel"><h2>正答率の推移</h2><p class="section-hint">回答がある日の4択正答率</p><svg class="chart" viewBox="0 0 320 135" role="img" aria-label="直近7日の4択正答率。日別数値は下に表示"><path d="M18 20H310M18 65H310M18 110H310" stroke="#e5e9e0"/>'+lines+points.map(p=>p?'<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#16715f"/>':'').join('')+'</svg><div class="chart-caption">'+shown.map(d=>'<span>'+d.date.slice(5)+'<br>'+(d.n?Math.round(d.c/d.n*100)+'%':'—')+'</span>').join('')+'</div></section><section class="panel"><h2>教科ごとの正答率</h2><div class="subject-rate">'+subjectRates.map(r=>'<div class="subject-rate-row"><span>'+r.name+'</span><div class="track"><i style="width:'+(r.rate===null?0:r.rate)+'%"></i></div><b>'+(r.rate===null?'—':r.rate+'%')+'</b></div>').join('')+'</div><p class="legend">期間内の5教科比較です。上の教科フィルターには左右されません。回答がない教科は—です。</p></section><section class="panel"><h2>教科・単元ごとの状態</h2>'+groups.map(g=>{const qs=candidates.filter(q=>q.subject+' / '+q.unit===g),states=qs.map(q=>status(q)),n=states.filter(s=>s.name!=='未学習').length,b=a.filter(e=>e.subject+' / '+e.unit===g);return '<details class="unit"><summary><b>'+esc(g)+'</b><br><small>'+n+' / '+qs.length+'問に取り組み済み · '+(b.length?Math.round(b.filter(e=>e.outcome==='correct').length/b.length*100)+'%（'+b.length+'回答）':'回答なし')+'</small></summary><div class="track"><i style="width:'+n/qs.length*100+'%"></i></div><p>'+['未学習','練習中','復習おすすめ','定着の目安'].map(n=>n+' '+states.filter(s=>s.name===n).length).join(' / ')+'</p><small>'+(qs.length<5?'問題数が少ないため参考値。':'')+'4択の結果から見た状態です。</small></details>';}).join('')+'</section><section class="panel"><h2>復習での変化</h2><div class="metric"><small>24時間以降の再回答で正解</small><strong>'+imp.yes+'<small> / '+imp.total+'</small></strong></div><p class="legend">誤答後、24時間以上空けた最初の再回答。同じ問題版を比較。再回答待ち '+imp.pending+'問。</p><div class="metric"><small>回答時間の中央値</small><strong>'+(median===null?'—':Math.round(median/1000)+'秒')+'</strong></div><p class="legend">有効な時間記録 '+times.length+'件。速さは習熟判定に使いません。</p></section></div><div class="section-label"><h2>記録の詳細</h2></div><section class="panel"><details><summary>最近20件・連続正解</summary>'+a.slice(-20).reverse().map(e=>'<div class="history">'+e.date+' · '+esc(e.subject)+' · '+(e.outcome==='correct'?'正解':'誤答')+'<br><span>'+esc(items.find(q=>q.id===e.id)?.q||e.id)+'<br>'+(e.timing_valid?Math.round(e.active_ms/1000)+'秒':'時間なし')+' · 日を空けた連続正解 '+status(items.find(q=>q.id===e.id),e.skill,e.method).streak+'</span></div>').join('')+'</details><p class="legend">同日の連続正解を定着に数えません。選択での習熟の目安で、書字・綴り・自力記述は測定していません。v0.2以前の履歴は保持し、この4択の集計と分けています。</p><div class="history-tools"><button onclick="exportData()">履歴を保存</button><button onclick="clearData()">v0.3の履歴を削除</button></div></section>'+note());view.querySelectorAll('select')[0].value=String(period);view.querySelectorAll('select')[1].value=filterSubject;nav('chart');}

表","headers":["政策","内容"],"rows":[["太閤検地","田畑の面積・生産力・耕作者を調査"],["刀狩","農民から武器を取り上げる"]],"note":"学習用に整理した資料です。史料原文ではありません。"}},{"id":"SC-SOC-HIS-DATA-000007","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"表のAとBの組み合わせで正しいのは？","answer":"A：上方、B：江戸","options":["A：上方、B：江戸","A：江戸、B：上方","A：奈良、B：鎌倉","A：鎌倉、B：奈良"],"ex":"元禄文化は上方、化政文化は江戸の町人を中心に発達しました。人物や作品も結び付けましょう。","practice_kind":"資料の読み取り","material":{"title":"比較表","headers":["文化","中心地"],"rows":[["元禄文化","A"],["化政文化","B"]],"note":"学習用に整理した資料です。史料原文ではありません。"}},{"id":"SC-SOC-HIS-DATA-000008","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"表の二つの条約を比較すると、通商条約に含まれた不平等な内容は？","answer":"領事裁判権を認め、関税自主権がなかった","options":["領事裁判権を認め、関税自主権がなかった","参勤交代を義務づけた","男女に選挙権を認めた","藩を廃止した"],"ex":"裁判と関税の二点が重要です。開港だけを理由に不平等条約と判断しないようにしましょう。","practice_kind":"資料の読み取り","material":{"title":"比較表","headers":["条約","主な内容"],"rows":[["日米和親条約","下田・函館の開港"],["日米修好通商条約","領事裁判権を認める、関税自主権がない"]],"note":"学習用に整理した資料です。史料原文ではありません。"}},{"id":"SC-SOC-HIS-DATA-000009","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"この表の政策に共通するねらいは？","answer":"近代国家をつくり国力を高める","options":["近代国家をつくり国力を高める","摂関政治を復活させる","幕府の大名支配を強める","外国との交流をすべてやめる"],"ex":"教育・軍事・産業を整備し、欧米に対抗できる近代国家をつくろうとしました。","practice_kind":"資料の読み取り","material":{"title":"比較表","headers":["政策","内容"],"rows":[["学制","学校制度の整備"],["徴兵令","近代的な軍隊の整備"],["殖産興業","近代産業の育成"]],"note":"学習用に整理した資料です。史料原文ではありません。"}},{"id":"SC-SOC-HIS-DATA-000010","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"表の二つの法律が同じ年に成立したことから読み取れる状況は？","answer":"政治参加の拡大と思想の統制が同時に進んだ","options":["政治参加の拡大と思想の統制が同時に進んだ","女性参政権がこの年に実現した","国会が廃止された","すべての言論規制がなくなった"],"ex":"普通選挙法による参加拡大と、治安維持法による統制を両面から捉えます。女性参政権は戦後です。","practice_kind":"資料の読み取り","material":{"title":"比較表","headers":["法律","内容"],"rows":[["普通選挙法（1925年）","25歳以上の男子に選挙権"],["治安維持法（1925年）","国体の変革や私有財産制度の否認を目的とする結社などを取り締まる"]],"note":"学習用に整理した資料です。史料原文ではありません。"}},{"id":"SC-SOC-HIS-DATA-000011","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"空欄Aに入る出来事は？","answer":"太平洋戦争の開始","options":["太平洋戦争の開始","日露戦争の開始","第一次世界大戦の開始","朝鮮戦争の開始"],"ex":"太平洋戦争は1941年に始まりました。満州事変→日中戦争→太平洋戦争の順に整理します。","practice_kind":"資料の読み取り","material":{"title":"年表","headers":["年","出来事"],"rows":[["1931","満州事変"],["1937","日中戦争の本格化"],["1941","A"],["1945","日本の降伏"]],"note":"学習用に整理した資料です。史料原文ではありません。"}},{"id":"SC-SOC-HIS-DATA-000012","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"この年表で、条約の調印と主権回復について正しい説明は？","answer":"主権回復は条約発効の1952年","options":["主権回復は条約発効の1952年","調印した1951年に必ず主権を回復した","国連加盟した1956年に初めて条約に調印した","1947年にこの条約が発効した"],"ex":"調印と発効は別の時点です。1952年に条約が発効して占領が終わり、日本は主権を回復しました。","practice_kind":"資料の読み取り","material":{"title":"年表","headers":["年","出来事"],"rows":[["1951","サンフランシスコ平和条約に調印"],["1952","同条約が発効"],["1956","日本が国際連合へ加盟"]],"note":"学習用に整理した資料です。史料原文ではありません。"}},{"id":"SC-SOC-HIS-WRITE-000001","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"稲作の広がりによる社会の変化の説明として適切なのは？","answer":"米の蓄えや土地の所有に差が生まれ、土地や水をめぐる争いが起こったため。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"稲作が広がると、なぜむらの間で争いや身分の差が生まれたのか。米・土地に触れて説明しよう。","check_points":["米や土地の所有の差","土地や水をめぐる争い"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000002","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"墾田永年私財法と土地の変化の説明として適切なのは？","answer":"新しく開墾した土地の永久私有が認められ、貴族や寺院などの私有地が広がった。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"墾田永年私財法によって、土地の所有はどのように変わったか。開墾・私有の二語を使って説明しよう。","check_points":["開墾した土地が対象","永久私有が認められた"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000003","subject":"社会","grade":"中1〜中3","unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"元寇後の御家人の困窮の説明として適切なのは？","answer":"防衛のために戦費を負担した一方、新たな領地を得られず十分な恩賞を受けにくかったため。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"元寇後、御家人の生活が苦しくなった理由を、戦費と恩賞の両面から説明しよう。","check_points":["防衛・戦費の負担","新たな領地を得られず恩賞が不足"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000004","subject":"社会","grade":"中1〜中3","unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"勘合を用いた理由の説明として適切なのは？","answer":"明が倭寇と正式な貿易船を区別するために、勘合を使って船を確認した。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"日明貿易で勘合を使った理由を、倭寇との関係から説明しよう。","check_points":["倭寇と正式な貿易船の区別","勘合による確認"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000005","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"太閤検地のねらいの説明として適切なのは？","answer":"田畑の面積や生産力、耕作者を調べて、年貢を納める基準と負担する者を明確にするため。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"太閤検地のねらいを、土地の生産力と年貢に触れて説明しよう。","check_points":["土地の面積・生産力を調査","年貢の基準や負担者を明確にする"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000006","subject":"社会","grade":"中1〜中3","unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"参勤交代と大名統制の説明として適切なのは？","answer":"大名に江戸と領地の往復や江戸滞在を義務づけ、費用の負担と妻子の江戸居住によって統制を強めた。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"参勤交代が大名統制に役立った理由を、経済的負担と江戸滞在に触れて説明しよう。","check_points":["江戸と領地の往復・江戸滞在","費用負担や妻子の江戸居住による統制"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000007","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"産業革命とアジア","q":"工業化とアジア進出の説明として適切なのは？","answer":"機械工業の発達で大量生産が進み、原料の供給地と製品を売る市場を求めたため。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"産業革命後、欧米諸国がアジアへ進出した理由を、原料と市場の二語を使って説明しよう。","check_points":["原料の供給地を求めた","製品を売る市場を求めた"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000008","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"不平等条約の二つの内容の説明として適切なのは？","answer":"アメリカの領事裁判権を認め、日本に関税自主権がなかったため。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"日米修好通商条約が不平等条約とされる理由を、裁判と関税の二点から説明しよう。","check_points":["領事裁判権を認めた","関税自主権がなかった"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000009","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"地租改正と政府収入の説明として適切なのは？","answer":"収穫高ではなく地価を基準とし、土地所有者に現金で税を納めさせたため。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"地租改正が政府収入の安定に役立った理由を、税の基準と納め方に触れて説明しよう。","check_points":["収穫高でなく地価を基準","土地所有者が現金で納税"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000010","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"第一次世界大戦と日本経済の説明として適切なのは？","answer":"ヨーロッパ諸国の生産やアジア向け輸出が戦争で減り、日本製品への需要と日本の輸出が増えたため。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"第一次世界大戦中に日本で好景気になった理由を、ヨーロッパと輸出の関係から説明しよう。","check_points":["欧州の生産・輸出の減少","日本製品への需要や輸出の増加"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000011","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"農地改革のねらいの説明として適切なのは？","answer":"地主の農地を政府が買い上げ小作農に売り渡し、自作農を増やして地主への依存を弱めようとした。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"戦後の農地改革が農村をどう変えようとしたか。地主と小作農に触れて説明しよう。","check_points":["地主の土地を小作農へ売り渡す","自作農を増やす"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-WRITE-000012","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"経済成長と公害の説明として適切なのは？","answer":"工業生産が急増する一方で環境対策が十分でなく、工場の排水や排煙が水や空気を汚染したため。","options":[],"ex":"原因・目的と結果のつながりを、自分の言葉で説明しましょう。","practice_kind":"記述練習","writing_prompt":"高度経済成長期に公害が深刻化した理由を、工業化と環境への影響に触れて説明しよう。","check_points":["工業生産の増大","排水・排煙による汚染と対策の不足"],"word_guide":"40〜80字程度を目安に。内容が伝わることを優先。","type":"written"},{"id":"SC-SOC-HIS-LEVEL-000001","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"世界の古代文明","q":"ナイル川流域で発展し、ピラミッドや象形文字で知られる文明は？","answer":"エジプト文明","options":["エジプト文明","メソポタミア文明","インダス文明","中国文明"],"ex":"文明名だけでなく、川・地域・文字を一組で覚えよう。ナイル川とピラミッドはエジプト文明の手がかり。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000002","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"弥生","q":"弥生時代の高床倉庫は、主に何を保存するための建物だった？","answer":"収穫した穀物","options":["収穫した穀物","仏教の経典","輸入した鉄砲","領主の城の設計図"],"ex":"稲作が広まり、収穫物を蓄える必要が生じた。床を高くする構造は湿気や害獣を防ぐのに役立った。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000003","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"743年、開墾した土地の永久私有を認めた法は？","answer":"墾田永年私財法","options":["墾田永年私財法","三世一身法","御成敗式目","武家諸法度"],"ex":"「開墾した土地」「永久私有」が決め手。三世一身法では私有できる期間に限りがあった。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000004","subject":"社会","grade":2,"unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉幕府で、将軍と主従関係を結んだ武士を何という？","answer":"御家人","options":["御家人","国司","公家","名主"],"ex":"御家人は将軍から土地の保護などの恩を受け、軍役などの奉公を行った。武士全員を指す名称ではない。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000005","subject":"社会","grade":2,"unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"日明貿易で、正式な貿易船と倭寇を区別するために使った証明は？","answer":"勘合","options":["勘合","地券","朱印状","五箇条の御誓文"],"ex":"勘合は照合用の証明。朱印状は主に安土桃山・江戸初期の朱印船貿易と結び付ける。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000006","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"大名が領地と江戸を往復して勤務する制度は？","answer":"参勤交代","options":["参勤交代","廃藩置県","班田収授法","徴兵令"],"ex":"参勤交代は大名統制の仕組み。往復や江戸滞在に費用がかかり、大名の財政にも負担となった。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-2syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000007","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"市民革命","q":"1689年のイギリスで、議会の権利を確認した文書は？","answer":"権利の章典","options":["権利の章典","独立宣言","人権宣言","南京条約"],"ex":"名誉革命の翌年の文書。アメリカの独立宣言、フランスの人権宣言と国を取り違えない。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://e-clus.com/course/detail/886"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000008","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"産業革命とアジア","q":"18世紀後半から産業革命が最初に本格化した国は？","answer":"イギリス","options":["イギリス","日本","清","ロシア"],"ex":"綿工業などで機械化が進み、工場制機械工業が発達した。国名と生産方法の変化をセットにする。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://e-clus.com/course/detail/1102"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000009","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"1873年の地租改正で、地租を納める義務を負ったのは？","answer":"土地の所有者","options":["土地の所有者","土地を所有しない小作人だけ","藩主だけ","外国の領事"],"ex":"地価を基準とする税を、土地所有者が現金で納めた。耕している人と所有している人は必ずしも同じではない。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://www.archives.go.jp/ayumi/kobetsu/m06_1873_03.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000010","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"1925年の普通選挙法で衆議院議員の選挙権を認められたのは、原則としてどの人々？","answer":"満25歳以上の男子","options":["満25歳以上の男子","満25歳以上の男女","満18歳以上の男女","一定額以上を納税した男子だけ"],"ex":"納税額の条件はなくなったが、女子にはまだ選挙権がなかった。当時の「普通選挙」と現在の制度は異なる。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://www.archives.go.jp/learning/archive_collection_1/"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000011","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"1929年のアメリカの株価暴落をきっかけに広がった世界的な不況は？","answer":"世界恐慌","options":["世界恐慌","高度経済成長","第一次石油危機","バブル景気"],"ex":"出来事の時期を確認しよう。世界恐慌は1929年から、第一次石油危機は1973年に起きた。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000012","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"日本国憲法の基本原則で、政治の最終的な決定権が国民にあることを何という？","answer":"国民主権","options":["国民主権","天皇主権","領事裁判権","関税自主権"],"ex":"主権は国の政治を最終的に決める権力。国民主権・基本的人権の尊重・平和主義の三原則を整理する。","difficulty":"基礎","practice_kind":"用語・人物","source_refs":["https://www.archives.go.jp/owning/mini_img/1-4.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000013","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"縄文","q":"縄文時代と弥生時代の暮らしを比べた説明として適切なのは？","answer":"縄文では狩猟・採集・漁労が中心で、弥生では水田稲作が広まった","options":["縄文では狩猟・採集・漁労が中心で、弥生では水田稲作が広まった","縄文で鉄砲が広まり、弥生で打製石器が初めて使われた","縄文に武家政権ができ、弥生に律令国家が成立した","縄文も弥生も、すべての人が同じ仕事だけをした"],"ex":"時代全体の傾向を比べる問題。弥生でも狩猟や漁労は続いたので、「完全に入れ替わった」とは考えない。","difficulty":"標準","practice_kind":"理由・比較","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000014","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"飛鳥","q":"次のできごとを古い順に並べたものは？","answer":"大化の改新 → 大宝律令 → 平城京への遷都","options":["大化の改新 → 大宝律令 → 平城京への遷都","大宝律令 → 大化の改新 → 平城京への遷都","平城京への遷都 → 大化の改新 → 大宝律令","大化の改新 → 平城京への遷都 → 大宝律令"],"ex":"645年・701年・710年の順。改革の開始、律令の整備、奈良の都という流れと結び付ける。","difficulty":"標準","practice_kind":"年代・順序","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000015","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"摂関政治と院政の違いとして適切なのは？","answer":"摂関政治では摂政・関白が、院政では上皇が政治を主導した","options":["摂関政治では摂政・関白が、院政では上皇が政治を主導した","摂関政治では御家人が、院政では町人が政治を主導した","摂関政治では上皇が、院政では摂政・関白が政治を主導した","両方とも征夷大将軍が全国の大名を支配する制度だった"],"ex":"まず「誰が中心か」を比べる。摂政・関白と、天皇を退位した上皇を取り違えない。","difficulty":"標準","practice_kind":"理由・比較","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000016","subject":"社会","grade":2,"unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"御成敗式目の内容・目的として適切なのは？","answer":"武士の慣習などに基づき、裁判の判断基準を示した","options":["武士の慣習などに基づき、裁判の判断基準を示した","全国の大名の参勤交代を定めた","すべての土地の永久私有を初めて認めた","外国の領事に日本人を裁く権利を与えた"],"ex":"1232年、北条泰時の時代の武士の法。大名統制の武家諸法度や、古代の土地法とは対象が違う。","difficulty":"標準","practice_kind":"理由・比較","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000017","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"太閤検地と刀狩を組み合わせた結果として適切なのは？","answer":"耕作者や年貢の把握が進み、武士と百姓の身分・役割の分離が進んだ","options":["耕作者や年貢の把握が進み、武士と百姓の身分・役割の分離が進んだ","国民全員に衆議院議員の選挙権が与えられた","外国船との貿易が完全に禁止された","藩を廃止して県が置かれた"],"ex":"検地は土地と耕作者・収穫量の把握、刀狩は百姓の武器の取り上げ。二つを兵農分離につなげる。","difficulty":"標準","practice_kind":"理由・比較","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-2syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000018","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"いわゆる鎖国下の対外関係について適切なのは？","answer":"長崎では中国・オランダとの貿易が続いた","options":["長崎では中国・オランダとの貿易が続いた","日本はすべての国・地域との交流を断った","全国の港で自由に外国船との貿易を行った","長崎ではイギリス・スペインだけと貿易した"],"ex":"貿易や出入国は制限されたが、交流がゼロになったわけではない。対馬・薩摩・松前の窓口も整理しよう。","difficulty":"標準","practice_kind":"理由・比較","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-2syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000019","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"江戸時代の政治を古い順に並べたものは？","answer":"享保の改革 → 田沼意次の政治 → 寛政の改革","options":["享保の改革 → 田沼意次の政治 → 寛政の改革","寛政の改革 → 田沼意次の政治 → 享保の改革","田沼意次の政治 → 享保の改革 → 寛政の改革","享保の改革 → 寛政の改革 → 田沼意次の政治"],"ex":"徳川吉宗、田沼意次、松平定信の順。人物名だけでなく農業・商業への姿勢も比べる。","difficulty":"標準","practice_kind":"年代・順序","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-2syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000020","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"市民革命","q":"名誉革命・アメリカ独立宣言・フランス革命を古い順に並べたものは？","answer":"名誉革命 → アメリカ独立宣言 → フランス革命","options":["名誉革命 → アメリカ独立宣言 → フランス革命","アメリカ独立宣言 → 名誉革命 → フランス革命","フランス革命 → 名誉革命 → アメリカ独立宣言","名誉革命 → フランス革命 → アメリカ独立宣言"],"ex":"1688年、1776年、1789年。イギリスの議会政治、植民地の独立、フランスの身分制への反発を別々に整理する。","difficulty":"標準","practice_kind":"年代・順序","source_refs":["https://e-clus.com/course/detail/886"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000021","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"条約改正について、1894年の条約締結と1911年の改正を対応させたものは？","answer":"1894年：領事裁判権の撤廃を実現する条約／1911年：関税自主権の完全回復","options":["1894年：領事裁判権の撤廃を実現する条約／1911年：関税自主権の完全回復","1894年：関税自主権の完全回復／1911年：領事裁判権を初めて承認","1894年：日本の国連加盟／1911年：日本の独立回復","1894年：すべての貿易を禁止／1911年：日明貿易開始"],"ex":"裁判の権利と税率を決める権利を分ける。1894年に締結された日英通商航海条約の領事裁判権撤廃は1899年に実施された。","difficulty":"標準","practice_kind":"理由・比較","source_refs":["https://www.archives.go.jp/ayumi/kobetsu/m27_1894_01.html","https://www.archives.go.jp/ayumi/kobetsu/m44_1911_01.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000022","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"廃藩置県の政治的な意味として適切なのは？","answer":"藩を廃止して府県を置き、中央政府が地方を統治する仕組みを進めた","options":["藩を廃止して府県を置き、中央政府が地方を統治する仕組みを進めた","大名が世襲で府県を支配する仕組みを確立した","鎌倉幕府の御家人制度を復活させた","外国の領事に府県の政治を任せた"],"ex":"1871年の改革。名称の変更だけでなく、中央から派遣される官僚による統治へ進んだ点が重要。","difficulty":"標準","practice_kind":"理由・比較","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000023","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"第一次世界大戦後の国際連盟と、第二次世界大戦後の国際連合を比べた説明として適切なのは？","answer":"アメリカは国際連盟に加盟しなかったが、国際連合には発足時から参加した","options":["アメリカは国際連盟に加盟しなかったが、国際連合には発足時から参加した","アメリカは両方に一度も参加していない","国際連盟は第二次世界大戦後、国際連合は第一次世界大戦後に成立した","両方とも日本だけが設立した組織だった"],"ex":"国際連盟は1920年、国際連合は1945年に発足。「二つの大戦の後」とアメリカの参加の違いを押さえる。","difficulty":"標準","practice_kind":"理由・比較","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000024","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"日本国憲法の公布・施行について正しい順序と年月日は？","answer":"1946年11月3日に公布 → 1947年5月3日に施行","options":["1946年11月3日に公布 → 1947年5月3日に施行","1947年5月3日に公布 → 1946年11月3日に施行","1945年8月15日に公布 → 1951年9月8日に施行","1889年2月11日に公布 → 1890年11月29日に施行"],"ex":"公布は国民に知らせること、施行は効力が生じること。1889年・1890年は大日本帝国憲法の年月日。","difficulty":"標準","practice_kind":"年代・順序","source_refs":["https://www.archives.go.jp/owning/mini_img/1-4.html","https://www.shugiin.go.jp/internet/itdb_annai.nsf/html/statics/kokkai/kokkai.htm"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。"},{"id":"SC-SOC-HIS-LEVEL-000025","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"世界の古代文明","q":"表の共通点と地理の知識を組み合わせて、古代文明が大河流域で発展した理由として最も適切なものは？","answer":"川の水を農業に利用し、食料生産を支えることができた","options":["川の水を農業に利用し、食料生産を支えることができた","川の近くなら洪水が一度も起きず、水を管理する必要がなかった","大河流域の文明は、すべて同じ文字と政治制度を採用した","農業は都市の発展と無関係で、食料は川だけから得ていた"],"ex":"大河の水と周辺の土地が農業を支え、人口や都市の発達につながった。洪水の危険もあり、水の管理は重要だった。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"表の「川」と「生産」の列を見比べる。","steps":["文明ごとに川や文字は違うが、農業を行っている点は共通する。","川の水を利用できると作物を育てやすくなる。","食料生産が都市の人々を支える、という因果を選ぶ。"],"trap":"共通点から理由を考える。表だけで「洪水がない」「文字が同じ」とは言えない。","eliminate":["「洪水も管理もない」：洪水は起こり、灌漑などの水の管理も必要だった。","「同じ文字・制度」：表の文字は異なり、川の共通性から政治制度の一致は導けない。","「農業と無関係」：表に農業が共通して示されている。"]},"material":{"title":"文明の比較","headers":["文明","川","生産・文化"],"rows":[["エジプト","ナイル川","農業・象形文字"],["メソポタミア","チグリス川・ユーフラテス川","農業・くさび形文字"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000026","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"奈良","q":"土地制度の表から、743年の法がもたらした変化として最も適切なものは？","answer":"土地を開く意欲を高める一方、寺院や貴族の私有地拡大につながった","options":["土地を開く意欲を高める一方、寺院や貴族の私有地拡大につながった","開墾地の私有期間を短くして、国への返還を早めた","私有できるのは収穫した米だけで、土地の私有は認めなかった","開墾者が誰であっても、すべての土地を同じ面積に分け直した"],"ex":"永久に所有できれば開墾の動機になる。しかし、資金や人手のある寺院・貴族は広い土地を開きやすかった。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"「期限付き」から「永久」への変化に注目する。","steps":["開墾の費用や手間をかけても、長く利益を得られるようになる。","寺院や貴族は、人手などを集めて開墾を進められる。","目的である開墾促進と、結果である私有地拡大を一緒に考える。"],"trap":"墾田永年私財法が、すべての土地を一度に私有地へ変えたわけではない。","eliminate":["「期間を短く」：期限付きから永久へ変わっている。","「土地の私有を認めない」：開墾地の永久私有と矛盾。","「すべて同じ面積に分け直す」：この法は開墾地の扱いを定めるもので、一律再分配ではない。"]},"material":{"title":"開墾地の扱い","headers":["法","開墾地の私有"],"rows":[["三世一身法（723年）","条件によって期限付きで認める"],["墾田永年私財法（743年）","永久に認める"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000027","subject":"社会","grade":2,"unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"表の二つの内容を結び付けると、元寇後に御家人の不満が高まった理由として適切なのは？","answer":"戦いで負担を負ったのに、新しい土地による恩賞を十分に得にくかった","options":["戦いで負担を負ったのに、新しい土地による恩賞を十分に得にくかった","元の領地を新たに獲得したため、土地の恩賞を大量に与えられた","防衛の費用はすべて元が負担したため、御家人の負担はなかった","国外からの侵攻では、御家人に軍役の義務がなかった"],"ex":"国外からの侵攻を退けても、国内の戦いのように敵の領地を奪って分配できるわけではなかった。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"御家人の「負担」と幕府が分けられる「土地」を対にする。","steps":["御家人は防衛のために軍役を果たし、費用などを負担した。","元寇は侵攻を防ぐ戦いであり、大量の新領地を得る戦いではない。","負担に見合う土地の恩賞を得にくいことが、不満につながる。"],"trap":"「新しい土地を得にくい」と「恩賞が全くなかった」は同じではない。","eliminate":["「元の領地を獲得」：侵攻を退けても、元の領地を獲得したわけではない。","「元が費用を全額負担」：防衛に参加した御家人は費用などを負担した。","「軍役の義務がない」：御家人は防衛に動員されている。"]},"material":{"title":"元寇と御家人","headers":["観点","内容"],"rows":[["御家人の役割","防衛のために動員された"],["戦いの性格","国外からの侵攻を退けた"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000028","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"安土桃山","q":"表の二政策を合わせて考えると、豊臣秀吉の支配のねらいとして最も適切なのは？","answer":"耕作者と年貢を把握し、百姓の武装を抑えて支配を安定させる","options":["耕作者と年貢を把握し、百姓の武装を抑えて支配を安定させる","検地で武器を取り上げ、刀狩で耕作者と石高を調べる","検地で百姓の年貢をすべて免除し、刀狩で武装を自由にする","検地も刀狩も、百姓を武士にして農業を全面的にやめさせる"],"ex":"検地は土地・年貢の把握、刀狩は武器の取り上げ。別々の暗記を「支配の安定」という目的につなげる。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-2syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"二つの政策が、それぞれ「何を把握・制限するか」を読む。","steps":["検地で耕作者と石高を確かめ、年貢を取り立てる基礎を整える。","刀狩で百姓の武装を抑え、一揆などを防ぐ方向に働く。","両方を武士と百姓の分離や統一政権の支配安定へ結び付ける。"],"trap":"一つの政策の説明だけで、二政策の関係を説明したことにしない。","eliminate":["「検地と刀狩を逆にする」：土地の調査が検地、武器の取り上げが刀狩。","「年貢免除・武装自由」：年貢の把握と武装抑制という方向に反する。","「百姓を武士にする」：武士と百姓の役割を分離する方向とは異なる。"]},"material":{"title":"統一政権の政策","headers":["政策","主な内容"],"rows":[["太閤検地","耕作者・土地の面積・石高を調べる"],["刀狩","百姓から刀や鉄砲などを取り上げる"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000029","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"江戸初期","q":"表から考えられる参勤交代の政治的効果と経済的影響の組み合わせは？","answer":"大名を統制し、大名行列に関連する街道・宿場の利用が増えた","options":["大名を統制し、大名行列に関連する街道・宿場の利用が増えた","大名を統制し、領地と江戸の間の人や物の移動を完全になくした","大名の江戸滞在を禁止し、街道や宿場を使わなくてもよいようにした","大名の往復費用をすべて免除して、幕府からの独立を認めた"],"ex":"大名の統制と人・物の移動の増加は両立する。政策には、政治面だけでなく経済面への影響もある。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-2syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"「領地と江戸を往復」「滞在費用」を別々の影響に結び付ける。","steps":["幕府の命令で勤務させることは、大名の統制になる。","往復には街道や宿場を利用し、滞在にも物資が必要になる。","統制という政治面と、交通・消費という経済面の両方を含む答えを選ぶ。"],"trap":"「統制された」と「移動がなくなった」は別の話。表の往復と矛盾しないか確かめる。","eliminate":["「移動を完全になくす」：領地と江戸を往復する制度なので逆。","「江戸滞在を禁止」：表には江戸勤務と滞在費用が示されている。","「費用免除・独立を認める」：費用負担があり、統制の制度である。"]},"material":{"title":"参勤交代の仕組み","headers":["観点","内容"],"rows":[["勤務","領地と江戸を原則として一年交代で往復"],["負担","往復・江戸滞在に費用がかかる"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000030","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"江戸中期","q":"表のAとBを比べた説明として適切なのは？","answer":"Aは田沼意次の政治、Bは松平定信の寛政の改革で、商業と農村への重点が異なる","options":["Aは田沼意次の政治、Bは松平定信の寛政の改革で、商業と農村への重点が異なる","Aは松平定信の寛政の改革、Bは田沼意次の政治である","Aは商業を禁止し、Bは農村の再建を禁止する政策である","AもBも同じ担当者が行い、重点もまったく同じだった"],"ex":"Aの株仲間と商業、Bの農村立て直しを手がかりに政策担当者を特定する。両方とも幕府財政の立て直しを目指したが方法は異なる。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-2syakai_rekisi_tousyo.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"人物名がなくても、具体的な政策の組み合わせから判断する。","steps":["株仲間を認め、商業からの収入を重視したのは田沼意次。","倹約や農村の立て直しを重視したのは松平定信。","同じ財政難への対応でも、重点が違うと整理する。"],"trap":"「商業を重視」と「農業を一切無視」、「農村重視」と「商業が存在しない」は同じではない。","eliminate":["「AとBを逆にする」：株仲間と商業重視は田沼の手がかり。","「商業・農村再建を禁止」：表の重点とそれぞれ反対。","「担当者も重点も同じ」：田沼意次と松平定信で、政策の重点も違う。"]},"material":{"title":"江戸中期の政策比較","headers":["政策","重点・内容"],"rows":[["A","株仲間を認めるなど、商業からの収入を重視"],["B","倹約を進め、農村の立て直しを重視"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000031","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"市民革命","q":"表と知識を合わせて、イギリスとフランスの革命を比べた説明として適切なのは？","answer":"イギリスでは王権の制限と議会の権利が、フランスでは自由・平等の理念が示された","options":["イギリスでは王権の制限と議会の権利が、フランスでは自由・平等の理念が示された","両国とも国王の権力を無制限にすることを中心理念とした","イギリスでは議会の権利を否定し、フランスでは身分による特権を永久に保障した","イギリスの権利の章典とフランスの人権宣言は、同じ国の同じ年の文書だった"],"ex":"国・年・文書名を対応させ、文書が示す理念を比べる。同じ「革命」でも経過と政治の形は同一ではない。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://e-clus.com/course/detail/886"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"表の国と文書名を先に対応させる。","steps":["1689年の権利の章典は、名誉革命後のイギリスの文書。","1789年の人権宣言は、フランス革命の自由・平等の理念を示す。","国王の権力を無制限にした、という説明は両方の流れに合わない。"],"trap":"「市民革命」の共通性と、各国の固有の出来事を分ける。","eliminate":["「王権を無制限に」：王権の制限や自由・平等の理念とは反対。","「議会否定・身分特権保障」：それぞれの革命が示した方向と逆。","「同じ国・同じ年」：表では国も年も異なる。"]},"material":{"title":"革命に関係する文書","headers":["国","年","文書"],"rows":[["イギリス","1689年","権利の章典"],["フランス","1789年","人権宣言"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000032","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"産業革命とアジア","q":"表の変化に伴って起きた社会問題と、それに対する動きの組み合わせとして適切なのは？","answer":"長時間労働などの問題 → 労働組合による労働条件の改善要求","options":["長時間労働などの問題 → 労働組合による労働条件の改善要求","長時間労働などの問題 → 労働者が労働組合で労働時間の延長だけを要求","機械化による大量生産 → 労働者の雇用が直ちに全くなくなった","工場労働者の増加 → 賃金や労働条件の問題は一切起こらなくなった"],"ex":"機械化と大量生産だけでなく、働く人の生活への影響も考える。労働者は労働組合などで労働条件の改善を求めた。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://e-clus.com/course/detail/1102"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"生産方法の変化を「そこで働く人」から考える。","steps":["機械を備える工場で、多くの労働者が雇われる。","長時間労働や低賃金などの問題が生じた。","労働者が団結して改善を求める労働運動につながる。"],"trap":"技術の進歩が、すべての人の生活を直ちに良くしたと決め付けない。","eliminate":["「労働時間の延長だけ」：労働組合は長時間労働などの改善を求めた。","「雇用が全くなくなる」：機械を使う工場でも労働者が雇われた。","「問題が一切ない」：工場制機械工業の発達の中で労働問題が生じた。"]},"material":{"title":"産業革命の生産変化","headers":["観点","変化"],"rows":[["綿工業","紡績機などの改良・機械化"],["生産場所","工場制機械工業の発達"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000033","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"表の地租改正が政府にとって持つ利点と、農民の負担を結び付けた説明として適切なのは？","answer":"政府は税収を見込みやすくなるが、土地所有者は不作でも原則として一定の現金を納める必要がある","options":["政府は税収を見込みやすくなるが、土地所有者は不作でも原則として一定の現金を納める必要がある","政府の税収は毎年の収穫量だけで変わり、不作なら地租は自動的にゼロになる","土地所有者は地価に関係なく、収穫した米だけで地租を納める","土地を所有しない小作人だけが、政府に直接地租を納める義務を負う"],"ex":"地価基準の現金納付は政府の財政安定に役立つ一方、土地所有者にとって不作時の負担を重く感じさせた。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://www.archives.go.jp/ayumi/kobetsu/m06_1873_03.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"「地価を基準」と「現金」を、政府と納税者の二つの立場で読む。","steps":["税額は毎年の収穫量そのものではなく地価を基準とする。","政府は収穫の豊凶に左右されにくい税収を見込める。","土地所有者は不作でも納付用の現金を用意する必要がある。"],"trap":"政府の利点だけ、農民の負担だけでなく、同じ制度の両面を説明する。","eliminate":["「収穫量だけ・自動的にゼロ」：地価を基準とし、豊凶にかかわらず原則一定だった。","「米だけで納める」：地租改正では現金納付に改められた。","「小作人だけが納税義務者」：政府に地租を納める義務は土地所有者にあった。"]},"material":{"title":"1873年の地租改正の原則","headers":["項目","内容"],"rows":[["税額の基準","地価（当初はその3％）"],["納付方法","現金"],["納税義務者","土地所有者"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000034","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"表の二法から、1925年の政治について導ける説明として適切なのは？","answer":"選挙に参加できる男子を増やす一方、特定の政治運動への取り締まりも強めた","options":["選挙に参加できる男子を増やす一方、特定の政治運動への取り締まりも強めた","納税額の条件をなくすと同時に、女子にも衆議院の選挙権を認めた","選挙権の拡大と同時に、政治的結社への取り締まりをすべて廃止した","納税額の条件を厳しくすると同時に、国体の変革を目的とする結社を自由にした"],"ex":"政治参加の拡大と、思想・運動の統制が同じ時期に進んだ。一つの法律だけで時代全体を判断しない。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://www.archives.go.jp/learning/archive_collection_1/"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"普通選挙法と治安維持法を、別々の方向の動きとして読む。","steps":["普通選挙法では、男子の選挙権にあった納税額の条件がなくなる。","治安維持法は、国体の変革や私有財産制度の否認を目的とする結社などを取り締まる。","参加拡大と取り締まり強化の両方を含む説明を選ぶ。"],"trap":"「普通選挙」の名称だけから、女子も投票できたと判断しない。","eliminate":["「女子にも選挙権」：当時は原則として満25歳以上の男子だった。","「取り締まりをすべて廃止」：治安維持法を同年に制定している。","「納税条件を厳格化・結社を自由に」：二法の内容を両方とも逆にしている。"]},"material":{"title":"1925年の二つの法律","headers":["法律","内容の要点"],"rows":[["普通選挙法","衆議院の選挙権の納税要件を撤廃"],["治安維持法","国体の変革や私有財産制度の否認を目的とする結社などを取り締まる"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000035","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"表と日本国憲法の原則から、戦後の政治制度の変化を説明したものは？","answer":"国民主権を原則とし、天皇は日本国と日本国民統合の象徴となった","options":["国民主権を原則とし、天皇は日本国と日本国民統合の象徴となった","天皇が引き続き主権者となり、国民の政治参加は認められなくなった","国民主権を原則とし、天皇には国政に関する最終決定権が与えられた","国民主権を原則とする日本国憲法は、1946年11月3日の公布と同日に施行された"],"ex":"戦後の変化は年月日だけでなく、主権の所在と天皇の地位から整理する。日本国憲法は国民主権などを原則とする。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://www.archives.go.jp/owning/mini_img/1-4.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"公布・施行の区別を確認し、表にない政治原則は知識で補う。","steps":["日本国憲法は1946年に公布され、1947年に施行された。","主権が国民にあることを基本原則とする。","天皇は象徴であり、国政に関する権能を持たない。"],"trap":"表は年月日の情報しか示していない。政治原則を表から直接読み取ったことにはしない。","eliminate":["「天皇が主権者・参加を認めない」：国民主権と異なる。","「天皇に国政の最終決定権」：象徴天皇には国政に関する権能がない。","「公布と同日に施行」：表では施行は1947年5月3日。"]},"material":{"title":"日本国憲法の成立過程","headers":["段階","年月日"],"rows":[["公布","1946年11月3日"],["施行","1947年5月3日"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-LEVEL-000036","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"表を踏まえ、1899年から1911年の完全回復までの条約改正を説明したものは？","answer":"領事裁判権の撤廃は実施されたが、関税自主権の完全回復はまだ実現していなかった","options":["領事裁判権の撤廃は実施されたが、関税自主権の完全回復はまだ実現していなかった","領事裁判権と関税自主権はどちらも1899年に完全に回復した","領事裁判権の撤廃は1911年の改正より後に初めて実施された","関税自主権は、日本国内の外国人を裁判する権利のことだった"],"ex":"裁判と関税の二つの課題を分け、条約の締結と実施の時期も区別する。1894年の条約では関税自主権を部分的に回復したが、完全回復は1911年。","difficulty":"応用","practice_kind":"資料の読み取り","source_refs":["https://www.archives.go.jp/ayumi/kobetsu/m27_1894_01.html","https://www.archives.go.jp/ayumi/kobetsu/m44_1911_01.html"],"reference_note":"公開資料の学習テーマ・歴史事項を参考にした独自問題。参考元の設問や史料の転載ではありません。","explanation":{"focus":"「締結」「実施」「完全回復」の三つを区別する。","steps":["1894年は日英通商航海条約を締結した年で、領事裁判権撤廃は1899年に実施された。","1911年に関税自主権が完全に回復するので、その前には完全回復していない。","1899年以後の二つの権利の状態を、別々に答える。"],"trap":"「一部の回復」と「完全回復」は違う。領事裁判権の撤廃と関税自主権の回復を一つの年にまとめない。","eliminate":["「両方とも1899年に完全回復」：関税の完全回復は1911年。","「裁判権撤廃が1911年より後」：1899年の実施と矛盾。","「関税は裁判の権利」：関税自主権は輸入品などの税率を自主的に決める権利。"]},"material":{"title":"条約改正の二つの課題","headers":["年","出来事"],"rows":[["1894年","領事裁判権撤廃を認める日英通商航海条約の締結"],["1899年","同条約の発効により領事裁判権撤廃を実施"],["1911年","条約改正による関税自主権の完全回復"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"}},{"id":"SC-SOC-HIS-DEEP-000001","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"宗教のおこり","q":"三大宗教の成立地について正しい対応は？","answer":"仏教：インド／キリスト教：パレスチナ地方／イスラム教：アラビア半島","options":["仏教：インド／キリスト教：パレスチナ地方／イスラム教：アラビア半島","仏教：アラビア半島／キリスト教：インド／イスラム教：パレスチナ地方","仏教：中国／キリスト教：日本／イスラム教：インド","仏教：インド／キリスト教：アラビア半島／イスラム教：パレスチナ地方"],"ex":"成立した地域と、後に広まった地域を区別する。仏教はインドにおこり、中国や日本などに伝わった。","difficulty":"標準","focus_area":"宗教・文化","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000002","practice_kind":"理由・比較","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000002","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"宗教のおこり","q":"表の成立地と現在までの広がりを考えたとき、正しい説明は？","answer":"宗教が成立した地域と、後に伝わって信仰される地域は一致するとは限らない","options":["宗教が成立した地域と、後に伝わって信仰される地域は一致するとは限らない","宗教は成立した地域の外へ一度も伝わらなかった","仏教は中国で信仰されたので、中国で成立したと判断できる","三宗教の成立地が異なることから、どれも交易路では伝わらなかったと判断できる"],"ex":"出発点と広がりは別の情報。宗教は人の移動や交流などを通じて成立地の外にも伝わった。","difficulty":"応用","focus_area":"宗教・文化","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000001","practice_kind":"資料の読み取り","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"三大宗教の成立地","headers":["宗教","成立地"],"rows":[["仏教","インド"],["キリスト教","パレスチナ地方"],["イスラム教","アラビア半島"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"表が示すのは「成立地」で、信仰される地域のすべてではない。","steps":["まず表の情報の範囲を確かめる。","中国や日本への仏教伝来など、成立地の外への広がりを知識で補う。","成立地と伝播先を混同しない説明を選ぶ。"],"trap":"一つの地域で信仰されているという事実だけでは、そこで成立したとは言えない。","eliminate":["「外へ伝わらない」：仏教の東アジアへの伝来などと矛盾。","「中国で成立」：表ではインド。","「交易路では伝わらない」：成立地の違いから伝播方法は決められない。"]}},{"id":"SC-SOC-HIS-DEEP-000003","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"国風文化の文学について正しい作者と作品の組み合わせは？","answer":"紫式部：源氏物語／清少納言：枕草子","options":["紫式部：源氏物語／清少納言：枕草子","紫式部：枕草子／清少納言：源氏物語","紫式部：徒然草／清少納言：方丈記","紫式部：平家物語／清少納言：古事記"],"ex":"物語と随筆というジャンルの違いも一緒に覚える。徒然草や方丈記は後の鎌倉文化と結び付ける。","difficulty":"標準","focus_area":"宗教・文化","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000004","practice_kind":"理由・比較","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","https://www.ndl.go.jp/gallery/exhibitions/202411"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000004","subject":"社会","grade":2,"unit":"歴史・古代","field_name":"歴史","topic_name":"平安","q":"表を手がかりに国風文化を説明したものとして適切なのは？","answer":"大陸文化を受け継ぎながら、仮名文字など日本の生活や言語に合う表現が発達した","options":["大陸文化を受け継ぎながら、仮名文字など日本の生活や言語に合う表現が発達した","外国の文化を一切受け継がず、漢字も全く使われなくなった","すべての文学がオランダ語で書かれるようになった","武士だけが文化の担い手となり、宮廷文学はなくなった"],"ex":"国風文化は「外国の影響がゼロ」の文化ではない。漢字から仮名が生まれるなど、受容した文化を日本に合う形で発展させた。","difficulty":"応用","focus_area":"宗教・文化","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000003","practice_kind":"資料の読み取り","source_refs":["https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-1syakai_rekisi_tousyo.html","https://www.ndl.go.jp/gallery/exhibitions/202411"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"平安時代の文学を整理","headers":["作品","作者","ジャンル"],"rows":[["源氏物語","紫式部","物語"],["枕草子","清少納言","随筆"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"作品の時代・担い手と、仮名文字の発達を合わせる。","steps":["表の作品は平安の宮廷生活と結び付く。","日本語を表す仮名文字の発達は、日本に合う文学表現を支えた。","大陸文化の継承と日本的な発展が両立する答えを選ぶ。"],"trap":"「国風」と「交流が完全に断絶した」を同じ意味にしない。","eliminate":["「漢字も全く使わない」：漢字の使用は続いた。","「オランダ語」：江戸の蘭学などとの時代混同。","「武士だけ・宮廷文学消滅」：表の作品の背景と違う。"]}},{"id":"SC-SOC-HIS-DEEP-000005","subject":"社会","grade":2,"unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"鎌倉時代の新しい仏教について正しい組み合わせは？","answer":"法然：浄土宗／道元：曹洞宗","options":["法然：浄土宗／道元：曹洞宗","法然：曹洞宗／道元：浄土宗","法然：真言宗／道元：天台宗","法然：日蓮宗／道元：浄土真宗"],"ex":"法然と道元では宗派も重視する実践も違う。人名・宗派・実践を一組で整理しよう。","difficulty":"標準","focus_area":"宗教・文化","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000006","practice_kind":"理由・比較","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","https://www.try-it.jp/chapters-13452/lessons-13466/point-2/"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000006","subject":"社会","grade":2,"unit":"歴史・中世","field_name":"歴史","topic_name":"鎌倉","q":"表から、鎌倉時代の新しい仏教を比較した説明として適切なのは？","answer":"救いを求めるという点は共通しても、念仏・坐禅・題目など重視する実践は異なる","options":["救いを求めるという点は共通しても、念仏・坐禅・題目など重視する実践は異なる","すべての宗派は念仏だけを重視した","坐禅を重視する宗派は、法然の浄土宗だけだった","実践が異なるので、どの宗派も仏教ではなかった"],"ex":"共通する大きな目的と、具体的な実践の違いを分ける。「新しい仏教」を一つの教えとしてまとめ過ぎない。","difficulty":"応用","focus_area":"宗教・文化","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000005","practice_kind":"資料の読み取り","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","https://www.try-it.jp/chapters-13452/lessons-13466/point-2/"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"鎌倉仏教の実践の比較","headers":["人物・宗派","重視する実践"],"rows":[["法然・浄土宗","念仏"],["道元・曹洞宗","坐禅"],["日蓮・日蓮宗","題目"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"宗派の名称ではなく、実践の列を比べる。","steps":["念仏、坐禅、題目は同じものではない。","違いがあっても、いずれも仏教の教えである。","共通性と違いの両方を残した説明を選ぶ。"],"trap":"実践の相違から、仏教ではないという結論は出せない。","eliminate":["「念仏だけ」：坐禅と題目の行を無視している。","「法然だけが坐禅」：法然の行は念仏。","「仏教ではない」：実践の違いと宗教の分類を混同している。"]}},{"id":"SC-SOC-HIS-DEEP-000007","subject":"社会","grade":2,"unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"室町時代の文化について正しい対応は？","answer":"足利義満：金閣・北山文化／足利義政：銀閣・東山文化","options":["足利義満：金閣・北山文化／足利義政：銀閣・東山文化","足利義満：銀閣・東山文化／足利義政：金閣・北山文化","足利義満：東大寺・天平文化／足利義政：平等院・国風文化","足利義満：金閣・元禄文化／足利義政：銀閣・化政文化"],"ex":"人物・建物・文化名を対応させる。銀閣寺東求堂の同仁斎は、書院造の源流として重要。","difficulty":"標準","focus_area":"宗教・文化","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000008","practice_kind":"理由・比較","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","https://kunishitei.bunka.go.jp/heritage/detail/911/17"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000008","subject":"社会","grade":2,"unit":"歴史・中世","field_name":"歴史","topic_name":"室町","q":"表の建築的特徴から考えられる、東山文化の現代へのつながりとして適切なのは？","answer":"畳の部屋や付書院・違棚など、後の和風住宅につながる要素がみられる","options":["畳の部屋や付書院・違棚など、後の和風住宅につながる要素がみられる","四畳半や付書院・違棚は、平安時代の寝殿造をそのまま示す特徴である","付書院・違棚は武器を置くための軍事設備で、住宅文化とのつながりを示さない","後の和風住宅と共通する特徴があるので、同仁斎は江戸時代に初めて建てられた"],"ex":"畳の部屋や付書院・違棚を、後の和風住宅につながる書院造の要素として読む。後の住宅との共通点から、建物自体が後の時代に作られたとは判断しない。","difficulty":"応用","focus_area":"宗教・文化","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000007","practice_kind":"資料の読み取り","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","https://kunishitei.bunka.go.jp/heritage/detail/911/17"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"銀閣寺東求堂・同仁斎の特徴","headers":["観点","内容"],"rows":[["室内","四畳半の部屋"],["設備","付書院・違棚"],["文化史上の位置","書院造の源流"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"表の「室内」「設備」を、後の和風住宅の要素と照合する。","steps":["四畳半の部屋と付書院・違棚は、室内の設備や使い方に関係する特徴。","表は書院造の源流と位置付けている。平安時代の寝殿造と区別する。","室町時代の特徴が後の和風住宅へつながったと考える。後世との共通点は創建が後世という証拠ではない。"],"trap":"文化が後の時代へ受け継がれることと、建物が後の時代に初めて建てられたことを区別する。","eliminate":["表は「書院造の源流」と位置付けている。寝殿造と書院造という異なる住宅様式を区別する。","付書院・違棚は室内の設備で、表は住宅文化との関係を示す。武器を置く軍事設備という説明は当てはまらない。","後の文化につながることと、その建物が後の時代に建てられたことは別。東求堂・同仁斎は室町時代の遺構。"]}},{"id":"SC-SOC-HIS-DEEP-000009","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"大航海と宗教改革","q":"大航海時代の航海について正しい対応は？","answer":"コロンブス：大西洋を渡る／バスコ・ダ・ガマ：アフリカ南端を回ってインドへ","options":["コロンブス：大西洋を渡る／バスコ・ダ・ガマ：アフリカ南端を回ってインドへ","コロンブス：アフリカ南端経由でインドへ／バスコ・ダ・ガマ：大西洋を渡ってアメリカ方面へ","コロンブス：日本の海岸線を測量／バスコ・ダ・ガマ：遣唐使として中国へ","コロンブス：太平洋だけを往復／バスコ・ダ・ガマ：地中海だけを往復"],"ex":"航海者の名前だけでなく、どちらへ進んだかを地図の知識と結び付ける。","difficulty":"標準","focus_area":"対外関係","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000010","practice_kind":"理由・比較","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000010","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"大航海と宗教改革","q":"二つの航海を世界の交易の変化につなげた説明として適切なのは？","answer":"ヨーロッパからアジアやアメリカ方面へ海上航路が広がり、交易や植民地支配の拡大につながった","options":["ヨーロッパからアジアやアメリカ方面へ海上航路が広がり、交易や植民地支配の拡大につながった","新航路の成立で、海上交易はただちに世界中からなくなった","新航路はヨーロッパと他地域の接触を完全に禁止するために開かれた","新航路の成立は、すべての地域に同じ利益だけをもたらした"],"ex":"新航路は交易の拡大だけでなく、征服や植民地支配にもつながった。地域や立場によって影響は違う。","difficulty":"応用","focus_area":"対外関係","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000009","practice_kind":"資料の読み取り","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"二つの海上航路","headers":["航海者","主な到達・経路"],"rows":[["コロンブス","大西洋を渡り、カリブ海の島々へ"],["バスコ・ダ・ガマ","アフリカ南端を回ってインドへ"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"二航路の到達地域が違うことと、共通する海上での接触に注目する。","steps":["ヨーロッパと他地域を結ぶ航路が広がった。","物資の交易だけでなく、人の移動や軍事的な支配も進んだ。","利益だけに限定せず、交易と支配の両面を含む説明を選ぶ。"],"trap":"航海者側の利益だけで、現地の人々への影響まで判断しない。","eliminate":["「交易が消滅」：新航路による交易の広がりと逆。","「接触を完全禁止」：航路を開くという出来事に反する。","「同じ利益だけ」：植民地支配などの影響を無視する。"]}},{"id":"SC-SOC-HIS-DEEP-000011","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"江戸時代の学問を、研究対象で区別した説明は？","answer":"蘭学はオランダ語の書物などを通じて西洋の学問を学び、国学は日本の古典などを研究した","options":["蘭学はオランダ語の書物などを通じて西洋の学問を学び、国学は日本の古典などを研究した","蘭学は日本の古典だけを研究し、国学はオランダ語の医学書だけを研究した","蘭学も国学も国会の法律を作る学問だった","蘭学は奈良時代、国学は旧石器時代だけに存在した"],"ex":"外国・日本という研究対象や、学ぶ資料の違いを整理する。国学も単に国の政治を学ぶという意味ではない。","difficulty":"標準","focus_area":"近代化・社会","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000012","practice_kind":"理由・比較","source_refs":["https://www.ndl.go.jp/nichiran/s1/s1_3.html","https://www.ndl.go.jp/nichiran/s2/s2_2.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000012","subject":"社会","grade":2,"unit":"歴史・近世","field_name":"歴史","topic_name":"江戸文化","q":"表を踏まえ、いわゆる鎖国下の学問を説明したものとして適切なのは？","answer":"対外交流が制限されても、オランダ語の書物を通じた知識の受容は続いた","options":["対外交流が制限されても、オランダ語の書物を通じた知識の受容は続いた","外国の書物は一冊も入らず、西洋の学問は一切知られなかった","西洋の医学書が翻訳されたので、日本の古典研究は存在しなかった","医学書の翻訳があるので、すべての港で外国船が自由に貿易できた"],"ex":"交流の制限と知識の流入は両立する。医学書の翻訳という一例から、貿易制度全体を自由貿易と判断しない。","difficulty":"応用","focus_area":"近代化・社会","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000011","practice_kind":"資料の読み取り","source_refs":["https://www.ndl.go.jp/nichiran/s1/s1_3.html","https://www.ndl.go.jp/nichiran/s2/s2_2.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"江戸時代の知識の受容","headers":["資料・活動","内容"],"rows":[["解体新書","オランダ語の解剖学書をもとに翻訳"],["蘭学者の活動","医学・天文学などを学び研究"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"「翻訳」が成立するために、どんな資料が必要かを考える。","steps":["翻訳には外国の書物や語学の知識が必要。","対外交流が限定されても、知識を受け取る経路はあった。","その事実と、貿易が無制限だったという主張を区別する。"],"trap":"知識の受容の事実と、全国の港の自由貿易を飛躍して結び付けない。","eliminate":["「外国書物ゼロ」：翻訳の事実と矛盾。","「古典研究なし」：蘭学の存在から国学の不在は導けない。","「全港が自由貿易」：書物の受容と港の制度は別の問題。"]}},{"id":"SC-SOC-HIS-DEEP-000013","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"1854年の日米和親条約と1858年の日米修好通商条約の違いとして適切なのは？","answer":"前者は下田・函館の開港などを定め、後者は通商関係を定めた","options":["前者は下田・函館の開港などを定め、後者は通商関係を定めた","前者は関税自主権の完全回復、後者は日本の国連加盟を定めた","前者は明との勘合貿易、後者は朱印船の制度を定めた","前者も後者も外国との一切の接触を永久に禁止した"],"ex":"和親条約と通商条約は同じ条約ではない。年・開港・貿易の違いを整理する。","difficulty":"標準","focus_area":"対外関係","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000014","practice_kind":"理由・比較","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000014","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"幕末","q":"表の条約と、その後の条約改正を考えた説明として適切なのは？","answer":"開国後の通商では領事裁判権や関税の制約が課題となり、その改正が外交上の目標となった","options":["開国後の通商では領事裁判権や関税の制約が課題となり、その改正が外交上の目標となった","二条約の締結によって、関税自主権は直ちに完全回復した","通商条約では貿易が一切認められず、条約改正も必要なかった","領事裁判権とは、日本が輸入品の税率を自由に決める権利である"],"ex":"開国と、不平等な条件の解消は別の段階。裁判と関税を分けて条約改正につなげる。","difficulty":"応用","focus_area":"対外関係","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000013","practice_kind":"資料の読み取り","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"幕末の対米条約","headers":["条約","年","学習上の要点"],"rows":[["日米和親条約","1854年","下田・函館の開港など"],["日米修好通商条約","1858年","通商、領事裁判権、関税上の制約"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"条約締結の時期と、条約改正の課題を分ける。","steps":["1858年の通商条約に不平等な条件があった。","領事裁判権は裁判、関税自主権は税率の決定に関する問題。","開国したから即座に制約が解消したわけではない、と判断する。"],"trap":"条約を結んだことと、条約の不平等な条件を改めたことを混同しない。","eliminate":["「完全回復した」：関税自主権の完全回復は1911年。","「貿易を一切認めない」：通商条約の内容と違う。","「領事裁判権＝税率」：裁判と関税の混同。"]}},{"id":"SC-SOC-HIS-DEEP-000015","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"明治初期の学制と徴兵令を目的で区別した説明は？","answer":"学制は学校制度の整備、徴兵令は近代的な軍隊の整備につながった","options":["学制は学校制度の整備、徴兵令は近代的な軍隊の整備につながった","学制は軍隊の制度、徴兵令は学校の制度を定めた","学制は藩の復活、徴兵令は幕府の御家人だけの保護を定めた","学制も徴兵令も外国との条約の名称だった"],"ex":"学校と軍隊をそれぞれ全国的に整える政策。徴兵令には当初、免役規定があり、すべての男子が必ず入営したわけではない。","difficulty":"標準","focus_area":"近代化・社会","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000016","practice_kind":"理由・比較","source_refs":["https://www.archives.go.jp/ayumi/kobetsu/m05_1872_02.html","https://www.archives.go.jp/ayumi/kobetsu/m06_1873_01.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000016","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"表の政策から、明治政府の近代化の共通するねらいとして適切なのは？","answer":"教育や軍隊を全国的に整備し、近代国家の基盤を作る","options":["教育や軍隊を全国的に整備し、近代国家の基盤を作る","学校と軍隊の制度を各藩にすべて委ね、中央政府の関与をなくす","学校の整備だけを進めて、軍隊の制度を廃止する","全国の男子を例外なく必ず同じ年に入営させる"],"ex":"異なる分野の政策を、近代国家の基盤整備という共通点でまとめる。当初の徴兵には免役規定などがあった。","difficulty":"応用","focus_area":"近代化・社会","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000015","practice_kind":"資料の読み取り","source_refs":["https://www.archives.go.jp/ayumi/kobetsu/m05_1872_02.html","https://www.archives.go.jp/ayumi/kobetsu/m06_1873_01.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"明治初期の制度整備","headers":["年","政策","分野"],"rows":[["1872年","学制","教育"],["1873年","徴兵令","軍隊"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"政策の違いを確かめた後、共通する国家づくりの方向を考える。","steps":["学校と軍隊は違う分野の制度。","全国的な制度整備は、近代国家を支える人材や軍隊の整備になる。","両政策の内容を含む説明を選び、例外を無視した断定は避ける。"],"trap":"全国的な制度という表現は、全員が例外なく同じ扱いを受けたという意味ではない。","eliminate":["「藩にすべて委ねる」：中央政府による制度整備と反対。","「軍隊の制度を廃止」：徴兵令と矛盾。","「全男子が同年に必ず入営」：年齢条件・検査・免役規定などを無視する。"]}},{"id":"SC-SOC-HIS-DEEP-000017","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"民撰議院設立建白書から国会開設までの流れとして正しいものは？","answer":"1874年に建白書 → 1881年に国会開設の勅諭 → 1890年に帝国議会開設","options":["1874年に建白書 → 1881年に国会開設の勅諭 → 1890年に帝国議会開設","1874年に帝国議会開設 → 1881年に建白書 → 1890年に国会開設の勅諭","1881年に帝国議会開設 → 1890年に建白書 → 1925年に国会開設の勅諭","1874年に建白書 → 1874年中に帝国議会開設 → 1881年に国会廃止"],"ex":"要求を出した年、開設を約束した年、実際に開設した年は異なる。1889年の憲法発布も間に位置付ける。","difficulty":"標準","focus_area":"近代化・社会","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000018","practice_kind":"理由・比較","source_refs":["https://www.archives.go.jp/ayumi/kobetsu/m07_1874_01.html","https://www.archives.go.jp/ayumi/kobetsu/m14_1881_01.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000018","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"表から国会開設までの政治過程を説明したものとして適切なのは？","answer":"民間側の要求と政府側の準備を経て議会が開設され、建白書提出の時点で直ちに開設されたわけではない","options":["民間側の要求と政府側の準備を経て議会が開設され、建白書提出の時点で直ちに開設されたわけではない","建白書の提出だけで、その日のうちに帝国議会が開設された","国会開設の勅諭は、1890年にすでに開設された議会を後から約束した","国会が開設されたので、当初から女子を含む全成人に選挙権があった"],"ex":"要求・約束・実現を区別する。国会開設と選挙権の範囲も別の論点で、当初は性別・年齢・納税要件があった。","difficulty":"応用","focus_area":"近代化・社会","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000017","practice_kind":"資料の読み取り","source_refs":["https://www.archives.go.jp/ayumi/kobetsu/m07_1874_01.html","https://www.archives.go.jp/ayumi/kobetsu/m14_1881_01.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"国会開設への段階","headers":["年","出来事"],"rows":[["1874年","民撰議院設立建白書"],["1881年","国会開設の勅諭"],["1890年","帝国議会の開設"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"出来事の年の間に隔たりがあることを見る。","steps":["建白書は議会を求める意見で、開設そのものではない。","勅諭は将来の開設方針を示した。","実際の開設と、その時点の選挙権の範囲を区別する。"],"trap":"議会があることから、すべての人が投票できると決め付けない。","eliminate":["「その日に開設」：表では1890年。","「開設後に約束」：1881年は1890年より前。","「全成人が投票」：当初の選挙権には制限があった。"]}},{"id":"SC-SOC-HIS-DEEP-000019","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"日清戦争と日露戦争の講和条約について正しい対応は？","answer":"日清戦争：下関条約／日露戦争：ポーツマス条約","options":["日清戦争：下関条約／日露戦争：ポーツマス条約","日清戦争：ポーツマス条約／日露戦争：下関条約","日清戦争：南京条約／日露戦争：ベルサイユ条約","日清戦争：サンフランシスコ平和条約／日露戦争：日米和親条約"],"ex":"戦争と条約を対応させ、相手国・年・賠償金の有無も比較する。","difficulty":"標準","focus_area":"対外関係","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000020","practice_kind":"理由・比較","source_refs":["https://www.archives.go.jp/exhibition/digital/modean_state/contents/nisshin-war/index.html","https://www.archives.go.jp/learning/archive_collection_10/"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000020","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"表と戦争後の国内の反応を結び付けた説明として適切なのは？","answer":"日露戦争では大きな戦費・犠牲に対して賠償金が得られず、講和への不満が高まった","options":["日露戦争では大きな戦費・犠牲に対して賠償金が得られず、講和への不満が高まった","日露戦争では賠償金が得られたので、不満は一切起こらなかった","日清戦争では賠償金がなく、日露戦争では清から賠償金を受け取った","賠償金の有無だけで、領土や権益を含む条約の内容すべてを判断できる"],"ex":"戦争の負担と講和条件のギャップが不満につながった。賠償金がなくても、ポーツマス条約には南樺太などの条件があった。","difficulty":"応用","focus_area":"対外関係","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000019","practice_kind":"資料の読み取り","source_refs":["https://www.archives.go.jp/exhibition/digital/modean_state/contents/nisshin-war/index.html","https://www.archives.go.jp/learning/archive_collection_10/"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"二つの講和条約の比較","headers":["条約","年","賠償金"],"rows":[["下関条約","1895年","清が日本へ支払う"],["ポーツマス条約","1905年","日本は得られない"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"条約の違いを、戦争を支えた人々の負担と結び付ける。","steps":["日露戦争では日本が多くの戦費や犠牲を負った。","表では、その講和で賠償金を得ていない。","条件が期待に届かないことが不満になるが、条約全体が無内容だったとは言えない。"],"trap":"賠償金の一項目だけで、領土・権益などの条件を消してしまわない。","eliminate":["「賠償金あり・不満なし」：表と違い、日比谷焼打ち事件などが起きた。","「清から日露の賠償」：相手国と条件を取り違えている。","「有無だけで全内容判断」：表にない条件は別に確認する必要がある。"]}},{"id":"SC-SOC-HIS-DEEP-000021","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"第一次世界大戦期の日本の経済と米騒動の背景を説明したものは？","answer":"輸出の増加による好況の一方、米価などの物価上昇が生活を圧迫した","options":["輸出の増加による好況の一方、米価などの物価上昇が生活を圧迫した","輸出増加によって、すべての人の生活費が必ず下がった","日本で工業がなくなり、輸出もすべて止まった","米騒動は米価の大幅な値下がりだけを理由に起きた"],"ex":"国全体の好況と、個々の人の生活の改善は同じではない。物価の上昇は所得が追い付かない人の負担となる。","difficulty":"標準","focus_area":"近代化・社会","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000022","practice_kind":"理由・比較","source_refs":["https://www.archives.go.jp/ayumi/kobetsu/t07_1918_02.html","https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-3syakai_rekisi_tousyo.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000022","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"大正","q":"二つの記録を合わせたとき、第一次世界大戦期の日本社会について最も適切な説明は？","answer":"輸出産業の好況があっても、米価上昇で生活に困る人々がいて、社会不安につながった","options":["輸出産業の好況があっても、米価上昇で生活に困る人々がいて、社会不安につながった","産業が好況なら、すべての世帯の生活は必ず同じ程度に改善する","米価が上がったことから、日本の輸出は全く増えなかったと断定できる","米騒動が起きたので、当時のすべての企業が赤字だったと断定できる"],"ex":"マクロの好況と家計の負担は両立する。収入・物価・職業などによって景気の影響は違う。","difficulty":"応用","focus_area":"近代化・社会","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000021","practice_kind":"資料の読み取り","source_refs":["https://www.archives.go.jp/ayumi/kobetsu/t07_1918_02.html","https://www.pref.ishikawa.lg.jp/kyoiku/gakkou/manabi/kyouka/t-3syakai_rekisi_tousyo.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"大戦期の日本を二つの観点で見る","headers":["観点","記録の要点"],"rows":[["産業","輸出が増え、好況となった"],["生活","米価が上昇し、1918年に米騒動が広がった"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"二つの記録が、違う立場の状況を示していることを確認する。","steps":["産業の売上増と、家計の支出増は別の指標。","米価が上がれば、米を買う人の負担が増す。","一方の記録で他方を否定せず、同時に起きた変化として説明する。"],"trap":"国全体の景気を、全世帯・全企業の状態へそのまま一般化しない。","eliminate":["「全世帯が同じ改善」：物価や所得の影響は立場によって異なる。","「輸出が増えない」：産業の記録と矛盾。","「全企業が赤字」：生活の記録から企業全部の利益は分からない。"]}},{"id":"SC-SOC-HIS-DEEP-000023","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"満州事変・国際連盟脱退・日中戦争を古い順に並べたものは？","answer":"満州事変 → 国際連盟脱退 → 日中戦争","options":["満州事変 → 国際連盟脱退 → 日中戦争","日中戦争 → 満州事変 → 国際連盟脱退","国際連盟脱退 → 日中戦争 → 満州事変","満州事変 → 日中戦争 → 国際連盟脱退"],"ex":"1931年、1933年、1937年。1933年は脱退通告の年として中学校の年表で整理する。","difficulty":"標準","focus_area":"対外関係","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000024","practice_kind":"理由・比較","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","https://www.archives.go.jp/ayumi/table.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000024","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦前","q":"表を読んだ生徒の説明で、年代順と因果関係を慎重に区別しているものは？","answer":"先後関係は表で確認できるが、各出来事の原因を説明するには背景や国際関係も確認する必要がある","options":["先後関係は表で確認できるが、各出来事の原因を説明するには背景や国際関係も確認する必要がある","表で前にある出来事は、必ず後の出来事の唯一の原因である","日中戦争は満州事変より先に始まったので、満州事変の原因だと表から分かる","国際連盟脱退が中間にあるので、二つの戦争は国際関係と一切無関係だった"],"ex":"年表は順序の根拠になるが、「唯一の原因」の証明にはならない。拡大する軍事行動や国際連盟との対立など、背景を確かめる。","difficulty":"応用","focus_area":"対外関係","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000023","practice_kind":"資料の読み取り","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","https://www.archives.go.jp/ayumi/table.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"1930年代の出来事","headers":["年","出来事"],"rows":[["1931年","満州事変"],["1933年","日本が国際連盟脱退を通告"],["1937年","日中戦争の開始"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"問いが順序ではなく「原因の説明の仕方」を聞いている点に注目する。","steps":["1931→1933→1937という先後は確定できる。","先に起きたことだけで、唯一の原因とは言えない。","因果を説明するには内容・背景などの追加根拠が必要、と判断する。"],"trap":"「後に起きた」と「それだけが原因で起きた」を同じ意味にしない。","eliminate":["「唯一の原因」：年代だけからは断定できない。","「日中戦争が先」：表の順序に反する。","「国際関係と無関係」：表の位置から関連の有無は導けない。"]}},{"id":"SC-SOC-HIS-DEEP-000025","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"戦後の農地改革を説明したものとして適切なのは？","answer":"国が地主の小作地などを買い上げ、小作人へ売り渡して自作農を増やした","options":["国が地主の小作地などを買い上げ、小作人へ売り渡して自作農を増やした","国が自作農の土地をすべて地主に渡して、小作地を増やした","全国の農地をすべて工場にして、農業を廃止した","開墾地の永久私有を初めて認めた奈良時代の法だった"],"ex":"土地を持たずに耕す小作農から、自分の土地を耕す自作農への変化が重要。古代の開墾促進法とは異なる。","difficulty":"標準","focus_area":"戦後・経済","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000026","practice_kind":"理由・比較","source_refs":["https://www.archives.go.jp/learning/archive_collection_6/"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000026","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"表の変化と農地改革を結び付けた説明として適切なのは？","answer":"小作人が土地を所有することで、地主との経済的な関係が変わり、地主の影響力が弱まった","options":["小作人が土地を所有することで、地主との経済的な関係が変わり、地主の影響力が弱まった","改革後も土地の所有関係は全く変わらず、地主の影響力が必ず強まった","耕作者が土地を買ったので、農地の総面積は必ず同じ割合で増えた","自作農が増えるとは、すべての農家が一切費用を払わなくなるという意味である"],"ex":"所有関係の変化が、地主と耕作者の力関係を変えた。自作農の増加と農地総面積の増加は別の指標。","difficulty":"応用","focus_area":"戦後・経済","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000025","practice_kind":"資料の読み取り","source_refs":["https://www.archives.go.jp/learning/archive_collection_6/"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"農地改革による関係の変化","headers":["観点","改革前の小作関係","改革による変化"],"rows":[["土地の所有","地主が所有","多くの小作人が土地を購入"],["耕作者の立場","小作料を払って借りる","自作農となる農家が増加"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"「誰が所有するか」と「誰が耕すか」を対応させる。","steps":["改革前は耕作者と所有者が別の場合が多かった。","土地を買った耕作者は自作農になる。","所有と小作関係の変化から、地主の影響力の後退を説明する。"],"trap":"所有者の変化を、土地の面積や全費用の消滅に置き換えない。","eliminate":["「所有が不変」：表の購入・自作農化と逆。","「農地総面積が必ず増える」：所有者の変更は面積増加を意味しない。","「費用が一切なくなる」：土地購入や耕作などの費用は別に必要。"]}},{"id":"SC-SOC-HIS-DEEP-000027","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"戦後日本の国際復帰について正しい順序は？","answer":"平和条約調印（1951年）→ 独立回復（1952年）→ 国連加盟（1956年）","options":["平和条約調印（1951年）→ 独立回復（1952年）→ 国連加盟（1956年）","独立回復（1951年）→ 国連加盟（1952年）→ 平和条約調印（1956年）","国連加盟（1951年）→ 平和条約調印（1952年）→ 独立回復（1956年）","平和条約調印（1951年）→ 国連加盟（1952年）→ 独立回復（1956年）"],"ex":"条約の調印と発効、国連加盟は別の出来事。サンフランシスコ平和条約の発効による独立回復は1952年。","difficulty":"標準","focus_area":"戦後・経済","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000028","practice_kind":"理由・比較","source_refs":["https://www.mofa.go.jp/mofaj/ms/da/pagew_000001_02046.html","https://www.archives.go.jp/ayumi/kobetsu/s32_1956_04.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000028","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"表の経過から、日本の国連加盟を冷戦との関係で説明したものは？","answer":"独立回復後に申請してもソ連の反対があり、日ソ国交正常化を経て加盟が実現した","options":["独立回復後に申請してもソ連の反対があり、日ソ国交正常化を経て加盟が実現した","独立回復と同日に自動的に加盟し、安全保障理事会の判断は不要だった","日ソ国交正常化は1952年の申請より前に済んでいた","ソ連が拒否権を使ったことから、日本は国連への加盟を一度も申請しなかったと分かる"],"ex":"独立回復と加盟の間に時間差がある背景を、東西対立と結び付ける。国連加盟は自動ではなかった。","difficulty":"応用","focus_area":"戦後・経済","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000027","practice_kind":"資料の読み取り","source_refs":["https://www.mofa.go.jp/mofaj/ms/da/pagew_000001_02046.html","https://www.archives.go.jp/ayumi/kobetsu/s32_1956_04.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"国連加盟までの経過","headers":["年","出来事"],"rows":[["1952年","独立回復・国連加盟申請。ソ連が拒否権を行使"],["1956年10月","日ソ国交正常化"],["1956年12月","日本の国連加盟"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"表の申請・反対・正常化・加盟の順を追う。","steps":["独立回復と加盟申請は1952年。","申請があっても、安全保障理事会でソ連の反対があった。","1956年の日ソ国交正常化と加盟を、冷戦下の外交関係の変化として説明する。"],"trap":"申請したことと、承認され加盟したことを区別する。","eliminate":["「同日に自動加盟」：1952年と1956年に隔たりがある。","「正常化が先」：1956年は1952年より後。","「一度も申請していない」：反対されたのは申請があったため。"]}},{"id":"SC-SOC-HIS-DEEP-000029","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"戦後の世界","q":"1955年のアジア・アフリカ会議について適切な説明は？","answer":"新たに独立した国々などが集まり、平和共存や植民地主義への反対を掲げた","options":["新たに独立した国々などが集まり、平和共存や植民地主義への反対を掲げた","欧米だけが集まり、植民地支配の拡大だけを決めた","国際連盟を1920年に設立するための会議だった","日本の明治政府が廃藩置県を決めた会議だった"],"ex":"バンドンで開かれた会議。米ソの二陣営だけでなく、独立したアジア・アフリカ諸国の動きにも注目する。","difficulty":"標準","focus_area":"戦後・経済","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000030","practice_kind":"理由・比較","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","https://www.mofa.go.jp/mofaj/annai/honsho/shiryo/qa/sengo_03.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000030","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"戦後の世界","q":"表の二つの動きを合わせて、戦後の世界を説明したものは？","answer":"米ソの対立がある一方、アジア・アフリカの国々も独立や平和共存を求めて活動した","options":["米ソの対立がある一方、アジア・アフリカの国々も独立や平和共存を求めて活動した","米ソの対立があったので、アジア・アフリカには独立した国が一つもなかった","すべての国は同じ目的で米ソのどちらかだけに無条件に従った","1955年の会議が開かれた時点で、冷戦は直ちに完全に終わった"],"ex":"東西対立と、脱植民地化や第三勢力の動きを合わせて見る。戦後世界を米ソだけで説明しない。","difficulty":"応用","focus_area":"戦後・経済","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000029","practice_kind":"資料の読み取り","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","https://www.mofa.go.jp/mofaj/annai/honsho/shiryo/qa/sengo_03.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"戦後世界の複数の動き","headers":["観点","内容"],"rows":[["東西関係","アメリカとソ連を中心とする対立"],["独立国の動き","1955年のアジア・アフリカ会議。平和共存などを主張"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"表には異なる主体による二つの動きがある。","steps":["米ソ中心の対立は、戦後世界の大きな構図。","新たな独立国も独自の目標を掲げていた。","一方で他方を消さず、複数の動きが並存する説明を選ぶ。"],"trap":"ある動きの存在を、別の動きの不在や終結の証拠にしない。","eliminate":["「独立国が一つもない」：会議の参加国の動きと矛盾。","「全部無条件に従う」：独自に平和共存を掲げる動きを無視。","「冷戦が直ちに終結」：会議の開催だけで対立は解消しなかった。"]}},{"id":"SC-SOC-HIS-DEEP-000031","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"高度経済成長と第一次石油危機について適切な説明は？","answer":"輸入石油を多く使う経済に原油高が影響し、高度経済成長の終わりにつながった","options":["輸入石油を多く使う経済に原油高が影響し、高度経済成長の終わりにつながった","第一次石油危機は1929年に起き、米騒動を直接起こした","日本は原油を全量国内で生産したため、原油高の影響はなかった","原油価格の上昇で、すべての工業製品の生産費が必ず下がった"],"ex":"第一次石油危機は1973年。エネルギーの輸入依存と、生産費・物価・成長への影響をつなげる。","difficulty":"標準","focus_area":"戦後・経済","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000032","practice_kind":"理由・比較","source_refs":["https://www.enecho.meti.go.jp/about/special/tokushu/anzenhosho/middleeast.html","https://www.enecho.meti.go.jp/about/whitepaper/2016html/2-1-1.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。"},{"id":"SC-SOC-HIS-DEEP-000032","subject":"社会","grade":2,"unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"表の情報を使い、石油危機後の省エネルギーやエネルギー源の多様化の理由を説明したものは？","answer":"輸入石油の価格・供給の変動による影響を減らすため、使用量や依存を抑える必要があった","options":["輸入石油の価格・供給の変動による影響を減らすため、使用量や依存を抑える必要があった","石油に頼る比率をさらに高めれば、石油の供給停止の影響は必ずなくなる","輸入石油が不要な経済だったため、省エネルギーだけが初めて工業化を起こした","価格が上がったことから、石油は日本に全く輸入されていなかったと判断できる"],"ex":"省エネルギーは使う量を減らし、多様化は一つのエネルギー源への偏りを減らす。二つは対策の働き方が違う。","difficulty":"応用","focus_area":"戦後・経済","history_batch":"deep2","paired_question":"SC-SOC-HIS-DEEP-000031","practice_kind":"資料の読み取り","source_refs":["https://www.enecho.meti.go.jp/about/special/tokushu/anzenhosho/middleeast.html","https://www.enecho.meti.go.jp/about/whitepaper/2016html/2-1-1.html"],"reference_note":"公開学習資料と公的資料を参考にした独自問題・独自整理表です。過去問・史料原文の転載や頻出率の集計ではありません。","material":{"title":"石油危機と日本の経済","headers":["観点","内容"],"rows":[["成長期のエネルギー","輸入石油への依存が高まる"],["1973年の危機","原油価格高騰と供給への不安"],["その後の対応","省エネルギー・エネルギー源の多様化"]],"note":"学習用に独自整理した表です。史料原文・実測統計ではありません。"},"explanation":{"focus":"「依存」と「価格・供給の変動」を因果でつなげる。","steps":["依存が高いほど、石油の変動の影響を受けやすい。","省エネルギーは石油などの使用量を抑える。","多様化は特定の資源に頼り過ぎないための対策、と整理する。"],"trap":"対策の目的を、資源が全く不要になるという極端な説明に変えない。","eliminate":["「依存を高めれば影響ゼロ」：一つの資源への偏りはリスクを増やす。","「石油不要・初めて工業化」：高度成長期の経済と逆。","「全く輸入していない」：表の輸入依存に矛盾。"]}},{"subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"世界の中世","history_batch":"write3","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","https://www.try-it.jp/chapters-11378/lessons-11394/"],"reference_note":"公開教材・公的資料を参考にした独自問題です。史料原文や過去問を転載したものではありません。","material":{"title":"中世の対立と交流","headers":["観点","内容"],"rows":[["軍事","十字軍の遠征"],["商業","東方の香辛料・絹織物などを地中海交易で輸入"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"id":"SC-SOC-HIS-APPLY-000001","q":"表の軍事面と商業面を合わせて、中世のヨーロッパと東方の関係を説明したものは？","answer":"軍事的な対立がある一方、交易による物資や文化の接触もあった","options":["軍事的な対立がある一方、交易による物資や文化の接触もあった","軍事的な対立があれば、すべての交易は必ずなくなる","東方の物資が輸入されたので、宗教上の対立は一度もなかった","香辛料が輸入されたので、当時すべての人が同じ宗教を信じていた"],"ex":"対立と交流は同時に存在し得る。軍事遠征だけ、交易だけで時代全体を説明しない。","difficulty":"応用","practice_kind":"資料の読み取り","writing_id":"SC-SOC-HIS-WRITEPLUS-000001","explanation":{"focus":"同じ地域の関係を、異なる二つの観点から見る。","steps":["軍事の記録は対立の一面を示す。","商業の記録は交易の存在を示す。","どちらかを消さず、対立と交流が並存する説明にまとめる。"],"trap":"戦争があったことを、文化や物資の交流が一切なかった証拠にしない。","eliminate":["「交易が必ずなくなる」：輸入の記録と矛盾。","「対立が一度もない」：交易の存在から対立の不在は導けない。","「同じ宗教」：物資の流通から信仰の一致は分からない。"]}},{"subject":"社会","grade":"中2","unit":"歴史・中世","field_name":"歴史","topic_name":"世界の中世","history_batch":"write3","source_refs":["https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","https://www.try-it.jp/chapters-11378/lessons-11394/"],"reference_note":"公開教材・公的資料を参考にした独自問題です。史料原文や過去問を転載したものではありません。","material":{"title":"中世の対立と交流","headers":["観点","内容"],"rows":[["軍事","十字軍の遠征"],["商業","東方の香辛料・絹織物などを地中海交易で輸入"]],"note":"学習用の独自整理表です。史料原文・実測統計ではありません。"},"id":"SC-SOC-HIS-WRITEPLUS-000001","type":"written","q":"表を使い、中世のヨーロッパと東方の関係を「対立」と「交流」の両面から説明しなさい。","writing_prompt":"表を使い、中世のヨーロッパと東方の関係を「対立」と「交流」の両面から説明しなさい。","answer":"十字軍の遠征による軍事的な対立がある一方、地中海交易では東方の香辛料や絹織物などが輸入され、物資の交流もあった。","options":[],"ex":"原因・変化・結果をつなぎ、資料の根拠と知識を区別して説明しよう。","check_points":["十字軍などの軍事的な対立に触れた","地中海交易などの交流もあったと説明した"],"word_guide":"40〜100字を目安に、指定された二つの内容をつないで書こう。字数は採点条件ではありません。","practice_kind":"記述練習","explanation":{"focus":

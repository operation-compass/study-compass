成。"},{"id":"SC-SOC-HIS-EXT-000025","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"市民革命","q":"1688年、イギリスで国王を交代させ議会の力を強めた革命は？","answer":"名誉革命","options":["名誉革命","フランス革命","ロシア革命","辛亥革命"],"ex":"名誉革命後、1689年の権利章典により議会の権利が確認されました。","practice_kind":"用語・人物","reference_url":"https://e-clus.com/course/detail/886","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000026","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"市民革命","q":"名誉革命後、イギリスで議会の権利を確認した文書は？","answer":"権利章典","options":["権利章典","人権宣言","独立宣言","五箇条の御誓文"],"ex":"権利章典は国王の権力を制限し、議会を重んじる政治を発展させました。","practice_kind":"用語・人物","reference_url":"https://e-clus.com/course/detail/886","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000027","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"市民革命","q":"1776年の独立宣言で、北アメリカの植民地が独立を宣言した相手は？","answer":"イギリス","options":["イギリス","フランス","スペイン","清"],"ex":"イギリスの植民地が独立戦争を経てアメリカ合衆国を成立させました。","practice_kind":"用語・人物","reference_url":"https://e-clus.com/course/detail/886","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000028","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"市民革命","q":"1789年に始まったフランス革命で出された、人の自由や平等を掲げる文書は？","answer":"人権宣言","options":["人権宣言","権利章典","ポツダム宣言","教育勅語"],"ex":"人権宣言は自由・平等などの原理を示し、後の人権思想にも影響しました。","practice_kind":"用語・人物","reference_url":"https://e-clus.com/course/detail/886","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000029","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"市民革命","q":"フランス革命後に皇帝となり、ヨーロッパへ勢力を広げた人物は？","answer":"ナポレオン","options":["ナポレオン","リンカーン","ワシントン","ビスマルク"],"ex":"ナポレオンはフランス皇帝となり、法典の整備も進めました。","practice_kind":"用語・人物","reference_url":"https://e-clus.com/course/detail/886","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000030","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"市民革命","q":"イギリス・フランスの革命やアメリカの独立に共通する方向として適切なのは？","answer":"専制や植民地支配に対し、政治的な権利や自由を求めた","options":["専制や植民地支配に対し、政治的な権利や自由を求めた","王や本国の権力を強め、政治参加の範囲を狭めようとした","革命の直後から、女性や奴隷を含む全員の平等な参政権を実現した","どの国でも王を残し、同じ立憲君主制の政治体制を作った"],"ex":"専制や植民地支配に対して権利や自由を求めた点を比較する。イギリスの立憲君主制、アメリカやフランスの共和政など、結果の政治体制は同一ではない。当初から女性や奴隷を含む全員に同じ権利が保障されたわけでもない。","practice_kind":"理由・比較","reference_url":"https://e-clus.com/course/detail/886","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。","source_refs":["https://e-clus.com/course/detail/886","https://www.archives.gov/founding-docs/declaration-transcript"]},{"id":"SC-SOC-HIS-EXT-000031","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"市民革命","q":"古い順に並べると正しいのは？ ①フランス革命 ②アメリカ独立宣言 ③名誉革命","answer":"③→②→①","options":["③→②→①","①→②→③","②→①→③","③→①→②"],"ex":"名誉革命1688年→アメリカ独立宣言1776年→フランス革命1789年です。","practice_kind":"年代・順序","reference_url":"https://e-clus.com/course/detail/886","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000032","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"産業革命とアジア","q":"18世紀後半に産業革命が最初に進んだ国は？","answer":"イギリス","options":["イギリス","日本","清","ロシア"],"ex":"イギリスで綿工業などの機械化が進み、他の国々へ広がりました。","practice_kind":"年代・順序","reference_url":"https://e-clus.com/course/detail/1102","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000033","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"産業革命とアジア","q":"産業革命による生産の変化として適切なのは？","answer":"機械を使う工場で大量生産が進んだ","options":["機械を使う工場で大量生産が進んだ","すべての工場が閉鎖された","農業だけで生計を立てる社会になった","貿易が世界中で禁止された"],"ex":"工場制機械工業が発達し、生産や交通、人々の働き方が大きく変わりました。","practice_kind":"理由・比較","reference_url":"https://e-clus.com/course/detail/1102","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000034","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"産業革命とアジア","q":"産業革命後、欧米諸国がアジアへ進出した経済的な目的は？","answer":"原料の供給地や製品の市場を求めた","options":["原料の供給地や製品の市場を求めた","機械工業を禁止するため","各国の参勤交代を廃止するため","農業や貿易を一切やめるため"],"ex":"工業化した国々は原料と販売先を求め、アジアへの進出を強めました。","practice_kind":"理由・比較","reference_url":"https://e-clus.com/course/detail/1102","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000035","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"産業革命とアジア","q":"1840年に始まったアヘン戦争の当事国は？","answer":"イギリスと清","options":["イギリスと清","日本と清","アメリカと日本","フランスとロシア"],"ex":"清のアヘン取り締まりを背景にイギリスとの戦争が起こり、清が敗れました。","practice_kind":"用語・人物","reference_url":"https://e-clus.com/course/detail/1102","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000036","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"産業革命とアジア","q":"アヘン戦争後、清がイギリスと結んだ条約は？","answer":"南京条約","options":["南京条約","下関条約","ポーツマス条約","日米和親条約"],"ex":"1842年の南京条約で、清は香港島の割譲や港の開放などを認めました。","practice_kind":"用語・人物","reference_url":"https://e-clus.com/course/detail/1102","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000037","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"産業革命とアジア","q":"アメリカの南北戦争中に奴隷解放宣言を出した大統領は？","answer":"リンカーン","options":["リンカーン","ワシントン","ウィルソン","ルーズベルト"],"ex":"リンカーンは1863年に奴隷解放宣言を出しました。南北戦争は1861年に始まりました。","practice_kind":"用語・人物","reference_url":"https://e-clus.com/course/detail/1102","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000038","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"産業革命とアジア","q":"資本主義の発展に伴う労働問題への対応として適切なのは？","answer":"労働者が労働組合をつくり待遇改善を求めた","options":["労働者が労働組合をつくり待遇改善を求めた","労働者が全員大名になった","機械が世界中で廃止された","賃金を受け取る働き方がなくなった"],"ex":"長時間労働や低賃金などの問題から、労働運動や社会主義思想が広まりました。","practice_kind":"理由・比較","reference_url":"https://e-clus.com/course/detail/1102","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000039","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"1872年、学校制度を整えるために公布されたものは？","answer":"学制","options":["学制","徴兵令","地租改正","普通選挙法"],"ex":"学制によって近代的な学校制度の整備が進められました。公布年と政策の内容を結び付けましょう。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000040","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"明治政府が1873年に出した、国民に兵役の義務を課す法令は？","answer":"徴兵令","options":["徴兵令","学制","廃藩置県","武家諸法度"],"ex":"徴兵令は武士中心の軍事制度を改め、近代的な軍隊を整える政策でした。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000041","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"明治初期、殖産興業の一環で政府がつくった工場は？","answer":"官営模範工場","options":["官営模範工場","蔵屋敷","寺子屋","高床倉庫"],"ex":"富岡製糸場などの官営模範工場をつくり、技術を導入して近代産業を育てました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000042","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"自由民権運動で求められたこととして適切なのは？","answer":"国会の開設と憲法の制定","options":["国会の開設と憲法の制定","参勤交代の再開","藩の独立","鎖国の継続"],"ex":"国民の政治参加を求める運動が国会開設へつながりました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000043","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"1894年、領事裁判権の撤廃を実現した条約改正に関わる外相は？","answer":"陸奥宗光","options":["陸奥宗光","小村寿太郎","岩倉具視","板垣退助"],"ex":"陸奥宗光が日英通商航海条約を結び、領事裁判権の撤廃は1899年に実施されました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000044","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"1911年、関税自主権の回復に関わった外相は？","answer":"小村寿太郎","options":["小村寿太郎","陸奥宗光","伊藤博文","大隈重信"],"ex":"領事裁判権の撤廃と関税自主権の回復は時期が違います。小村寿太郎は1911年の回復に関わりました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000045","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"1895年、ロシア・ドイツ・フランスが日本に遼東半島の返還を求めた出来事は？","answer":"三国干渉","options":["三国干渉","日独伊三国同盟","薩長同盟","五・四運動"],"ex":"日清戦争後、日本が下関条約で得た遼東半島を三国干渉によって清に返還しました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000046","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"日露戦争後のポーツマス条約に関する説明で正しいのは？","answer":"日本は賠償金を得られなかった","options":["日本は賠償金を得られなかった","日本は清から台湾を得た","日本は全世界を植民地にした","日本は領事裁判権を認めた"],"ex":"日本は南樺太などを得ましたが賠償金は得られず、国内で条約への不満が起こりました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000047","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"明治","q":"1910年、日本が朝鮮を植民地とした出来事は？","answer":"韓国併合","options":["韓国併合","廃藩置県","大政奉還","辛亥革命"],"ex":"日本は1910年に韓国併合を行い、朝鮮を植民地として支配しました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000048","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"世界大戦と民族運動","q":"1911年、中国で清を倒すきっかけとなった革命は？","answer":"辛亥革命","options":["辛亥革命","ロシア革命","名誉革命","フランス革命"],"ex":"辛亥革命により清が倒れ、1912年に中華民国が成立しました。孫文が臨時大総統となりました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000049","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代" ":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000054","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"世界大戦と民族運動","q":"1919年、朝鮮で日本の植民地支配からの独立を求めた運動は？","answer":"三・一独立運動","options":["三・一独立運動","五・四運動","米騒動","自由民権運動"],"ex":"朝鮮の三・一独立運動と、中国の五・四運動は同じ1919年です。場所と目的を区別しましょう。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000055","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"世界大戦と民族運動","q":"1919年、中国で日本の要求や政府の対応に反対して広がった運動は？","answer":"五・四運動","options":["五・四運動","三・一独立運動","米騒動","護憲運動"],"ex":"五・四運動は中国の民族運動です。日本の二十一か条の要求や山東省の権益問題などが背景にありました。","practice_kind":"理由・比較","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000056","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"世界大戦と民族運動","q":"インドで非暴力・不服従を掲げて独立運動を進めた人物は？","answer":"ガンディー","options":["ガンディー","孫文","レーニン","ヒトラー"],"ex":"ガンディーはイギリスの植民地支配に対し、非暴力・不服従による運動を進めました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000057","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"世界大戦と民族運動","q":"世界恐慌に対し、アメリカで公共事業などを進めた政策は？","answer":"ニューディール政策","options":["ニューディール政策","ブロック経済","鎖国政策","享保の改革"],"ex":"ルーズベルト大統領は政府による公共事業などで雇用や景気の回復を図りました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000058","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"世界大戦と民族運動","q":"世界恐慌後、イギリスやフランスが植民地との貿易を優先した政策は？","answer":"ブロック経済","options":["ブロック経済","ニューディール政策","楽市・楽座","地租改正"],"ex":"本国と植民地の貿易を優先する政策で、植民地の少ない国との対立を強め 成。"},{"id":"SC-SOC-HIS-EXT-000073","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"サンフランシスコ平和条約が発効し、日本が主権を回復した年は？","answer":"1952年","options":["1952年","1945年","1951年","1956年"],"ex":"条約の調印は1951年、発効は1952年です。年表では「調印」か「発効」かに注意しましょう。","practice_kind":"年代・順序","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000074","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1951年、講和条約と同時に日本がアメリカと結んだ条約は？","answer":"日米安全保障条約","options":["日米安全保障条約","日英同盟","日ソ共同宣言","日中平和友好条約"],"ex":"講和と同時に日米安全保障条約が結ばれ、独立後も米軍が日本に駐留することになりました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000075","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1956年、日ソ共同宣言によって実現したことは？","answer":"日本とソ連の国交回復","options":["日本とソ連の国交回復","沖縄の日本復帰","韓国との国交正常化","中国との国交正常化"],"ex":"日ソ国交回復は、日本の国際連合加盟につながりました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000076","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1965年、日本が韓国との国交を正常化した条約は？","answer":"日韓基本条約","options":["日韓基本条約","日中平和友好条約","日英同盟","南京条約"],"ex":"日韓基本条約によって日本と韓国の国交が正常化しました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000077","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1972年、アメリカの施政下から日本に復帰した地域は？","answer":"沖縄","options":["沖縄","北海道","台湾","南樺太"],"ex":"沖縄は1972年に日本へ復帰しました。戦後の日本と国際社会との関係を整理しましょう。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000078","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1972年の日中共同声明で実現したことは？","answer":"日本と中国の国交正常化","options":["日本と中国の国交正常化","日本とソ連の国交回復","国際連盟への加盟","朝鮮戦争の開戦"],"ex":"日中国交正常化は1972年、日中平和友好条約の締結は1978年です。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000079","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"1973年、日本経済に大きな影響を与えた原油価格の急上昇を何という？","answer":"石油危機","options":["石油危機","米騒動","世界恐慌","三国干渉"],"ex":"石油危機はオイルショックとも呼ばれ、物価の上昇や高度経済成長の終わりにつながりました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000080","subject":"社会","grade":"中1〜中3","unit":"歴史・近現代","field_name":"歴史","topic_name":"昭和戦後","q":"高度経済成長とともに深刻化した社会問題の一つは？","answer":"工場排水や大気汚染などの公害","options":["工場排水や大気汚染などの公害","参勤交代の負担","元寇による恩賞不足","鎖国による長崎貿易の禁止"],"ex":"工業化の一方で水俣病などの公害が深刻化し、環境を守る対策が求められました。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000081","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"歴史の見方","q":"西暦701年から800年までを何世紀という？","answer":"8世紀","options":["8世紀","7世紀","9世紀","10世紀"],"ex":"1世紀は1〜100年です。701〜800年は8世紀で、794年の平安京遷都も8世紀です。","practice_kind":"年代・順序","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000082","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"歴史の見方","q":"紀元前の年を古い順に並べると正しいのは？","answer":"紀元前500年→紀元前300年→紀元前100年","options":["紀元前500年→紀元前300年→紀元前100年","紀元前100年→紀元前300年→紀元前500年","紀元前300年→紀元前500年→紀元前100年","紀元前500年→紀元前100年→紀元前300年"],"ex":"紀元前は数字が大きい年ほど古くなります。西暦の年との違いに注意しましょう。","practice_kind":"年代・順序","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000083","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"歴史の見方","q":"ある出来事を調べるとき、史料の信頼性を考えるために確認することは？","answer":"いつ誰が何のためにつくったか","options":["いつ誰が何のためにつくったか","紙が白いかだけ","文字が大きいかだけ","自分の予想と同じかだけ"],"ex":"史料の作成時期・作者・目的を確認し、他の史料と比べることが大切です。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000084","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"歴史の見方","q":"出来事の前後関係を確かめるのに最も適した資料は？","answer":"年表","options":["年表","人口ピラミッド","雨温図","等高線図"],"ex":"年表は時間の順序を整理する資料です。前後関係と原因・結果は区別して考えます。","practice_kind":"用語・人物","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-EXT-000085","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"歴史の見方","q":"同じ出来事について二つの史料の記述が違うときの対応として適切なのは？","answer":"作成者の立場や目的を比べ、他の史料も調べる","options":["作成者の立場や目的を比べ、他の史料も調べる","新しい方だけを必ず正しいとする","長い方だけを必ず正しいとする","都合のよい方だけを選ぶ"],"ex":"立場や目的の違いによって記述が変わることがあります。複数の史料を比較して判断します。","practice_kind":"理由・比較","reference_url":"https://www.mext.go.jp/content/20240919-mxt_kyoiku01-100002608.pdf","reference_note":"学習範囲・背景の参考。問題文・選択肢・解説は独自作成。"},{"id":"SC-SOC-HIS-DATA-000001","subject":"社会","grade":"中1〜中3","unit":"歴史・古代","field_name":"歴史","topic_name":"世界の古代文明","q":"文明と河川を整理した表で、空欄Aに入る文明は？","answer":"メソポタミア文明","options":["メソポタミア文明","中国文明","ローマ文明","ギリシャ文明"],"ex":"二つの河川の間に栄えたメソポタミア文明です。文明の名前と位置を結び付けましょう。","practice_kind":"資料の読み取り","material":{"title":"比較表","headers":["文明","河川"],"rows":[["エジプト","ナイル川"],["A","チグリス川・ユーフラテス川"],["インダス","インダス川"]],"not

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Study COMPASS｜公開問題フィード検証</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#081b38;color:#f7fbff;margin:0;padding:22px;line-height:1.6}main{max-width:680px;margin:auto}h1{font-size:1.35rem}.panel{background:#122e55;border:1px solid #375c90;border-radius:14px;padding:20px;margin-top:18px}button{display:block;width:100%;border:1px solid #79a7da;background:#183f73;color:white;padding:14px;margin:10px 0;border-radius:10px;text-align:left;font-size:1rem}button:disabled{opacity:.65}button:focus-visible{outline:3px solid #66d6ff}.correct{border-color:#6be8ad}.wrong{border-color:#ffad9f}#feedback{font-weight:700}small{color:#b5d9fa}#next{background:#246fd4;text-align:center}a{color:#88d7ff}</style></head><body><main><h1>Study COMPASS｜公開問題フィード検証</h1><p><small>新しい公開シート専用の検証画面です。既存の学習問題には影響しません。</small></p><div class="panel" id="status" role="status">公開済み問題を確認しています…</div><section class="panel" id="quiz" hidden><small id="counter"></small><h2 id="question"></h2><div id="choices"></div><p id="feedback" aria-live="polite"></p><p id="explanation"></p><button type="button" id="next" hidden>次の問題へ</button></section><p><a href="/">ホームへ戻る</a></p></main>
<script>
'use strict';
function csvRows(input){
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<input.length;i++){
    const c=input[i];
    if(quoted){if(c==='"'&&input[i+1]==='"'){cell+='"';i++;}else if(c==='"'){quoted=false;}else cell+=c;}
    else if(c==='"'){if(cell)throw Error('CSV形式エラー');quoted=true;}
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&input[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell='';}
    else cell+=c;
  }
  if(quoted)throw Error('CSV引用符エラー');
  row.push(cell);if(row.some(v=>v!==''))rows.push(row);
  return rows;
}
const HEADERS=['question_id','version','subject','grade','unit_major','unit_minor','question_type','question_text','choice_a','choice_b','choice_c','choice_d','correct_answer','explanation','source_url'];
const status=document.getElementById('status'),quiz=document.getElementById('quiz');
let data=[],position=0;
function show(){
  const q=data[position];quiz.hidden=false;
  document.getElementById('counter').textContent=(position+1)+' / '+data.length+'問 · '+q.subject+' · '+q.unit_major;
  document.getElementById('question').textContent=q.question_text;
  document.getElementById('feedback').textContent='';
  document.getElementById('explanation').textContent='';
  document.getElementById('next').hidden=true;
  const el=document.getElementById('choices');el.replaceChildren();
  const labels=['A','B','C','D'];let answer=String(q.correct_answer).trim().toUpperCase();
  if(!labels.includes(answer)){answer=labels.find(x=>q['choice_'+x.toLowerCase()]===q.correct_answer)||'';}
  for(const label of labels){
    const btn=document.createElement('button');btn.type='button';btn.textContent=label+'．'+q['choice_'+label.toLowerCase()];
    btn.addEventListener('click',()=>{
      for(const b of el.querySelectorAll('button'))b.disabled=true;
      btn.classList.add(label===answer?'correct':'wrong');
      document.getElementById('feedback').textContent=label===answer?'正解！':'正解は '+answer+' です';
      document.getElementById('explanation').textContent=q.explanation||'';
      document.getElementById('next').hidden=position>=data.length-1;
    });
    el.append(btn);
  }
}
document.getElementById('next').addEventListener('click',()=>{if(position+1<data.length){position++;show();}});
(async()=>{
  try{
    const response=await fetch('/api/questions.csv',{cache:'no-store'});
    if(!response.ok)throw Error('公開データを取得できません (HTTP '+response.status+')');
    const rows=csvRows((await response.text()).replace(/^\uFEFF/,''));
    if(!rows.length||HEADERS.some((h,i)=>rows[0][i]!==h)||rows[0].length!==HEADERS.length)throw Error('公開データの列構成が一致しません');
    const ids=new Set();
    data=rows.slice(1).map(row=>{
      if(row.length!==HEADERS.length)throw Error('列数に不整合があります');
      return Object.fromEntries(HEADERS.map((key,i)=>[key,row[i]]));
    }).filter(q=>{
      if(!q.question_id||ids.has(q.question_id))throw Error('問題IDが重複または空です');
      ids.add(q.question_id);
      const correct=String(q.correct_answer).trim().toUpperCase();
      if(!q.question_text||!['a','b','c','d'].every(k=>q['choice_'+k])||!['A','B','C','D',q.choice_a,q.choice_b,q.choice_c,q.choice_d].includes(correct))throw Error('問題データに不整合があります');
      return true;
    });
    status.textContent=data.length?data.length+'問を取得しました。':'現在、公開承認済みの新規問題は0問です。';
    if(data.length)show();
  }catch(e){status.textContent='公開問題を表示できません：'+e.message;}
})();
</script></body></html>
